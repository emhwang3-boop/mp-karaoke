var D={"ko":{"title":"서비스 소개","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. StageSong은 어떤 서비스인가요","b":["StageSong(스테이지송, 머니퍼즐 노래방)은 주식회사 부만이 운영하는 온라인 노래방 서비스입니다. 금영엔터테인먼트의 노래방 반주 영상으로 웹 브라우저에서 바로 노래를 부를 수 있습니다.","노래는 곡마다 포인트로 이용하며(1곡 1,000P, 1P = 1원), 포인트는 신용·체크카드로 충전합니다. 화면은 한국어·English·日本語·简体中文·繁體中文·Español 6개 언어로 이용할 수 있습니다."]},{"h":"2. 주요 기능","b":[["노래 부르기: 곡 제목이나 가수로 검색해 금영 노래방 반주 영상을 재생하고 노래합니다.","녹화와 스테이지: 노래하는 모습을 녹화할 수 있고, 녹화한 노래는 로그인한 뒤 「스테이지」에 올려 다른 이용자와 함께 보거나 링크로 공유할 수 있습니다. 노래를 올리려면 본인인증(만 15세 이상)이 필요합니다.","얼굴 마스크·꾸미기: 녹화할 때 얼굴 마스크 등 꾸미기 아이템을 사용할 수 있습니다. 꾸미기 아이템은 포인트로 구매하며 구매 시각부터 1일(24시간), 7일 또는 30일 동안 이용합니다.","계정: 구글 또는 애플 계정으로 로그인하며, 포인트와 잔여 곡은 로그인한 계정에 보관됩니다."]]},{"h":"3. 이용 요금","b":[{"tbl":[["노래 1곡","1,000P"],["곡 묶음 10곡","9,500P (곡당 950P)"],["곡 묶음 20곡","18,000P (곡당 900P)"],["곡 묶음 30곡","26,000P (곡당 867P)"],["곡 묶음 50곡","42,000P (곡당 840P)"],["포인트 충전 (웹)",["5,000원 → 5,000P","10,000원 → 10,000P","30,000원 → 30,000P","50,000원 → 50,000P"]]]},["노래는 곡 단위로 이용합니다. 곡마다 포인트를 사용하며, 가격은 구매 화면에 표시된 대로입니다.","회사는 여러 곡을 묶은 「곡 묶음」을 판매합니다. 곡 묶음은 크기별로 있고 유료 포인트로만 구매할 수 있으며, 구성과 가격은 구매 화면에 표시된 대로입니다. 구매한 곡은 로그인한 계정에 「잔여 곡」으로 기록되며, 곡 묶음 구매일로부터 1년간 사용할 수 있고 기한 내 사용하지 않은 잔여 곡은 소멸합니다. 무료 포인트로는 곡 묶음을 구매할 수 없으며, 곡을 1곡씩 재생할 때 사용할 수 있습니다.","곡은 재생이 시작될 때 1곡이 사용됩니다. 재생 1회가 1곡이며, 같은 곡을 반복해 불러도 재생마다 1곡이 사용됩니다.","곡은 노래를 부르는 사람만 사용하며, 보기와 듣기는 무료입니다."]]},{"h":"4. 결제 수단","b":[["포인트 충전은 신용·체크카드 일시불로만 결제할 수 있으며(할부·간편결제·계좌이체 불가), 충전 금액은 5,000원·10,000원·30,000원·50,000원입니다.","포인트 대금은 회사가 계약한 전자지급결제대행사의 결제창 또는 앱 마켓 결제를 통해 회사에 지급됩니다. 회사는 카드 번호 등 결제 정보를 직접 받거나 저장하지 않습니다."]]},{"h":"5. 유효기간·청약철회·환불","b":["포인트(1P = 1원)는 유료 포인트(결제로 충전)와 무료 포인트(회사가 무상 지급)로 나누어 기록합니다. 충전 포인트의 사용기한은 결제 시점부터 1년이며, 기한 내 미사용 포인트는 소멸됩니다. 무료 포인트는 지급일로부터 1년간 사용할 수 있습니다.",["결제일로부터 7일 이내: 청약철회가 가능하며, 사용하지 않은 유료 포인트 전부를 수수료 없이 카드 결제 취소로 환불합니다(일부를 사용했어도).","결제일로부터 7일이 지난 뒤: 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제한 금액을 카드 결제 부분 취소로 환불합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","무료 포인트는 환불하지 않으며 환불 처리 시 소멸합니다. 10원 미만은 버립니다."],["잔여 곡 환불: 사용하지 않은 잔여 곡은 곡 묶음 구매에 사용한 유료 포인트 몫을 곡 수로 나눈 금액으로, 사용하지 않은 곡 수만큼 결제한 카드의 결제 취소(부분 취소)로 환불합니다(1P = 1원). 카드사 사정에 따라 영업일 기준 3~7일이 걸릴 수 있습니다.","곡 묶음 구매일로부터 7일 이내: 수수료 없이 환불합니다.","곡 묶음 구매일로부터 7일이 지난 뒤: 환불 금액에서 10% 이내의 환불 수수료를 공제합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 7일이 지난 유료 포인트와 잔여 곡을 합쳐 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다. 10원 미만은 환불하지 않습니다."],["꾸미기 아이템, 방 개설(연장 포함), AI 사진·영상 생성, LIVE 방송 차감은 사용 즉시 제공되는 서비스이므로 청약철회와 환불이 되지 않습니다. 이 사실은 사용 전 확인 화면에 표시합니다. 다만 제공에 실패하면 사용한 포인트를 되돌립니다.","재생이 시작된 곡은 환불되지 않습니다. 곡을 불러오지 못해 재생이 시작되지 않으면 자동으로 되돌립니다."],"환불은 결제한 카드의 결제 취소로만 가능하며, 현금 지급이나 계좌 이체로는 환불하지 않습니다. 카드사 사정에 따라 취소 반영에 영업일 기준 3~7일이 걸릴 수 있습니다.","환불 요청은 노래방 「내 지갑 → 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다.",{"a":"refund.html","t":"자세한 내용은 환불 규정을 따릅니다."}]},{"h":"6. 이용 나이","b":[["서비스는 만 15세 이상 이용할 수 있으며, 만 15세 미만은 이용할 수 없습니다. 이 약관에서 청소년은 만 15세 이상 만 19세 미만인 사람을, 성인은 만 19세 이상인 사람을 말합니다. 나이는 태어난 날을 기준으로 한 만 나이로 한국 날짜에 따라 계산하며, 만 19세 생일이 되면 성인으로 처리합니다.","회사는 서비스(앱)에 들어올 때 휴대폰 본인인증으로 만 15세 이상인지 한 번 확인하며, 본인인증을 마치지 않으면 서비스를 이용할 수 없습니다. 인증 결과 중 생년월일과 성별만 저장합니다.","청소년은 한 달에 200,000원까지 포인트를 충전할 수 있습니다. 미성년자가 법정대리인의 동의 없이 한 결제는 미성년자 본인 또는 법정대리인이 관련 법령(민법 제5조 등)에 따라 취소할 수 있으며, 회사는 결제 취소·환불을 관련 법령에 따라 처리합니다."]]},{"h":"7. 문의","b":[{"contact":1},"모든 거래에 대한 책임과 환불, 민원 등은 주식회사 부만에서 진행합니다."]}],"tel":"전화","em":"이메일","lk":["이용약관","환불 규정","개인정보처리방침","법적 고지"]},"en":{"title":"About the service","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. What is StageSong?","b":["StageSong (Money Puzzle Karaoke) is an online karaoke service operated by Booman Inc. You can sing along to Kumyoung Entertainment karaoke accompaniment videos right in your web browser.","Each song is paid for with points (1,000P per song, 1P = ₩1), and points are topped up by credit or debit card. The service is available in 6 languages: 한국어, English, 日本語, 简体中文, 繁體中文 and Español."]},{"h":"2. Main features","b":[["Sing: search by song title or artist, play the Kumyoung karaoke accompaniment video and sing.","Recording and Stage: you can record yourself singing, and after signing in you can post the recording to “Stage” for other users to watch, or share it by link. Posting a song requires identity verification (15 and over).","Face masks and decorations: you can use decoration items such as face masks while recording. Decoration items are bought with points and can be used for 1 day (24 hours), 7 days or 30 days from the time of purchase.","Account: sign in with your Google or Apple account; your points and remaining songs are kept on the account you sign in with."]]},{"h":"3. Prices","b":[{"tbl":[["1 song","1,000P"],["Song bundle · 10 songs","9,500P (950P per song)"],["Song bundle · 20 songs","18,000P (900P per song)"],["Song bundle · 30 songs","26,000P (867P per song)"],["Song bundle · 50 songs","42,000P (840P per song)"],["Point top-up (web)",["₩5,000 → 5,000P","₩10,000 → 10,000P","₩30,000 → 30,000P","₩50,000 → 50,000P"]]]},["Karaoke is used song by song. Each song uses points, and the price is as shown on the purchase screen.","The Company sells “Song bundles” that group several songs. Bundles come in several sizes, can be bought with paid points only, and their contents and prices are as shown on the purchase screen. Songs you buy are recorded as “remaining songs” on your signed-in account; they can be used for 1 year from the bundle purchase date, and remaining songs not used within that period expire. Free points cannot be used to buy Song bundles; they can be used to play songs one at a time.","One song is used when playback starts. One play is one use, and repeating the same song uses one song each time.","Only the person singing uses a song; watching and listening are free."]]},{"h":"4. Payment methods","b":[["Points can be topped up only by credit/debit card in a single payment (no installments, easy-pay or bank transfer), in amounts of ₩5,000, ₩10,000, ₩30,000 and ₩50,000.","Payment for points is made to the Company through the payment window of its contracted payment gateway or through app market billing. The Company does not receive or store card numbers or other payment details."]]},{"h":"5. Validity, withdrawal and refunds","b":["Points (1P = ₩1) are recorded as paid points (charged by payment) and free points (given by the Company at no charge). Purchased points can be used for 1 year from the time of payment; points not used within that period expire. Free points can be used for 1 year from the date given.",["Within 7 days of payment: you can withdraw, and all unused paid points are refunded by cancelling the card payment with no fee (even if you used some).","After 7 days from payment: the remaining paid points, minus a refund fee of up to 10%, are refunded by a partial cancellation of the card payment (the rate applied is shown on the refund request screen). However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Free points are not refunded and expire when a refund is processed. Amounts under ₩10 are dropped."],["Refund of remaining songs: unused remaining songs are refunded by cancelling (partially cancelling) the card payment, at their paid value — the paid-point share of the Song bundle divided by its number of songs — for each unused song (1P = ₩1). Depending on the card company, this may take 3–7 business days.","Within 7 days of the bundle purchase date: refunded with no fee.","More than 7 days after the bundle purchase date: a refund fee of up to 10% is deducted (the rate applied is shown on the refund request screen). However, if your paid points and remaining songs past 7 days total 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund. Amounts under ₩10 are not refunded."],["Decoration items, room creation (including extensions), AI photo and video creation and LIVE broadcast deductions are provided as soon as they are used, so they can't be withdrawn or refunded. This is shown on the confirmation screen before use. If provision fails, however, the points used are returned.","Songs whose playback has started are not refunded. If a song fails to load and playback does not start, it is returned automatically."],"Refunds are made only by cancelling the payment on the card you paid with; there are no cash refunds or bank transfers. Depending on the card company, the cancellation may take 3–7 business days to appear.","You can request a refund with “My wallet > Request refund” in the karaoke or through the contact below.",{"a":"refund.html","t":"Details follow the Refund Policy."}]},{"h":"6. Age requirement","b":[["The Service is for users aged 15 and over. People under 15 may not use the Service. In these Terms, a minor means a person aged 15 or over and under 19, and an adult means a person aged 19 or over. Age is counted in full years from the date of birth, using the date in Korea, and a user is treated as an adult from their 19th birthday.","When you enter the Service (app), the Company checks once, by mobile identity verification, that you are 15 or older. You cannot use the Service without completing identity verification. We keep only the date of birth and gender from the result.","Minors can top up points up to KRW 200,000 per month. A payment made by a minor without the consent of a legal guardian may be cancelled by the minor or the legal guardian under the applicable laws (such as Article 5 of the Korean Civil Act), and the Company handles such cancellations and refunds under those laws."]]},{"h":"7. Contact","b":[{"contact":1},"Booman Inc. is responsible for all transactions, refunds and complaints."]}],"tel":"Tel","em":"Email","lk":["Terms","Refund policy","Privacy policy","Legal Notice"]},"ja":{"title":"サービス紹介","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. StageSongとは","b":["StageSong（ステージソング、マネーパズル カラオケ）は、株式会社ブマン（Booman Inc.）が運営するオンラインカラオケサービスです。クミョンエンターテインメントのカラオケ伴奏動画で、ウェブブラウザからすぐに歌えます。","歌は1曲ごとにポイントで利用し（1曲1,000P、1P＝1ウォン）、ポイントはクレジット・デビットカードでチャージします。画面は한국어・English・日本語・简体中文・繁體中文・Españolの6言語で利用できます。"]},{"h":"2. 主な機能","b":[["歌う：曲名や歌手で検索し、クミョンのカラオケ伴奏動画を再生して歌います。","録画とステージ：歌う姿を録画でき、録画した歌はログイン後に「ステージ」に投稿して他の利用者と一緒に見たり、リンクで共有したりできます。歌を投稿するには本人認証（満15歳以上）が必要です。","フェイスマスク・デコレーション：録画するときにフェイスマスクなどのデコレーションアイテムを使用できます。デコレーションアイテムはポイントで購入し、購入時刻から1日（24時間）、7日または30日間利用できます。","アカウント：GoogleまたはAppleアカウントでログインし、ポイントと残り曲はログインしたアカウントに保管されます。"]]},{"h":"3. 利用料金","b":[{"tbl":[["1曲","1,000P"],["曲パック 10曲","9,500P (1曲 950P)"],["曲パック 20曲","18,000P (1曲 900P)"],["曲パック 30曲","26,000P (1曲 867P)"],["曲パック 50曲","42,000P (1曲 840P)"],["ポイントチャージ（ウェブ）",["₩5,000 → 5,000P","₩10,000 → 10,000P","₩30,000 → 30,000P","₩50,000 → 50,000P"]]]},["カラオケは曲単位で利用します。曲ごとにポイントを使用し、価格は購入画面に表示されたとおりです。","当社は複数の曲をまとめた「曲パック」を販売します。曲パックはサイズ別にあり、有料ポイントでのみ購入でき、内容と価格は購入画面に表示されたとおりです。購入した曲はログインしたアカウントに「残り曲」として記録され、曲パックの購入日から1年間使用でき、期限内に使わなかった残り曲は消滅します。無料ポイントでは曲パックを購入できず、曲を1曲ずつ再生するときに使えます。","曲は再生が始まるときに1曲使用されます。1回の再生が1曲で、同じ曲を繰り返しても再生ごとに1曲使用されます。","曲を使用するのは歌う人だけで、視聴と鑑賞は無料です。"]]},{"h":"4. 決済手段","b":[["ポイントのチャージはクレジット・デビットカードの一括払いのみで（分割・簡単決済・口座振替は不可）、チャージ金額は5,000ウォン・10,000ウォン・30,000ウォン・50,000ウォンです。","ポイント代金は、当社が契約した電子決済代行会社の決済画面またはアプリマーケットの決済を通じて当社に支払われます。当社はカード番号などの決済情報を直接受け取ったり保存したりしません。"]]},{"h":"5. 有効期限・申込みの撤回・返金","b":["ポイント（1P＝1ウォン）は、有料ポイント（決済でチャージ）と無料ポイント（当社が無償で付与）に分けて記録します。チャージしたポイントの使用期限は決済時点から1年で、期限内に使わなかったポイントは消滅します。無料ポイントは付与日から1年間使用できます。",["決済日から7日以内：申込みの撤回ができ、使っていない有料ポイントをすべて手数料なしでカード決済取消により返金します（一部を使っていても）。","決済日から7日を過ぎた後：残りの有料ポイントから10%以内の返金手数料を差し引いた金額を、カード決済の部分取消で返金します（適用手数料率は返金申請画面に表示）。ただし残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","無料ポイントは返金せず、返金処理時に消滅します。10ウォン未満は切り捨てます。"],["残り曲の返金：使っていない残り曲は、曲パックの購入に使った有料ポイント分を曲数で割った金額で、使っていない曲数分を決済したカードの決済取消（部分取消）で返金します（1P＝1ウォン）。カード会社の事情により営業日基準で3〜7日かかる場合があります。","曲パックの購入日から7日以内：手数料なしで返金します。","曲パックの購入日から7日経過後：返金額から10%以内の返金手数料を差し引きます（適用率は返金申請画面に表示）。ただし、7日を過ぎた有料ポイントと残り曲の合計が10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。10ウォン未満は返金しません。"],["デコレーションアイテム、部屋の開設（延長を含む）、AI写真・動画の生成、LIVE配信の差引は使用と同時に提供されるサービスのため、申込みの撤回と返金はできません。このことは使用前の確認画面に表示します。ただし提供に失敗した場合は、使用したポイントをお返しします。","再生が始まった曲は返金されません。曲を読み込めず再生が始まらなかった場合は自動でお返しします。"],"返金は決済したカードの決済取消のみで行い、現金での支払いや口座振込による返金はしません。カード会社の事情により、取消の反映に営業日基準で3〜7日かかる場合があります。","返金申請はカラオケの「マイウォレット → 返金申請」または下記お問い合わせ先からできます。",{"a":"refund.html","t":"詳しくは返金規定に従います。"}]},{"h":"6. 利用年齢","b":[["本サービスは満15歳以上の方が利用でき、満15歳未満の方は利用できません。この規約で青少年とは満15歳以上満19歳未満の人を、成人とは満19歳以上の人をいいます。年齢は生年月日を基準とする満年齢で韓国の日付により計算し、満19歳の誕生日から成人として扱います。","当社はサービス（アプリ）に入るときに携帯電話の本人認証で満15歳以上かを一度確認し、本人認証を済ませないとサービスを利用できません。認証結果のうち生年月日と性別のみ保存します。","青少年のポイントチャージは月200,000ウォンまでです。未成年者が法定代理人の同意なく行った決済は、未成年者本人または法定代理人が関係法令（韓国民法第5条など）に基づき取り消すことができ、当社は決済の取消・返金を関係法令に従って処理します。"]]},{"h":"7. お問い合わせ","b":[{"contact":1},"すべての取引に関する責任・返金・苦情対応は株式会社ブマン（Booman Inc.）が行います。"]}],"tel":"電話","em":"メール","lk":["利用規約","返金規定","プライバシーポリシー","法的告知"]},"zhs":{"title":"服务介绍","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. StageSong 是什么服务","b":["StageSong（Money Puzzle 练歌房）是由株式会社Booman（Booman Inc.）运营的在线卡拉OK服务。您可以直接在网页浏览器中，跟着金永娱乐（Kumyoung Entertainment）的卡拉OK伴奏视频唱歌。","每首歌曲使用积分（每首1,000P，1P = 1韩元），积分通过信用卡·借记卡充值。界面支持한국어·English·日本語·简体中文·繁體中文·Español 6种语言。"]},{"h":"2. 主要功能","b":[["唱歌：按歌名或歌手搜索，播放金永卡拉OK伴奏视频并演唱。","录像与舞台：可以录下自己唱歌的样子，登录后可将录像发布到「舞台」与其他用户一起观看，或通过链接分享。发布歌曲需要完成实名认证（年满15周岁）。","面具·装饰：录像时可以使用面具等装饰道具。装饰道具用积分购买，自购买时起可使用1天（24小时）、7天或30天。","账户：使用Google或Apple账号登录，积分和剩余歌曲保存在登录的账户中。"]]},{"h":"3. 使用费用","b":[{"tbl":[["1首歌曲","1,000P"],["歌曲套餐 10首","9,500P (每首 950P)"],["歌曲套餐 20首","18,000P (每首 900P)"],["歌曲套餐 30首","26,000P (每首 867P)"],["歌曲套餐 50首","42,000P (每首 840P)"],["积分充值（网页）",["₩5,000 → 5,000P","₩10,000 → 10,000P","₩30,000 → 30,000P","₩50,000 → 50,000P"]]]},["卡拉OK按歌曲使用。每首歌使用积分，价格以购买页面显示为准。","本公司销售由多首歌曲组成的「歌曲套餐」。歌曲套餐按大小提供，仅可用付费积分购买，内容和价格以购买画面显示为准。购买的歌曲以「剩余歌曲」记录在登录的账号中，自歌曲套餐购买之日起1年内可用，期限内未使用的剩余歌曲将失效。免费积分不能购买歌曲套餐，可在逐首播放歌曲时使用。","歌曲在开始播放时使用1首。播放1次即为1首，重复同一首歌时每次播放都使用1首。","只有演唱者使用歌曲，观看和收听免费。"]]},{"h":"4. 支付方式","b":[["积分充值仅支持信用卡·借记卡一次性付款（不支持分期、简易支付、转账），充值金额为5,000韩元·10,000韩元·30,000韩元·50,000韩元。","积分款项通过本公司签约的电子支付代理机构的支付窗口或应用市场支付向本公司支付。本公司不直接接收或保存卡号等支付信息。"]]},{"h":"5. 有效期限·撤销订购·退款","b":["积分（1P = 1韩元）分为付费积分（付款充值）和免费积分（本公司免费赠送）记录。充值积分的使用期限为自付款时起1年，期限内未使用的积分将失效。免费积分自赠送之日起1年内可用。",["自付款之日起7日内：可撤销订购，未使用的付费积分全部免手续费以取消信用卡付款的方式退款（即使已使用部分）。","自付款之日起超过7日后：从剩余付费积分中扣除不超过10%的退款手续费后的金额，以信用卡付款部分取消的方式退款（适用费率显示在退款申请画面）。但剩余付费积分在10,000P以下时，改为扣除1,000韩元，扣除后金额少于扣除额的，不予退款。","免费积分不予退款，并在退款处理时失效。不足10韩元的部分舍去。"],["剩余歌曲退款：未使用的剩余歌曲按购买歌曲套餐所用付费积分除以歌曲数的金额，按未使用的歌曲数以取消（部分取消）所付款信用卡付款的方式退款（1P = 1韩元）。视发卡机构情况，可能需要3~7个工作日。","自歌曲套餐购买之日起7日内：免手续费退款。","自歌曲套餐购买之日起满7日后：从退款金额中扣除不超过10%的退款手续费（适用费率显示在退款申请页面）。但满7日的付费积分和剩余歌曲合计在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。不足10韩元的部分不予退还。"],["装饰道具、开设房间（含延长）、生成 AI 照片和视频、LIVE直播扣除属于使用即提供的服务，不可撤回或退款。此事项在使用前的确认页面上显示。但提供失败时，退还所用积分。","已开始播放的歌曲不予退款。歌曲加载失败而未开始播放时，将自动退回。"],"退款仅通过取消所付款信用卡的付款办理，不以现金支付或银行转账方式退款。视发卡机构情况，取消可能需要3~7个工作日生效。","可通过卡拉OK的“我的钱包 → 申请退款”或下方联系方式申请退款。",{"a":"refund.html","t":"详情以退款规定为准。"}]},{"h":"6. 使用年龄","b":[["本服务供年满15周岁者使用，未满15周岁者不得使用。本条款中，青少年指年满15周岁未满19周岁的人，成年人指年满19周岁的人。年龄以出生日期为准按周岁、依韩国日期计算，自满19周岁生日起按成年人处理。","进入本服务（应用）时，本公司通过手机实名认证确认一次是否年满15周岁；未完成实名认证的，不能使用本服务。认证结果中仅保存出生日期和性别。","青少年每月最多可充值200,000韩元积分。未成年人未经法定代理人同意进行的支付，未成年人本人或其法定代理人可依相关法律（韩国《民法》第5条等）撤销，本公司依相关法律处理付款撤销·退款。"]]},{"h":"7. 咨询","b":[{"contact":1},"所有交易的责任、退款及投诉等均由株式会社Booman（Booman Inc.）负责处理。"]}],"tel":"电话","em":"邮箱","lk":["使用条款","退款规定","隐私政策","法律声明"]},"zht":{"title":"服務介紹","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. StageSong 是什麼服務","b":["StageSong（Money Puzzle 練歌房）是由株式會社Booman（Booman Inc.）經營的線上卡拉OK服務。您可以直接在網頁瀏覽器中，跟著金永娛樂（Kumyoung Entertainment）的卡拉OK伴奏影片唱歌。","每首歌曲使用點數（每首1,000P，1P = 1韓元），點數透過信用卡·簽帳金融卡儲值。介面支援한국어·English·日本語·简体中文·繁體中文·Español 6種語言。"]},{"h":"2. 主要功能","b":[["唱歌：按歌名或歌手搜尋，播放金永卡拉OK伴奏影片並演唱。","錄影與舞台：可以錄下自己唱歌的樣子，登入後可將錄影發布到「舞台」與其他使用者一起觀看，或透過連結分享。發布歌曲需要完成實名認證（年滿15歲）。","面具·裝飾：錄影時可以使用面具等裝飾道具。裝飾道具以點數購買，自購買時起可使用1天（24小時）、7天或30天。","帳戶：使用Google或Apple帳號登入，點數和剩餘歌曲保存在登入的帳戶中。"]]},{"h":"3. 使用費用","b":[{"tbl":[["1首歌曲","1,000P"],["歌曲套餐 10首","9,500P (每首 950P)"],["歌曲套餐 20首","18,000P (每首 900P)"],["歌曲套餐 30首","26,000P (每首 867P)"],["歌曲套餐 50首","42,000P (每首 840P)"],["點數儲值（網頁）",["₩5,000 → 5,000P","₩10,000 → 10,000P","₩30,000 → 30,000P","₩50,000 → 50,000P"]]]},["卡拉OK按歌曲使用。每首歌使用點數，價格以購買頁面顯示為準。","本公司販售由多首歌曲組成的「歌曲套餐」。歌曲套餐依大小提供，僅可用付費點數購買，內容和價格以購買畫面顯示為準。購買的歌曲以「剩餘歌曲」記錄在登入的帳號中，自歌曲套餐購買之日起1年內可用，期限內未使用的剩餘歌曲將失效。免費點數不能購買歌曲套餐，可在逐首播放歌曲時使用。","歌曲於開始播放時使用1首。播放1次即為1首，重複同一首歌時每次播放都使用1首。","只有演唱者使用歌曲，觀看和收聽免費。"]]},{"h":"4. 付款方式","b":[["點數儲值僅支援信用卡·簽帳金融卡一次付清（不支援分期、簡易支付、轉帳），儲值金額為5,000韓元·10,000韓元·30,000韓元·50,000韓元。","點數款項透過本公司簽約的電子支付代理機構的付款視窗或應用程式商店付款向本公司支付。本公司不直接接收或儲存卡號等付款資訊。"]]},{"h":"5. 有效期限·撤銷訂購·退款","b":["點數（1P = 1韓元）分為付費點數（付款儲值）和免費點數（本公司免費贈送）記錄。儲值點數的使用期限為自付款時起1年，期限內未使用的點數將失效。免費點數自贈送之日起1年內可用。",["自付款之日起7日內：可撤銷訂購，未使用的付費點數全部免手續費以取消信用卡付款的方式退款（即使已使用部分）。","自付款之日起超過7日後：從剩餘付費點數中扣除不超過10%的退款手續費後的金額，以信用卡付款部分取消的方式退款（適用費率顯示在退款申請畫面）。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元，扣除後金額少於扣除額者，不予退款。","免費點數不予退款，並於退款處理時失效。未滿10韓元的部分捨去。"],["剩餘歌曲退款：未使用的剩餘歌曲按購買歌曲套餐所用付費點數除以歌曲數的金額，依未使用的歌曲數以取消（部分取消）所付款信用卡付款的方式退款（1P = 1韓元）。視發卡機構情況，可能需要3~7個工作日。","自歌曲套餐購買之日起7日內：免手續費退款。","自歌曲套餐購買之日起滿7日後：從退款金額中扣除不超過10%的退款手續費（適用費率顯示在退款申請頁面）。但滿7日的付費點數和剩餘歌曲合計在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。未滿10韓元的部分不予退還。"],["裝飾道具、開設房間（含延長）、生成 AI 照片和影片、LIVE直播扣除屬於使用即提供的服務，不可撤回或退款。此事項於使用前的確認頁面上顯示。但提供失敗時，退還所用點數。","已開始播放的歌曲不予退款。歌曲載入失敗而未開始播放時，將自動退回。"],"退款僅透過取消所付款信用卡的付款辦理，不以現金支付或銀行轉帳方式退款。視發卡機構情況，取消可能需要3~7個工作日生效。","可透過卡拉OK的「我的錢包 → 申請退款」或下方聯絡方式申請退款。",{"a":"refund.html","t":"詳情以退款規定為準。"}]},{"h":"6. 使用年齡","b":[["本服務供年滿15歲者使用，未滿15歲者不得使用。本條款中，青少年指年滿15歲未滿19歲之人，成年人指年滿19歲之人。年齡以出生日期為準按實足年齡、依韓國日期計算，自滿19歲生日起按成年人處理。","進入本服務（應用程式）時，本公司透過手機實名認證確認一次是否年滿15歲；未完成實名認證者，不能使用本服務。認證結果中僅儲存出生日期和性別。","青少年每月最多可儲值200,000韓元點數。未成年人未經法定代理人同意所為之付款，未成年人本人或其法定代理人得依相關法令（韓國《民法》第5條等）撤銷，本公司依相關法令處理付款撤銷·退款。"]]},{"h":"7. 諮詢","b":[{"contact":1},"所有交易的責任、退款及申訴等均由株式會社Booman（Booman Inc.）負責處理。"]}],"tel":"電話","em":"電郵","lk":["使用條款","退款規定","隱私政策","法律聲明"]},"es":{"title":"Acerca del servicio","app":"StageSong · Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. ¿Qué es StageSong?","b":["StageSong (Money Puzzle Karaoke) es un servicio de karaoke en línea gestionado por Booman Inc. Puedes cantar con los vídeos de acompañamiento de karaoke de Kumyoung Entertainment directamente en tu navegador web.","Cada canción se paga con puntos (1.000P por canción, 1P = ₩1) y los puntos se recargan con tarjeta de crédito o débito. El servicio está disponible en 6 idiomas: 한국어, English, 日本語, 简体中文, 繁體中文 y Español."]},{"h":"2. Funciones principales","b":[["Cantar: busca por título o artista, reproduce el vídeo de acompañamiento de karaoke de Kumyoung y canta.","Grabación y Escenario: puedes grabarte cantando y, tras iniciar sesión, publicar la grabación en «Escenario» para que otros usuarios la vean o compartirla con un enlace. Para publicar una canción hace falta la verificación de identidad (15 años o más).","Máscaras faciales y decoración: al grabar puedes usar artículos de decoración como máscaras faciales. Los artículos de decoración se compran con puntos y se usan durante 1 día (24 horas), 7 días o 30 días desde la hora de compra.","Cuenta: inicia sesión con tu cuenta de Google o Apple; tus puntos y canciones restantes se guardan en la cuenta con la que inicias sesión."]]},{"h":"3. Precios","b":[{"tbl":[["1 canción","1.000P"],["Paquete de 10 canciones","9.500P (950P por canción)"],["Paquete de 20 canciones","18.000P (900P por canción)"],["Paquete de 30 canciones","26.000P (867P por canción)"],["Paquete de 50 canciones","42.000P (840P por canción)"],["Recarga de puntos (web)",["₩5.000 → 5.000P","₩10.000 → 10.000P","₩30.000 → 30.000P","₩50.000 → 50.000P"]]]},["El karaoke se usa por canciones. Cada canción usa puntos, y el precio es el que muestra la pantalla de compra.","La Empresa vende «paquetes de canciones» que agrupan varias canciones. Hay paquetes de varios tamaños, solo se compran con puntos de pago y su contenido y precio son los que se muestran en la pantalla de compra. Las canciones compradas se registran como «canciones restantes» en tu cuenta; pueden usarse durante 1 año desde la compra del paquete y las que no se usen en ese plazo caducan. Los puntos gratuitos no sirven para comprar paquetes de canciones; se pueden usar para reproducir canciones una a una.","Se usa una canción cuando empieza la reproducción. Una reproducción es un uso, y repetir la misma canción usa una canción cada vez.","Solo usa una canción quien canta; ver y escuchar es gratis."]]},{"h":"4. Medios de pago","b":[["Los puntos solo se recargan con tarjeta de crédito/débito en un único pago (sin cuotas, pagos rápidos ni transferencia), por importes de ₩5.000, ₩10.000, ₩30.000 y ₩50.000.","El pago de los puntos se hace a la Empresa a través de la ventana de pago de su pasarela contratada o de la facturación de la tienda de apps. La Empresa no recibe ni guarda números de tarjeta u otros datos de pago."]]},{"h":"5. Validez, desistimiento y reembolsos","b":["Los puntos (1P = ₩1) se registran como puntos de pago (recargados con pago) y puntos gratuitos (entregados por la Empresa sin coste). Los puntos comprados pueden usarse durante 1 año desde el pago; los que no se usen en ese plazo caducan. Los puntos gratuitos pueden usarse durante 1 año desde su entrega.",["En los 7 días siguientes al pago: puedes desistir y todos los puntos de pago no usados se reembolsan anulando el pago con tarjeta, sin comisión (aunque hayas usado parte).","Pasados 7 días desde el pago: los puntos de pago restantes, menos una comisión de reembolso de hasta el 10%, se reembolsan con una anulación parcial del pago con tarjeta (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda es menor que el descuento, no hay reembolso.","Los puntos gratuitos no se reembolsan y caducan al procesar un reembolso. Se descartan los importes inferiores a ₩10."],["Reembolso de canciones restantes: las canciones restantes no usadas se reembolsan anulando (total o parcialmente) el pago con tarjeta, por su valor pagado —la parte en puntos de pago del paquete dividida entre su número de canciones— por cada canción no usada (1P = ₩1). Según la entidad emisora, puede tardar de 3 a 7 días hábiles.","En los 7 días siguientes a la compra del paquete: se reembolsa sin comisión.","Pasados 7 días desde la compra del paquete: se descuenta una comisión de reembolso de hasta el 10% (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago y las canciones restantes con más de 7 días suman 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso. No se reembolsan importes inferiores a ₩10."],["Los artículos de decoración, la creación de salas (incluidas las ampliaciones), la creación de fotos y vídeos con IA y los descuentos por emisiones LIVE se prestan en el momento de usarlos, por lo que no admiten desistimiento ni reembolso. Esto se indica en la pantalla de confirmación antes del uso. No obstante, si la prestación falla, se devuelven los puntos usados.","Las canciones cuya reproducción ya empezó no se reembolsan. Si una canción no se carga y la reproducción no empieza, se devuelve automáticamente."],"Los reembolsos solo se hacen anulando el pago en la tarjeta con la que pagaste; no hay reembolsos en efectivo ni por transferencia bancaria. Según la entidad emisora, la anulación puede tardar de 3 a 7 días hábiles en reflejarse.","Puedes solicitar el reembolso con «Mi monedero > Solicitar reembolso» en el karaoke o en el contacto de abajo.",{"a":"refund.html","t":"Los detalles siguen la Política de reembolso."}]},{"h":"6. Edad mínima","b":[["El Servicio es para personas de 15 años o más. Los menores de 15 años no pueden usarlo. En estos Términos, menor significa una persona de 15 años o más y menos de 19, y adulto una persona de 19 años o más. La edad se cuenta en años cumplidos desde la fecha de nacimiento, según la fecha de Corea, y se te trata como adulto desde tu 19.º cumpleaños.","Al entrar en el Servicio (app), la Empresa comprueba una vez, mediante verificación de identidad por móvil, que tienes 15 años o más. Sin completar la verificación de identidad no puedes usar el Servicio. Del resultado solo guardamos la fecha de nacimiento y el sexo.","Los menores pueden recargar hasta 200.000 KRW en puntos al mes. Un pago hecho por un menor sin el consentimiento de su representante legal puede ser anulado por el menor o por su representante legal según la ley aplicable (como el artículo 5 del Código Civil coreano), y la Empresa tramita esas anulaciones y reembolsos conforme a dicha ley."]]},{"h":"7. Contacto","b":[{"contact":1},"Booman Inc. se encarga de la responsabilidad, los reembolsos y las reclamaciones de todas las transacciones."]}],"tel":"Teléfono","em":"Correo","lk":["Términos","Reembolsos","Privacidad","Aviso legal"]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function inline(s){ return esc(s).replace(/(admin|emhwang3)@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }
function opBlock(lang){ var o=OP[lang], d=D[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov]];
  if(BIZ_TEL) L.push([d.tel, esc(BIZ_TEL)]);
  L.push([o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],[o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]);
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<div class="hd"><img src="logo.png" alt=""><h1>'+esc(d.title)+'</h1></div>';
  h+='<p class="eff">'+esc(d.app)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else if(b&&b.tbl){ h+='<table class="pt">'; for(var r=0;r<b.tbl.length;r++) h+='<tr><td>'+esc(b.tbl[r][0])+'</td><td>'+(typeof b.tbl[r][1]==="string"?esc(b.tbl[r][1]):b.tbl[r][1].map(esc).join('<br>'))+'</td></tr>'; h+='</table>'; }
      else if(b&&b.a) h+='<p><a href="'+b.a+'?lang='+lang+'">'+esc(b.t)+'</a></p>';
      else if(b&&b.contact) h+='<ul><li>'+esc(d.em)+': <a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a></li>'+(BIZ_TEL?'<li>'+esc(d.tel)+': '+esc(BIZ_TEL)+'</li>':'')+'</ul>';
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+='<p class="lk"><a href="terms.html?lang='+lang+'">'+esc(d.lk[0])+'</a> · <a href="refund.html?lang='+lang+'">'+esc(d.lk[1])+'</a> · <a href="privacy.html?lang='+lang+'">'+esc(d.lk[2])+'</a> · <a href="legal.html?lang='+lang+'">'+esc(d.lk[3])+'</a></p>';
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

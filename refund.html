var D={"ko":{"title":"환불 규정","eff":"시행일: 2027년 1월 1일","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. 곡과 곡 묶음","b":["노래는 곡 단위로 이용합니다. 곡마다 포인트를 사용하며, 가격은 구매 화면에 표시된 대로입니다.","회사는 여러 곡을 묶은 「곡 묶음」을 판매합니다. 곡 묶음은 크기별로 있고 유료 포인트로만 구매할 수 있으며, 구성과 가격은 구매 화면에 표시된 대로입니다. 구매한 곡은 로그인한 계정에 「잔여 곡」으로 기록되며, 곡 묶음 구매일로부터 1년간 사용할 수 있고 기한 내 사용하지 않은 잔여 곡은 소멸합니다. 무료 포인트로는 곡 묶음을 구매할 수 없으며, 곡을 1곡씩 재생할 때 사용할 수 있습니다.","곡은 재생이 시작될 때 1곡이 사용됩니다. 재생 1회가 1곡이며, 같은 곡을 반복해 불러도 재생마다 1곡이 사용됩니다.","사용 순서는 출시 이벤트 무료 곡, 잔여 곡, 포인트(유료 포인트 먼저) 순입니다. 잔액이 부족하면 재생이 시작되지 않습니다.","우리끼리 노래, LIVE, 챌린지, 릴레이, 녹화에도 같은 규칙을 적용합니다. 노래를 부르는 사람만 곡을 사용하며, 보기와 듣기는 무료입니다. LIVE 방송의 관람객별 포인트 차감과 선물은 별도입니다.","곡을 불러오지 못해 재생이 시작되지 않으면 사용한 곡은 자동으로 되돌립니다.",["잔여 곡 환불: 사용하지 않은 잔여 곡은 곡 묶음 구매에 사용한 유료 포인트 몫을 곡 수로 나눈 금액으로, 사용하지 않은 곡 수만큼 결제한 카드의 결제 취소(부분 취소)로 환불합니다(1P = 1원). 카드사 사정에 따라 영업일 기준 3~7일이 걸릴 수 있습니다.","곡 묶음 구매일로부터 7일 이내: 수수료 없이 환불합니다.","곡 묶음 구매일로부터 7일이 지난 뒤: 환불 금액에서 10% 이내의 환불 수수료를 공제합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 7일이 지난 유료 포인트와 잔여 곡을 합쳐 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다. 10원 미만은 환불하지 않습니다.","앱 마켓에서 충전한 포인트로 산 곡 묶음의 몫은 해당 앱 마켓의 환불 규정을 따릅니다.","재생이 시작된 곡은 환불하지 않습니다.","곡과 곡 묶음에 사용한 포인트는 지갑으로 되돌리지 않습니다(재생이 시작되지 않은 경우는 제외).","환불 요청 중인 잔여 곡은 처리가 끝날 때까지 사용할 수 없습니다."],"환불 요청은 노래방 「내 지갑 → 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"2. 노래방 포인트","b":["포인트(1P = 1원)는 유료 포인트(결제로 충전)와 무료 포인트(회사가 무상 지급)로 나누어 기록합니다. 충전 포인트의 사용기한은 결제 시점부터 1년이며, 기한 내 미사용 포인트는 소멸됩니다. 무료 포인트는 지급일로부터 1년간 사용할 수 있습니다.","포인트 충전은 신용·체크카드 일시불로만 결제할 수 있으며(할부·간편결제·계좌이체 불가), 충전 금액은 5,000원·10,000원·30,000원·50,000원입니다.",["결제일로부터 7일 이내: 청약철회가 가능하며, 사용하지 않은 유료 포인트 전부를 수수료 없이 카드 결제 취소로 환불합니다(일부를 사용했어도).","결제일로부터 7일이 지난 뒤: 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제한 금액을 카드 결제 부분 취소로 환불합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","무료 포인트는 환불하지 않으며 환불 처리 시 소멸합니다. 10원 미만은 버립니다."],"예: 50,000P를 충전하고 44,000P를 사용한 경우, 8일째에는 잔여 6,000P에서 1,000원을 공제해 5,000원 환불. 50,000P를 충전하고 20,000P를 사용한 경우, 8일째에는 잔여 30,000P에서 수수료 10%를 공제해 27,000원 환불.","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트는 해당 앱 마켓의 환불 규정을 따르며, 앱 마켓에서 환불되면 그 포인트를 지갑에서 차감합니다.","환불 요청은 노래방 「내 지갑 → 환불 요청」 단추 또는 아래 문의처로 하실 수 있습니다."]},{"h":"2-1. LIVE 방송 포인트·선물","b":[["LIVE 방송으로 차감된 포인트는 이미 사용한 서비스 대가이므로 환불되지 않습니다. 자동 감시 오판 복구는 예외입니다.","보낸 LIVE 선물은 취소·환불되지 않습니다. 다만 관련 법령에 따라 취소할 수 있는 경우는 예외로 합니다.","받은 선물로 적립된 포인트와 순위 상금은 무료 포인트이므로 환불되거나 현금으로 바뀌지 않습니다."]]},{"h":"2-2. 사용 즉시 제공되는 서비스","b":[["꾸미기 아이템, 방 개설(연장 포함), AI 사진·영상 생성, LIVE 방송 차감은 사용 즉시 제공되는 서비스이므로 청약철회와 환불이 되지 않습니다. 이 사실은 사용 전 확인 화면에 표시합니다. 다만 제공에 실패하면 사용한 포인트를 되돌립니다.","재생이 시작된 곡은 환불되지 않습니다. 곡을 불러오지 못해 재생이 시작되지 않으면 자동으로 되돌립니다.","출시 이벤트 무료 곡은 환불하지 않습니다."]]},{"h":"3. 환불 방법과 문의","b":["환불은 결제한 카드의 결제 취소로만 가능하며, 현금 지급이나 계좌 이체로는 환불하지 않습니다. 카드사 사정에 따라 취소 반영에 영업일 기준 3~7일이 걸릴 수 있습니다.","결제일로부터 7일 이내 청약철회가 가능합니다.","모든 거래에 대한 책임과 환불, 민원 등은 주식회사 부만에서 진행합니다. 민원담당자: 감사 황의만 · 010-4221-7066","문의: 고객센터 010-4221-7066 또는 이메일 admin@moneypuzzle.co.kr"]}]},"en":{"title":"Refund Policy","eff":"Effective date: January 1, 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. Songs and Song bundles","b":["Karaoke is used song by song. Each song uses points, and the price is as shown on the purchase screen.","The Company sells “Song bundles” that group several songs. Bundles come in several sizes, can be bought with paid points only, and their contents and prices are as shown on the purchase screen. Songs you buy are recorded as “remaining songs” on your signed-in account; they can be used for 1 year from the bundle purchase date, and remaining songs not used within that period expire. Free points cannot be used to buy Song bundles; they can be used to play songs one at a time.","One song is used when playback starts. One play is one use, and repeating the same song uses one song each time.","Songs are used in this order: launch event free songs, remaining songs, then points (paid points first). If your balance is not enough, playback does not start.","The same rule applies to Just Us Karaoke, LIVE, Challenge, Relay and recording: only the person singing uses a song, and watching and listening are free. The per-viewer point charge for LIVE broadcasts and gifts are separate.","If a song fails to load and playback does not start, it is returned automatically.",["Refund of remaining songs: unused remaining songs are refunded by cancelling (partially cancelling) the card payment, at their paid value — the paid-point share of the Song bundle divided by its number of songs — for each unused song (1P = ₩1). Depending on the card company, this may take 3–7 business days.","Within 7 days of the bundle purchase date: refunded with no fee.","More than 7 days after the bundle purchase date: a refund fee of up to 10% is deducted (the rate applied is shown on the refund request screen). However, if your paid points and remaining songs past 7 days total 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund. Amounts under ₩10 are not refunded.","The share of a Song bundle bought with points topped up in an app market follows that market's refund policy.","Songs whose playback has started are not refunded.","Points spent on songs and Song bundles are not returned to your wallet, except where playback did not start.","Remaining songs under a refund request cannot be used until the request is processed."],"You can request a refund with “My wallet > Request refund” in the karaoke or through the contact below."]},{"h":"2. Karaoke points","b":["Points (1P = ₩1) are recorded as paid points (charged by payment) and free points (given by the Company at no charge). Purchased points can be used for 1 year from the time of payment; points not used within that period expire. Free points can be used for 1 year from the date given.","Points can be topped up only by credit/debit card in a single payment (no installments, easy-pay or bank transfer), in amounts of ₩5,000, ₩10,000, ₩30,000 and ₩50,000.",["Within 7 days of payment: you can withdraw, and all unused paid points are refunded by cancelling the card payment with no fee (even if you used some).","After 7 days from payment: the remaining paid points, minus a refund fee of up to 10%, are refunded by a partial cancellation of the card payment (the rate applied is shown on the refund request screen). However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Free points are not refunded and expire when a refund is processed. Amounts under ₩10 are dropped."],"Example: if you top up 50,000P and use 44,000P, on day 8 ₩1,000 is deducted from the remaining 6,000P and ₩5,000 is refunded. If you top up 50,000P and use 20,000P, on day 8 a 10% fee is deducted from the remaining 30,000P and ₩27,000 is refunded.","Points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy; if the marketplace refunds them, the points are deducted from your wallet.","You can request a refund with “My wallet > Request refund” in the karaoke or through the contact below."]},{"h":"2-1. LIVE broadcast points and gifts","b":[["Points deducted for a LIVE broadcast pay for service already used and can't be refunded. Restoration after a mistaken automatic monitoring decision is an exception.","Sent LIVE gifts can't be cancelled or refunded, except where the law allows cancellation.","Points earned from gifts and ranking prizes are free points and can't be refunded or exchanged for cash."]]},{"h":"2-2. Services provided on use","b":[["Decoration items, room creation (including extensions), AI photo and video creation and LIVE broadcast deductions are provided as soon as they are used, so they can't be withdrawn or refunded. This is shown on the confirmation screen before use. If provision fails, however, the points used are returned.","Songs whose playback has started are not refunded. If a song fails to load and playback does not start, it is returned automatically.","Free songs from the launch event are not refunded."]]},{"h":"3. How refunds are paid and contact","b":["Refunds are made only by cancelling the payment on the card you paid with; there are no cash refunds or bank transfers. Depending on the card company, the cancellation may take 3–7 business days to appear.","You can withdraw within 7 days of payment.","Booman Inc. is responsible for all transactions, refunds and complaints. Complaints officer: Hwang Euiman (Auditor) · 010-4221-7066","Contact: Support +82-10-4221-7066 or email admin@moneypuzzle.co.kr"]}]},"ja":{"title":"返金規定","eff":"施行日：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. 曲と曲パック","b":["カラオケは曲単位で利用します。曲ごとにポイントを使用し、価格は購入画面に表示されたとおりです。","当社は複数の曲をまとめた「曲パック」を販売します。曲パックはサイズ別にあり、有料ポイントでのみ購入でき、内容と価格は購入画面に表示されたとおりです。購入した曲はログインしたアカウントに「残り曲」として記録され、曲パックの購入日から1年間使用でき、期限内に使わなかった残り曲は消滅します。無料ポイントでは曲パックを購入できず、曲を1曲ずつ再生するときに使えます。","曲は再生が始まるときに1曲使用されます。1回の再生が1曲で、同じ曲を繰り返しても再生ごとに1曲使用されます。","使用の順序は、リリース記念イベントの無料曲、残り曲、ポイント（有料ポイントが先）の順です。残高が足りない場合、再生は始まりません。","仲間だけカラオケ、LIVE、チャレンジ、リレー、録画にも同じルールを適用します。曲を使用するのは歌う人だけで、視聴と鑑賞は無料です。LIVE配信の視聴者ごとのポイント差引とギフトは別です。","曲を読み込めず再生が始まらなかった場合、使用した曲は自動でお返しします。",["残り曲の返金：使っていない残り曲は、曲パックの購入に使った有料ポイント分を曲数で割った金額で、使っていない曲数分を決済したカードの決済取消（部分取消）で返金します（1P＝1ウォン）。カード会社の事情により営業日基準で3〜7日かかる場合があります。","曲パックの購入日から7日以内：手数料なしで返金します。","曲パックの購入日から7日経過後：返金額から10%以内の返金手数料を差し引きます（適用率は返金申請画面に表示）。ただし、7日を過ぎた有料ポイントと残り曲の合計が10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。10ウォン未満は返金しません。","アプリマーケットでチャージしたポイントで購入した曲パックの分は、そのマーケットの返金規定に従います。","再生が始まった曲は返金しません。","曲と曲パックに使ったポイントはウォレットに戻しません（再生が始まらなかった場合を除きます）。","返金申請中の残り曲は処理が終わるまで使用できません。"],"返金申請はカラオケの「マイウォレット → 返金申請」または下記お問い合わせ先からできます。"]},{"h":"2. カラオケポイント","b":["ポイント（1P＝1ウォン）は、有料ポイント（決済でチャージ）と無料ポイント（当社が無償で付与）に分けて記録します。チャージしたポイントの使用期限は決済時点から1年で、期限内に使わなかったポイントは消滅します。無料ポイントは付与日から1年間使用できます。","ポイントのチャージはクレジット・デビットカードの一括払いのみで（分割・簡単決済・口座振替は不可）、チャージ金額は5,000ウォン・10,000ウォン・30,000ウォン・50,000ウォンです。",["決済日から7日以内：申込みの撤回ができ、使っていない有料ポイントをすべて手数料なしでカード決済取消により返金します（一部を使っていても）。","決済日から7日を過ぎた後：残りの有料ポイントから10%以内の返金手数料を差し引いた金額を、カード決済の部分取消で返金します（適用手数料率は返金申請画面に表示）。ただし残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","無料ポイントは返金せず、返金処理時に消滅します。10ウォン未満は切り捨てます。"],"例：50,000Pをチャージして44,000Pを使った場合、8日目は残り6,000Pから1,000ウォンを差し引いて5,000ウォン返金。50,000Pをチャージして20,000Pを使った場合、8日目は残り30,000Pから手数料10%を差し引いて27,000ウォン返金。","Google Play・App Storeなどのアプリマーケットで購入したポイントは、そのマーケットの返金規定に従い、マーケットで返金された場合はウォレットから差し引きます。","返金申請はカラオケの「マイウォレット → 返金申請」または下記お問い合わせ先からできます。"]},{"h":"2-1. LIVE配信のポイント・ギフト","b":[["LIVE配信で差し引かれたポイントは利用済みのサービス対価のため返金されません。自動監視の誤判定による復旧は例外です。","贈ったLIVEギフトは取消・返金できません。ただし関連法令により取り消せる場合を除きます。","受け取ったギフトで積み立てたポイントとランキング賞金は無料ポイントのため、返金や現金化はできません。"]]},{"h":"2-2. 使用と同時に提供されるサービス","b":[["デコレーションアイテム、部屋の開設（延長を含む）、AI写真・動画の生成、LIVE配信の差引は使用と同時に提供されるサービスのため、申込みの撤回と返金はできません。このことは使用前の確認画面に表示します。ただし提供に失敗した場合は、使用したポイントをお返しします。","再生が始まった曲は返金されません。曲を読み込めず再生が始まらなかった場合は自動でお返しします。","リリース記念イベントの無料曲は返金しません。"]]},{"h":"3. 返金方法・お問い合わせ","b":["返金は決済したカードの決済取消のみで行い、現金での支払いや口座振込による返金はしません。カード会社の事情により、取消の反映に営業日基準で3〜7日かかる場合があります。","決済日から7日以内は申込みの撤回ができます。","すべての取引に関する責任・返金・苦情対応は株式会社ブマン（Booman Inc.）が行います。苦情担当者：監査役 ファン・ウィマン · 010-4221-7066","お問い合わせ：カスタマーセンター +82-10-4221-7066 またはメール admin@moneypuzzle.co.kr"]}]},"zhs":{"title":"退款规定","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. 歌曲与歌曲套餐","b":["卡拉OK按歌曲使用。每首歌使用积分，价格以购买页面显示为准。","本公司销售由多首歌曲组成的「歌曲套餐」。歌曲套餐按大小提供，仅可用付费积分购买，内容和价格以购买画面显示为准。购买的歌曲以「剩余歌曲」记录在登录的账号中，自歌曲套餐购买之日起1年内可用，期限内未使用的剩余歌曲将失效。免费积分不能购买歌曲套餐，可在逐首播放歌曲时使用。","歌曲在开始播放时使用1首。播放1次即为1首，重复同一首歌时每次播放都使用1首。","使用顺序为：上线活动的免费歌曲、剩余歌曲、积分（付费积分优先）。余额不足时不会开始播放。","小圈子K歌、LIVE、挑战、接力和录像也适用同一规则：只有演唱者使用歌曲，观看和收听免费。LIVE直播按观众扣除的积分和礼物另行计算。","歌曲加载失败而未开始播放时，已使用的歌曲将自动退回。",["剩余歌曲退款：未使用的剩余歌曲按购买歌曲套餐所用付费积分除以歌曲数的金额，按未使用的歌曲数以取消（部分取消）所付款信用卡付款的方式退款（1P = 1韩元）。视发卡机构情况，可能需要3~7个工作日。","自歌曲套餐购买之日起7日内：免手续费退款。","自歌曲套餐购买之日起满7日后：从退款金额中扣除不超过10%的退款手续费（适用费率显示在退款申请页面）。但满7日的付费积分和剩余歌曲合计在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。不足10韩元的部分不予退还。","用应用商店充值的积分购买的歌曲套餐部分，按该商店的退款规定办理。","已开始播放的歌曲不予退款。","用于歌曲和歌曲套餐的积分不退回钱包（未开始播放的情况除外）。","申请退款中的剩余歌曲在处理完成前不能使用。"],"可通过卡拉OK的“我的钱包 → 申请退款”或下方联系方式申请退款。"]},{"h":"2. 卡拉OK积分","b":["积分（1P = 1韩元）分为付费积分（付款充值）和免费积分（本公司免费赠送）记录。充值积分的使用期限为自付款时起1年，期限内未使用的积分将失效。免费积分自赠送之日起1年内可用。","积分充值仅支持信用卡·借记卡一次性付款（不支持分期、简易支付、转账），充值金额为5,000韩元·10,000韩元·30,000韩元·50,000韩元。",["自付款之日起7日内：可撤销订购，未使用的付费积分全部免手续费以取消信用卡付款的方式退款（即使已使用部分）。","自付款之日起超过7日后：从剩余付费积分中扣除不超过10%的退款手续费后的金额，以信用卡付款部分取消的方式退款（适用费率显示在退款申请画面）。但剩余付费积分在10,000P以下时，改为扣除1,000韩元，扣除后金额少于扣除额的，不予退款。","免费积分不予退款，并在退款处理时失效。不足10韩元的部分舍去。"],"例：充值50,000P并使用44,000P时，第8天从剩余6,000P中扣除1,000韩元，退还5,000韩元。充值50,000P并使用20,000P时，第8天从剩余30,000P中扣除10%手续费，退还27,000韩元。","在 Google Play、App Store 等应用市场购买的积分按该市场的退款规定办理；市场退款后，将从钱包中扣除相应积分。","可通过卡拉OK的“我的钱包 → 申请退款”或下方联系方式申请退款。"]},{"h":"2-1. LIVE直播积分与礼物","b":[["LIVE直播扣除的积分属于已使用服务的对价，不予退款。自动监测误判的恢复除外。","已送出的LIVE礼物不可取消或退款，但依相关法令可取消的情形除外。","收到礼物累积的积分和排名奖金属于免费积分，不可退款或兑换现金。"]]},{"h":"2-2. 使用即提供的服务","b":[["装饰道具、开设房间（含延长）、生成 AI 照片和视频、LIVE直播扣除属于使用即提供的服务，不可撤回或退款。此事项在使用前的确认页面上显示。但提供失败时，退还所用积分。","已开始播放的歌曲不予退款。歌曲加载失败而未开始播放时，将自动退回。","上线活动的免费歌曲不予退款。"]]},{"h":"3. 退款方式与咨询","b":["退款仅通过取消所付款信用卡的付款办理，不以现金支付或银行转账方式退款。视发卡机构情况，取消可能需要3~7个工作日生效。","自付款之日起7日内可撤销订购。","所有交易的责任、退款及投诉等均由株式会社Booman（Booman Inc.）负责处理。投诉负责人：监事 黄义满 · 010-4221-7066","咨询：客服 +82-10-4221-7066 或邮箱 admin@moneypuzzle.co.kr"]}]},"zht":{"title":"退款規定","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. 歌曲與歌曲套餐","b":["卡拉OK按歌曲使用。每首歌使用點數，價格以購買頁面顯示為準。","本公司販售由多首歌曲組成的「歌曲套餐」。歌曲套餐依大小提供，僅可用付費點數購買，內容和價格以購買畫面顯示為準。購買的歌曲以「剩餘歌曲」記錄在登入的帳號中，自歌曲套餐購買之日起1年內可用，期限內未使用的剩餘歌曲將失效。免費點數不能購買歌曲套餐，可在逐首播放歌曲時使用。","歌曲於開始播放時使用1首。播放1次即為1首，重複同一首歌時每次播放都使用1首。","使用順序為：上線活動的免費歌曲、剩餘歌曲、點數（付費點數優先）。餘額不足時不會開始播放。","小圈子K歌、LIVE、挑戰、接力和錄影也適用同一規則：只有演唱者使用歌曲，觀看和收聽免費。LIVE直播按觀眾扣除的點數和禮物另行計算。","歌曲載入失敗而未開始播放時，已使用的歌曲將自動退回。",["剩餘歌曲退款：未使用的剩餘歌曲按購買歌曲套餐所用付費點數除以歌曲數的金額，依未使用的歌曲數以取消（部分取消）所付款信用卡付款的方式退款（1P = 1韓元）。視發卡機構情況，可能需要3~7個工作日。","自歌曲套餐購買之日起7日內：免手續費退款。","自歌曲套餐購買之日起滿7日後：從退款金額中扣除不超過10%的退款手續費（適用費率顯示在退款申請頁面）。但滿7日的付費點數和剩餘歌曲合計在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。未滿10韓元的部分不予退還。","以應用商店儲值的點數購買的歌曲套餐部分，依該商店的退款規定辦理。","已開始播放的歌曲不予退款。","用於歌曲和歌曲套餐的點數不退回錢包（未開始播放的情況除外）。","申請退款中的剩餘歌曲在處理完成前不能使用。"],"可透過卡拉OK的「我的錢包 → 申請退款」或下方聯絡方式申請退款。"]},{"h":"2. 卡拉OK點數","b":["點數（1P = 1韓元）分為付費點數（付款儲值）和免費點數（本公司免費贈送）記錄。儲值點數的使用期限為自付款時起1年，期限內未使用的點數將失效。免費點數自贈送之日起1年內可用。","點數儲值僅支援信用卡·簽帳金融卡一次付清（不支援分期、簡易支付、轉帳），儲值金額為5,000韓元·10,000韓元·30,000韓元·50,000韓元。",["自付款之日起7日內：可撤銷訂購，未使用的付費點數全部免手續費以取消信用卡付款的方式退款（即使已使用部分）。","自付款之日起超過7日後：從剩餘付費點數中扣除不超過10%的退款手續費後的金額，以信用卡付款部分取消的方式退款（適用費率顯示在退款申請畫面）。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元，扣除後金額少於扣除額者，不予退款。","免費點數不予退款，並於退款處理時失效。未滿10韓元的部分捨去。"],"例：儲值50,000P並使用44,000P時，第8天從剩餘6,000P中扣除1,000韓元，退還5,000韓元。儲值50,000P並使用20,000P時，第8天從剩餘30,000P中扣除10%手續費，退還27,000韓元。","在 Google Play、App Store 等應用程式市集購買的點數依該市集的退款規定辦理；市集退款後，將從錢包中扣除相應點數。","可透過卡拉OK的「我的錢包 → 申請退款」或下方聯絡方式申請退款。"]},{"h":"2-1. LIVE直播點數與禮物","b":[["LIVE直播扣除的點數屬於已使用服務的對價，不予退款。自動監測誤判的恢復除外。","已送出的LIVE禮物不可取消或退款，但依相關法令可取消的情形除外。","收到禮物累積的點數和排名獎金屬於免費點數，不可退款或兌換現金。"]]},{"h":"2-2. 使用即提供的服務","b":[["裝飾道具、開設房間（含延長）、生成 AI 照片和影片、LIVE直播扣除屬於使用即提供的服務，不可撤回或退款。此事項於使用前的確認頁面上顯示。但提供失敗時，退還所用點數。","已開始播放的歌曲不予退款。歌曲載入失敗而未開始播放時，將自動退回。","上線活動的免費歌曲不予退款。"]]},{"h":"3. 退款方式與諮詢","b":["退款僅透過取消所付款信用卡的付款辦理，不以現金支付或銀行轉帳方式退款。視發卡機構情況，取消可能需要3~7個工作日生效。","自付款之日起7日內可撤銷訂購。","所有交易的責任、退款及申訴等均由株式會社Booman（Booman Inc.）負責處理。申訴負責人：監事 黃義滿 · 010-4221-7066","諮詢：客服 +82-10-4221-7066 或電郵 admin@moneypuzzle.co.kr"]}]},"es":{"title":"Política de reembolso","eff":"Fecha de entrada en vigor: 1 de enero de 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"1. Canciones y paquetes de canciones","b":["El karaoke se usa por canciones. Cada canción usa puntos, y el precio es el que muestra la pantalla de compra.","La Empresa vende «paquetes de canciones» que agrupan varias canciones. Hay paquetes de varios tamaños, solo se compran con puntos de pago y su contenido y precio son los que se muestran en la pantalla de compra. Las canciones compradas se registran como «canciones restantes» en tu cuenta; pueden usarse durante 1 año desde la compra del paquete y las que no se usen en ese plazo caducan. Los puntos gratuitos no sirven para comprar paquetes de canciones; se pueden usar para reproducir canciones una a una.","Se usa una canción cuando empieza la reproducción. Una reproducción es un uso, y repetir la misma canción usa una canción cada vez.","El orden de uso es: canciones gratis del evento de lanzamiento, canciones restantes y puntos (primero los puntos de pago). Si el saldo no alcanza, la reproducción no empieza.","La misma regla se aplica a Solo nosotros Karaoke, LIVE, Reto, Relevo y la grabación: solo usa una canción quien canta; ver y escuchar es gratis. El descuento de puntos por espectador de las emisiones LIVE y los regalos son aparte.","Si una canción no se carga y la reproducción no empieza, se devuelve automáticamente.",["Reembolso de canciones restantes: las canciones restantes no usadas se reembolsan anulando (total o parcialmente) el pago con tarjeta, por su valor pagado —la parte en puntos de pago del paquete dividida entre su número de canciones— por cada canción no usada (1P = ₩1). Según la entidad emisora, puede tardar de 3 a 7 días hábiles.","En los 7 días siguientes a la compra del paquete: se reembolsa sin comisión.","Pasados 7 días desde la compra del paquete: se descuenta una comisión de reembolso de hasta el 10% (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago y las canciones restantes con más de 7 días suman 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso. No se reembolsan importes inferiores a ₩10.","La parte de un paquete de canciones comprada con puntos recargados en una tienda de apps sigue la política de esa tienda.","Las canciones cuya reproducción ya empezó no se reembolsan.","Los puntos usados en canciones y paquetes de canciones no se devuelven al monedero, salvo si la reproducción no empezó.","Las canciones restantes con una solicitud de reembolso en curso no pueden usarse hasta que se procese."],"Puedes solicitar el reembolso con «Mi monedero > Solicitar reembolso» en el karaoke o en el contacto de abajo."]},{"h":"2. Puntos de karaoke","b":["Los puntos (1P = ₩1) se registran como puntos de pago (recargados con pago) y puntos gratuitos (entregados por la Empresa sin coste). Los puntos comprados pueden usarse durante 1 año desde el pago; los que no se usen en ese plazo caducan. Los puntos gratuitos pueden usarse durante 1 año desde su entrega.","Los puntos solo se recargan con tarjeta de crédito/débito en un único pago (sin cuotas, pagos rápidos ni transferencia), por importes de ₩5.000, ₩10.000, ₩30.000 y ₩50.000.",["En los 7 días siguientes al pago: puedes desistir y todos los puntos de pago no usados se reembolsan anulando el pago con tarjeta, sin comisión (aunque hayas usado parte).","Pasados 7 días desde el pago: los puntos de pago restantes, menos una comisión de reembolso de hasta el 10%, se reembolsan con una anulación parcial del pago con tarjeta (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda es menor que el descuento, no hay reembolso.","Los puntos gratuitos no se reembolsan y caducan al procesar un reembolso. Se descartan los importes inferiores a ₩10."],"Ejemplo: si recargas 50.000P y usas 44.000P, el día 8 se descuentan ₩1.000 de los 6.000P restantes y se reembolsan ₩5.000. Si recargas 50.000P y usas 20.000P, el día 8 se descuenta una comisión del 10% de los 30.000P restantes y se reembolsan ₩27.000.","Los puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda; si la tienda los reembolsa, se descuentan de tu monedero.","Puedes solicitar el reembolso con «Mi monedero > Solicitar reembolso» en el karaoke o en el contacto de function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

var D={"ko":{"title":"개인정보 처리방침","eff":"시행일: 2027년 1월 1일","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["주식회사 부만(이하 '회사')은 「개인정보 보호법」 등 관련 법령을 준수하며, 이용자의 개인정보를 소중히 보호합니다. 본 방침은 노래방 서비스 '머니퍼즐 노래방(Money Puzzle Karaoke)'(https://karaoke.moneypuzzle.co.kr, 이하 '서비스')에 적용됩니다."]},{"h":"1. 수집하는 개인정보 항목 및 수집 방법","b":["노래방 영상은 로그인 없이 볼 수 있으며, 아래의 경우에만 개인정보를 수집합니다.",["구글 또는 애플 로그인 시(선택) — 이름, 이메일, 구글 또는 애플 계정 식별값","곡 이용권 구매 시 — 구매자 이름, 휴대폰 번호, 이메일, 주문 내용(묶음·금액·주문번호·주문 시각). 카드 번호 등 결제 정보는 토스페이먼츠가 처리하며 회사는 받지 않습니다.","환불 요청 시 — 요청 시각, 남은 곡 수, 계정","방 꾸미기 아이템 구매 시 — 구매한 아이템 내역(아이템·사용 포인트·구매 시각·계정), 보관함(보유 아이템·수량)","노래방 이용 기록 — 부른 곡(영상·제목·가수·반주 회사), 이용 시각, 재생 시간, 끝까지 재생 여부, 화면 언어, 접속 나라, 이용자 번호(로그인 계정 또는 기기 무작위 번호를 해시로 가린 값)","브라우저 저장소 — 화면 언어, 로그인 세션, 기기 무작위 번호 (이용자의 기기에만 저장)","주변 노래 친구 이용 시(선택) — 기기의 대략 위치(약 1km 단위로 줄인 값), 위치정보 이용 동의 기록(동의 시각), 위치정보 이용·제공 사실 확인자료(이용 시각·목적·계정 번호), 초대·차단·신고 기록","나이 인증(본인인증, StageSong을 처음 열 때) — 생년월일과 성별 (이름·휴대폰 번호 등 그 밖의 본인인증 정보는 저장하지 않습니다)","LIVE 방송 시 — 방송 영상·소리, 방송 기록(시작·종료 시각, 관람 시간, 차감 포인트, 받은 선물), 댓글, 신고·내보내기 기록","입장 동의·게시물 신고·차단 시 — 이용약관 동의 시각과 약관 판, 신고 대상·사유·내용, 차단한 계정"],"수집 방법: 이용자가 화면에서 직접 입력하거나, 구글·애플 로그인으로 전달받거나, 서비스 이용 중 자동으로 기록합니다."]},{"h":"2. 개인정보의 수집·이용 목적","b":[["로그인 정보: 곡 이용권 보관·구매 확인, 부정 이용 방지","구매자 정보·주문 내용: 결제 확인, 결제 안내, 환불 처리, 소비자 문의 대응","환불 요청 정보: 환불 금액 계산과 처리","노래방 이용 기록: 음악 저작권 사용료 정산(곡별 이용 횟수 보고)과 서비스 개선","구매한 아이템 내역: 아이템 보관·사용, 포인트 사용 내역 표시, 환불·소비자 문의 대응","위치 정보: 주변 노래 친구 둘러보기(거리 구간 표시) — 모르는 사람을 방에 초대하는 데 쓰지 않습니다","생년월일·성별: 만 15세 이상 이용가 서비스의 나이 확인(앱 입장 때 한 번), 주변 노래 친구의 나이대·성별 표시와 청소년(만 15세 이상 만 19세 미만)·성인 구분, 청소년의 한 달 충전 한도 적용","방송 영상·소리: 신고 처리와 분쟁 대응"]]},{"h":"3. 개인정보의 보유 및 이용 기간","b":["구글 또는 애플 로그인 정보(이름·이메일·계정 식별값): 곡 이용권 보관과 부정 이용 방지 목적으로 보관하며, 마지막 이용 후 1년이 지나면 삭제합니다. 다만 남은 곡 이용권의 보관 기간(구매일부터 1년) 동안은 보관합니다. 유료 포인트 잔액이 있으면 잔액이 없어질 때까지 보관합니다.","곡 이용권 주문·결제·환불 기록(구매자 이름·휴대폰·이메일 포함): 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 계약·청약철회, 대금결제 및 재화 등의 공급에 관한 기록은 5년, 소비자 불만·분쟁 처리 기록은 3년 보관합니다.","노래방 이용 기록(곡·이용 시각·재생 시간·접속 나라·가린 이용자 번호): 음악 저작권 사용료 정산 목적으로 5년간 보관하며, 이름·이메일은 기록하지 않습니다.","위치정보(약 1km 단위): 「내 위치 보이기」를 켠 동안만 보관하며, 끄거나 24시간이 지나거나 동의를 철회하면 지체 없이 파기합니다. 위치정보 이용·제공 사실 확인자료는 「위치정보의 보호 및 이용 등에 관한 법률」에 따라 6개월간 보관한 뒤 자동으로 파기합니다. 생년월일·성별은 계정을 삭제할 때까지 보관합니다(로그인하지 않고 인증한 기기의 결과는 1년 뒤 자동 파기).","LIVE 방송 영상·소리: 신고 처리와 분쟁 대응 목적으로 비공개 보관하며, 방송일로부터 30일이 지나면 자동으로 삭제합니다. 보관 영상은 관리자만 열람합니다.","이용자가 삭제를 요청한 경우 지체 없이 파기합니다."]},{"h":"3-1. 위치정보의 처리 (주변 노래 친구)","b":["회사는 위치기반서비스사업을 신고하였습니다(주식회사 부만, 신고 제1866호). 위치정보 이용 조건은 이용약관 제13조의2를 따릅니다.",["이용 목적: 주변 노래 친구 둘러보기(거리 구간 표시) — 모르는 사람을 방에 초대하는 데 쓰지 않습니다","수집 방법: 이용자가 「내 위치 보이기」를 켤 때 기기(브라우저·앱)의 대략 위치를 받습니다. 앱은 대략 위치 권한만 요청합니다.","공개 범위: 위치를 켠 같은 구분(청소년(만 15세 이상 만 19세 미만) 또는 성인)의 다른 이용자에게 거리 구간(1km·3km·10km 이내)과 나이대·성별(본인인증 결과, 예: 「20대 · 남」)만 보이며, 정확한 나이·생일·좌표·주소는 보이지 않습니다. 본인인증한 여성은 「여성에게만 내 위치 보이기」로 남성 이용자에게 보이지 않게 할 수 있습니다. 제3자에게 제공하지 않습니다.","동의 철회: 「위치정보 동의 철회」 또는 고객센터로 언제든 철회할 수 있으며, 철회하면 위치를 바로 삭제합니다.","이용자는 위치정보 이용·제공 사실 확인자료의 열람·고지와 오류 정정을 요구할 수 있습니다.","위치정보관리책임자: 황의만 (010-4221-7066 · admin@moneypuzzle.co.kr)"]]},{"h":"3-2. 자동 감시","b":["항목: LIVE 방송의 저해상도 화면·음성 조각, 게시 영상의 화면 표본, 판별 결과값(점수), 제재 기록(계정·기기 식별값, 시각, 사유).","목적: 음란물·미성년자 보호, 욕설 차단, 위반 제재와 이의 처리.","처리 방법: 도란도란·우리끼리 노래의 화면은 내 기기 안에서만 판별하며 영상과 소리를 서버로 보내지 않습니다. LIVE 화면과 게시 영상 표본은 Anthropic, LIVE 음성은 Cloudflare Workers AI에 판별을 위탁합니다.","보유 기간: 화면과 음성은 판별 즉시 폐기합니다. 판별 결과값은 90일, 제재 기록은 이의 처리와 재입장 차단에 필요한 기간 동안 보관합니다."]},{"h":"3-2. AI 사진의 얼굴 처리 (상황 사진·단체 AI 사진)","b":["AI 상황 사진은 이용자가 녹화한 본인 영상의 한 장면으로만 만들며, 다른 사람의 얼굴은 AI가 만든 가상 인물로 바꿉니다.","단체 AI 사진은 우리끼리 노래 방·도란도란 방에서 「참여」를 누른 사람의 얼굴만 사용합니다. 「참여」를 누르는 것이 얼굴 사진 이용에 대한 동의이며, 누르지 않은 사람은 사진에 나오지 않습니다.","참여할 때 촬영한 얼굴 사진은 단체 사진 생성을 위해서만 임시로 저장하며, 생성이 끝나면 바로 삭제합니다. 생성하지 않으면 참여 마감 30분 뒤 자동으로 삭제합니다. 시작한 사람이 취소하거나 내가 참여를 취소하면 그때 삭제합니다.","생성에는 Google(Gemini API)을 이용하며, 얼굴 사진은 생성 요청에만 전달됩니다. 완성된 사진에는 「AI 생성」이 표시되고, 참여한 사람의 「AI 사진 모음」에 저장되며, 각자 자기 모음에서 지울 수 있습니다(마지막 참여자가 지우면 사진도 삭제)."]},{"h":"4. 개인정보의 제3자 제공 및 처리 위탁","b":["회사는 이용자의 개인정보를 판매하지 않으며, 서비스 제공에 꼭 필요한 아래 업체에만 처리를 맡기거나 정보를 전달합니다.",["토스페이먼츠: 곡 이용권 결제 처리(결제창·카드 승인·취소)","Google·Apple: 로그인(계정 확인)","외부 영상 재생 서비스: 노래방 영상 재생 — 재생기가 이용자 기기에서 해당 서비스로 직접 연결되며, 그 서비스의 개인정보처리방침이 적용됩니다","Cloudflare: 서비스 서버(허브) 운영, LIVE 방송 중계와 방송 영상 보관","휴대폰 본인확인기관(본인인증 업체): 나이 인증 — 인증 결과 중 생년월일과 성별만 받습니다(생년월일은 만 나이 계산에만 씁니다)","Google(Gemini API): AI 상황 사진·단체 AI 사진 생성 — 생성 요청에 얼굴 사진을 전달하며, 회사는 생성 후 얼굴 사진을 바로 삭제합니다"],"위 업체 중 일부는 해외 서버를 사용하므로 서비스 제공에 꼭 필요한 범위에서 정보가 국외로 전송될 수 있습니다.","그 밖에 법령에 근거가 있거나 수사기관의 적법한 요청이 있는 경우를 제외하고는 제3자에게 제공하지 않습니다."]},{"h":"5. 이용자의 권리와 행사 방법","b":["이용자는 언제든지 자신의 개인정보에 대한 열람·정정·삭제를 요청하고 동의를 철회할 수 있습니다.","요청은 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 할 수 있으며, 회사는 지체 없이 처리합니다.","계정 삭제는 앱의 「내 스테이지 → 계정 삭제」 또는 https://karaoke.moneypuzzle.co.kr/account-delete.html 에서 할 수 있습니다. 삭제하면 지체 없이 파기하며, 법령에 따라 보관해야 하는 결제·환불 기록(5년)과 위치정보 이용·제공 사실 확인자료(6개월), 이의 처리와 재입장 차단에 필요한 제재 기록은 정해진 기간 동안 보관합니다."]},{"h":"6. 개인정보의 안전성 확보 조치","b":["회사는 구매자 이름·휴대폰·이메일을 AES-GCM 방식으로 암호화하여 저장하고, 노래방 이용 기록의 이용자 번호는 해시로 가려 저장하며, 관리자 화면은 비밀번호(5번 틀리면 잠금)와 접근 기록으로 관리합니다."]},{"h":"7. 개인정보 보호책임자","b":["개인정보 처리에 관한 문의·불만·피해 구제는 아래 보호책임자에게 연락하실 수 있습니다.",["개인정보 보호책임자: 황의만","고객센터: 010-4221-7066","이메일: admin@moneypuzzle.co.kr"]]},{"h":"8. 아동의 개인정보","b":["서비스는 만 15세 미만 아동을 대상으로 하지 않으며, 만 15세 미만의 개인정보를 의도적으로 수집하지 않습니다. StageSong은 만 15세 이상 이용가이며 앱을 처음 열 때 본인인증으로 나이를 확인합니다. 청소년(만 15세 이상 만 19세 미만)의 경우에도 생년월일·성별 외의 본인인증 정보는 저장하지 않으며, 위치정보는 이용자가 「내 위치 보이기」를 켤 때만 다른 청소년에게 거리 구간으로만 보입니다. 청소년의 결제는 법정대리인이 관련 법령에 따라 취소할 수 있습니다."]},{"h":"9. 방침의 변경","b":["본 방침이 변경되는 경우 시행일과 변경 내용을 앱 또는 본 페이지를 통해 공지합니다."]}]},"en":{"title":"Privacy Policy","eff":"Effective date: January 1, 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["Booman Inc. (\"the Company\") complies with the Personal Information Protection Act and related laws and protects your personal information. This policy applies to the karaoke service \"Money Puzzle Karaoke\" (https://karaoke.moneypuzzle.co.kr, \"the Service\")."]},{"h":"1. Information we collect and how","b":["You can watch the karaoke videos without signing in. We collect personal information only in the following cases.",["When you sign in with Google or Apple (optional) — name, email, Google or Apple account identifier","When you buy a song pass — buyer's name, mobile number, email and order details (pack, amount, order number, order time). Card numbers and other payment details are processed by Toss Payments; the Company does not receive them.","When you request a refund — request time, number of unused songs, account","When you buy room decor items — purchased item history (item, points used, time of purchase, account) and My items (items and quantities owned)","Karaoke usage record — songs played (video, title, artist, accompaniment company), time of use, playback time, whether played to the end, screen language, country of access, user number (your account or a random device number, masked by hashing)","Browser storage — screen language, sign-in session, random device number (stored only on your device)","When using Singers nearby (optional) — your device's approximate location (rounded to about 1 km), the record of your consent to use location information (time), records of use and provision of location information (time, purpose, account number), and invitation, block and report records","For age verification (identity verification, when StageSong is first opened) — date of birth and gender only (name, phone number and other verification data are not stored)","When broadcasting on LIVE — broadcast video and audio, broadcast records (start and end time, viewing time, points deducted, gifts received), comments, and report and removal records","For entry agreement, reports and blocks — time of agreement and version of the Terms, reported item, reason and details, blocked accounts"],"How we collect: you enter it on screen, it is passed to us through Google or Apple sign-in, or it is recorded automatically while you use the Service."]},{"h":"2. Purpose of collection and use","b":[["Sign-in information: holding song passes, confirming purchases, preventing misuse","Buyer information and order details: confirming payments, payment notices, refunds and customer inquiries","Refund request information: calculating and processing refunds","Karaoke usage record: settling music copyright royalties (reporting plays per song) and improving the Service","Purchased item history: keeping and using your items, showing point usage, handling refunds and inquiries","Location: browsing Singers nearby (distance range) — never used to invite strangers into rooms","Date of birth and gender: confirming that users are 15 or older (once, on entry), showing age group and gender in Singers nearby and separating minors (15 to under 19) from adults, and applying the monthly top-up limit for minors","Broadcast video and audio: handling reports and disputes"]]},{"h":"3. Retention and use period","b":["Google or Apple sign-in information (name, email, account identifier): kept to hold your song passes and prevent misuse, and deleted 1 year after your last use, but kept for as long as your remaining song passes are stored (1 year from purchase). If you have a paid point balance, it is also kept until the balance is gone.","Song pass order, payment and refund records (including the buyer's name, mobile number and email): under the Act on Consumer Protection in Electronic Commerce, records on contracts and withdrawals, payments and supply are kept for 5 years, and records on consumer complaints and disputes for 3 years.","Karaoke usage records (song, time of use, playing time, country of access, masked user number): kept for 5 years to settle music copyright royalties. Names and email addresses are not recorded.","Location (about 1 km): kept only while “Show my location” is on, and destroyed without delay when you turn it off, after 24 hours, or when you withdraw consent. Records of use and provision of location information are kept for 6 months under the Act on the Protection, Use, etc. of Location Information and then destroyed automatically. Date of birth and gender are kept until the account is deleted (results for a device verified without signing in are destroyed automatically after 1 year).","LIVE broadcast video and audio: kept privately to handle reports and disputes, and deleted automatically 30 days after the broadcast. Only administrators can view them.","If you request deletion, we destroy the data without delay."]},{"h":"3-1. Location information (Singers nearby)","b":["The Company has reported its location-based service business (Booman Inc., report No. 1866). Conditions of use are set out in Article 13-2 of the Terms.",["Purpose: browsing Singers nearby (distance range) — never used to invite strangers into rooms","How it is collected: when you turn on “Show my location”, we receive your device's (browser or app) approximate location. The app requests approximate location permission only.","Who sees it: other users in the same group (minors , or adults) with location on see only a distance range (within 1, 3 or 10 km) and your age group and gender (from identity verification, e.g. “20s · Male”), never your exact age, birthday, coordinates or address. Verified women can use “Show my location to women only” to stay hidden from male users. It is not provided to third parties.","Withdrawing consent: any time with “Withdraw location consent” or via customer support; your location is deleted at once.","You may ask to view or be notified of the records of use and provision of your location information and to correct errors.","Location information officer: Hwang Euiman (010-4221-7066 · admin@moneypuzzle.co.kr)"]]},{"h":"3-2. Automatic monitoring","b":["Items: low-resolution frames and audio clips from LIVE broadcasts, sample frames from posted videos, check results (scores), and sanction records (account and device identifiers, time, reason).","Purpose: protecting against obscene content and protecting minors, blocking abusive language, sanctions and appeals.","How: in Doran-doran and Just Us Karaoke the picture is checked only on your device, and no video or sound goes to the server. LIVE frames and post samples are checked by Anthropic, and LIVE audio by Cloudflare Workers AI, on our behalf.","Retention: pictures and sound are discarded right after checking. Check results are kept for 90 days; sanction records are kept as long as needed for appeals and blocking re-entry."]},{"h":"3-2. Faces in AI photos (scene photos and group AI photos)","b":["AI scene photos are made only from a frame of the user's own recording, and any other faces are replaced with fictional AI-generated people.","Group AI photos use only the faces of people who tap “Join” in a Just Us Karaoke or Doran-doran room. Tapping “Join” is your consent to the use of your face photo; people who do not tap it do not appear in the photo.","The face photo taken when you join is stored temporarily only to create the group photo and is deleted as soon as creation finishes. If no photo is created, it is deleted automatically 30 minutes after joining closes. It is also deleted when the starter cancels or when you leave.","Creation uses Google (Gemini API), and face photos are sent only with the creation request. The finished photo is labeled “AI-generated”, saved to each participant's “AI photos”, and each participant can remove it from their own collection (when the last participant removes it, the photo is deleted)."]},{"h":"4. Third-party provision and processing","b":["The Company does not sell your personal information and entrusts processing to, or passes information to, only the following providers that are essential to the Service.",["Toss Payments: processing song pass payments (payment window, card approval and cancellation)","Google and Apple: sign-in (account verification)","External video playback service: karaoke video playback — the player connects directly from your device to that service, and its privacy policy applies","Cloudflare: operating the Service's server (hub), LIVE broadcast relay and storage of broadcast videos","Mobile identity verification provider: age verification — we receive only the date of birth and gender from the result (the date of birth is used only to work out age)","Google (Gemini API): creating AI scene photos and group AI photos — face photos are sent with the creation request, and we delete them right after creation"],"Some of these providers use servers abroad, so information may be transferred outside Korea to the extent essential to the Service.","We do not otherwise provide information to third parties, except where required by law or upon a lawful request from an investigative authority."]},{"h":"5. Your rights","b":["You may at any time request access to, correction or deletion of your personal information, and withdraw consent.","Requests can be made to Support (+82-10-4221-7066) or by email (admin@moneypuzzle.co.kr), and we will act without delay.","You can delete your account in the app under “My Stage → Delete account” or at https://karaoke.moneypuzzle.co.kr/account-delete.html. We then destroy your data without delay, except payment and refund records (5 years) and records of location use (6 months) kept by law, and sanction records needed for appeals and to prevent re-entry."]},{"h":"6. Security measures","b":["The Company stores buyers' names, mobile numbers and emails encrypted with AES-GCM, stores user numbers in the karaoke usage record masked by hashing, and protects the admin screen with a password (locked after 5 failed attempts) and access logs."]},{"h":"7. Privacy Officer","b":["For questions, complaints or remedies regarding personal information, please contact:",["Privacy Officer: Hwang Euiman","Support: +82-10-4221-7066","Email: admin@moneypuzzle.co.kr"]]},{"h":"8. Children","b":["The Service is not directed to children under 15 and does not knowingly collect personal information of people under 15. StageSong is for ages 15 and over and checks age by identity verification when it is first opened. For minors (15 to under 19), too, we store no verification data other than date of birth and gender, and their location is shown only as a distance range to other minors, only while they turn on “Show my location”. A legal guardian may cancel a minor's payments under the applicable laws."]},{"h":"9. Changes to this policy","b":["If this policy changes, we will announce the effective date and the changes through the app or this page."]}]},"ja":{"title":"個人情報処理方針","eff":"施行日：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["株式会社 부만（Booman Inc.、以下「当社」）は「個人情報保護法」などの関連法令を遵守し、利用者の個人情報を大切に保護します。本方針はカラオケサービス「マネーパズル カラオケ（Money Puzzle Karaoke）」（https://karaoke.moneypuzzle.co.kr、以下「本サービス」）に適用されます。"]},{"h":"1. 収集する個人情報の項目および方法","b":["カラオケ動画はログインなしで視聴できます。次の場合に限り個人情報を収集します。",["Google または Apple でログインする場合（任意）— 氏名、メールアドレス、Google または Apple アカウント識別子","曲チケットを購入する場合 — 購入者の氏名、携帯電話番号、メールアドレス、注文内容（パック・金額・注文番号・注文時刻）。カード番号などの決済情報はトスペイメンツが処理し、当社は受け取りません。","返金を申請する場合 — 申請時刻、残り曲数、アカウント","ルームデコのアイテム購入時 — 購入したアイテムの履歴（アイテム・使用ポイント・購入日時・アカウント）、アイテム箱（所持アイテム・数量）","カラオケ利用記録 — 歌った曲（動画・曲名・歌手・伴奏会社）、利用時刻、再生時間、最後まで再生したか、画面の言語、接続国、利用者番号（ログインアカウントまたは端末のランダム番号をハッシュで伏せた値）","ブラウザの保存領域 — 画面の言語、ログインセッション、端末のランダム番号（利用者の端末にのみ保存）","近くの歌友の利用時(任意) — 端末のおおよその位置(約1km単位に丸めた値)、位置情報の利用への同意記録(同意日時)、位置情報の利用・提供事実の確認資料(利用日時・目的・アカウント番号)、招待・ブロック・通報の記録","年齢認証(本人認証、StageSongを最初に開くとき) — 生年月日と性別(氏名・携帯電話番号などそのほかの本人認証情報は保存しません)","LIVE放送時 — 放送の映像・音声、放送記録（開始・終了時刻、視聴時間、差し引きポイント、受け取ったギフト）、コメント、通報・退出の記録","入場時の同意・投稿の通報・ブロック時 — 利用規約への同意日時と規約の版、通報の対象・理由・内容、ブロックしたアカウント"],"収集方法：利用者が画面で直接入力するか、Google・Appleログインを通じて受け取るか、サービス利用中に自動で記録します。"]},{"h":"2. 収集・利用の目的","b":[["ログイン情報：曲チケットの保管・購入確認、不正利用の防止","購入者情報・注文内容：決済確認、決済のご案内、返金処理、お問い合わせ対応","返金申請情報：返金額の計算と処理","カラオケ利用記録：音楽著作権使用料の精算（曲ごとの利用回数の報告）とサービス改善","購入したアイテムの履歴：アイテムの保管・使用、ポイント利用履歴の表示、返金・お問い合わせへの対応","位置情報：近くの歌友を見ること(距離の区分の表示) — 知らない人を部屋に招待するためには使いません","生年月日・性別：満15歳以上向けサービスの年齢確認(入場時に一度)、近くの歌友での年代・性別の表示と青少年(満15歳以上満19歳未満)・成人の区分、青少年の月間チャージ上限の適用","放送の映像・音声：通報処理と紛争対応"]]},{"h":"3. 保有および利用期間","b":["Google または Apple のログイン情報（氏名・メールアドレス・アカウント識別子）：曲チケットの保管と不正利用防止のために保管し、最終利用から1年が過ぎると削除します。ただし、残っている曲チケットの保管期間（購入日から1年）の間は保管します。有料ポイントの残高がある場合は、残高がなくなるまで保管します。","曲チケットの注文・決済・返金の記録（購入者の氏名・携帯電話・メールアドレスを含む）：「電子商取引等における消費者保護に関する法律」により、契約・申込みの撤回、代金決済および財貨等の供給に関する記録は5年、消費者の不満・紛争処理に関する記録は3年保管します。","カラオケ利用記録（曲・利用日時・再生時間・接続国・一部を隠した利用者番号）：音楽著作権使用料の精算のため5年間保管します。氏名・メールアドレスは記録しません。","位置情報(約1km単位)：「自分の位置を表示」がオンの間のみ保管し、オフにしたとき、24時間が過ぎたとき、または同意を撤回したときに遅滞なく破棄します。位置情報の利用・提供事実の確認資料は韓国「位置情報の保護及び利用等に関する法律」により6か月間保管した後、自動で破棄します。生年月日・性別はアカウント削除まで保管します(ログインせずに認証した端末の結果は1年後に自動で破棄)。","LIVE放送の映像・音声：通報処理と紛争対応のため非公開で保管し、放送日から30日が過ぎると自動で削除します。保管動画は管理者のみが閲覧します。","利用者が削除を求めた場合は遅滞なく破棄します。"]},{"h":"3-1. 位置情報の取り扱い（近くの歌友）","b":["当社は位置基盤サービス事業を申告しています（株式会社 부만(Booman Inc.)、申告第1866号）。位置情報の利用条件は利用規約第13条の2に従います。",["利用目的：近くの歌友を見ること(距離の区分の表示) — 知らない人を部屋に招待するためには使いません","収集方法：利用者が「自分の位置を表示」をオンにしたときに、端末(ブラウザ・アプリ)のおおよその位置を受け取ります。アプリはおおよその位置の権限のみ要求します。","公開範囲：位置をオンにした同じ区分(青少年(満15歳以上満19歳未満)または成人)のほかの利用者に、距離の区分(1km・3km・10km以内)と年代・性別(本人認証の結果、例：「20代・男性」)のみ表示され、正確な年齢・誕生日・座標・住所は表示されません。本人認証した女性は「女性にだけ自分の位置を表示」で男性利用者に表示されないようにできます。第三者には提供しません。","同意の撤回：「位置情報の同意撤回」またはカスタマーセンターでいつでも撤回でき、撤回すると位置をすぐ削除します。","利用者は位置情報の利用・提供事実の確認資料の閲覧・告知と誤りの訂正を求めることができます。","位置情報管理責任者：Hwang Euiman（010-4221-7066・admin@moneypuzzle.co.kr）"]]},{"h":"3-2. 自動監視","b":["項目：LIVE配信の低解像度画面・音声の断片、投稿動画の画面の標本、判定結果(点数)、制裁記録(アカウント・端末の識別値、時刻、理由)。","目的：わいせつ物からの保護と未成年者保護、暴言の遮断、違反への制裁と異議対応。","処理方法：ドランドラン・仲間だけカラオケの画面はご自身の端末の中でのみ判定し、映像と音声はサーバーへ送りません。LIVEの画面と投稿動画の標本はAnthropic、LIVEの音声はCloudflare Workers AIに判定を委託します。","保有期間：画面と音声は判定後すぐに破棄します。判定結果は90日、制裁記録は異議対応と再入室の遮断に必要な期間保管します。"]},{"h":"3-2. AI写真の顔の取り扱い（シーン写真・AI集合写真）","b":["AIシーン写真は、利用者が録画した本人の映像の一場面からのみ作成し、他の人の顔はAIが作った架空の人物に置き換えます。","AI集合写真は、仲間だけカラオケ部屋・ドランドランで「参加」を押した人の顔だけを使います。「参加」を押すことが顔写真の利用への同意であり、押していない人は写真に写りません。","参加時に撮影した顔写真は集合写真の作成のためだけに一時保存し、作成が終わるとすぐ削除します。作成しない場合は参加締切の30分後に自動で削除します。始めた人が取り消した場合や自分が参加を取り消した場合も、その時点で削除します。","作成にはGoogle（Gemini API）を利用し、顔写真は作成依頼にのみ送られます。完成した写真には「AI生成」と表示され、参加した人の「AI写真」に保存され、各自が自分の保存先から削除できます（最後の参加者が削除すると写真も削除）。"]},{"h":"4. 第三者提供および処理委託","b":["当社は利用者の個人情報を販売せず、サービス提供に不可欠な次の事業者にのみ処理を委託し、または情報を提供します。",["トスペイメンツ：曲チケットの決済処理（決済画面・カード承認・取消）","Google・Apple：ログイン（アカウント確認）","外部の動画再生サービス：カラオケ動画の再生 — プレーヤーは利用者の端末から当該サービスに直接接続し、そのサービスのプライバシーポリシーが適用されます","Cloudflare：サービスのサーバー（ハブ）の運用、LIVE放送の中継と放送動画の保管","携帯電話本人確認機関(本人認証事業者)：年齢認証 — 認証結果のうち生年月日と性別のみ受け取ります(生年月日は満年齢の計算にのみ使います)","Google（Gemini API）：AIシーン写真・AI集合写真の作成 — 作成依頼に顔写真を送り、当社は作成後すぐに顔写真を削除します"],"上記事業者の一部は海外のサーバーを使用するため、サービス提供に不可欠な範囲で情報が国外に転送されることがあります。","そのほか、法令に根拠がある場合や捜査機関の適法な要請がある場合を除き、第三者には提供しません。"]},{"h":"5. 利用者の権利","b":["利用者はいつでも自身の個人情報の閲覧・訂正・削除を求め、同意を撤回できます。","ご請求はカスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）で行え、当社は遅滞なく対応します。","アカウント削除は、アプリの「マイステージ → アカウント削除」または https://karaoke.moneypuzzle.co.kr/account-delete.html から行えます。削除すると遅滞なく破棄しますが、法令により保管が必要な決済・返金の記録（5年）と位置情報の利用・提供事実の確認資料（6か月）、異議処理と再入場防止に必要な制裁記録は定められた期間保管します。"]},{"h":"6. 安全性確保の措置","b":["当社は購入者の氏名・携帯電話・メールアドレスをAES-GCM方式で暗号化して保存し、カラオケ利用記録の利用者番号はハッシュで伏せて保存し、管理画面はパスワード（5回間違えるとロック）とアクセス記録で管理します。"]},{"h":"7. 個人情報保護責任者","b":["個人情報の取り扱いに関する問い合わせ・苦情・救済は、下記の保護責任者にご連絡ください。",["個人情報保護責任者：黄義晩（Hwang Euiman）","カスタマーセンター：+82-10-4221-7066","メール：admin@moneypuzzle.co.kr"]]},{"h":"8. 児童の個人情報","b":["本サービスは満15歳未満の児童を対象とせず、満15歳未満の個人情報を意図的に収集しません。StageSongは満15歳以上の方が対象で、最初に開くときに本人認証で年齢を確認します。青少年(満15歳以上満19歳未満)の場合も生年月日・性別以外の本人認証情報は保存せず、位置情報は利用者が「自分の位置を表示」をオンにしたときだけ、ほかの青少年に距離の区分としてのみ表示されます。青少年の決済は法定代理人が関係法令に基づき取り消すことができます。"]},{"h":"9. 方針の変更","b":["本方針が変更される場合、施行日および変更内容をアプリまたは本ページで告知します。"]}]},"zhs":{"title":"隐私政策","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["Booman Inc.（株式会社 부만，以下称“本公司”）遵守《个人信息保护法》等相关法律法规，重视并保护用户的个人信息。本政策适用于卡拉OK服务“Money Puzzle Karaoke（머니퍼즐 노래방）”（https://karaoke.moneypuzzle.co.kr，以下称“本服务”）。"]},{"h":"1. 收集的个人信息项目及方式","b":["无需登录即可观看卡拉OK视频，仅在以下情况下收集个人信息。",["使用Google或Apple登录时（可选）— 姓名、电子邮箱、Google或Apple账号标识","购买点歌券时 — 购买人姓名、手机号码、电子邮箱、订单内容（套餐、金额、订单号、下单时间）。卡号等支付信息由Toss Payments处理，本公司不接收。","申请退款时 — 申请时间、剩余歌曲数、账号","购买房间装扮物品时 — 已购物品记录（物品、使用积分、购买时间、账户）及我的物品（拥有的物品与数量）","卡拉OK使用记录 — 所唱歌曲（视频、歌名、歌手、伴奏公司）、使用时间、播放时长、是否播放到最后、界面语言、访问国家、用户编号（登录账号或设备随机编号经哈希处理后的值）","浏览器存储 — 界面语言、登录会话、设备随机编号（仅保存在用户设备上）","使用附近歌友时(可选) — 设备的大致位置(约按1公里取整的值)、位置信息使用同意记录(同意时间)、位置信息使用·提供事实确认资料(使用时间·目的·账号编号)、邀请·屏蔽·举报记录","年龄认证(实名认证，首次打开 StageSong 时) — 出生日期和性别(不保存姓名、手机号码等其他认证信息)","LIVE直播时 — 直播影像和声音、直播记录（开始和结束时间、观看时长、扣除积分、收到的礼物）、评论、举报和移出记录","进入时同意、举报及拉黑时 — 同意使用条款的时间和条款版本，举报对象、理由和内容，被拉黑的账号"],"收集方式：由用户在页面上直接填写、通过Google·Apple登录传送，或在使用服务过程中自动记录。"]},{"h":"2. 收集与使用目的","b":[["登录信息：保存点歌券、确认购买、防止不当使用","购买人信息·订单内容：确认付款、付款通知、退款处理、应对咨询","退款申请信息：计算及处理退款金额","卡拉OK使用记录：结算音乐著作权使用费（按歌曲报告使用次数）及改进服务","已购物品记录：保管与使用物品、显示积分使用记录、处理退款与咨询","位置信息：浏览附近歌友(显示距离区间) — 不用于邀请陌生人进入房间","出生日期·性别：确认是否年满15周岁(进入时一次)，在附近歌友中显示年龄段和性别并区分青少年(年满15周岁未满19周岁)与成年人，以及适用青少年每月充值上限","直播影像和声音：处理举报和应对纠纷"]]},{"h":"3. 保存及使用期限","b":["Google或Apple登录信息（姓名、电子邮箱、账号标识）：为保存点歌券及防止不当使用而保存，最后一次使用1年后删除；但在剩余点歌券的保存期（自购买日起1年）内予以保存。如有付费积分余额，将保存至余额用尽为止。","点歌券订单、付款及退款记录（含购买人姓名、手机、电子邮箱）：根据《电子商务等消费者保护法》，有关合同及撤回、付款及供应的记录保存5年，有关消费者投诉及纠纷处理的记录保存3年。","练歌房使用记录（歌曲·使用时间·播放时长·访问国家·部分隐藏的用户编号）：为结算音乐著作权使用费保存5年，不记录姓名和电子邮箱。","位置信息(约1公里)：仅在「显示我的位置」开启期间保存，关闭、满24小时或撤回同意后立即销毁。位置信息使用·提供事实确认资料依韩国《位置信息保护及利用法》保存6个月后自动销毁。出生日期·性别保存至账号删除(未登录而完成认证的设备结果在1年后自动销毁)。","LIVE直播影像和声音：为处理举报和应对纠纷不公开保存，自直播日起30天后自动删除，仅管理员可查看。","用户请求删除时，立即予以销毁。"]},{"h":"3-1. 位置信息的处理（附近歌友）","b":["本公司已申报位置服务业务（株式会社 부만(Booman Inc.)，申报第1866号）。位置信息使用条件依使用条款第13条之2。",["使用目的：浏览附近歌友(显示距离区间) — 不用于邀请陌生人进入房间","收集方式：用户开启「显示我的位置」时接收设备(浏览器·应用)的大致位置。应用仅请求大致位置权限。","公开范围：仅向开启位置的同一组别(青少年(年满15周岁未满19周岁)或成年人)的其他用户显示距离区间(1公里·3公里·10公里以内)和年龄段·性别(实名认证结果，例如「20多岁 · 男」)，不显示确切年龄、生日、坐标和地址。完成实名认证的女性可通过「仅向女性显示我的位置」不向男性用户显示。不向第三方提供。","撤回同意：可随时通过「撤回位置信息同意」或客服撤回，撤回后立即删除位置。","用户可要求查阅、告知位置信息使用·提供事实确认资料及更正错误。","位置信息管理负责人：Hwang Euiman（010-4221-7066 · admin@moneypuzzle.co.kr）"]]},{"h":"3-2. 自动监测","b":["项目：LIVE 直播的低分辨率画面和音频片段、发布视频的画面样本、判定结果（分数）、处罚记录（账号和设备标识、时间、原因）。","目的：防范淫秽内容、保护未成年人、拦截辱骂内容、处罚违规及处理申诉。","处理方式：Doran-doran 和小圈子K歌的画面只在你的设备内判定，视频和声音不会发送到服务器。LIVE 画面和发布视频样本委托 Anthropic 判定，LIVE 音频委托 Cloudflare Workers AI 判定。","保存期限：画面和声音在判定后立即销毁。判定结果保存90天，处罚记录在申诉处理和阻止再次进入所需的期间内保存。"]},{"h":"3-2. AI 照片中的面部处理（情景照片·AI 合影）","b":["AI 情景照片仅使用用户本人录像中的一个画面生成，其他人的面部会替换为 AI 生成的虚拟人物。","AI 合影只使用在小圈子K歌房或 Doran-doran 房间中点了「参加」的人的面部。点「参加」即表示同意使用你的面部照片，未点的人不会出现在照片中。","参加时拍摄的面部照片仅为生成合影而临时保存，生成结束后立即删除。如未生成，将在报名截止30分钟后自动删除。发起人取消或你取消参加时也会立即删除。","生成使用 Google（Gemini API），面部照片仅随生成请求发送。完成的照片会标注「AI生成」，保存到参加者的「AI 照片」，每个人都可以从自己的收藏中删除（最后一位参加者删除后照片也会删除）。"]},{"h":"4. 向第三方提供及处理委托","b":["本公司不出售用户的个人信息，仅将处理委托给或将信息提供给提供服务所必需的以下企业。",["Toss Payments：点歌券付款处理（支付页面、刷卡授权及取消）","Google·Apple：登录（账号验证）","外部视频播放服务：播放卡拉OK视频 — 播放器从用户设备直接连接该服务，适用该服务的隐私政策","Cloudflare：运营本服务的服务器（枢纽）、LIVE直播中继和直播视频保存","手机实名认证机构(认证服务商)：年龄认证 — 仅接收认证结果中的出生日期和性别(出生日期仅用于计算周岁年龄)","Google（Gemini API）：生成 AI 情景照片和 AI 合影 — 随生成请求发送面部照片，本公司在生成后立即删除面部照片"],"上述部分企业使用境外服务器，因此在提供服务所必需的范围内，信息可能被传输至境外。","除法律有依据或侦查机关提出合法请求外，不向第三方提供。"]},{"h":"5. 用户的权利","b":["用户可随时请求查阅·更正·删除本人个人信息，并撤回同意。","可通过客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）提出，本公司将及时处理。","可在应用的「我的舞台 → 删除账号」或 https://karaoke.moneypuzzle.co.kr/account-delete.html 删除账号。删除后我们将立即销毁数据，但法律要求保存的支付·退款记录（5年）和位置信息使用·提供事实确认资料（6个月），以及申诉处理和防止再次进入所需的处罚记录，会在规定期限内保存。"]},{"h":"6. 安全保障措施","b":["本公司以AES-GCM方式加密保存购买人姓名、手机及电子邮箱，卡拉OK使用记录中的用户编号经哈希处理后保存，管理页面以密码（错误5次即锁定）及访问记录进行管理。"]},{"h":"7. 个人信息保护负责人","b":["有关个人信息处理的咨询·投诉·救济，请联系下列负责人：",["个人信息保护负责人：Hwang Euiman","客服：+82-10-4221-7066","邮箱：admin@moneypuzzle.co.kr"]]},{"h":"8. 儿童个人信息","b":["本服务不以未满15周岁的儿童为对象，不会有意收集未满15周岁者的个人信息。StageSong 仅限年满15周岁者使用，首次打开时通过实名认证确认年龄。对于青少年(年满15周岁未满19周岁)，同样只保存出生日期和性别，不保存其他认证信息；位置信息仅在用户开启「显示我的位置」时以距离区间的形式向其他青少年显示。青少年的支付可由法定代理人依相关法律撤销。"]},{"h":"9. 政策变更","b":["本政策如有变更，将通过应用或本页面公告施行日期及变更内容。"]}]},"zht":{"title":"隱私政策","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["Booman Inc.（株式會社 부만，以下稱「本公司」）遵守《個人資料保護法》等相關法令，重視並保護使用者的個人資料。本政策適用於卡拉OK服務「Money Puzzle Karaoke（머니퍼즐 노래방）」（https://karaoke.moneypuzzle.co.kr，以下稱「本服務」）。"]},{"h":"1. 蒐集的個人資料項目及方式","b":["無需登入即可觀看卡拉OK影片，僅在以下情況下蒐集個人資料。",["使用Google或Apple登入時（可選）— 姓名、電子郵件、Google或Apple帳號識別碼","購買點歌券時 — 購買人姓名、手機號碼、電子郵件、訂單內容（套餐、金額、訂單號、下單時間）。卡號等付款資訊由Toss Payments處理，本公司不接收。","申請退款時 — 申請時間、剩餘歌曲數、帳號","購買房間裝扮物品時 — 已購物品紀錄（物品、使用點數、購買時間、帳戶）及我的物品（擁有的物品與數量）","卡拉OK使用紀錄 — 所唱歌曲（影片、歌名、歌手、伴奏公司）、使用時間、播放時長、是否播放到最後、介面語言、連線國家、使用者編號（登入帳號或裝置隨機編號經雜湊處理後的值）","瀏覽器儲存 — 介面語言、登入工作階段、裝置隨機編號（僅儲存在使用者裝置上）","使用附近歌友時(選擇) — 裝置的大致位置(約按1公里取整的值)、位置資訊使用同意紀錄(同意時間)、位置資訊使用·提供事實確認資料(使用時間·目的·帳號編號)、邀請·封鎖·檢舉紀錄","年齡認證(實名認證，首次開啟 StageSong 時) — 出生日期和性別(不儲存姓名、手機號碼等其他認證資訊)","LIVE直播時 — 直播影像和聲音、直播紀錄（開始和結束時間、觀看時長、扣除點數、收到的禮物）、留言、檢舉和移出紀錄","進入時同意、檢舉及封鎖時 — 同意使用條款的時間和條款版本，檢舉對象、理由和內容，被封鎖的帳號"],"蒐集方式：由使用者在頁面上直接填寫、透過Google·Apple登入傳送，或在使用服務過程中自動記錄。"]},{"h":"2. 蒐集與使用目的","b":[["登入資訊：保存點歌券、確認購買、防止不當使用","購買人資訊·訂單內容：確認付款、付款通知、退款處理、回覆諮詢","退款申請資訊：計算及處理退款金額","卡拉OK使用紀錄：結算音樂著作權使用費（依歌曲報告使用次數）及改善服務","已購物品紀錄：保管與使用物品、顯示點數使用紀錄、處理退款與諮詢","位置資訊：瀏覽附近歌友(顯示距離區間) — 不用於邀請陌生人進入房間","出生日期·性別：確認是否年滿15歲(進入時一次)，在附近歌友中顯示年齡層和性別並區分青少年(年滿15歲未滿19歲)與成年人，以及適用青少年每月儲值上限","直播影像和聲音：處理檢舉和應對糾紛"]]},{"h":"3. 保存及使用期限","b":["Google或Apple登入資訊（姓名、電子郵件、帳號識別碼）：為保存點歌券及防止不當使用而保存，最後一次使用1年後刪除；但在剩餘點歌券的保存期（自購買日起1年）內予以保存。如有付費點數餘額，將保存至餘額用盡為止。","點歌券訂單、付款及退款紀錄（含購買人姓名、手機、電子郵件）：依《電子商務等消費者保護法》，有關契約及撤回、付款及供應的紀錄保存5年，有關消費者申訴及糾紛處理的紀錄保存3年。","練歌房使用紀錄（歌曲·使用時間·播放時長·連線國家·部分隱藏的使用者編號）：為結算音樂著作權使用費保存5年，不記錄姓名及電子郵件。","位置資訊(約1公里)：僅在「顯示我的位置」開啟期間保存，關閉、滿24小時或撤回同意後立即銷毀。位置資訊使用·提供事實確認資料依韓國《位置資訊保護及利用法》保存6個月後自動銷毀。出生日期·性別保存至帳號刪除(未登入而完成認證的裝置結果在1年後自動銷毀)。","LIVE直播影像和聲音：為處理檢舉和應對糾紛不公開保存，自直播日起30天後自動刪除，僅管理員可查看。","使用者請求刪除時，立即予以銷毀。"]},{"h":"3-1. 位置資訊的處理（附近歌友）","b":["本公司已申報位置服務業務（株式會社 부만(Booman Inc.)，申報第1866號）。位置資訊使用條件依使用條款第13條之2。",["使用目的：瀏覽附近歌友(顯示距離區間) — 不用於邀請陌生人進入房間","收集方式：使用者開啟「顯示我的位置」時接收裝置(瀏覽器·應用程式)的大致位置。應用程式僅請求大致位置權限。","公開範圍：僅向開啟位置的同一組別(青少年(年滿15歲未滿19歲)或成年人)的其他使用者顯示距離區間(1公里·3公里·10公里以內)和年齡層·性別(實名認證結果，例如「20多歲 · 男」)，不顯示確切年齡、生日、座標和地址。完成實名認證的女性可透過「僅向女性顯示我的位置」不向男性使用者顯示。不向第三方提供。","撤回同意：可隨時透過「撤回位置資訊同意」或客服撤回，撤回後立即刪除位置。","使用者可要求查閱、告知位置資訊使用·提供事實確認資料及更正錯誤。","位置資訊管理負責人：Hwang Euiman（010-4221-7066 · admin@moneypuzzle.co.kr）"]]},{"h":"3-2. 自動監測","b":["項目：LIVE 直播的低解析度畫面和音訊片段、發布影片的畫面樣本、判定結果（分數）、處分紀錄（帳號和裝置識別值、時間、原因）。","目的：防範猥褻內容、保護未成年人、攔截辱罵內容、處分違規及處理申訴。","處理方式：Doran-doran 和小圈子K歌的畫面只在你的裝置內判定，影像和聲音不會傳送到伺服器。LIVE 畫面和發布影片樣本委託 Anthropic 判定，LIVE 音訊委託 Cloudflare Workers AI 判定。","保存期限：畫面和聲音在判定後立即銷毀。判定結果保存90天，處分紀錄在申訴處理和阻止再次進入所需的期間內保存。"]},{"h":"3-2. AI 照片中的臉部處理（情境照片·AI 合影）","b":["AI 情境照片僅使用使用者本人錄影中的一個畫面生成，其他人的臉部會替換為 AI 生成的虛擬人物。","AI 合影只使用在小圈子K歌房或 Doran-doran 房間中點了「參加」的人的臉部。點「參加」即表示同意使用你的臉部照片，未點的人不會出現在照片中。","參加時拍攝的臉部照片僅為生成合影而暫時保存，生成結束後立即刪除。如未生成，將在報名截止30分鐘後自動刪除。發起人取消或你取消參加時也會立即刪除。","生成使用 Google（Gemini API），臉部照片僅隨生成請求傳送。完成的照片會標註「AI生成」，儲存到參加者的「AI 照片」，每個人都可以從自己的收藏中刪除（最後一位參加者刪除後照片也會刪除）。"]},{"h":"4. 向第三方提供及處理委託","b":["本公司不出售使用者的個人資料，僅將處理委託給或將資訊提供給提供服務所必需的以下業者。",["Toss Payments：點歌券付款處理（付款頁面、刷卡授權及取消）","Google·Apple：登入（帳號驗證）","外部影片播放服務：播放卡拉OK影片 — 播放器從使用者裝置直接連線該服務，適用該服務的隱私權政策","Cloudflare：營運本服務的伺服器（樞紐）、LIVE直播中繼和直播影片保存","手機實名認證機構(認證服務商)：年齡認證 — 僅接收認證結果中的出生日期和性別(出生日期僅用於計算實足年齡)","Google（Gemini API）：生成 AI 情境照片與 AI 合影 — 隨生成請求傳送臉部照片，本公司在生成後立即刪除臉部照片"],"上述部分業者使用境外伺服器，因此在提供服務所必需的範圍內，資訊可能被傳輸至境外。","除法律有依據或偵查機關提出合法請求外，不向第三方提供。"]},{"h":"5. 使用者的權利","b":["使用者可隨時請求查閱·更正·刪除本人個人資料，並撤回同意。","可透過客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）提出，本公司將及時處理。","可在應用程式的「我的舞台 → 刪除帳號」或 https://karaoke.moneypuzzle.co.kr/account-delete.html 刪除帳號。刪除後我們將立即銷毀資料，但法律要求保存的付款·退款記錄（5年）和位置資訊使用·提供事實確認資料（6個月），以及申訴處理和防止再次進入所需的處分記錄，會在規定期限內保存。"]},{"h":"6. 安全保障措施","b":["本公司以AES-GCM方式加密保存購買人姓名、手機及電子郵件，卡拉OK使用紀錄中的使用者編號經雜湊處理後保存，管理頁面以密碼（錯誤5次即鎖定）及存取紀錄進行管理。"]},{"h":"7. 個人資料保護負責人","b":["有關個人資料處理的諮詢·投訴·救濟，請聯絡下列負責人：",["個人資料保護負責人：Hwang Euiman","客服：+82-10-4221-7066","電郵：admin@moneypuzzle.co.kr"]]},{"h":"8. 兒童個人資料","b":["本服務不以未滿15歲的兒童為對象，不會有意蒐集未滿15歲者的個人資料。StageSong 僅限年滿15歲者使用，首次開啟時透過實名認證確認年齡。對於青少年(年滿15歲未滿19歲)，同樣只儲存出生日期和性別，不儲存其他認證資訊；位置資訊僅在使用者開啟「顯示我的位置」時以距離區間的形式向其他青少年顯示。青少年的付款得由法定代理人依相關法令撤銷。"]},{"h":"9. 政策變更","b":["本政策如有變更，將透過應用程式或本頁面公告施行日期及變更內容。"]}]},"es":{"title":"Política de Privacidad","eff":"Fecha de entrada en vigor: 1 de enero de 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"","b":["Booman Inc. («la Empresa») cumple la Ley de Protección de Información Personal y la normativa relacionada, y protege su información personal. Esta política se aplica al servicio de karaoke «Money Puzzle Karaoke» (https://karaoke.moneypuzzle.co.kr, «el Servicio»)."]},{"h":"1. Información que recopilamos y cómo","b":["Puede ver los vídeos de karaoke sin iniciar sesión. Solo recopilamos información personal en los casos siguientes.",["Al iniciar sesión con Google o Apple (opcional): nombre, correo e identificador de la cuenta de Google o Apple","Al comprar un bono: nombre, móvil y correo del comprador y datos del pedido (pack, importe, número y hora del pedido). Los números de tarjeta y demás datos de pago los procesa Toss Payments; la Empresa no los recibe.","Al solicitar un reembolso: hora de la solicitud, canciones sin usar y cuenta","Al comprar artículos de decoración de sala — historial de artículos comprados (artículo, puntos usados, hora de compra, cuenta) y Mis artículos (artículos y cantidades que tienes)","Registro de uso del karaoke: canciones reproducidas (vídeo, título, artista, empresa de acompañamiento), hora de uso, tiempo de reproducción, si se reprodujo hasta el final, idioma de la pantalla, país de acceso y número de usuario (cuenta o número aleatorio del dispositivo, enmascarado con hash)","Almacenamiento del navegador: idioma, sesión iniciada y número aleatorio del dispositivo (solo en su dispositivo)","Al usar Cantantes cerca (opcional): ubicación aproximada del dispositivo (redondeada a unos 1 km), registro de tu consentimiento para usar la ubicación (hora), registros de uso y cesión de la ubicación (hora, finalidad, número de cuenta) y registros de invitaciones, bloqueos y denuncias","Para la verificación de edad (verificación de identidad, al abrir StageSong por primera vez): solo la fecha de nacimiento y el sexo (no se guardan nombre, teléfono ni otros datos de verificación)","Al emitir en LIVE: vídeo y audio de la emisión, registros de emisión (inicio y fin, tiempo de visualización, puntos descontados, regalos recibidos), comentarios y registros de denuncias y expulsiones","Al aceptar al entrar, denunciar o bloquear: hora de aceptación y versión de los Términos, elemento denunciado, motivo y detalles, y cuentas bloqueadas"],"Cómo los recopilamos: usted los introduce en pantalla, nos llegan por el inicio de sesión de Google o Apple o se registran automáticamente al usar el Servicio."]},{"h":"2. Finalidad de la recopilación y el uso","b":[["Datos de inicio de sesión: conservar bonos, confirmar compras y prevenir abusos","Datos del comprador y del pedido: confirmar pagos, avisos de pago, reembolsos y consultas","Datos de la solicitud de reembolso: calcular y tramitar el reembolso","Registro de uso del karaoke: liquidar los derechos de autor musicales (informe de usos por canción) y mejorar el Servicio","Historial de artículos comprados: guardar y usar tus artículos, mostrar el uso de puntos y atender reembolsos y consultas","Ubicación: ver Cantantes cerca (rango de distancia), nunca para invitar a desconocidos a salas","Fecha de nacimiento y sexo: confirmar que tienes 15 años o más (una vez, al entrar), mostrar la franja de edad y el sexo en Cantantes cerca y separar a los menores (de 15 a menos de 19 años) de los adultos, y aplicar el límite mensual de recarga de los menores","Vídeo y audio de emisiones: atender denuncias y disputas"]]},{"h":"3. Plazo de conservación y uso","b":["Datos de inicio de sesión de Google o Apple (nombre, correo, identificador): se guardan para conservar sus bonos y prevenir abusos, y se eliminan 1 año después de su último uso, aunque se mantienen mientras se conserven sus bonos (1 año desde la compra). Si tiene saldo de puntos de pago, se conservan hasta que el saldo se agote.","Registros de pedidos, pagos y reembolsos de bonos (incluidos nombre, móvil y correo del comprador): según la Ley de Protección del Consumidor en el Comercio Electrónico, los registros de contratos y desistimientos, pagos y suministro se conservan 5 años, y los de quejas y disputas 3 años.","Registros de uso del karaoke (canción, hora de uso, tiempo de reproducción, país de acceso y número de usuario enmascarado): se conservan 5 años para liquidar los derechos de autor musicales. No se registran nombres ni correos electrónicos.","Ubicación (unos 1 km): se guarda solo mientras «Mostrar mi ubicación» esté activada y se destruye sin demora al desactivarla, a las 24 horas o al retirar el consentimiento. Los registros de uso y cesión de la ubicación se guardan 6 meses según la ley coreana de información de ubicación y luego se destruyen automáticamente. La fecha de nacimiento y el sexo se guardan hasta eliminar la cuenta (el resultado de un dispositivo verificado sin iniciar sesión se destruye automáticamente al cabo de 1 año).","Vídeo y audio de emisiones LIVE: se guardan de forma privada para atender denuncias y disputas y se eliminan automáticamente a los 30 días de la emisión. Solo los administradores pueden verlos.","Si usted solicita la eliminación, destruimos los datos sin demora."]},{"h":"3-1. Información de ubicación (Cantantes cerca)","b":["La Empresa ha registrado su actividad de servicio basado en ubicación (Booman Inc., registro n.º 1866). Las condiciones de uso están en el artículo 13-2 de los Términos.",["Finalidad: ver Cantantes cerca (rango de distancia), nunca para invitar a desconocidos a salas","Cómo se obtiene: al activar «Mostrar mi ubicación» recibimos la ubicación aproximada del dispositivo (navegador o app). La app solo pide el permiso de ubicación aproximada.","Quién la ve: otros usuarios del mismo grupo (menores (de 15 a menos de 19 años), o adultos) con la ubicación activada ven solo un rango de distancia (a menos de 1, 3 o 10 km) y tu franja de edad y sexo (según la verificación de identidad, p. ej. «20-29 años · Hombre»), nunca tu edad exacta, cumpleaños, coordenadas ni dirección. Las mujeres verificadas pueden usar «Mostrar mi ubicación solo a mujeres» para no aparecer a los usuarios hombres. No se cede a terceros.","Retirar el consentimiento: en cualquier momento con «Retirar consentimiento de ubicación» o por atención al cliente; tu ubicación se borra al instante.","Puedes pedir ver o que se te notifiquen los registros de uso y cesión de tu ubicación y corregir errores.","Responsable de información de ubicación: Hwang Euiman (010-4221-7066 · admin@moneypuzzle.co.kr)"]]},{"h":"3-2. Supervisión automática","b":["Datos: imágenes de baja resolución y fragmentos de audio de las emisiones LIVE, imágenes de muestra de vídeos publicados, resultados (puntuaciones) y registros de sanciones (identificadores de cuenta y dispositivo, hora, motivo).","Finalidad: proteger frente a contenido obsceno y proteger a menores, bloquear lenguaje ofensivo, sanciones y reclamaciones.","Cómo: en Doran-doran y Solo nosotros Karaoke la imagen se comprueba solo en tu dispositivo, y no se envían vídeo ni sonido al servidor. Las imágenes de LIVE y las muestras de publicaciones las comprueba Anthropic, y el audio de LIVE Cloudflare Workers AI, por encargo nuestro.","Conservación: las imágenes y el sonido se eliminan justo después de la comprobación. Los resultados se guardan 90 días; los registros de sanciones, el tiempo necesario para reclamaciones y para bloquear el reingreso."]},{"h":"3-2. Caras en las fotos IA (fotos de escena y fotos de grupo con IA)","b":["Las fotos de escena con IA se crean solo a partir de un fotograma de la grabación de la propia persona usuaria; las demás caras se sustituyen por personas ficticias generadas por IA.","Las fotos de grupo con IA usan solo las caras de quienes tocan «Unirme» en una sala Solo nosotros Karaoke o Doran-doran. Tocar «Unirme» es tu consentimiento para usar la foto de tu cara; quien no lo toca no aparece en la foto.","La foto de la cara que se hace al unirte se guarda temporalmente solo para crear la foto de grupo y se borra en cuanto termina la creación. Si no se crea, se borra automáticamente 30 minutos después del cierre de la inscripción. También se borra si quien la inició la cancela o si sales.","La creación usa Google (Gemini API) y las fotos de las caras solo se envían con la solicitud de creación. La foto terminada lleva la etiqueta «Generado por IA», se guarda en «Fotos IA» de cada participante y cada uno puede quitarla de su colección (cuando la quita el último participante, la foto se borra)."]},{"h":"4. Cesión a terceros y encargo del tratamiento","b":["La Empresa no vende su información personal y solo encarga el tratamiento o comunica datos a los siguientes proveedores imprescindibles para el Servicio.",["Toss Payments: tramitación de los pagos de bonos (ventana de pago, autorización y anulación con tarjeta)","Google y Apple: inicio de sesión (verificación de la cuenta)","Servicio externo de reproducción de vídeo: reproducción de los vídeos de karaoke; el reproductor conecta directamente tu dispositivo con ese servicio y se aplica su política de privacidad","Cloudflare: funcionamiento del servidor (hub) del Servicio, retransmisión de emisiones LIVE y almacenamiento de sus vídeos","Proveedor de verificación de identidad móvil: verificación de edad; solo recibimos la fecha de nacimiento y el sexo del resultado (la fecha de nacimiento solo se usa para calcular la edad)","Google (Gemini API): creación de fotos de escena con IA y fotos de grupo con IA — las fotos de las caras se envían con la solicitud y las borramos justo después de crearlas"],"Algunos de estos proveedores usan servidores en el extranjero, por lo que los datos pueden transferirse fuera de Corea en la medida imprescindible para el Servicio.","Por lo demás, no cedemos información a terceros, salvo cuando lo exija la ley o ante una solicitud legítima de una autoridad investigadora."]},{"h":"5. Sus derechos","b":["Puede en cualquier momento solicitar el acceso, la rectificación o la eliminación de sus datos personales y retirar su consentimiento.","Las solicitudes pueden hacerse a Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr), y actuaremos sin demora.","Puedes eliminar tu cuenta en la app, en «Mi escenario → Eliminar cuenta», o en https://karaoke.moneypuzzle.co.kr/account-delete.html. Destruimos tus datos sin demora, salvo los registros de pagos y reembolsos (5 años) y de uso de la ubicación (6 meses) que exige la ley, y los registros de sanciones necesarios para reclamaciones y para impedir el reingreso."]},{"h":"6. Medidas de seguridad","b":["La Empresa guarda cifrados con AES-GCM el nombre, el móvil y el correo de los compradores, guarda enmascarado con hash el número de usuario del registro de karaoke y protege la pantalla de administración con contraseña (bloqueo tras 5 intentos fallidos) y registros de acceso."]},{"h":"7. Responsable de privacidad","b":["Para consultas, reclamaciones o reparación relativas a los datos personales, puede contactar con:",["Responsable de privacidad: Hwang Euiman","Atención: +82-10-4221-7066","Correo: admin@moneypuzzle.co.kr"]]},{"h":"8. Menores","b":["El Servicio no está dirigido a menores de 15 años y no recopila conscientemente datos personales de menores de 15 años. StageSong es para mayores de 15 años y comprueba la edad mediante verificación de identidad al abrirse por primera vez. En el caso de los menores (de 15 a menos de 19 años), tampoco guardamos datos de verificación aparte de la fecha de nacimiento y el sexo, y su ubicación solo se muestra como rango de distancia a otros menores, y solo mientras activen «Mostrar mi ubicación». El representante legal puede anular los pagos de un menor según la ley aplicable."]},{"h":"9. Cambios en esta política","b":["Si esta política cambia, anunciaremos la fecha de entrada en vigor y los cambios a través de la app o de esta página."]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/(admin|emhwang3)@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>').replace(/https:\/\/karaoke\.moneypuzzle\.co\.kr\/account-delete\.html/g,'<a href="account-delete.html">$&</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

var D={"ko":{"title":"이용약관","eff":"시행일: 2027년 1월 1일","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"제1조 (목적)","b":["본 약관은 주식회사 부만(이하 '회사')이 제공하는 노래방 서비스 StageSong(스테이지송, 머니퍼즐 노래방, https://karaoke.moneypuzzle.co.kr, 이하 「서비스」)의 이용 조건을 정하는 것을 목적으로 합니다."]},{"h":"제1조의2 (입장할 때의 동의)","b":["StageSong에 처음 들어올 때 계정마다 한 번, ① 나이 본인인증 ② 이용약관·환불 규정·개인정보 수집·이용·자동 감시 안내 항목별 동의 ③ 위치기반서비스 이용 동의 순서로 진행합니다.","②의 필수 항목에 모두 동의하지 않으면 서비스를 이용할 수 없습니다. ③은 선택이며, 동의하지 않아도 서비스를 이용할 수 있고 「주변 노래 친구」만 이용할 수 없습니다. ③은 나중에 「주변 노래 친구」에서 다시 동의할 수 있습니다.","회사는 항목별 동의 시각과 각 문서의 판(시행일)을 계정별로 기록합니다. 유료 결제는 결제할 때 따로 동의를 받습니다."]},{"h":"제2조 (서비스의 내용)","b":["서비스는 다음을 제공합니다.",["노래방 영상 재생(곡마다 포인트 또는 유료 포인트로 구매하는 곡 묶음으로 이용)","노래방 포인트(선불)와 곡 묶음(유료 포인트로 구매)의 판매 (판매 당사자: 회사)","구글·애플 계정 로그인 및 포인트·잔여 곡 보관","노래방 LIVE 방송·선물과 순위 시상"],"포인트 대금은 회사가 계약한 전자지급결제대행사의 결제창 또는 앱 마켓 결제를 통해 회사에 지급됩니다. 회사는 카드 번호 등 결제 정보를 직접 받거나 저장하지 않습니다."]},{"h":"제3조 (곡 이용과 묶음)","b":["노래는 곡 단위로 이용합니다. 곡마다 포인트를 사용하며, 가격은 구매 화면에 표시된 대로입니다.","회사는 여러 곡을 묶은 「곡 묶음」을 판매합니다. 곡 묶음은 크기별로 있고 유료 포인트로만 구매할 수 있으며, 구성과 가격은 구매 화면에 표시된 대로입니다. 구매한 곡은 로그인한 계정에 「잔여 곡」으로 기록되며 유효기간이 없습니다. 무료 포인트로는 곡 묶음을 구매할 수 없으며, 곡을 1곡씩 재생할 때 사용할 수 있습니다.","곡은 재생이 시작될 때 1곡이 사용됩니다. 재생 1회가 1곡이며, 같은 곡을 반복해 불러도 재생마다 1곡이 사용됩니다.","사용 순서는 출시 이벤트 무료 곡, 잔여 곡, 포인트(유료 포인트 먼저) 순입니다. 잔액이 부족하면 재생이 시작되지 않습니다.","우리끼리 노래, LIVE, 챌린지, 릴레이, 녹화에도 같은 규칙을 적용합니다. 노래를 부르는 사람만 곡을 사용하며, 보기와 듣기는 무료입니다. LIVE 방송의 관람객별 포인트 차감과 선물은 별도입니다(제8조의2).","곡을 불러오지 못해 재생이 시작되지 않으면 사용한 곡은 자동으로 되돌립니다.",["잔여 곡 환불: 사용하지 않은 잔여 곡은 곡 묶음 구매에 사용한 유료 포인트 몫을 곡 수로 나눈 금액으로, 사용하지 않은 곡 수만큼 결제한 수단으로 환불합니다(1P = 1원).","곡 묶음 구매일로부터 7일 이내: 수수료 없이 환불합니다.","곡 묶음 구매일로부터 7일이 지난 뒤: 환불 금액에서 10% 이내의 환불 수수료를 공제합니다(적용 수수료율은 환불 요청 화면에 표시). 다만 7일이 지난 유료 포인트와 잔여 곡을 합쳐 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다. 10원 미만은 환불하지 않습니다.","앱 마켓에서 충전한 포인트로 산 곡 묶음의 몫은 해당 앱 마켓의 환불 규정을 따릅니다.","재생이 시작된 곡은 환불하지 않습니다.","곡과 곡 묶음에 사용한 포인트는 지갑으로 되돌리지 않습니다(재생이 시작되지 않은 경우는 제외).","환불 요청 중인 잔여 곡은 처리가 끝날 때까지 사용할 수 없습니다."],"자세한 내용은 환불 규정을 따릅니다."]},{"h":"제3조의2 (포인트)","b":["회사는 서비스 안 노래방에서 사용하는 선불 「포인트」를 판매합니다. 포인트 사용과 환불에서는 1P를 1원으로 계산합니다. 충전 가격은 결제 수단별 구매 화면에 표시된 대로입니다.","포인트는 로그인한 계정의 지갑 하나에 기록되며, 웹과 전용 앱에서 같은 포인트를 충전하고 사용합니다.","포인트는 유료 포인트(이용자가 결제로 충전한 포인트)와 무료 포인트(충전 혜택·이벤트·순위 상금·LIVE 선물 적립·보상 등 결제 없이 받은 포인트)로 나누어 기록합니다.","포인트를 사용할 때는 유료 포인트를 먼저(먼저 충전한 것부터) 사용하고, 그다음 무료 포인트를 사용합니다. 포인트를 사용하기 전에는 사용할 포인트와 사용 후 잔여 포인트를 화면에 표시하고 이용자의 확인을 받습니다. 다만 곡 재생은 처음 부를 때 사용 금액과 잔여를 한 번 안내하고, 그 뒤에는 초록 칸에 잔여를 표시합니다.",["유료 포인트: 유효기간이 없습니다.","무료 포인트: 지급일로부터 1년간 사용할 수 있으며, 유효기간이 지난 무료 포인트는 사용할 수 없습니다."],["환불(구매일로부터 7일 이내): 사용하지 않은 유료 포인트는 일부를 사용했더라도 수수료 없이 전부 환불합니다.","환불(구매일로부터 7일이 지난 뒤): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다. 적용 수수료율은 환불 요청 화면에 표시합니다. 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","무료 포인트는 환불 대상이 아니며, 환불을 처리할 때 함께 소멸합니다. 10원 미만은 환불하지 않습니다."],"환불은 「내 지갑 → 환불 요청」 또는 고객센터로 요청할 수 있으며, 회사가 확인한 뒤 결제한 수단으로 환불합니다. 환불 요청 중인 포인트는 처리가 끝날 때까지 사용할 수 없습니다.","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트의 환불은 해당 앱 마켓의 환불 규정을 따릅니다. 앱 마켓에서 결제가 취소·환불되면 그 결제로 충전된 포인트(함께 지급된 무료 포인트 포함)를 지갑에서 차감하며, 이미 사용한 경우에는 다른 포인트 또는 이후 충전되는 포인트에서 차감합니다."]},{"h":"제3조의3 (꾸미기 아이템)","b":["꾸미기 상점의 아이템은 구매 시각부터 1일(24시간), 7일 또는 30일 동안 보유하고 이용할 수 있습니다.","기간이 끝나면 보관함에서 사라지며 계속 쓰려면 다시 구매해야 합니다.","사용 중인 얼굴 마스크는 앱을 끄고 나갈 때까지 이용할 수 있습니다. 우리끼리 노래 방에 놓은 아이템은 기간이 끝나면 사라집니다.","꽃다발은 1일(24시간) 단위로만 판매합니다. 소모품은 구매 시각부터 24시간 안에 사용하지 않으면 사라집니다.","얼굴 마스크는 꾸미기 아이템에 포함됩니다. 전면 카메라에서 얼굴을 찾지 못하면 화면이 흐려지며, 마스크와 흐림은 녹화와 방송에 그대로 담깁니다."]},{"h":"제3조의4 (출시 이벤트)","b":[["출시 이벤트 기간(출시 후 한 달, 기간은 화면에 표시)에는 계정마다 무료 3곡을 부를 수 있습니다.","무료 곡은 재생이 시작될 때 1곡씩 차감됩니다(제3조). 같은 재생은 한 번만 차감합니다.","무료 곡은 환불하지 않으며 현금으로 바꿀 수 없고, 이벤트 기간이 끝나면 남은 무료 곡은 사라집니다."]]},{"h":"제3조의5 (방 이용료와 방 삭제)","b":[["우리끼리 노래 방은 방장이 만들 때 포인트를 1회 사용합니다.","금액은 사용 전에 화면에 표시합니다. 방 연결에 실패하면 사용한 포인트를 되돌립니다.","우리끼리 노래 방은 만든 날로부터 3개월이 지나면 영상과 함께 자동으로 삭제됩니다.","방장이 방을 삭제하면 방의 영상이 모두 서버에서 삭제되며 복구할 수 없습니다. 다만 다른 방에도 올린 영상은 그 방에 남습니다."]]},{"h":"제3조의6 (AI 사진·영상)","b":[["AI 상황 사진, 단체 AI 사진, AI 영상은 유료이며 금액은 사용 전에 화면에 표시합니다.","생성에 실패하면 사용한 포인트를 자동으로 되돌립니다.","AI 영상을 만들면 이용자가 고른 녹화 구간이 외부 AI 업체로 전달됩니다."]]},{"h":"제3조의7 (청약철회와 환불이 제한되는 서비스)","b":["꾸미기 아이템, 방 개설(연장 포함), AI 사진·영상 생성, LIVE 방송 차감은 사용 즉시 제공되는 서비스이므로 청약철회와 환불이 되지 않습니다. 이 사실은 사용 전 확인 화면에 표시합니다. 다만 제공에 실패하면 사용한 포인트를 되돌립니다.","재생이 시작된 곡도 환불되지 않습니다(제3조). 곡을 불러오지 못해 재생이 시작되지 않으면 자동으로 되돌립니다."]},{"h":"제4조 (미성년자의 이용)","b":["서비스는 만 15세 이상 이용할 수 있으며, 만 15세 미만은 이용할 수 없습니다. 이 약관에서 청소년은 만 15세 이상 만 19세 미만인 사람을, 성인은 만 19세 이상인 사람을 말합니다. 나이는 태어난 날을 기준으로 한 만 나이로 한국 날짜에 따라 계산하며, 만 19세 생일이 되면 성인으로 처리합니다.","회사는 서비스(앱)에 들어올 때 휴대폰 본인인증으로 만 15세 이상인지 한 번 확인하며, 본인인증을 마치지 않으면 서비스를 이용할 수 없습니다. 인증 결과 중 생년월일과 성별만 저장합니다.","청소년은 한 달에 200,000원까지 포인트를 충전할 수 있습니다. 미성년자가 법정대리인의 동의 없이 한 결제는 미성년자 본인 또는 법정대리인이 관련 법령(민법 제5조 등)에 따라 취소할 수 있으며, 회사는 결제 취소·환불을 관련 법령에 따라 처리합니다.","「주변 노래 친구」와 사람 찾기에서 청소년은 청소년끼리만, 성인은 성인끼리만 서로 보이고 팔로우할 수 있으며, 앱 안 방 초대는 맞팔 친구끼리만 할 수 있습니다(제13조의2).","만 15세 미만의 이용이 확인되면 회사는 이용을 제한할 수 있습니다."]},{"h":"제5조 (곡 제공 조건)","b":["곡 제공 사정에 따라 일부 곡이 목록에서 빠지거나 재생되지 않을 수 있습니다.","곡 목록이 바뀌어도 잔여 곡과 포인트는 그대로입니다."]},{"h":"제6조 (계정 삭제 시 잔여 곡·포인트)","b":["계정 삭제 전에 환불 규정에 따라 잔여 곡·포인트의 환불을 요청할 수 있습니다.","유료 포인트와 잔여 곡의 환불은 계정 삭제 전에 요청해야 하며, 계정을 삭제하면 남은 포인트와 잔여 곡은 소멸합니다(제6조의2)."]},{"h":"제6조의2 (계정 삭제)","b":["이용자는 앱의 「내 스테이지 → 계정 삭제」에서 언제든 계정을 삭제할 수 있습니다. 앱을 이용할 수 없으면 계정 삭제 안내 페이지(https://karaoke.moneypuzzle.co.kr/account-delete.html) 또는 admin@moneypuzzle.co.kr로 요청할 수 있습니다.","삭제하면 프로필·ID·팔로우 관계·게시 영상과 그 파일·내가 쓴 댓글·내가 만든 우리끼리 노래 방과 그 방의 영상·AI 사진·로그인 기록·나이 인증 결과·동의 기록·위치 정보가 삭제되고, 남은 포인트와 잔여 곡은 소멸하며, 복구할 수 없습니다. 같은 구글·애플 계정으로 이용하는 머니퍼즐 투어앱의 로그인 기록과 명소 후기도 함께 삭제됩니다.","환불 요청을 처리하는 중에는 계정을 삭제할 수 없습니다. 유료 포인트와 잔여 곡의 환불은 삭제 전에 요청해야 합니다.","결제·환불 기록은 「전자상거래 등에서의 소비자보호에 관한 법률」에 따라 금액·시각·수단 등 최소한의 내용으로 5년간 보관하고, 제재 기록은 이의 처리와 재입장 차단에 필요한 기간 동안, 위치정보 이용·제공 사실 확인자료는 6개월간 보관합니다."]},{"h":"제7조 (저작권 및 이용 범위)","b":["노래방 영상과 그 안의 반주·가사·영상의 권리는 금영엔터테인먼트 등 각 권리자에게 있고, 서비스의 화면·로고·글의 권리는 회사에 있습니다.","이용자는 서비스를 개인적으로 노래하고 감상하는 데에만 이용할 수 있으며, 서비스가 제공하는 기능 밖에서 영상·반주·가사를 복제·배포·방송하거나 영업장 등에서 영리 목적으로 이용해서는 안 됩니다."]},{"h":"제8조 (녹음·녹화물 게시)","b":["이 조항은 노래 녹음·녹화와 「스테이지」·「내 스테이지」 게시 기능에 적용됩니다.",["이용자가 올린 노래의 목소리·영상에 대한 권리는 이용자에게 있습니다. 이용자는 회사가 그 노래를 서비스 안에서 보여 주고 서비스를 알리는 데 무상으로 쓸 수 있도록 허락합니다. 이용자가 노래를 지우면 회사도 더 이상 쓰지 않습니다.","녹음·녹화물 안의 반주·가사의 권리는 금영엔터테인먼트 등 권리자에게 있으므로, 서비스 밖으로 내려받거나 다른 곳에 올릴 수 없습니다.","노래는 본인인증(만 15세 이상)을 마친 이용자만 올릴 수 있습니다. 다만 올릴 때 판별에서 문제가 감지된 청소년 계정의 영상이나 미성년자가 관련될 수 있는 영상은 올라가지 않습니다.","다른 사람의 얼굴·목소리를 허락 없이 담은 것, 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리를 침해하는 것, 광고는 올릴 수 없습니다.","스테이지는 노래를 부르는 영상만 올리는 곳입니다. 노래를 부르는 영상이 아닌 것은 회사가 예고 없이 지울 수 있습니다.","신고가 들어오거나(제8조의5) 위 내용에 해당하면 회사는 그 노래를 숨기거나 지울 수 있으며, 되풀이하면 올리기를 제한할 수 있습니다.","이용자는 언제든 자기 노래를 지울 수 있고, 계정을 삭제하면 올린 노래도 지워집니다(제6조의2).","상황 사진은 이용자 본인의 녹화 영상으로만 만들며, 함께 나오는 다른 인물은 AI가 만든 가상 인물입니다. 상황 사진에는 「AI 생성」이 표시됩니다.","단체 AI 사진은 우리끼리 노래 방에서 「참여」를 누른 사람의 얼굴로만 만들며, 「참여」를 누르는 것이 얼굴 사진 이용에 대한 동의입니다. 참여할 때 촬영한 얼굴 사진은 생성에만 임시로 쓰고 생성 후 바로 삭제합니다. 요금(5,000P)은 시작한 사람이 내며, 생성에 실패하면 자동으로 환불됩니다. 단체 AI 사진에도 「AI 생성」이 표시됩니다."]]},{"h":"제8조의2 (LIVE 방송)","b":["이 조항은 노래방 「LIVE」 기능에 적용됩니다.",["LIVE 방송은 본인인증한 성인만 시작할 수 있습니다. 관람·댓글·반응은 서비스를 이용할 수 있는 이용자가 할 수 있으며, 관람에는 포인트가 사용되지 않습니다.","방송인은 방송 중 관람객 1명이 1시간 시청할 때 100P를 1분 단위로 부담합니다. 회사는 방송을 시작할 때 이를 화면에 알리고, 잔여 포인트가 0P가 되면 방송을 자동으로 종료합니다.","곡이 끝나도 방송은 이어집니다. 방송인은 3분 안에 다음 곡을 골라 이어 부를 수 있으며, 고르지 않으면 안내 후 30초 뒤 방송이 종료됩니다.","방송인은 「관객」 판에서 관람객의 별명과 공개 프로필 사진을 볼 수 있습니다.","관람객은 방송인에게 포인트로 선물을 보낼 수 있습니다. 선물의 종류·가격과 한도(1인 하루 500,000P)는 화면에 표시된 대로이며, 청소년은 선물을 보낼 수 없습니다. 보낸 선물은 취소·환불되지 않습니다. 다만 관련 법령에 따라 취소할 수 있는 경우는 예외로 합니다.","방송인은 받은 선물 금액의 60%를 무료 포인트로 적립받습니다. 적립된 포인트의 유효기간은 적립일로부터 1년이며, 서비스 안에서만 사용할 수 있고 현금으로 바꾸거나 환불할 수 없습니다.","선물에 사용한 결제가 취소·환불되거나 부정 결제로 확인되면, 회사는 그 선물로 방송인에게 적립한 포인트를 회수할 수 있습니다. 이미 사용한 경우에는 이후 적립분에서 공제하거나 반환을 청구할 수 있습니다.","방송에도 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리 침해, 광고는 금지됩니다. 회사는 신고가 들어오거나 이를 위반한 방송을 예고 없이 종료할 수 있고, 되풀이하면 방송을 제한할 수 있습니다. 방송인은 관람객을 내보낼 수 있습니다.","회사는 신고 처리와 분쟁 대응을 위해 방송 영상을 비공개로 30일간 보관한 뒤 삭제하며, 보관 영상은 관리자만 열람합니다."]]},{"h":"제8조의3 (순위 시상)","b":[["회사는 전체 공개 노래 영상을 대상으로 주간·월간·연말(왕중왕) 순위를 발표하고 1위에게 상금을 포인트로 지급합니다. 기준과 상금은 서비스 화면에 표시된 대로입니다.","매월 마지막 일요일의 주간 상금은 그달 월간 상금으로 대체하고, 12월 월간 상금은 연말 왕중왕 상금으로 대체합니다.","상금은 무료 포인트로 자동 지급되며, 유효기간은 지급일로부터 1년입니다. 환불하거나 현금으로 바꿀 수 없습니다.","수상자에게는 프로필 별이 표시됩니다. 주간·월간 별은 해가 바뀌면 사라지고 왕중왕 별은 유지됩니다.","부정한 방법으로 순위에 영향을 준 영상은 순위에서 제외할 수 있습니다."]]},{"h":"제8조의4 (자동 감시)","b":["StageSong에는 음성과 화면을 살피는 자동 감시 시스템이 설치되어 있습니다.","LIVE 방송: 폰 안 판별과 함께 저해상도 화면과 음성 조각을 서버에서 판별합니다. 판별에 쓴 화면과 음성은 저장하지 않으며, 댓글의 욕설은 가려서 표시합니다.","우리끼리 노래: 방에 올리는 영상은 게시 영상과 같이 판별합니다. 앱에 처음 들어올 때 이용약관과 함께 동의합니다.","게시 영상: 올릴 때 화면 표본을 판별하고 제목·설명·댓글의 욕설을 확인합니다. 문제가 있으면 「나만 보기」로 올라갑니다.","처음에는 화면을 몇 초 가리고 안내합니다. 높은 확신의 감지가 연속되고 반복될 때만 강퇴와 24시간 이용 제한이 적용되며, 음성·욕설 자동 판정은 안내까지만 합니다. 다만 청소년 계정은 첫 회부터, 미성년자가 관련될 수 있는 장면은 즉시 방송 종료와 이용 제한을 적용합니다. 위반이 되풀이되면 이용을 영구히 제한할 수 있습니다.","제한 안내의 「이의 신청」을 누르면 회사가 확인하며, 오판이면 제한을 해제하고 사용한 포인트를 복구합니다. 끊긴 LIVE 방송에서 사용한 포인트는 무료 포인트(유효기간 1년)로 돌려 드립니다.","자동 판정에는 오판이 있을 수 있어 회사는 임계값을 보수적으로 운영합니다. 판별용 사본은 저장하지 않습니다. 방송 영상은 제8조의2에 따라 따로 보관합니다. 미성년자가 관련될 수 있는 장면이 감지되면 방송을 즉시 끝내고 해당 녹화를 삭제합니다."]},{"h":"제8조의5 (신고와 차단)","b":["이용자는 영상과 댓글마다 「신고」로 음란·욕설·괴롭힘·저작권·기타 사유를 골라 신고할 수 있습니다. 같은 항목은 한 사람이 한 번만 신고할 수 있고, 하루 신고 횟수에는 제한이 있습니다.","회사는 신고를 확인해 해당 영상이나 댓글을 숨기거나 지울 수 있고, 위반이 되풀이되면 이용을 제한할 수 있습니다.","이용자는 다른 이용자의 스테이지·영상·댓글에서 그 사람을 차단할 수 있습니다. 차단하면 서로의 영상과 댓글이 스테이지 목록·사람 찾기·주변 노래 친구에서 보이지 않고, 팔로우가 해제되며, 서로 팔로우·댓글·방 초대를 할 수 없습니다.","차단은 「내 스테이지 → 차단 목록」에서 해제할 수 있습니다."]},{"h":"제8조의6 (프로필 공개)","b":["이용자의 ID, 프로필 사진, 별, 전체 공개 영상, 팔로워 수는 다른 이용자에게 공개됩니다.","다른 이용자는 ID로 이용자를 검색할 수 있습니다. 검색과 표시에는 제4조의 구분과 차단(제8조의5)이 적용됩니다."]},{"h":"제9조 (외부 링크 면책)","b":["서비스는 이용자의 편의를 위해 외부 사이트·앱으로 연결되는 링크를 제공할 수 있습니다. 회사는 외부 서비스의 내용·거래·정확성에 대해 책임지지 않습니다.","노래방 영상은 외부 영상 재생 서비스와 권리자가 제공하며, 영상 안의 광고·내용·재생 가능 여부는 해당 서비스와 권리자의 정책을 따릅니다."]},{"h":"제10조 (이용자의 의무 및 금지 행위)","b":["이용자는 다음 행위를 하여서는 안 됩니다.",["법령 또는 공서양속에 반하는 행위","서비스의 정상적인 운영을 방해하거나 무단으로 데이터를 수집하는 행위","타인의 권리를 침해하는 행위"]]},{"h":"제11조 (서비스 중단 및 점검)","b":["서비스는 연중무휴 24시간 제공을 원칙으로 합니다. 다만 점검·설비 교체·장애가 있을 때는 일시 중단할 수 있으며, 미리 알릴 수 있는 경우에는 서비스 화면으로 미리 알립니다.","회사의 고의 또는 과실로 이용자에게 손해가 생긴 경우 회사는 관련 법령에 따라 배상합니다."]},{"h":"제12조 (책임의 한계)","b":["곡 제공 사정으로 일부 곡은 재생되지 않거나 목록이 바뀔 수 있습니다.","회사는 천재지변, 외부 API·통신의 장애 등 회사의 합리적 통제를 벗어난 사유로 인한 손해에 대해 책임을 지지 않습니다."]},{"h":"제13조 (기기 접근 권한)","b":["서비스는 녹화, LIVE, 단체 AI 사진 참여처럼 해당 기능을 쓸 때만 카메라와 마이크를 사용합니다. 처음 쓸 때 브라우저 또는 앱이 허락을 묻고, 허락하지 않으면 해당 기능만 쓸 수 없고 다른 기능은 그대로 쓸 수 있습니다.","녹화한 영상은 이용자의 기기 안에 저장되며, 이용자가 「내 노래 올리기」로 올리기를 고른 영상만 회사로 보내집니다. 다만 LIVE 방송, 게시 판별 표본, AI 생성을 고른 구간은 각 조항에 따라 전송됩니다.","위치는 「주변 노래 친구」에서 「내 위치 보이기」를 켤 때만 대략 위치(약 1km)를 씁니다. 앱에 처음 들어올 때 또는 처음 켤 때 위치정보 이용 동의를 받고 브라우저 또는 앱이 위치 권한을 묻습니다(앱은 대략 위치 권한만 요청). 그 밖의 기기 접근 권한은 쓰지 않으며, 접근 권한이 더 필요해지면 꼭 필요한 권한과 선택 권한을 나누어 그 이유와 함께 미리 알리고 동의를 받습니다(정보통신망법 제22조의2)."]},{"h":"제13조의2 (위치기반서비스 — 주변 노래 친구)","b":["회사는 「위치정보의 보호 및 이용 등에 관한 법률」에 따라 위치기반서비스사업을 신고한 사업자입니다(주식회사 부만, 신고 제1866호).","서비스 내용: 「주변 노래 친구」는 로그인하고 「내 위치 보이기」를 켠 이용자끼리(본인인증은 StageSong을 처음 열 때 한 번 진행합니다) 서로의 거리 구간(1km·3km·10km 이내)과 최근 전체 공개 노래를 보여 주며, 보기·좋아요·댓글·팔로우를 할 수 있게 합니다. 위치를 켜지 않으면 다른 사람의 목록도 볼 수 없습니다. 위치 이용에는 요금이 없습니다.",["앱에 처음 들어올 때 또는 처음 켤 때 위치정보 이용에 동의해야 하며(동의하지 않아도 다른 서비스는 이용할 수 있습니다), 회사는 동의를 계정별로 시각과 함께 기록합니다.","위치는 약 1km 단위로 줄여 저장하며, 정확한 좌표·주소는 저장하거나 다른 이용자에게 보여 주지 않습니다.","위치는 켜 둔 동안만 보관하고, 끄거나 보이기 시간(켠 뒤 15분, 연장하면 연장한 시각까지)이 끝나거나 동의를 철회하면 지체 없이 파기합니다.","회사는 위치정보 이용·제공 사실 확인자료(이용 시각·목적·계정)를 자동으로 기록하여 6개월간 보관한 뒤 파기합니다.","이용자는 언제든 「내 위치 보이기」를 끄거나 「위치정보 동의 철회」로 동의를 철회할 수 있으며, 위치정보 이용·제공 사실 확인자료의 열람·고지와 오류 정정을 요구할 수 있습니다.","회사는 위치정보를 다른 이용자에게 거리 구간으로만 보여 주며, 법령에 따른 경우를 제외하고 그 밖의 제3자에게 제공하지 않습니다.","목록에는 본인인증 결과로 나이대와 성별이 함께 표시됩니다(예: 「20대 · 남」, 청소년은 「10대」). 성별은 늘 표시되며, 정확한 나이·생일은 표시하지 않습니다.","청소년은 청소년끼리만, 성인은 성인끼리만 서로 목록에 보이고 팔로우할 수 있습니다.","목록은 「전체 / 맞팔 친구 / 10대 / 20대 / 30-40대 / 50대 / 60대 이상」으로 거를 수 있습니다. 본인인증한 여성은 「여성에게만 내 위치 보이기」를 켤 수 있으며, 켜면 남성 이용자와 서로 목록에 보이지 않습니다.","「주변 노래 친구」에서는 모르는 사람을 방에 초대할 수 없습니다. 앱 안에서 우리끼리 노래 방에 사람을 넣거나 초대하는 것은 서로 팔로우한 「맞팔 친구」끼리만 할 수 있으며, 회사가 이를 확인합니다. 이용자가 카카오톡 등으로 직접 보내는 초대 링크는 그대로 이용할 수 있습니다.","이용자는 다른 이용자를 차단·신고할 수 있습니다(제8조의5). 차단하면 서로 목록에 보이지 않고 초대를 주고받지 못합니다. 맞팔 친구 초대는 하루 20번, 대기 중인 초대는 3개까지 보낼 수 있습니다."],"위치정보관리책임자: 황의만 (고객센터 010-4221-7066 · admin@moneypuzzle.co.kr)","위치정보와 관련한 분쟁은 방송미디어통신위원회 또는 개인정보분쟁조정위원회에 조정을 신청할 수 있으며, 회사의 위치정보 처리로 이용자에게 손해가 생긴 경우 회사는 관련 법령에 따라 배상합니다."]},{"h":"제14조 (준거법 및 관할)","b":["회사와 이용자 간에 제기된 소송은 대한민국 법을 준거법으로 합니다.","회사와 이용자 간 발생한 분쟁에 관한 소송은 민사소송법상의 관할법원에 제기합니다.","이용자가 외국 거주자인 경우, 회사와 이용자 간에 발생한 분쟁에 관한 소송은 전항에도 불구하고 대한민국 서울중앙지방법원을 전속 관할 법원으로 합니다. 다만 소비자인 이용자가 법령에 따라 다른 법원에 제기할 권리는 제한되지 않습니다."]},{"h":"제15조 (문의)","b":["서비스 이용에 관한 문의는 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 연락하실 수 있습니다."]},{"h":"제16조 (약관의 변경)","b":["회사는 약관을 변경할 때 변경 내용과 적용일을 적용일 7일 전부터 서비스 화면에 공지합니다. 이용자에게 불리한 변경은 적용일 30일 전부터 공지합니다.","변경에 동의하지 않는 이용자는 계정을 삭제해 계약을 해지할 수 있습니다."]},{"h":"제17조 (이용 제한과 계약 해지)","b":["회사는 이용자가 이 약관이나 법령을 위반하면 위반의 정도에 따라 게시물 숨김·삭제, 기능 제한, 일시 또는 영구적인 이용 제한을 할 수 있으며, 그 사유를 화면 등으로 알립니다. 자동 감시에 따른 제한은 제8조의4를 따릅니다.","이용자는 언제든 계정을 삭제해 계약을 해지할 수 있습니다(제6조의2). 남은 유료 포인트와 잔여 곡의 환불은 환불 규정을 따릅니다."]},{"h":"제18조 (서비스 종료)","b":["서비스를 종료할 때는 30일 전에 알리고 남은 유료 포인트와 잔여 곡을 환불합니다."]},{"h":"제19조 (번역본)","b":["번역본과 한국어본이 다르면 한국어본을 따릅니다."]}]},"en":{"title":"Terms of Service","eff":"Effective date: January 1, 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"Article 1 (Purpose)","b":["These Terms govern your use of the karaoke service StageSong (Money Puzzle Karaoke, https://karaoke.moneypuzzle.co.kr, “the Service”) provided by Booman Inc. (\"the Company\")."]},{"h":"Article 1-2 (Agreement on entry)","b":["The first time you enter StageSong, once per account, you go through: (1) age verification, (2) item-by-item agreement to these Terms, the Refund Policy, the collection and use of personal information and the automatic monitoring notice, and (3) consent to the location-based service.","If you do not agree to all required items in (2), you cannot use the Service. (3) is optional: without it you can still use the Service, except for “Singers nearby”. You can consent to (3) later in “Singers nearby”.","The Company records, per account and per item, the time of agreement and the version (effective date) of each document. Paid purchases are agreed to separately at the time of payment."]},{"h":"Article 2 (The Service)","b":["The Service provides:",["Playback of karaoke videos (using points per song or Song bundles bought with paid points)","Sale of prepaid karaoke points and Song bundles bought with paid points (seller: the Company)","Sign-in with Google or Apple and storage of your points and remaining songs","Karaoke LIVE broadcasts, gifts and ranking awards"],"Payment for points is made to the Company through the payment window of its contracted payment gateway or through app market billing. The Company does not receive or store card numbers or other payment details."]},{"h":"Article 3 (Song use and bundles)","b":["Karaoke is used song by song. Each song uses points, and the price is as shown on the purchase screen.","The Company sells “Song bundles” of several songs. Song bundles come in several sizes and can be bought with paid points only; their contents and prices are as shown on the purchase screen. Songs you buy are recorded on your signed-in account as “remaining songs”, which have no expiry date. Free points can't be used to buy Song bundles; they can be used to play songs one at a time.","One song is used when playback starts. One play is one use, and repeating the same song uses one song each time.","Songs are used in this order: launch event free songs, remaining songs, then points (paid points first). If your balance is not enough, playback does not start.","The same rule applies to Just Us Karaoke, LIVE, Challenge, Relay and recording: only the person singing uses a song, and watching and listening are free. The per-viewer point charge for LIVE broadcasts and gifts are separate (Article 8-2).","If a song fails to load and playback does not start, it is returned automatically.",["Refund of remaining songs: unused remaining songs are refunded to your original payment method at their paid value, which is the paid-point share of the Song bundle divided by its number of songs, for each unused song (1P = ₩1).","Within 7 days of the bundle purchase date: refunded with no fee.","More than 7 days after the bundle purchase date: a refund fee of up to 10% is deducted (the rate applied is shown on the refund request screen). However, if your paid points and remaining songs past 7 days total 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund. Amounts under ₩10 are not refunded.","The share of a Song bundle bought with points topped up in an app market follows that market's refund policy.","Songs whose playback has started are not refunded.","Points spent on songs and Song bundles are not returned to your wallet, except where playback did not start.","Remaining songs under a refund request cannot be used until the request is processed."],"Details follow the Refund Policy."]},{"h":"Article 3-2 (Points)","b":["The Company sells prepaid “points” used in the karaoke of the Service. For using and refunding points, 1P counts as ₩1. Top-up prices are as shown on the purchase screen for each payment method.","Points are recorded in a single wallet for your signed-in account, and the same points can be topped up and used on the web and in the dedicated app.","Points are recorded separately as paid points (topped up by your payment) and free points (received without payment, such as top-up bonuses, events, ranking prizes, LIVE gift credits and compensation).","When points are used, paid points are used first (earliest top-up first), then free points. Before any use, the screen shows the points to be used and the balance afterwards, and asks you to confirm. For song plays, however, the amount and your balance are shown once, the first time you sing, and after that your balance is shown in the green box.",["Paid points: no expiry date.","Free points: can be used for 1 year from the date given. Expired free points cannot be used."],["Refund (within 7 days of purchase): unused paid points are refunded in full with no fee, even if you used part of them.","Refund (after 7 days): remaining paid points are refunded minus a refund fee of up to 10%. The rate applied is shown on the refund request screen. However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Free points are not refundable and expire when a refund is processed. Amounts under ₩10 are not refunded."],"You can request a refund via “My wallet > Request refund” or Support. After review, the Company refunds to the payment method used. Points under a refund request cannot be used until the request is processed.","Refunds for points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy. If the marketplace cancels or refunds the payment, the points from that payment (including any free points given with it) are deducted from your wallet; if already used, they are deducted from other points or from later top-ups."]},{"h":"Article 3-3 (Decoration items)","b":["Items in the decoration shop can be held and used for 1 day (24 hours), 7 days or 30 days from the time of purchase.","When the period ends they disappear from My items, and you must purchase them again to keep using them.","A face mask in use can be used until you close and leave the app. Items placed in a Just Us Karaoke room disappear when their period ends.","Bouquets are sold for 1 day (24 hours) only. Consumables disappear if they are not used within 24 hours of purchase.","Face masks are decoration items. If the front camera can't find your face, the picture is blurred. Masks and blur appear as they are in recordings and broadcasts."]},{"h":"Article 3-4 (Launch event)","b":[["During the launch event (one month after launch; the period is shown on screen), each account can sing 3 free songs.","One free song is used when playback starts (Article 3). The same play counts only once.","Free songs can't be refunded or exchanged for cash, and any left when the event ends disappear."]]},{"h":"Article 3-5 (Room fees and room deletion)","b":[["A Just Us Karaoke room uses points once, when the owner creates it.","The amount is shown on screen before use. If the room can't connect, the points used are returned.","A Just Us Karaoke room is deleted automatically with its videos 3 months after it was created.","If the owner deletes a room, all of its videos are deleted from the server and can't be recovered. Videos also posted to another room stay in that room."]]},{"h":"Article 3-6 (AI photos and videos)","b":[["AI scene photos, group AI photos and AI videos are paid features, and the amount is shown on screen before use.","If creation fails, the points used are returned automatically.","When you make an AI video, the recording section you chose is sent to an external AI provider."]]},{"h":"Article 3-7 (Services that can't be withdrawn or refunded)","b":["Decoration items, room creation (including extensions), AI photo and video creation and LIVE broadcast deductions are provided as soon as they are used, so they can't be withdrawn or refunded. This is shown on the confirmation screen before use. If provision fails, however, the points used are returned.","Songs whose playback has started are not refunded either (Article 3). If a song fails to load and playback does not start, it is returned automatically."]},{"h":"Article 4 (Use by minors)","b":["The Service is for users aged 15 and over. People under 15 may not use the Service. In these Terms, a minor means a person aged 15 or over and under 19, and an adult means a person aged 19 or over. Age is counted in full years from the date of birth, using the date in Korea, and a user is treated as an adult from their 19th birthday.","When you enter the Service (app), the Company checks once, by mobile identity verification, that you are 15 or older. You cannot use the Service without completing identity verification. We keep only the date of birth and gender from the result.","Minors can top up points up to KRW 200,000 per month. A payment made by a minor without the consent of a legal guardian may be cancelled by the minor or the legal guardian under the applicable laws (such as Article 5 of the Korean Civil Act), and the Company handles such cancellations and refunds under those laws.","In “Singers nearby” and people search, minors can see and follow only minors, and adults only adults; in-app room invitations are only possible between mutual friends (Article 13-2).","If use by a person under 15 is found, the Company may restrict that use."]},{"h":"Article 5 (Song availability)","b":["Depending on song supply, some songs may disappear from the list or fail to play.","If the song list changes, your remaining songs and points stay as they are."]},{"h":"Article 6 (Remaining songs and points when you delete your account)","b":["Before deleting your account, you can request a refund for your remaining songs and points under the Refund Policy.","Refunds of paid points and remaining songs must be requested before you delete your account. When you delete it, any points and remaining songs left expire (Article 6-2)."]},{"h":"Article 6-2 (Deleting your account)","b":["You can delete your account at any time in the app under “My Stage → Delete account”. If you can't use the app, you can request deletion through the account deletion page (https://karaoke.moneypuzzle.co.kr/account-delete.html) or at admin@moneypuzzle.co.kr.","Deletion removes your profile, ID, follow relationships, posted videos and their files, your comments, the Just Us Karaoke rooms you made and their videos, AI photos, sign-in record, age verification result, consent records and location data. Your remaining points and remaining songs expire, and none of this can be restored. The sign-in record and place reviews of the Money Puzzle tour app used with the same Google or Apple account are deleted as well.","An account can't be deleted while a refund request is being processed. Refunds of paid points and remaining songs must be requested before deletion.","Payment and refund records are kept for 5 years in minimal form (amount, time, method and the like) under Korea's Act on Consumer Protection in Electronic Commerce. Sanction records are kept as long as needed for appeals and to prevent re-entry, and records of location use for 6 months."]},{"h":"Article 7 (Copyright and scope of use)","b":["Rights to the karaoke videos and the accompaniment, lyrics and footage in them belong to Kumyoung Entertainment and other rights holders. Rights to the Service's screens, logos and text belong to the Company.","You may use the Service only for personal singing and listening. Outside the features the Service provides, you may not copy, distribute or broadcast the videos, accompaniment or lyrics, or use them for profit, such as in a business."]},{"h":"Article 8 (Posting recordings)","b":["This article applies to recording songs and posting them to \"Public Stage\" and \"My Stage\".",["Rights to the voice and video in songs you post belong to you. You allow the Company, free of charge, to show those songs in the Service and to use them to promote the Service. Once you delete a song, the Company stops using it.","Rights to the accompaniment and lyrics in a recording belong to Kumyoung Entertainment and other rights holders, so you may not download recordings outside the Service or post them elsewhere.","Only users who have completed identity verification (15 and over) may post songs. However, a minor account's video in which the check finds a problem, or a video that may involve a minor, is not posted.","You may not post others' faces or voices without permission, obscene, violent or hateful content, abusive language, anything that infringes others' rights, or advertising.","The Public Stage is only for videos of people singing. The Company may delete anything that is not a singing video without notice.","If a song is reported or falls under the above, the Company may hide or delete it, and may restrict posting for repeated violations.","You can delete your songs at any time, and your posted songs are deleted when you delete your account (Article 6-2).","Scene photos are made only from your own recording; any other people shown are fictional people created by AI. Scene photos are marked \"AI-generated\".","Group AI photos are made only from the faces of people who tap “Join” in a Just Us Karaoke room; tapping “Join” is consent to the use of your face photo. Face photos taken when joining are used temporarily only for creation and deleted right after. The fee (5,000P) is paid by the person who starts it and is refunded automatically if creation fails. Group AI photos are also labeled “AI-generated”."]]},{"h":"Article 8-2 (LIVE broadcasts)","b":["This article applies to the karaoke LIVE feature.",["Only verified adults can start a LIVE broadcast. Anyone able to use the Service can watch, comment and react, and watching uses no points.","The broadcaster pays 100P per viewer per hour, calculated every minute. The Company shows this before the broadcast starts and ends the broadcast automatically when remaining points reach 0P.","The broadcast continues when a song ends. The broadcaster can pick the next song within 3 minutes and keep singing; otherwise a notice appears and the broadcast ends 30 seconds later.","The broadcaster can see viewers' nicknames and public profile photos in the “Audience” panel.","Viewers can send gifts to the broadcaster with points. Gift types, prices and the limit (500,000P per person per day) are as shown on screen. Minors can't send gifts. Sent gifts can't be cancelled or refunded, except where the law allows cancellation.","The broadcaster receives 60% of the gift amount as free points. These points are valid for 1 year from the date credited, can only be used within the Service, and can't be exchanged for cash or refunded.","If a payment used for a gift is cancelled or refunded, or is found to be fraudulent, the Company may reclaim the points credited to the broadcaster for that gift. If they have already been used, the Company may deduct the amount from later credits or demand its return.","Obscene, violent or hateful content, abuse, infringement of others' rights and advertising are prohibited in broadcasts. The Company may end a reported or violating broadcast without notice and may restrict repeat offenders. Broadcasters can remove viewers.","The Company keeps broadcast videos privately for 30 days to handle reports and disputes, then deletes them. Only administrators can view them."]]},{"h":"Article 8-3 (Rankings and awards)","b":[["The Company announces weekly, monthly and year-end (Champion) rankings of public song videos and pays first place a prize in points. Criteria and prizes are as shown on screen.","The weekly prize for the last Sunday of each month is replaced by that month's monthly prize, and December's monthly prize is replaced by the year-end Champion prize.","Prizes are paid automatically as free points, valid for 1 year from payment. They can't be refunded or exchanged for cash.","Winners get a profile star. Weekly and monthly stars disappear when the year changes; Champion stars stay.","Videos that affect rankings by improper means may be excluded."]]},{"h":"Article 8-4 (Automatic monitoring)","b":["StageSong has an automatic monitoring system for sound and picture.","LIVE: along with checks on your phone, low-resolution frames and audio clips are checked on the server. They are not stored afterwards, and abusive words in comments are hidden.","Just Us Karaoke: videos posted to a room are checked the same way as posted videos. You agree together with the Terms the first time you enter the app.","Posted videos: sample frames are checked when you post, along with title, description and comments. If there's a problem, the video is saved as “Only me”.","At first your picture is covered for a few seconds with a notice. Removal and a 24-hour limit apply only when high-confidence detections continue and repeat. Automatic checks of sound and language only give a notice. However, for minor accounts these apply from the first time, and scenes that may involve a minor mean the broadcast ends immediately and use is limited. Repeated violations can lead to a permanent limit.","Tap “Appeal” in the notice and the Company will review it. If it was a mistake, the limit is lifted and the points you used are restored. Points used in the interrupted LIVE broadcast come back as free points (valid for 1 year).","Automatic checks can make mistakes, so the Company sets thresholds conservatively. Copies used for checking are not stored. Broadcast videos are kept separately under Article 8-2. If a scene that may involve a minor is detected, the broadcast ends immediately and that recording is deleted."]},{"h":"Article 8-5 (Reporting and blocking)","b":["You can report any video or comment with “Report”, choosing a reason: sexual content, abusive language, harassment, copyright or other. One person can report the same item once, and the number of reports per day is limited.","The Company reviews reports and may hide or delete the video or comment, and may restrict use for repeated violations.","You can block another user from their stage, a video or a comment. Once blocked, you no longer see each other's videos and comments in Stage lists, people search or Singers nearby, any follows are removed, and you can't follow, comment on or invite each other.","You can unblock people in “My Stage → Blocked users”."]},{"h":"Article 8-6 (Public profile)","b":["Your ID, profile photo, stars, public videos and follower count are visible to other users.","Other users can search for you by ID. Search and display follow the separation in Article 4 and blocking (Article 8-5)."]},{"h":"Article 9 (External links)","b":["The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services.","Karaoke videos are provided by external video playback services and rights holders; ads, content and availability within the videos follow the policies of those services and rights holders."]},{"h":"Article 10 (User obligations and prohibited acts)","b":["You must not:",["act in violation of law or public order and morals","interfere with the normal operation of the Service or collect data without authorization","infringe the rights of others"]]},{"h":"Article 11 (Service suspension and maintenance)","b":["The Service is in principle available 24 hours a day, all year. It may be suspended temporarily for maintenance, equipment replacement or failures; where possible, we will announce this on the Service in advance.","If you suffer damage due to the Company's intent or negligence, the Company will compensate you in accordance with applicable law."]},{"h":"Article 12 (Limitation of liability)","b":["Depending on song supply, some songs may not play or the list may change.","The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]},{"h":"Article 13 (Device permissions)","b":["The Service uses the camera and microphone only when you use a feature that needs them, such as recording, LIVE or joining a group AI photo. Your browser or the app asks for permission the first time; if you decline, only that feature is unavailable and everything else still works.","Recordings stay on your device; only the recordings you choose to post with \"Post my song\" are sent to the Company. However, LIVE broadcasts, sample frames for checking posts and the sections you choose for AI creation are sent as set out in the relevant articles.","Location is used only when you turn on “Show my location” in “Singers nearby”, and only as an approximate location (about 1 km). When you first enter the app or first turn it on, we ask for your consent to use location information and your browser or the app asks for location permission (the app requests approximate location only). No other device permissions are used; if more are ever needed, we will tell you in advance which are required and which are optional, with the reasons, and ask for your consent (Article 22-2 of the Network Act)."]},{"h":"Article 13-2 (Location-based service — Singers nearby)","b":["The Company has reported its location-based service business under Korea's Act on the Protection, Use, etc. of Location Information (Booman Inc., report No. 1866).","What it does: “Singers nearby” shows signed-in users who turned on “Show my location” (identity verification is done once, when StageSong is first opened) each other's distance range (within 1, 3 or 10 km) and latest public songs, and lets them watch, like, comment and follow. Without turning on your own location you cannot see the list either. Using location is free.",["You must consent to the use of location information when you first enter the app or first turn it on (other services stay available without it); the Company records the consent per account with the time.","Location is rounded to about 1 km before saving; exact coordinates or addresses are never stored or shown to other users.","Location is kept only while turned on and is destroyed without delay when you turn it off, when the visible time ends (15 minutes after turning it on, or the extended time), or when you withdraw consent.","The Company automatically records the use and provision of location information (time, purpose, account), keeps these records for 6 months and then destroys them.","You may turn off “Show my location” or withdraw consent with “Withdraw location consent” at any time, and may ask to view or be notified of the records of use and provision of your location information and to correct errors.","Location is shown to other users only as a distance range and is not provided to any other third party except as required by law.","Each person in the list shows an age group and gender from identity verification (e.g. “20s · Male”; minors show as “Teens”). Gender is always shown; exact age and birthday are never shown.","Minors can see and follow only minors, and adults only adults.","The list can be filtered by “All / Mutual friends / Teens / 20s / 30s–40s / 50s / 60+”. Verified women can turn on “Show my location to women only”; she and male users then don't see each other in the list.","“Singers nearby” does not let you invite strangers into rooms. In the app, adding or inviting people to Just Us Karaoke rooms is only possible between “mutual friends” who follow each other, and the Company checks this. Invitation links that users send themselves via KakaoTalk etc. work as before.","You can block and report other users. Blocked users do not see each other in the list and cannot exchange invitations. You can send up to 20 mutual-friend invitations a day and have up to 3 pending at once."],"Location information officer: Hwang Euiman (customer center 010-4221-7066 · admin@moneypuzzle.co.kr)","For disputes about location information you may apply for mediation to the Korea Media and Communications Commission or the Personal Information Dispute Mediation Committee. If the Company's handling of location information causes you damage, the Company will compensate you as provided by law."]},{"h":"Article 14 (Governing law and jurisdiction)","b":["Any lawsuit between the Company and a user is governed by the laws of the Republic of Korea.","Any lawsuit concerning a dispute between the Company and a user shall be filed with the court having jurisdiction under the Civil Procedure Act of the Republic of Korea.","Despite the preceding paragraph, if the user resides outside the Republic of Korea, the Seoul Central District Court of the Republic of Korea has exclusive jurisdiction over any lawsuit concerning a dispute between the Company and the user. However, this does not limit the right of a user who is a consumer to file in another court under the law."]},{"h":"Article 15 (Contact)","b":["For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]},{"h":"Article 16 (Changes to these Terms)","b":["When the Company changes these Terms, it announces the changes and the effective date on the Service from 7 days before that date. Changes unfavourable to users are announced from 30 days before.","If you do not agree to a change, you can end the contract by deleting your account."]},{"h":"Article 17 (Restriction of use and termination)","b":["If you violate these Terms or the law, the Company may hide or delete your content, restrict features, or limit your use temporarily or permanently, depending on the seriousness of the violation, and will tell you the reason on screen or by other means. Limits from automatic monitoring follow Article 8-4.","You can end the contract at any time by deleting your account (Article 6-2). Refunds of paid points and remaining songs follow the Refund Policy."]},{"h":"Article 18 (End of the Service)","b":["If the Service ends, we will tell you 30 days in advance and refund your remaining paid points and remaining songs."]},{"h":"Article 19 (Translations)","b":["If a translation differs from the Korean version, the Korean version prevails."]}]},"ja":{"title":"利用規約","eff":"施行日：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供するカラオケサービスStageSong（ステージソング、マネーパズル カラオケ、https://karaoke.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]},{"h":"第1条の2（入場時の同意）","b":["StageSongに初めて入るとき、アカウントごとに一度、①年齢の本人認証 ②利用規約・返金規定・個人情報の収集・利用・自動監視のご案内への項目別の同意 ③位置基盤サービス利用への同意の順に進みます。","②の必須項目すべてに同意しない場合、本サービスは利用できません。③は任意で、同意しなくても本サービスを利用できますが、「近くの歌友」のみ利用できません。③は後から「近くの歌友」で同意できます。","当社は項目ごとの同意日時と各文書の版（施行日）をアカウントごとに記録します。有料の決済は、決済時に別途同意をいただきます。"]},{"h":"第2条（サービスの内容）","b":["本サービスは次のものを提供します。",["カラオケ動画の再生（曲ごとのポイント、または有料ポイントで購入する曲パックで利用）","カラオケポイント（前払い）と曲パック（有料ポイントで購入）の販売（販売当事者：当社）","Google・Appleアカウントでのログインおよびポイント・残り曲の保管","カラオケのLIVE配信・ギフトとランキング表彰"],"ポイントの代金は、当社が契約した電子決済代行会社の決済画面またはアプリマーケットの決済を通じて当社に支払われます。当社はカード番号などの決済情報を直接受け取ったり保存したりしません。"]},{"h":"第3条（曲の利用と曲パック）","b":["カラオケは曲単位で利用します。曲ごとにポイントを使用し、価格は購入画面に表示されたとおりです。","当社は複数の曲をまとめた「曲パック」を販売します。曲パックには複数のサイズがあり、有料ポイントでのみ購入でき、内容と価格は購入画面に表示されたとおりです。購入した曲はログインしたアカウントに「残り曲」として記録され、有効期限はありません。 無料ポイントでは曲パックを購入できず、曲を1曲ずつ再生するときに使えます。","曲は再生が始まるときに1曲使用されます。1回の再生が1曲で、同じ曲を繰り返しても再生ごとに1曲使用されます。","使用の順序は、リリース記念イベントの無料曲、残り曲、ポイント（有料ポイントが先）の順です。残高が足りない場合、再生は始まりません。","仲間だけカラオケ、LIVE、チャレンジ、リレー、録画にも同じルールを適用します。曲を使用するのは歌う人だけで、視聴と鑑賞は無料です。LIVE配信の視聴者ごとのポイント差引とギフトは別です（第8条の2）。","曲を読み込めず再生が始まらなかった場合、使用した曲は自動でお返しします。",["残り曲の返金：未使用の残り曲は、曲パックの購入に使った有料ポイント分を曲数で割った金額を、未使用の曲数分、決済した手段で返金します（1P＝1ウォン）。","曲パックの購入日から7日以内：手数料なしで返金します。","曲パックの購入日から7日経過後：返金額から10%以内の返金手数料を差し引きます（適用率は返金申請画面に表示）。ただし、7日を過ぎた有料ポイントと残り曲の合計が10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。10ウォン未満は返金しません。","アプリマーケットでチャージしたポイントで購入した曲パックの分は、そのマーケットの返金規定に従います。","再生が始まった曲は返金しません。","曲と曲パックに使ったポイントはウォレットに戻しません（再生が始まらなかった場合を除きます）。","返金申請中の残り曲は処理が終わるまで使用できません。"],"詳しくは返金規定に従います。"]},{"h":"第3条の2（ポイント）","b":["当社は、サービス内カラオケで使う前払いの「ポイント」を販売します。ポイントの使用と返金では1Pを1ウォンとして計算します。チャージ価格は決済手段ごとの購入画面に表示されたとおりです。","ポイントはログインしたアカウントのウォレット1つに記録され、ウェブと専用アプリで同じポイントをチャージ・使用します。","ポイントは、有料ポイント（利用者が決済でチャージしたポイント）と無料ポイント（チャージ特典・イベント・ランキング賞金・LIVEギフトの積立・補償など、決済なしで受け取ったポイント）に分けて記録します。","ポイントを使うときは、有料ポイントから（先にチャージしたものから）使い、その後に無料ポイントを使います。使用前に、使うポイントと使用後の残りポイントを画面に表示し、利用者の確認を受けます。ただし曲の再生は、初めて歌うときに使用額と残りを一度ご案内し、その後は緑の欄に残りを表示します。",["有料ポイント：有効期限はありません。","無料ポイント：付与日から1年間使用でき、有効期限を過ぎた無料ポイントは使用できません。"],["返金（購入日から7日以内）：未使用の有料ポイントは、一部を使っていても手数料なしで全額返金します。","返金（購入日から7日経過後）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します。適用する手数料率は返金申請画面に表示します。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","無料ポイントは返金の対象外で、返金処理時にあわせて消滅します。10ウォン未満は返金しません。"],"返金は「マイウォレット → 返金申請」またはカスタマーセンターで申請でき、当社が確認した後、決済した手段で返金します。返金申請中のポイントは処理が終わるまで使用できません。","Google Play・App Storeなどのアプリマーケットで購入したポイントの返金は、そのアプリマーケットの返金規定に従います。アプリマーケットで決済が取消・返金された場合、その決済でチャージされたポイント（一緒に付与された無料ポイントを含む）をウォレットから差し引き、すでに使用している場合はほかのポイントまたは以後チャージされるポイントから差し引きます。"]},{"h":"第3条の3（デコレーションアイテム）","b":["デコレーションショップのアイテムは、購入時刻から1日（24時間）、7日または30日間、保有・利用できます。","期間が終わるとアイテム箱から消え、引き続き使うには再度購入が必要です。","使用中のフェイスマスクはアプリを閉じて退出するまで利用できます。仲間だけカラオケの部屋に置いたアイテムは、期間が終わると消えます。","花束は1日（24時間）単位でのみ販売します。消耗品は購入時刻から24時間以内に使用しないと消えます。","フェイスマスクはデコレーションアイテムに含まれます。前面カメラで顔を見つけられないと画面がぼやけ、マスクとぼかしは録画と配信にそのまま残ります。"]},{"h":"第3条の4（リリース記念イベント）","b":[["リリース記念イベントの期間（リリース後1か月、期間は画面に表示）中は、アカウントごとに無料3曲を歌えます。","無料曲は再生が始まるときに1曲ずつ差し引かれます（第3条）。同じ再生は1回のみ差し引きます。","無料曲は返金も現金化もできず、イベント期間が終わると残りの無料曲は消えます。"]]},{"h":"第3条の5（部屋の利用料と部屋の削除）","b":[["仲間だけカラオケの部屋は、部屋主が作るときにポイントを1回使用します。","金額は使用前に画面に表示します。部屋の接続に失敗した場合は、使用したポイントをお返しします。","仲間だけカラオケの部屋は、作成日から3か月が過ぎると動画とともに自動で削除されます。","部屋主が部屋を削除すると、部屋の動画はすべてサーバーから削除され、復元できません。ただし、他の部屋にも投稿した動画はその部屋に残ります。"]]},{"h":"第3条の6（AI写真・動画）","b":[["AIシーン写真、AI集合写真、AI動画は有料で、金額は使用前に画面に表示します。","生成に失敗すると、使用したポイントを自動でお返しします。","AI動画を作ると、利用者が選んだ録画区間が外部のAI事業者に渡されます。"]]},{"h":"第3条の7（申込みの撤回と返金が制限されるサービス）","b":["デコレーションアイテム、部屋の開設（延長を含む）、AI写真・動画の生成、LIVE配信の差引は使用と同時に提供されるサービスのため、申込みの撤回と返金はできません。このことは使用前の確認画面に表示します。ただし提供に失敗した場合は、使用したポイントをお返しします。","再生が始まった曲も返金されません（第3条）。曲を読み込めず再生が始まらなかった場合は自動でお返しします。"]},{"h":"第4条（未成年者の利用）","b":["本サービスは満15歳以上の方が利用でき、満15歳未満の方は利用できません。この規約で青少年とは満15歳以上満19歳未満の人を、成人とは満19歳以上の人をいいます。年齢は生年月日を基準とする満年齢で韓国の日付により計算し、満19歳の誕生日から成人として扱います。","当社はサービス（アプリ）に入るときに携帯電話の本人認証で満15歳以上かを一度確認し、本人認証を済ませないとサービスを利用できません。認証結果のうち生年月日と性別のみ保存します。","青少年のポイントチャージは月200,000ウォンまでです。未成年者が法定代理人の同意なく行った決済は、未成年者本人または法定代理人が関係法令（韓国民法第5条など）に基づき取り消すことができ、当社は決済の取消・返金を関係法令に従って処理します。","「近くの歌友」と人探しでは、青少年は青少年同士だけ、成人は成人同士だけが互いに表示され、フォローでき、アプリ内の部屋への招待は相互フォローの友だち同士だけです（第13条の2）。","満15歳未満の方の利用が判明した場合、当社は利用を制限することがあります。"]},{"h":"第5条（曲の提供条件）","b":["曲の提供事情により、一部の曲が一覧から消えたり再生できなかったりすることがあります。","曲の一覧が変わっても残り曲とポイントはそのままです。"]},{"h":"第6条（アカウント削除時の残り曲・ポイント）","b":["アカウント削除の前に、返金規定に従って残り曲・ポイントの返金を申請できます。","有料ポイントと残り曲の返金はアカウント削除前に申請する必要があり、削除すると残りのポイントと残り曲は消滅します（第6条の2）。"]},{"h":"第6条の2（アカウント削除）","b":["利用者はアプリの「マイステージ → アカウント削除」からいつでもアカウントを削除できます。アプリを利用できない場合は、アカウント削除のご案内ページ（https://karaoke.moneypuzzle.co.kr/account-delete.html）または admin@moneypuzzle.co.kr からお申し込みいただけます。","削除すると、プロフィール・ID・フォロー関係・投稿動画とそのファイル・自分のコメント・作成した仲間だけカラオケ部屋とその動画・AI写真・ログイン記録・年齢認証の結果・同意記録・位置情報が削除され、残りのポイントと残り曲は消滅し、復元できません。同じGoogle・Appleアカウントで利用しているマネーパズルのツアーアプリのログイン記録とスポットのレビューも一緒に削除されます。","返金申請の処理中はアカウントを削除できません。有料ポイントと残り曲の返金は削除前に申請する必要があります。","決済・返金の記録は韓国「電子商取引等における消費者保護に関する法律」により、金額・日時・手段など最小限の内容で5年間保管し、制裁記録は異議処理と再入場防止に必要な期間、位置情報の利用・提供事実の確認資料は6か月間保管します。"]},{"h":"第7条（著作権および利用範囲）","b":["カラオケ動画とその中の伴奏・歌詞・映像の権利はクミョンエンターテインメントなど各権利者に、本サービスの画面・ロゴ・文章の権利は当社に帰属します。","利用者は本サービスを個人的に歌ったり楽しんだりする目的にのみ利用でき、サービスが提供する機能の外で動画・伴奏・歌詞を複製・配布・放送したり、店舗などで営利目的に利用したりしてはなりません。"]},{"h":"第8条（録音・録画物の投稿）","b":["この条項は、歌の録音・録画および「ステージ」「マイステージ」への投稿機能に適用されます。",["利用者が投稿した歌の声・映像の権利は利用者に帰属します。利用者は、当社がその歌をサービス内で表示し、サービスの宣伝に無償で使用することを許諾します。利用者が歌を削除すると、当社も使用を中止します。","録音・録画物に含まれる伴奏・歌詞の権利はクミョンエンターテインメントなどの権利者に帰属するため、サービスの外へダウンロードしたり、他の場所に投稿したりすることはできません。","歌を投稿できるのは本人認証（満15歳以上）を済ませた利用者だけです。ただし、投稿時の判定で問題が検知された青少年アカウントの動画や、未成年者が関わる可能性のある動画は投稿されません。","他人の顔・声を無断で含むもの、わいせつ・暴力・差別的な表現、暴言、他人の権利を侵害するもの、広告は投稿できません。","ステージは歌っている動画だけを投稿する場所です。歌っている動画でないものは、当社が予告なく削除することがあります。","通報があった場合や上記に該当する場合、当社はその歌を非表示または削除でき、繰り返す場合は投稿を制限できます。","利用者はいつでも自分の歌を削除でき、アカウントを削除すると投稿した歌も削除されます（第6条の2）。","シーン写真は利用者本人の録画映像からのみ作成し、一緒に写る他の人物はAIが作った架空の人物です。シーン写真には「AI生成」と表示されます。","AI集合写真は、仲間だけカラオケ部屋で「参加」を押した人の顔だけで作成し、「参加」を押すことが顔写真の利用への同意となります。参加時に撮影した顔写真は作成にだけ一時的に使い、作成後すぐ削除します。料金（5,000P）は始めた人が支払い、作成に失敗すると自動で返金されます。AI集合写真にも「AI生成」と表示されます。"]]},{"h":"第8条の2（LIVE配信）","b":["この条項はカラオケの「LIVE」機能に適用されます。",["LIVE配信を始められるのは本人認証した成人だけです。視聴・コメント・リアクションはサービスを利用できる利用者が行え、視聴にポイントは使われません。","配信者は配信中、視聴者1人が1時間視聴するごとに100Pを1分単位で負担します。当社は配信開始時にこれを画面で知らせ、残りポイントが0Pになると配信を自動で終了します。","曲が終わっても配信は続きます。配信者は3分以内に次の曲を選んで歌い続けることができ、選ばないと案内の30秒後に配信が終了します。","配信者は「観客」パネルで視聴者のニックネームと公開プロフィール写真を見ることができます。","視聴者は配信者にポイントでギフトを贈ることができます。ギフトの種類・価格と上限（1人1日500,000P）は画面の表示どおりで、青少年はギフトを贈れません。贈ったギフトは取消・返金できません。ただし関連法令により取り消せる場合を除きます。","配信者は受け取ったギフト金額の60%を無料ポイントとして受け取ります。積み立てたポイントの有効期間は積立日から1年で、サービス内でのみ使用でき、現金化や返金はできません。","ギフトに使った決済が取消・返金された場合、または不正決済と確認された場合、当社はそのギフトで配信者に積み立てたポイントを回収できます。すでに使用した場合は、以後の積立分から差し引くか、返還を請求することがあります。","配信でも、わいせつ・暴力・嫌悪表現、暴言、他人の権利侵害、広告は禁止します。当社は通報があった配信や違反した配信を予告なく終了でき、繰り返す場合は配信を制限できます。配信者は視聴者を退出させることができます。","当社は通報処理と紛争対応のため配信動画を非公開で30日間保管した後に削除し、保管動画は管理者のみが閲覧します。"]]},{"h":"第8条の3（ランキング表彰）","b":[["当社は全体公開の歌の動画を対象に週間・月間・年末（王中王）の順位を発表し、1位に賞金をポイントで支給します。基準と賞金はサービス画面の表示どおりです。","毎月最後の日曜日の週間賞金はその月の月間賞金に代え、12月の月間賞金は年末の王中王賞金に代えます。","賞金は無料ポイントとして自動で支給され、有効期間は支給日から1年です。返金や現金化はできません。","受賞者にはプロフィールの星が表示されます。週間・月間の星は年が変わると消え、王中王の星は残ります。","不正な方法で順位に影響を与えた動画は順位から除外することがあります。"]]},{"h":"第8条の4（自動監視）","b":["StageSongには音声と画面を確認する自動監視システムを設置しています。","LIVE配信：スマホ内の判定に加え、低解像度の画面と音声の断片をサーバーで判定します。判定に使った画面と音声は保存せず、コメントの暴言は伏せて表示します。","仲間だけカラオケ：ルームに投稿する動画は投稿動画と同じように判定します。アプリに初めて入るときに利用規約とあわせて同意します。","投稿動画：投稿時に画面の標本を判定し、タイトル・説明・コメントの暴言を確認します。問題があれば「自分のみ」で保存されます。","最初は画面を数秒隠してご案内します。確信度の高い検知が連続して繰り返された場合のみ、退室と24時間の利用制限を行います。音声・暴言の自動判定はご案内までです。ただし青少年アカウントは初回から、未成年者が関わる可能性のある場面は直ちに配信終了と利用制限を適用します。違反が繰り返される場合は、利用を永久に制限することがあります。","制限の案内にある「異議申し立て」を押すと当社が確認し、誤判定であれば制限を解除して使ったポイントを復旧します。途切れたLIVE配信で使ったポイントは無料ポイント（有効期間1年）としてお返しします。","自動判定には誤りがあり得るため、当社はしきい値を慎重に運用します。判定用の複製は保存しません。配信動画は第8条の2に従って別途保管します。未成年者が関わる可能性のある場面を検知すると、配信を直ちに終了し、その録画を削除します。"]},{"h":"第8条の5（通報とブロック）","b":["利用者は動画やコメントごとに「通報」で、わいせつ・暴言・嫌がらせ・著作権・その他の理由を選んで通報できます。同じ項目を通報できるのは1人1回までで、1日の通報回数には上限があります。","当社は通報を確認し、該当の動画やコメントを非表示にしたり削除したりでき、違反が繰り返される場合は利用を制限できます。","利用者は他の利用者のステージ・動画・コメントからその人をブロックできます。ブロックすると、お互いの動画とコメントがステージ一覧・人探し・近くの歌友に表示されなくなり、フォローが解除され、フォロー・コメント・部屋への招待ができなくなります。","ブロックは「マイステージ → ブロックリスト」で解除できます。"]},{"h":"第8条の6（プロフィールの公開）","b":["利用者のID、プロフィール写真、星、全体公開の動画、フォロワー数は他の利用者に公開されます。","他の利用者はIDで利用者を検索できます。検索と表示には第4条の区分とブロック（第8条の5）が適用されます。"]},{"h":"第9条（外部リンクの免責）","b":["本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。","カラオケ動画は外部の動画再生サービスと権利者が提供するもので、動画内の広告・内容・再生可否は当該サービスと権利者のポリシーに従います。"]},{"h":"第10条（利用者の義務および禁止行為）","b":["利用者は次の行為をしてはなりません。",["法令または公序良俗に反する行為","本サービスの正常な運営を妨げ、または無断でデータを収集する行為","他人の権利を侵害する行為"]]},{"h":"第11条（サービスの中断および点検）","b":["本サービスは年中無休・24時間の提供を原則とします。ただし点検・設備交換・障害の際は一時中断することがあり、事前に知らせることができる場合はサービス画面で事前にお知らせします。","当社の故意または過失により利用者に損害が生じた場合、当社は関係法令に従って賠償します。"]},{"h":"第12条（責任の限界）","b":["曲の提供事情により、一部の曲が再生できなかったり一覧が変わったりすることがあります。","当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]},{"h":"第13条（端末のアクセス権限）","b":["本サービスは、録画、LIVE、AI集合写真への参加など、その機能を使うときだけカメラとマイクを使います。初めて使うときにブラウザまたはアプリが許可を求め、許可しない場合はその機能だけが使えず、ほかの機能はそのまま使えます。","録画した動画は利用者の端末内に保存され、利用者が「自分の歌を投稿」で投稿を選んだ動画だけが当社に送信されます。ただし、LIVE配信、投稿判定の標本、AI生成に選んだ区間は、各条項に従って送信されます。","位置情報は「近くの歌友」で「自分の位置を表示」をオンにしたときだけ、おおよその位置(約1km)を使います。初めてオンにするときに位置情報の利用への同意をいただき、ブラウザまたはアプリが位置情報の権限を求めます(アプリはおおよその位置の権限のみ要求)。そのほかの端末アクセス権限は使わず、さらに必要になった場合は、必須権限と任意権限を分け、その理由とともに事前にお知らせし、同意を得ます（情報通信網法第22条の2）。"]},{"h":"第13条の2（位置基盤サービス — 近くの歌友）","b":["当社は韓国「位置情報の保護及び利用等に関する法律」に基づき位置基盤サービス事業を申告した事業者です（株式会社 부만(Booman Inc.)、申告第1866号）。","サービス内容：「近くの歌友」は、ログインして「自分の位置を表示」をオンにした利用者同士(本人認証はStageSongを最初に開くときに一度だけ行います)に互いの距離の区分(1km・3km・10km以内)と最近の全体公開の歌を表示し、視聴・いいね・コメント・フォローができるようにします。自分の位置をオンにしないと一覧も見られません。位置の利用は無料です。",["初めてオンにするときに位置情報の利用に同意する必要があり、当社は同意をアカウントごとに日時とともに記録します。","位置は約1km単位に丸めて保存し、正確な座標・住所は保存せず、ほかの利用者にも表示しません。","位置はオンの間のみ保管し、オフにしたとき、表示時間(オンにしてから15分、延長した場合はその時刻まで)が終わったとき、または同意を撤回したときに遅滞なく破棄します。","当社は位置情報の利用・提供事実の確認資料(利用日時・目的・アカウント)を自動で記録して6か月間保管した後、破棄します。","利用者はいつでも「自分の位置を表示」をオフにするか「位置情報の同意撤回」で同意を撤回でき、位置情報の利用・提供事実の確認資料の閲覧・告知と誤りの訂正を求めることができます。","当社は位置情報をほかの利用者に距離の区分としてのみ表示し、法令に基づく場合を除き、そのほかの第三者に提供しません。","一覧には本人認証の結果で年代と性別が表示されます（例：「20代・男性」、青少年は「10代」）。性別は常に表示され、正確な年齢・誕生日は表示しません。","青少年は青少年同士だけ、成人は成人同士だけが互いに一覧に表示され、フォローできます。","一覧は「すべて／相互フォロー／10代／20代／30〜40代／50代／60代以上」で絞り込めます。本人認証した女性は「女性にだけ自分の位置を表示」をオンにでき、オンにすると男性利用者とはお互いに一覧に表示されません。","「近くの歌友」では知らない人を部屋に招待できません。アプリ内で仲間だけカラオケ部屋に人を追加・招待できるのは、お互いにフォローしている「相互フォローの友だち」同士だけで、当社がこれを確認します。利用者がカカオトークなどで直接送る招待リンクはこれまでどおり使えます。","利用者は他の利用者をブロック・通報できます。ブロックするとお互いに一覧に表示されず、招待もやり取りできません。相互フォローの友だちへの招待は1日20回、保留中の招待は3件まで送れます。"],"位置情報管理責任者：Hwang Euiman（カスタマーセンター 010-4221-7066・admin@moneypuzzle.co.kr）","位置情報に関する紛争は、韓国放送メディア通信委員会または個人情報紛争調停委員会に調停を申請できます。当社の位置情報の取り扱いにより利用者に損害が生じた場合、当社は関係法令に従って賠償します。"]},{"h":"第14条（準拠法および管轄）","b":["当社と利用者の間で提起された訴訟には、大韓民国法を準拠法とします。","当社と利用者の間で生じた紛争に関する訴訟は、民事訴訟法上の管轄裁判所に提起します。","利用者が外国居住者である場合、当社と利用者の間で生じた紛争に関する訴訟は、前項にかかわらず大韓民国ソウル中央地方法院を専属管轄裁判所とします。ただし、消費者である利用者が法令に基づき他の裁判所に提起する権利は制限されません。"]},{"h":"第15条（お問い合わせ）","b":["本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]},{"h":"第16条（規約の変更）","b":["当社は規約を変更するとき、変更内容と適用日を適用日の7日前からサービス画面で告知します。利用者に不利な変更は適用日の30日前から告知します。","変更に同意しない利用者は、アカウントを削除して契約を解約できます。"]},{"h":"第17条（利用制限と契約の解約）","b":["当社は、利用者が本規約や法令に違反した場合、違反の程度に応じて投稿の非表示・削除、機能の制限、一時的または永久的な利用制限を行うことがあり、その理由を画面などでお知らせします。自動監視による制限は第8条の4に従います。","利用者はいつでもアカウントを削除して契約を解約できます（第6条の2）。残りの有料ポイントと残り曲の返金は返金規定に従います。"]},{"h":"第18条（サービスの終了）","b":["サービスを終了するときは30日前にお知らせし、残りの有料ポイントと残り曲を返金します。"]},{"h":"第19条（翻訳版）","b":["翻訳版と韓国語版が異なる場合は、韓国語版に従います。"]}]},"zhs":{"title":"使用条款","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本条款旨在规定 Booman Inc.（株式会社 부만，以下称“本公司”）提供的卡拉OK服务StageSong（Money Puzzle Karaoke，https://karaoke.moneypuzzle.co.kr，以下称“本服务”）的使用条件。"]},{"h":"第1条之2（进入时的同意）","b":["首次进入 StageSong 时，每个账号一次，依次进行：①年龄实名认证 ②逐项同意使用条款、退款规定、个人信息收集与使用和自动监测说明 ③同意位置服务的使用。","未同意②中所有必选项则无法使用本服务。③为可选项，不同意也可使用本服务，仅「附近歌友」无法使用。③可稍后在「附近歌友」中同意。","本公司按账号逐项记录同意时间和各文件的版本（生效日）。付费购买在付款时另行取得同意。"]},{"h":"第2条（服务内容）","b":["本服务提供以下内容：",["播放卡拉OK视频（按歌曲使用积分，或使用以付费积分购买的歌曲套餐）","销售卡拉OK积分（预付）及歌曲套餐（用付费积分购买）（销售方：本公司）","Google·Apple 账号登录及积分·剩余歌曲保存","卡拉OK LIVE直播、礼物和排名奖励"],"积分款项通过本公司签约的电子支付代理机构的支付页面或应用商店支付支付给本公司。本公司不直接接收或保存卡号等支付信息。"]},{"h":"第3条（歌曲使用与歌曲套餐）","b":["卡拉OK按歌曲使用。每首歌使用积分，价格以购买页面显示为准。","本公司销售由多首歌曲组成的「歌曲套餐」。歌曲套餐有多种规格，只能用付费积分购买，内容与价格以购买页面显示为准。购买的歌曲作为「剩余歌曲」记录在登录的账户中，没有有效期。 免费积分不能购买歌曲套餐，可在逐首播放歌曲时使用。","歌曲在开始播放时使用1首。播放1次即为1首，重复同一首歌时每次播放都使用1首。","使用顺序为：上线活动的免费歌曲、剩余歌曲、积分（付费积分优先）。余额不足时不会开始播放。","小圈子K歌、LIVE、挑战、接力和录像也适用同一规则：只有演唱者使用歌曲，观看和收听免费。LIVE直播按观众扣除的积分和礼物另行计算（第8条之2）。","歌曲加载失败而未开始播放时，已使用的歌曲将自动退回。",["剩余歌曲退款：未使用的剩余歌曲，按购买歌曲套餐时使用的付费积分部分除以歌曲数的金额，乘以未使用的歌曲数，退回原支付方式（1P = 1韩元）。","自歌曲套餐购买之日起7日内：免手续费退款。","自歌曲套餐购买之日起满7日后：从退款金额中扣除不超过10%的退款手续费（适用费率显示在退款申请页面）。但满7日的付费积分和剩余歌曲合计在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。不足10韩元的部分不予退还。","用应用商店充值的积分购买的歌曲套餐部分，按该商店的退款规定办理。","已开始播放的歌曲不予退款。","用于歌曲和歌曲套餐的积分不退回钱包（未开始播放的情况除外）。","申请退款中的剩余歌曲在处理完成前不能使用。"],"详情以退款规定为准。"]},{"h":"第3条之2（积分）","b":["本公司销售在服务内卡拉OK使用的预付“积分”。积分的使用和退款按1P等于1韩元计算。充值价格以各支付方式的购买页面显示为准。","积分记录在已登录账户的一个钱包中，网页和专用应用使用同一积分进行充值和使用。","积分分为付费积分（用户通过付款充值的积分）和免费积分（充值优惠、活动、排名奖金、LIVE礼物累积、补偿等未经付款获得的积分）分别记录。","使用积分时，先使用付费积分（按充值先后），再使用免费积分。使用前，页面会显示将使用的积分和使用后的剩余积分，并经用户确认。但歌曲播放仅在首次演唱时提示一次使用金额和余额，此后在绿色框中显示余额。",["付费积分：没有有效期。","免费积分：自赠送之日起1年内可用，过期的免费积分不能使用。"],["退款（购买之日起7日内）：未使用的付费积分，即使已使用部分，也免手续费全额退还。","退款（购买满7日后）：从剩余付费积分中扣除不超过10%的退款手续费后退还。适用的费率显示在退款申请页面。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","免费积分不予退款，并在退款处理时一并失效。不足10韩元的部分不予退还。"],"可通过“我的钱包 → 申请退款”或客服申请退款，经本公司确认后退回原支付方式。申请退款中的积分在处理完成前不能使用。","在 Google Play、App Store 等应用市场购买的积分，退款按该应用市场的退款规定办理。应用市场取消或退还付款时，将从钱包中扣除该笔付款充值的积分（含同时赠送的免费积分）；如已使用，则从其他积分或之后充值的积分中扣除。"]},{"h":"第3条之3（装饰道具）","b":["装饰商店的道具自购买时起可持有和使用1天（24小时）、7天或30天。","期限届满后，道具将从道具箱中消失，如需继续使用须重新购买。","正在使用的面具可使用至关闭并退出应用为止。放在小圈子K歌房的道具在期限届满后消失。","花束仅按1天（24小时）销售。消耗品自购买时起24小时内未使用的将消失。","面具属于装饰道具。前置摄像头找不到面部时画面会变模糊，面具和模糊效果会原样保留在录像和直播中。"]},{"h":"第3条之4（上线活动）","b":[["上线活动期间（上线后一个月，具体期间以页面显示为准），每个账号可演唱3首免费歌曲。","开始播放时扣除1首免费歌曲（第3条）。同一次播放只扣一次。","免费歌曲不可退款或兑换现金，活动结束后剩余的免费歌曲失效。"]]},{"h":"第3条之5（房间使用费与房间删除）","b":[["小圈子K歌房由房主在创建时使用一次积分。","金额在使用前显示在页面上。房间连接失败时退还所用积分。","小圈子K歌房自创建之日起满3个月后，连同视频自动删除。","房主删除房间后，房间内所有视频都将从服务器删除，且无法恢复。但同时发布到其他房间的视频仍保留在该房间。"]]},{"h":"第3条之6（AI 照片和视频）","b":[["AI 情景照片、AI 合影和 AI 视频为付费功能，金额在使用前显示在页面上。","生成失败时自动退还所用积分。","制作 AI 视频时，用户选择的录像片段会传送给外部 AI 服务商。"]]},{"h":"第3条之7（不可撤回和退款的服务）","b":["装饰道具、开设房间（含延长）、生成 AI 照片和视频、LIVE直播扣除属于使用即提供的服务，不可撤回或退款。此事项在使用前的确认页面上显示。但提供失败时，退还所用积分。","已开始播放的歌曲同样不予退款（第3条）。歌曲加载失败而未开始播放时，将自动退回。"]},{"h":"第4条（未成年人的使用）","b":["本服务供年满15周岁者使用，未满15周岁者不得使用。本条款中，青少年指年满15周岁未满19周岁的人，成年人指年满19周岁的人。年龄以出生日期为准按周岁、依韩国日期计算，自满19周岁生日起按成年人处理。","进入本服务（应用）时，本公司通过手机实名认证确认一次是否年满15周岁；未完成实名认证的，不能使用本服务。认证结果中仅保存出生日期和性别。","青少年每月最多可充值200,000韩元积分。未成年人未经法定代理人同意进行的支付，未成年人本人或其法定代理人可依相关法律（韩国《民法》第5条等）撤销，本公司依相关法律处理付款撤销·退款。","在「附近歌友」和找人功能中，青少年只能与青少年互相看到并关注，成年人只能与成年人互相看到并关注；应用内的房间邀请只能在互关好友之间进行（第13条之2）。","如发现未满15周岁者使用，本公司可以限制其使用。"]},{"h":"第5条（歌曲提供条件）","b":["根据歌曲提供情况，部分歌曲可能从列表中消失或无法播放。","即使歌曲列表变化，剩余歌曲和积分也保持不变。"]},{"h":"第6条（删除账号时的剩余歌曲·积分）","b":["删除账号前，可按退款规定申请剩余歌曲·积分的退款。","付费积分和剩余歌曲的退款须在删除账号前申请，删除后剩余积分和剩余歌曲失效（第6条之2）。"]},{"h":"第6条之2（删除账号）","b":["用户可随时在应用的「我的舞台 → 删除账号」中删除账号。无法使用应用时，可通过账号删除说明页面（https://karaoke.moneypuzzle.co.kr/account-delete.html）或 admin@moneypuzzle.co.kr 申请。","删除后，个人资料、ID、关注关系、已发布视频及其文件、你写的评论、你创建的小圈子K歌房及其视频、AI照片、登录记录、年龄认证结果、同意记录和位置信息都将被删除，剩余积分和剩余歌曲失效，且无法恢复。使用同一 Google 或 Apple 账号的 Money Puzzle 旅游应用的登录记录和景点评价也会一并删除。","退款申请处理期间不能删除账号。付费积分和剩余歌曲的退款须在删除前申请。","支付·退款记录依韩国《电子商务等消费者保护法》以金额、时间、方式等最少内容保存5年；处罚记录在申诉处理和防止再次进入所需期间内保存；位置信息使用·提供事实确认资料保存6个月。"]},{"h":"第7条（著作权及使用范围）","b":["卡拉OK视频及其中的伴奏、歌词、影像的权利归金永娱乐等各权利人所有，本服务的页面、标志、文字的权利归本公司所有。","用户只能为个人演唱和欣赏使用本服务，不得在服务提供的功能之外复制、传播、广播视频、伴奏或歌词，也不得在营业场所等以营利为目的使用。"]},{"h":"第8条（发布录音、录像）","b":["本条适用于录制歌曲及发布到「舞台」「我的舞台」的功能。",["用户发布的歌曲中声音、影像的权利归用户所有。用户允许本公司无偿在服务内展示这些歌曲并用于宣传服务。用户删除歌曲后，本公司也停止使用。","录音、录像中伴奏、歌词的权利归金永娱乐等权利人所有，因此不得下载到服务之外或发布到其他地方。","只有完成实名认证（年满15周岁）的用户才能发布歌曲。但发布时判定发现问题的青少年账号视频，或可能涉及未成年人的视频，不会发布。","不得发布未经许可含有他人面孔或声音的内容、淫秽、暴力或仇恨内容、辱骂、侵害他人权利的内容或广告。","舞台只用于发布唱歌的视频。不是唱歌视频的内容，本公司可不经通知予以删除。","收到举报或属于上述情形时，本公司可以隐藏或删除该歌曲，屡次违反的可限制发布。","用户可随时删除自己的歌曲，删除账号时已发布的歌曲也将删除（第6条之2）。","情景照片仅使用用户本人的录像制作，照片中的其他人物均为AI生成的虚拟人物。情景照片上会标示“AI生成”。","AI 合影仅使用在小圈子K歌房中点了「参加」的人的面部生成，点「参加」即表示同意使用面部照片。参加时拍摄的面部照片仅临时用于生成，生成后立即删除。费用（5,000P）由发起人支付，生成失败时自动退还。AI 合影同样标注「AI生成」。"]]},{"h":"第8条之2（LIVE直播）","b":["本条适用于卡拉OK的「LIVE」功能。",["只有完成实名认证的成年人才能开始LIVE直播。可使用服务的用户均可观看、评论和发表情，观看不使用积分。","主播在直播中按每位观众每小时100P、以分钟计算承担费用。本公司在开播时于画面告知，剩余积分为0P时自动结束直播。","歌曲结束后直播继续。主播可在3分钟内选择下一首歌接着唱；未选择时，提示后30秒结束直播。","主播可在「观众」面板查看观众的昵称和公开头像。","观众可用积分向主播赠送礼物。礼物种类、价格和限额（每人每天500,000P）以画面显示为准，青少年不能赠送礼物。已送出的礼物不可取消或退款，但依相关法令可取消的情形除外。","主播获得礼物金额60%的免费积分。这些积分的有效期为自累积之日起1年，只能在服务内使用，不能兑换现金或退款。","用于礼物的付款被取消、退款或被确认为欺诈付款时，本公司可以收回因该礼物计入主播的积分。如已使用，本公司可从之后累积的积分中扣除，或要求返还。","直播中同样禁止淫秽、暴力、仇恨内容、辱骂、侵害他人权利和广告。本公司可不经预告结束被举报或违规的直播，屡犯者可限制直播。主播可以请观众离开。","本公司为处理举报和应对纠纷，不公开保存直播视频30天后删除，保存的视频仅管理员可查看。"]]},{"h":"第8条之3（排名奖励）","b":[["本公司以公开歌曲视频为对象公布周榜、月榜和年终（总冠军）排名，并以积分向第一名发放奖金。标准和奖金以服务画面显示为准。","每月最后一个星期日的周榜奖金由当月月榜奖金代替，12月月榜奖金由年终总冠军奖金代替。","奖金以免费积分自动发放，有效期自发放日起1年，不可退款或兑换现金。","获奖者显示头像星星。周榜、月榜星星在换年时消失，总冠军星星保留。","以不正当方式影响排名的视频可从排名中排除。"]]},{"h":"第8条之4（自动监测）","b":["StageSong 设有声音和画面自动监测系统。","LIVE 直播：除手机内判定外，低分辨率画面和音频片段在服务器上判定。判定所用内容不保存，评论中的辱骂词会被遮挡。","小圈子K歌：上传到房间的视频按发布视频的方式判定。首次进入应用时与使用条款一并同意。","发布的视频：发布时抽取画面判定，并检查标题、说明和评论中的辱骂词。如有问题，视频将设为「仅自己可见」。","最初只会遮挡画面几秒并提示。只有高置信度的检测连续且反复出现时，才会移出房间并限制使用24小时。声音和辱骂的自动判定只做提示。但青少年账号从第一次起适用，可能涉及未成年人的画面将立即结束直播并限制使用。屡次违规的，可永久限制使用。","点限制提示中的「提出申诉」后由本公司核实；确认误判的，将解除限制并恢复所用积分。中断的LIVE直播所用积分以免费积分（有效期1年）退还。","自动判定可能出错，因此本公司以保守方式设置阈值。判定用副本不保存。直播视频依第8条之2另行保存。检测到可能涉及未成年人的画面时，立即结束直播并删除相应录像。"]},{"h":"第8条之5（举报与拉黑）","b":["用户可对每个视频和评论点「举报」，选择色情、辱骂、骚扰、版权或其他理由。同一内容每人只能举报一次，每天的举报次数有限制。","本公司确认举报后可隐藏或删除相关视频或评论，反复违规的可限制使用。","用户可在其他用户的舞台、视频或评论处拉黑对方。拉黑后，双方的视频和评论不再出现在舞台列表、找人和附近歌友中，关注会被解除，也无法互相关注、评论或邀请进房。","可在「我的舞台 → 黑名单」中解除拉黑。"]},{"h":"第8条之6（公开个人资料）","b":["用户的ID、头像、星星、公开视频和粉丝数向其他用户公开。","其他用户可以通过ID搜索用户。搜索和显示适用第4条的区分及拉黑（第8条之5）。"]},{"h":"第9条（外部链接免责）","b":["为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。","卡拉OK视频由外部视频播放服务及权利人提供，视频中的广告、内容及能否播放遵循相关服务及权利人的政策。"]},{"h":"第10条（用户义务及禁止行为）","b":["用户不得有下列行为：",["违反法律或公序良俗的行为","妨碍本服务正常运营或擅自收集数据的行为","侵害他人权利的行为"]]},{"h":"第11条（服务中断及维护）","b":["本服务原则上全年无休、24小时提供。但在维护、设备更换或故障时可能暂时中断，能够事先通知的，将在服务页面上提前通知。","因本公司故意或过失给用户造成损害的，本公司依相关法律赔偿。"]},{"h":"第12条（责任限制）","b":["根据歌曲提供情况，部分歌曲可能无法播放或列表可能变化。","对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]},{"h":"第13条（设备访问权限）","b":["本服务仅在使用录像、LIVE、参加 AI 合影等相应功能时使用相机和麦克风。首次使用时浏览器或应用会请求许可，不允许时只是无法使用该功能，其他功能照常可用。","录像保存在用户设备上，只有用户通过「发布我的歌」选择发布的视频才会发送给本公司。但LIVE直播、发布判定样本和选择用于 AI 生成的片段，依各条款传送。","仅在「附近歌友」中开启「显示我的位置」时使用大致位置(约1公里)。首次开启时征得位置信息使用同意，并由浏览器或应用请求位置权限(应用仅请求大致位置权限)。不使用其他设备访问权限；如需更多权限，将区分必要权限和可选权限，事先告知原因并征得同意（《信息通信网法》第22条之2）。"]},{"h":"第13条之2（位置服务 — 附近歌友）","b":["本公司已依韩国《位置信息保护及利用法》申报位置服务业务（株式会社 부만(Booman Inc.)，申报第1866号）。","服务内容：「附近歌友」向已登录并开启「显示我的位置」的用户(实名认证在首次打开 StageSong 时进行一次)互相显示距离区间(1公里·3公里·10公里以内)和最近公开的歌曲，并可观看、点赞、评论、关注。不开启自己的位置就无法查看列表。使用位置免费。",["首次开启时须同意使用位置信息，本公司按账号记录同意及时间。","位置约按1公里取整后保存，不保存精确坐标或地址，也不向其他用户显示。","位置仅在开启期间保存，关闭、显示时间(开启后15分钟，延长则至延长后的时间)结束或撤回同意后立即销毁。","本公司自动记录位置信息使用·提供事实确认资料(时间、目的、账号)，保存6个月后销毁。","用户可随时关闭「显示我的位置」或通过「撤回位置信息同意」撤回同意，并可要求查阅、告知位置信息使用·提供事实确认资料及更正错误。","本公司仅以距离区间向其他用户显示位置信息，除法律规定外不向其他第三方提供。","列表中会根据实名认证结果显示年龄段和性别（例如「20多岁 · 男」，青少年显示为「10多岁」）。性别始终显示，不显示确切年龄和生日。","青少年只能与青少年互相在列表中看到并关注，成年人只能与成年人互相看到并关注。","列表可按「全部 / 互关好友 / 10多岁 / 20多岁 / 30~40多岁 / 50多岁 / 60岁以上」筛选。完成实名认证的女性可开启「仅向女性显示我的位置」，开启后她与男性用户在列表中互相看不到。","「附近歌友」不能邀请陌生人进入房间。在应用内向小圈子K歌房添加或邀请他人，只能在互相关注的「互关好友」之间进行，本公司会对此进行确认。用户通过 KakaoTalk 等亲自发送的邀请链接照常可用。","用户可以屏蔽、举报其他用户。屏蔽后彼此在列表中看不到对方，也不能互发邀请。互关好友邀请每天最多20次，待回复的邀请最多3个。"],"位置信息管理负责人：Hwang Euiman（客服 010-4221-7066 · admin@moneypuzzle.co.kr）","与位置信息相关的纠纷，可向韩国放送媒体通信委员会或个人信息纠纷调解委员会申请调解。因本公司处理位置信息给用户造成损害的，本公司依相关法律赔偿。"]},{"h":"第14条（准据法及管辖）","b":["公司与用户之间提起的诉讼以大韩民国法律为准据法。","公司与用户之间发生争议的诉讼，向《民事诉讼法》规定的管辖法院提起。","用户为外国居住者时，尽管有前款规定，公司与用户之间发生争议的诉讼以大韩民国首尔中央地方法院为专属管辖法院。但作为消费者的用户依法向其他法院提起诉讼的权利不受限制。"]},{"h":"第15条（咨询）","b":["有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]},{"h":"第16条（条款的变更）","b":["本公司变更条款时，自适用日7日前起在服务页面公告变更内容和适用日。对用户不利的变更，自适用日30日前起公告。","不同意变更的用户可以删除账号以解除合同。"]},{"h":"第17条（使用限制与解除合同）","b":["用户违反本条款或法律时，本公司可根据违规程度隐藏或删除内容、限制功能、暂时或永久限制使用，并通过页面等方式告知理由。自动监测导致的限制依第8条之4办理。","用户可随时删除账号以解除合同（第6条之2）。剩余付费积分和剩余歌曲的退款依退款规定办理。"]},{"h":"第18条（服务终止）","b":["终止服务时，将提前30日通知并退还剩余付费积分和剩余歌曲。"]},{"h":"第19条（译本）","b":["译本与韩文版不一致时，以韩文版为准。"]}]},"zht":{"title":"使用條款","eff":"施行日期：2027年1月1日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1條（目的）","b":["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的卡拉OK服務StageSong（Money Puzzle Karaoke，https://karaoke.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]},{"h":"第1條之2（進入時的同意）","b":["首次進入 StageSong 時，每個帳號一次，依序進行：①年齡實名認證 ②逐項同意使用條款、退款規定、個人資料收集與使用和自動監測說明 ③同意位置服務的使用。","未同意②中所有必選項目則無法使用本服務。③為選擇項目，不同意也可使用本服務，僅「附近歌友」無法使用。③可稍後在「附近歌友」中同意。","本公司按帳號逐項記錄同意時間和各文件的版本（生效日）。付費購買在付款時另行取得同意。"]},{"h":"第2條（服務內容）","b":["本服務提供以下內容：",["播放卡拉OK影片（按歌曲使用點數，或使用以付費點數購買的歌曲套餐）","銷售卡拉OK點數（預付）及歌曲套餐（以付費點數購買）（銷售方：本公司）","Google·Apple 帳號登入及點數·剩餘歌曲保存","卡拉OK LIVE直播、禮物和排名獎勵"],"點數款項透過本公司簽約的電子支付代理機構的付款頁面或應用商店付款支付給本公司。本公司不直接接收或保存卡號等付款資訊。"]},{"h":"第3條（歌曲使用與歌曲套餐）","b":["卡拉OK按歌曲使用。每首歌使用點數，價格以購買頁面顯示為準。","本公司銷售由多首歌曲組成的「歌曲套餐」。歌曲套餐有多種規格，只能以付費點數購買，內容與價格以購買頁面顯示為準。購買的歌曲作為「剩餘歌曲」記錄於登入的帳戶中，沒有有效期。 免費點數不能購買歌曲套餐，可在逐首播放歌曲時使用。","歌曲於開始播放時使用1首。播放1次即為1首，重複同一首歌時每次播放都使用1首。","使用順序為：上線活動的免費歌曲、剩餘歌曲、點數（付費點數優先）。餘額不足時不會開始播放。","小圈子K歌、LIVE、挑戰、接力和錄影也適用同一規則：只有演唱者使用歌曲，觀看和收聽免費。LIVE直播按觀眾扣除的點數和禮物另行計算（第8條之2）。","歌曲載入失敗而未開始播放時，已使用的歌曲將自動退回。",["剩餘歌曲退款：未使用的剩餘歌曲，按購買歌曲套餐時使用的付費點數部分除以歌曲數的金額，乘以未使用的歌曲數，退回原付款方式（1P = 1韓元）。","自歌曲套餐購買之日起7日內：免手續費退款。","自歌曲套餐購買之日起滿7日後：從退款金額中扣除不超過10%的退款手續費（適用費率顯示在退款申請頁面）。但滿7日的付費點數和剩餘歌曲合計在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。未滿10韓元的部分不予退還。","以應用商店儲值的點數購買的歌曲套餐部分，依該商店的退款規定辦理。","已開始播放的歌曲不予退款。","用於歌曲和歌曲套餐的點數不退回錢包（未開始播放的情況除外）。","申請退款中的剩餘歌曲在處理完成前不能使用。"],"詳情以退款規定為準。"]},{"h":"第3條之2（點數）","b":["本公司銷售在服務內卡拉OK使用的預付「點數」。點數的使用與退款按1P等於1韓元計算。儲值價格以各付款方式的購買頁面顯示為準。","點數記錄在已登入帳戶的一個錢包中，網頁與專用應用程式使用同一點數儲值與使用。","點數分為付費點數（使用者付款儲值的點數）與免費點數（儲值優惠、活動、排名獎金、LIVE禮物累積、補償等未經付款取得的點數）分別記錄。","使用點數時，先使用付費點數（依儲值先後），再使用免費點數。使用前，頁面會顯示將使用的點數與使用後的剩餘點數，並經使用者確認。但歌曲播放僅在首次演唱時提示一次使用金額和餘額，此後在綠色框中顯示餘額。",["付費點數：沒有有效期。","免費點數：自贈送之日起1年內可用，過期的免費點數不能使用。"],["退款（購買之日起7日內）：未使用的付費點數，即使已使用部分，也免手續費全額退還。","退款（購買滿7日後）：從剩餘付費點數中扣除不超過10%的退款手續費後退還。適用的費率顯示在退款申請頁面。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","免費點數不予退款，並於退款處理時一併失效。未滿10韓元的部分不予退還。"],"可透過「我的錢包 → 申請退款」或客服申請退款，經本公司確認後退回原付款方式。申請退款中的點數在處理完成前不能使用。","在 Google Play、App Store 等應用程式市集購買的點數，退款依該市集的退款規定辦理。市集取消或退還付款時，將從錢包中扣除該筆付款儲值的點數（含同時贈送的免費點數）；如已使用，則從其他點數或之後儲值的點數中扣除。"]},{"h":"第3條之3（裝飾道具）","b":["裝飾商店的道具自購買時起可持有和使用1天（24小時）、7天或30天。","期限屆滿後，道具將從道具箱中消失，如需繼續使用須重新購買。","正在使用的面具可使用至關閉並退出應用程式為止。放在小圈子K歌房的道具在期限屆滿後消失。","花束僅按1天（24小時）銷售。消耗品自購買時起24小時內未使用者將消失。","面具屬於裝飾道具。前置鏡頭找不到臉部時畫面會變模糊，面具和模糊效果會原樣保留在錄影和直播中。"]},{"h":"第3條之4（上線活動）","b":[["上線活動期間（上線後一個月，具體期間以頁面顯示為準），每個帳號可演唱3首免費歌曲。","開始播放時扣除1首免費歌曲（第3條）。同一次播放只扣一次。","免費歌曲不可退款或兌換現金，活動結束後剩餘的免費歌曲失效。"]]},{"h":"第3條之5（房間使用費與房間刪除）","b":[["小圈子K歌房由房主在建立時使用一次點數。","金額於使用前顯示在頁面上。房間連線失敗時退還所用點數。","小圈子K歌房自建立之日起滿3個月後，連同影片自動刪除。","房主刪除房間後，房間內所有影片都將從伺服器刪除，且無法復原。但同時發布到其他房間的影片仍保留在該房間。"]]},{"h":"第3條之6（AI 照片和影片）","b":[["AI 情境照片、AI 合影和 AI 影片為付費功能，金額於使用前顯示在頁面上。","生成失敗時自動退還所用點數。","製作 AI 影片時，使用者選擇的錄影片段會傳送給外部 AI 服務商。"]]},{"h":"第3條之7（不可撤回和退款的服務）","b":["裝飾道具、開設房間（含延長）、生成 AI 照片和影片、LIVE直播扣除屬於使用即提供的服務，不可撤回或退款。此事項於使用前的確認頁面上顯示。但提供失敗時，退還所用點數。","已開始播放的歌曲同樣不予退款（第3條）。歌曲載入失敗而未開始播放時，將自動退回。"]},{"h":"第4條（未成年人的使用）","b":["本服務供年滿15歲者使用，未滿15歲者不得使用。本條款中，青少年指年滿15歲未滿19歲之人，成年人指年滿19歲之人。年齡以出生日期為準按實足年齡、依韓國日期計算，自滿19歲生日起按成年人處理。","進入本服務（應用程式）時，本公司透過手機實名認證確認一次是否年滿15歲；未完成實名認證者，不能使用本服務。認證結果中僅儲存出生日期和性別。","青少年每月最多可儲值200,000韓元點數。未成年人未經法定代理人同意所為之付款，未成年人本人或其法定代理人得依相關法令（韓國《民法》第5條等）撤銷，本公司依相關法令處理付款撤銷·退款。","在「附近歌友」和找人功能中，青少年只能與青少年互相看到並追蹤，成年人只能與成年人互相看到並追蹤；應用程式內的房間邀請只能在互追好友之間進行（第13條之2）。","如發現未滿15歲者使用，本公司得限制其使用。"]},{"h":"第5條（歌曲提供條件）","b":["依歌曲提供情況，部分歌曲可能從清單中消失或無法播放。","即使歌曲清單變動，剩餘歌曲和點數亦維持不變。"]},{"h":"第6條（刪除帳號時的剩餘歌曲·點數）","b":["刪除帳號前，可依退款規定申請剩餘歌曲·點數的退款。","付費點數和剩餘歌曲的退款須於刪除帳號前申請，刪除後剩餘點數和剩餘歌曲失效（第6條之2）。"]},{"h":"第6條之2（刪除帳號）","b":["使用者可隨時在應用程式的「我的舞台 → 刪除帳號」中刪除帳號。無法使用應用程式時，可透過帳號刪除說明頁面（https://karaoke.moneypuzzle.co.kr/account-delete.html）或 admin@moneypuzzle.co.kr 申請。","刪除後，個人資料、ID、追蹤關係、已發布影片及其檔案、你寫的留言、你建立的小圈子K歌房及其影片、AI照片、登入記錄、年齡認證結果、同意記錄和位置資訊都將被刪除，剩餘點數和剩餘歌曲失效，且無法復原。使用同一 Google 或 Apple 帳號的 Money Puzzle 旅遊應用程式的登入記錄和景點評價也會一併刪除。","退款申請處理期間不能刪除帳號。付費點數和剩餘歌曲的退款須在刪除前申請。","付款·退款記錄依韓國《電子商務等消費者保護法》以金額、時間、方式等最少內容保存5年；處分記錄在申訴處理和防止再次進入所需期間內保存；位置資訊使用·提供事實確認資料保存6個月。"]},{"h":"第7條（著作權及使用範圍）","b":["卡拉OK影片及其中的伴奏、歌詞、影像的權利歸金永娛樂等各權利人所有，本服務的頁面、標誌、文字的權利歸本公司所有。","使用者僅能為個人演唱和欣賞使用本服務，不得於服務提供的功能之外重製、散布、播送影片、伴奏或歌詞，亦不得於營業場所等以營利為目的使用。"]},{"h":"第8條（發布錄音、錄影）","b":["本條適用於錄製歌曲及發布到「舞台」「我的舞台」的功能。",["使用者發布的歌曲中聲音、影像的權利歸使用者所有。使用者同意本公司無償於服務內展示該等歌曲並用於宣傳服務。使用者刪除歌曲後，本公司亦停止使用。","錄音、錄影中伴奏、歌詞的權利歸金永娛樂等權利人所有，因此不得下載至服務之外或發布到其他地方。","只有完成實名認證（年滿15歲）的使用者才能發布歌曲。但發布時判定發現問題的青少年帳號影片，或可能涉及未成年人的影片，不會發布。","不得發布未經許可含有他人面孔或聲音的內容、猥褻、暴力或仇恨內容、辱罵、侵害他人權利的內容或廣告。","舞台僅用於發布唱歌的影片。非唱歌影片的內容，本公司得不經通知予以刪除。","收到檢舉或屬上述情形時，本公司得隱藏或刪除該歌曲，屢次違反者得限制發布。","使用者可隨時刪除自己的歌曲，刪除帳號時已發布的歌曲亦將刪除（第6條之2）。","情境照片僅使用使用者本人的錄影製作，照片中的其他人物均為AI生成的虛擬人物。情境照片上會標示「AI生成」。","AI 合影僅使用在小圈子K歌房中點了「參加」的人的臉部生成，點「參加」即表示同意使用臉部照片。參加時拍攝的臉部照片僅暫時用於生成，生成後立即刪除。費用（5,000P）由發起人支付，生成失敗時自動退還。AI 合影同樣標註「AI生成」。"]]},{"h":"第8條之2（LIVE直播）","b":["本條適用於卡拉OK的「LIVE」功能。",["只有完成實名認證的成年人才能開始LIVE直播。可使用服務的使用者均可觀看、留言和發表情，觀看不使用點數。","主播在直播中按每位觀眾每小時100P、以分鐘計算負擔費用。本公司在開播時於畫面告知，剩餘點數為0P時自動結束直播。","歌曲結束後直播繼續。主播可於3分鐘內選擇下一首歌接著唱；未選擇時，提示後30秒結束直播。","主播可在「觀眾」面板查看觀眾的暱稱和公開頭像。","觀眾可用點數向主播贈送禮物。禮物種類、價格和限額（每人每天500,000P）以畫面顯示為準，青少年不能贈送禮物。已送出的禮物不可取消或退款，但依相關法令可取消的情形除外。","主播獲得禮物金額60%的免費點數。這些點數的有效期為自累積之日起1年，只能在服務內使用，不能兌換現金或退款。","用於禮物的付款被取消、退款或被確認為詐欺付款時，本公司得收回因該禮物計入主播的點數。如已使用，本公司可從之後累積的點數中扣除，或要求返還。","直播中同樣禁止猥褻、暴力、仇恨內容、辱罵、侵害他人權利和廣告。本公司可不經預告結束被檢舉或違規的直播，屢犯者可限制直播。主播可以請觀眾離開。","本公司為處理檢舉和應對糾紛，不公開保存直播影片30天後刪除，保存的影片僅管理員可查看。"]]},{"h":"第8條之3（排名獎勵）","b":[["本公司以公開歌曲影片為對象公布週榜、月榜和年終（總冠軍）排名，並以點數向第一名發放獎金。標準和獎金以服務畫面顯示為準。","每月最後一個星期日的週榜獎金由當月月榜獎金代替，12月月榜獎金由年終總冠軍獎金代替。","獎金以免費點數自動發放，有效期自發放日起1年，不可退款或兌換現金。","得獎者顯示頭像星星。週榜、月榜星星在換年時消失，總冠軍星星保留。","以不正當方式影響排名的影片可從排名中排除。"]]},{"h":"第8條之4（自動監測）","b":["StageSong 設有聲音和畫面自動監測系統。","LIVE 直播：除手機內判定外，低解析度畫面和音訊片段在伺服器上判定。判定所用內容不儲存，留言中的辱罵詞會被遮擋。","小圈子K歌：上傳到房間的影片按發布影片的方式判定。首次進入應用程式時與使用條款一併同意。","發布的影片：發布時抽取畫面判定，並檢查標題、說明和留言中的辱罵詞。如有問題，影片將設為「僅自己可見」。","最初只會遮擋畫面幾秒並提示。只有高信賴度的偵測連續且反覆出現時，才會移出房間並限制使用24小時。聲音和辱罵的自動判定只做提示。但青少年帳號從第一次起適用，可能涉及未成年人的畫面將立即結束直播並限制使用。屢次違規者，得永久限制使用。","點限制提示中的「提出申訴」後由本公司確認；確認誤判者，將解除限制並恢復所用點數。中斷的LIVE直播所用點數以免費點數（有效期1年）退還。","自動判定可能出錯，因此本公司以保守方式設定閾值。判定用副本不儲存。直播影片依第8條之2另行保存。偵測到可能涉及未成年人的畫面時，立即結束直播並刪除相應錄影。"]},{"h":"第8條之5（檢舉與封鎖）","b":["使用者可對每部影片和留言點「檢舉」，選擇色情、辱罵、騷擾、著作權或其他理由。同一內容每人只能檢舉一次，每天的檢舉次數有限制。","本公司確認檢舉後可隱藏或刪除相關影片或留言，反覆違規者可限制使用。","使用者可在其他使用者的舞台、影片或留言處封鎖對方。封鎖後，雙方的影片和留言不再出現在舞台列表、找人和附近歌友中，追蹤會被解除，也無法互相追蹤、留言或邀請進房。","可在「我的舞台 → 封鎖名單」中解除封鎖。"]},{"h":"第8條之6（公開個人資料）","b":["使用者的ID、頭像、星星、公開影片和粉絲數向其他使用者公開。","其他使用者可以透過ID搜尋使用者。搜尋和顯示適用第4條的區分及封鎖（第8條之5）。"]},{"h":"第9條（外部連結免責）","b":["為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。","卡拉OK影片由外部影片播放服務及權利人提供，影片中的廣告、內容及能否播放依循相關服務及權利人的政策。"]},{"h":"第10條（使用者義務及禁止行為）","b":["使用者不得有下列行為：",["違反法律或公序良俗的行為","妨礙本服務正常運營或擅自蒐集資料的行為","侵害他人權利的行為"]]},{"h":"第11條（服務中斷及維護）","b":["本服務原則上全年無休、24小時提供。但於維護、設備更換或故障時可能暫時中斷，能事先通知者，將於服務頁面提前通知。","因本公司故意或過失致使用者受有損害者，本公司依相關法令賠償。"]},{"h":"第12條（責任限制）","b":["依歌曲提供情況，部分歌曲可能無法播放或清單可能變動。","對於天災、外部 API·通訊故障等超出本公司合理控制範圍的事由所致損害，本公司不承擔責任。"]},{"h":"第13條（裝置存取權限）","b":["本服務僅在使用錄影、LIVE、參加 AI 合影等相應功能時使用相機和麥克風。首次使用時瀏覽器或應用程式會請求許可，不允許時僅無法使用該功能，其他功能照常可用。","錄影保存在使用者裝置上，只有使用者透過「發布我的歌」選擇發布的影片才會傳送給本公司。但LIVE直播、發布判定樣本和選擇用於 AI 生成的片段，依各條款傳送。","僅在「附近歌友」中開啟「顯示我的位置」時使用大致位置(約1公里)。首次開啟時取得位置資訊使用同意，並由瀏覽器或應用程式請求位置權限(應用程式僅請求大致位置權限)。不使用其他裝置存取權限；如需更多權限，將區分必要權限與選擇權限，事先告知原因並取得同意（《資訊通信網法》第22條之2）。"]},{"h":"第13條之2（位置服務 — 附近歌友）","b":["本公司已依韓國《位置資訊保護及利用法》申報位置服務業務（株式會社 부만(Booman Inc.)，申報第1866號）。","服務內容：「附近歌友」向已登入並開啟「顯示我的位置」的使用者(實名認證在首次開啟 StageSong 時進行一次)互相顯示距離區間(1公里·3公里·10公里以內)和最近公開的歌曲，並可觀看、按讚、留言、追蹤。不開啟自己的位置就無法查看列表。使用位置免費。",["首次開啟時須同意使用位置資訊，本公司按帳號記錄同意及時間。","位置約按1公里取整後儲存，不儲存精確座標或地址，也不向其他使用者顯示。","位置僅在開啟期間保存，關閉、顯示時間(開啟後15分鐘，延長則至延長後的時間)結束或撤回同意後立即銷毀。","本公司自動記錄位置資訊使用·提供事實確認資料(時間、目的、帳號)，保存6個月後銷毀。","使用者可隨時關閉「顯示我的位置」或透過「撤回位置資訊同意」撤回同意，並可要求查閱、告知位置資訊使用·提供事實確認資料及更正錯誤。","本公司僅以距離區間向其他使用者顯示位置資訊，除法律規定外不向其他第三方提供。","列表中會依實名認證結果顯示年齡層和性別（例如「20多歲 · 男」，青少年顯示為「10多歲」）。性別一律顯示，不顯示確切年齡和生日。","青少年只能與青少年互相在列表中看到並追蹤，成年人只能與成年人互相看到並追蹤。","列表可依「全部 / 互追好友 / 10多歲 / 20多歲 / 30~40多歲 / 50多歲 / 60歲以上」篩選。完成實名認證的女性可開啟「僅向女性顯示我的位置」，開啟後她與男性使用者在列表中互相看不到。","「附近歌友」不能邀請陌生人進入房間。在應用程式內向小圈子K歌房新增或邀請他人，只能在互相追蹤的「互追好友」之間進行，本公司會對此進行確認。使用者透過 KakaoTalk 等親自傳送的邀請連結照常可用。","使用者可以封鎖、檢舉其他使用者。封鎖後彼此在列表中看不到對方，也不能互發邀請。互追好友邀請每天最多20次，待回覆的邀請最多3個。"],"位置資訊管理負責人：Hwang Euiman（客服 010-4221-7066 · admin@moneypuzzle.co.kr）","與位置資訊相關的糾紛，可向韓國放送媒體通信委員會或個人資料糾紛調解委員會申請調解。因本公司處理位置資訊對使用者造成損害的，本公司依相關法律賠償。"]},{"h":"第14條（準據法及管轄）","b":["公司與使用者之間提起的訴訟以大韓民國法律為準據法。","公司與使用者之間發生爭議的訴訟，向《民事訴訟法》規定的管轄法院提起。","使用者為外國居住者時，儘管有前款規定，公司與使用者之間發生爭議的訴訟以大韓民國首爾中央地方法院為專屬管轄法院。但作為消費者的使用者依法向其他法院提起訴訟的權利不受限制。"]},{"h":"第15條（諮詢）","b":["有關本服務使用的諮詢，請聯絡客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）。"]},{"h":"第16條（條款的變更）","b":["本公司變更條款時，自適用日7日前起於服務頁面公告變更內容和適用日。對使用者不利的變更，自適用日30日前起公告。","不同意變更的使用者得刪除帳號以終止契約。"]},{"h":"第17條（使用限制與終止契約）","b":["使用者違反本條款或法令時，本公司得依違規程度隱藏或刪除內容、限制功能、暫時或永久限制使用，並透過頁面等方式告知理由。自動監測導致的限制依第8條之4辦理。","使用者可隨時刪除帳號以終止契約（第6條之2）。剩餘付費點數和剩餘歌曲的退款依退款規定辦理。"]},{"h":"第18條（服務終止）","b":["終止服務時，將提前30日通知並退還剩餘付費點數和剩餘歌曲。"]},{"h":"第19條（譯本）","b":["譯本與韓文版不一致時，以韓文版為準。"]}]},"es":{"title":"Términos de Servicio","eff":"Fecha de entrada en vigor: 1 de enero de 2027","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"Artículo 1 (Objeto)","b":["Estos Términos regulan el uso del servicio de karaoke StageSong (Money Puzzle Karaoke, https://karaoke.moneypuzzle.co.kr, «el Servicio») prestado por Booman Inc. («la Empresa»)."]},{"h":"Artículo 1-2 (Aceptación al entrar)","b":["La primera vez que entras en StageSong, una vez por cuenta, se sigue este orden: (1) verificación de edad, (2) aceptación, punto por punto, de estos Términos, la Política de reembolso, la recogida y uso de datos personales y el aviso de supervisión automática, y (3) consentimiento para el servicio basado en la ubicación.","Si no aceptas todos los puntos obligatorios de (2), no puedes usar el Servicio. (3) es opcional: sin él puedes usar el Servicio, salvo «Cantantes cerca». Puedes dar tu consentimiento a (3) más tarde en «Cantantes cerca».","La Empresa registra por cuenta y por punto la hora de la aceptación y la versión (fecha de entrada en vigor) de cada documento. Las compras de pago se aceptan por separado en el momento del pago."]},{"h":"Artículo 2 (El Servicio)","b":["El Servicio ofrece:",["Reproducción de vídeos de karaoke (con puntos por canción o paquetes de canciones comprados con puntos de pago)","Venta de puntos de karaoke prepagados y de paquetes de canciones comprados con puntos de pago (vendedor: la Empresa)","Inicio de sesión con Google o Apple y conservación de tus puntos y canciones restantes","Emisiones LIVE de karaoke, regalos y premios de ranking"],"El pago de los puntos se hace a la Empresa a través de la ventana de pago de su pasarela contratada o del cobro de la tienda de apps. La Empresa no recibe ni guarda números de tarjeta u otros datos de pago."]},{"h":"Artículo 3 (Uso de canciones y paquetes)","b":["El karaoke se usa por canciones. Cada canción usa puntos, y el precio es el que muestra la pantalla de compra.","La Empresa vende «paquetes de canciones» con varias canciones. Hay paquetes de canciones de varios tamaños, se compran solo con puntos de pago, y su contenido y precio son los que muestra la pantalla de compra. Las canciones compradas se registran en la cuenta con la que inicias sesión como «canciones restantes» y no caducan. Los puntos gratuitos no sirven para comprar paquetes de canciones; se pueden usar para reproducir canciones una a una.","Se usa una canción cuando empieza la reproducción. Una reproducción es un uso, y repetir la misma canción usa una canción cada vez.","El orden de uso es: canciones gratis del evento de lanzamiento, canciones restantes y puntos (primero los puntos de pago). Si el saldo no alcanza, la reproducción no empieza.","La misma regla se aplica a Solo nosotros Karaoke, LIVE, Reto, Relevo y la grabación: solo usa una canción quien canta; ver y escuchar es gratis. El descuento de puntos por espectador de las emisiones LIVE y los regalos son aparte (artículo 8-2).","Si una canción no se carga y la reproducción no empieza, se devuelve automáticamente.",["Reembolso de canciones restantes: las canciones restantes no usadas se reembolsan a tu medio de pago original por su valor pagado, es decir, la parte de puntos de pago del paquete de canciones dividida entre su número de canciones, por cada canción no usada (1P = ₩1).","En los 7 días siguientes a la compra del paquete: se reembolsa sin comisión.","Pasados 7 días desde la compra del paquete: se descuenta una comisión de reembolso de hasta el 10% (la tasa aplicada se muestra en la pantalla de solicitud). No obstante, si los puntos de pago y las canciones restantes con más de 7 días suman 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso. No se reembolsan importes inferiores a ₩10.","La parte de un paquete de canciones comprada con puntos recargados en una tienda de apps sigue la política de esa tienda.","Las canciones cuya reproducción ya empezó no se reembolsan.","Los puntos usados en canciones y paquetes de canciones no se devuelven al monedero, salvo si la reproducción no empezó.","Las canciones restantes con una solicitud de reembolso en curso no pueden usarse hasta que se procese."],"Los detalles siguen la Política de reembolso."]},{"h":"Artículo 3-2 (Puntos)","b":["La Empresa vende «puntos» prepagados para el karaoke del Servicio. Para usar y reembolsar puntos, 1P se calcula como ₩1. Los precios de recarga son los que muestra la pantalla de compra de cada medio de pago.","Los puntos se registran en un único monedero de tu cuenta con sesión iniciada, y los mismos puntos se recargan y usan en la web y en la app propia.","Los puntos se registran por separado como puntos de pago (recargados con tu pago) y puntos gratuitos (recibidos sin pago, como bonificaciones de recarga, eventos, premios de ranking, abonos de regalos de LIVE y compensaciones).","Al usar puntos, primero se usan los de pago (los recargados antes primero) y después los gratis. Antes de cualquier uso, la pantalla muestra los puntos que se usarán y el saldo restante, y pide tu confirmación. En la reproducción de canciones, el importe y el saldo se muestran una vez, la primera vez que cantas, y después el saldo aparece en el recuadro verde.",["Puntos de pago: no caducan.","Puntos gratuitos: pueden usarse durante 1 año desde la fecha de entrega. Los puntos gratuitos caducados no pueden usarse."],["Reembolso (en los 7 días siguientes a la compra): los puntos de pago no usados se reembolsan íntegros sin comisión, aunque hayas usado una parte.","Reembolso (pasados 7 días): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10%. La tasa aplicada se muestra en la pantalla de solicitud de reembolso. No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Los puntos gratuitos no son reembolsables y caducan al procesar un reembolso. No se reembolsan importes inferiores a ₩10."],"Puedes solicitar el reembolso en «Mi monedero > Solicitar reembolso» o a través de Atención al cliente. Tras revisarlo, la Empresa reembolsa al medio de pago utilizado. Los puntos con una solicitud de reembolso en curso no pueden usarse hasta que se procese.","Los reembolsos de puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda. Si la tienda cancela o reembolsa el pago, los puntos de ese pago (incluidos los puntos gratuitos entregados con él) se descuentan de tu monedero; si ya se usaron, se descuentan de otros puntos o de recargas posteriores."]},{"h":"Artículo 3-3 (Artículos de decoración)","b":["Los artículos de la tienda de decoración se pueden tener y usar durante 1 día (24 horas), 7 días o 30 días desde la hora de compra.","Al terminar el periodo desaparecen de Mis artículos y, para seguir usándolos, hay que volver a comprarlos.","Una máscara facial en uso se puede usar hasta cerrar y salir de la app. Los artículos colocados en una sala Solo nosotros Karaoke desaparecen al terminar su periodo.","Los ramos solo se venden por 1 día (24 horas). Los consumibles desaparecen si no se usan en las 24 horas siguientes a la compra.","Las máscaras faciales son artículos de decoración. Si la cámara frontal no encuentra tu cara, la imagen se difumina. Las máscaras y el difuminado quedan tal cual en las grabaciones y emisiones."]},{"h":"Artículo 3-4 (Evento de lanzamiento)","b":[["Durante el evento de lanzamiento (un mes tras el lanzamiento; el periodo se muestra en pantalla), cada cuenta puede cantar 3 canciones gratis.","Se descuenta una canción gratis cuando empieza la reproducción (artículo 3). Una misma reproducción solo se descuenta una vez.","Las canciones gratis no se reembolsan ni se cambian por dinero, y las que queden al terminar el evento desaparecen."]]},{"h":"Artículo 3-5 (Tarifas y eliminación de salas)","b":[["Una sala Solo nosotros Karaoke usa puntos una vez, cuando la crea su propietario.","El importe se muestra en pantalla antes de usarlo. Si la sala no logra conectarse, se devuelven los puntos usados.","Una sala Solo nosotros Karaoke se elimina automáticamente con sus vídeos 3 meses después de crearse.","Si el propietario elimina una sala, todos sus vídeos se borran del servidor y no se pueden recuperar. Los vídeos publicados también en otra sala permanecen en esa sala."]]},{"h":"Artículo 3-6 (Fotos y vídeos con IA)","b":[["Las fotos de escena con IA, las fotos de grupo con IA y los vídeos con IA son de pago, y el importe se muestra en pantalla antes de usarlos.","Si la creación falla, los puntos usados se devuelven automáticamente.","Al crear un vídeo con IA, el tramo de grabación que elijas se envía a un proveedor externo de IA."]]},{"h":"Artículo 3-7 (Servicios sin desistimiento ni reembolso)","b":["Los artículos de decoración, la creación de salas (incluidas las ampliaciones), la creación de fotos y vídeos con IA y los descuentos por emisiones LIVE se prestan en el momento de usarlos, por lo que no admiten desistimiento ni reembolso. Esto se indica en la pantalla de confirmación antes del uso. No obstante, si la prestación falla, se devuelven los puntos usados.","Las canciones cuya reproducción ya empezó tampoco se reembolsan (artículo 3). Si una canción no se carga y la reproducción no empieza, se devuelve automáticamente."]},{"h":"Artículo 4 (Uso por menores)","b":["El Servicio es para personas de 15 años o más. Los menores de 15 años no pueden usarlo. En estos Términos, menor significa una persona de 15 años o más y menos de 19, y adulto una persona de 19 años o más. La edad se cuenta en años cumplidos desde la fecha de nacimiento, según la fecha de Corea, y se te trata como adulto desde tu 19.º cumpleaños.","Al entrar en el Servicio (app), la Empresa comprueba una vez, mediante verificación de identidad por móvil, que tienes 15 años o más. Sin completar la verificación de identidad no puedes usar el Servicio. Del resultado solo guardamos la fecha de nacimiento y el sexo.","Los menores pueden recargar hasta 200.000 KRW en puntos al mes. Un pago hecho por un menor sin el consentimiento de su representante legal puede ser anulado por el menor o por su representante legal según la ley aplicable (como el artículo 5 del Código Civil coreano), y la Empresa tramita esas anulaciones y reembolsos conforme a dicha ley.","En «Cantantes cerca» y en la búsqueda de personas, los menores solo ven y siguen a menores, y los adultos solo a adultos; las invitaciones a salas dentro de la app solo son posibles entre amigos mutuos (artículo 13-2).","Si se detecta el uso por una persona menor de 15 años, la Empresa puede restringirlo."]},{"h":"Artículo 5 (Disponibilidad de canciones)","b":["Según la disponibilidad de las canciones, algunas pueden desaparecer de la lista o no reproducirse.","Aunque cambie la lista, tus canciones restantes y tus puntos se mantienen."]},{"

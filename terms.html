h":"Artículo 6 (Canciones restantes y puntos al eliminar la cuenta)","b":["Antes de eliminar tu cuenta, puedes pedir el reembolso de tus canciones restantes y puntos según la Política de reembolso.","El reembolso de los puntos de pago y las canciones restantes debe solicitarse antes de eliminar la cuenta; al eliminarla, los puntos y las canciones restantes caducan (artículo 6-2)."]},{"h":"Artículo 6-2 (Eliminar la cuenta)","b":["Puedes eliminar tu cuenta en cualquier momento en la app, en «Mi escenario → Eliminar cuenta». Si no puedes usar la app, puedes solicitarlo en la página de eliminación de cuenta (https://karaoke.moneypuzzle.co.kr/account-delete.html) o en admin@moneypuzzle.co.kr.","Al eliminarla se borran tu perfil, ID, seguimientos, vídeos publicados y sus archivos, tus comentarios, las salas Solo nosotros Karaoke que creaste y sus vídeos, fotos con IA, registro de inicio de sesión, resultado de la verificación de edad, registros de consentimiento y datos de ubicación. Tus puntos y canciones restantes caducan y nada de esto se puede recuperar. También se borran el registro de inicio de sesión y las reseñas de lugares de la app de viajes Money Puzzle usada con la misma cuenta de Google o Apple.","No se puede eliminar una cuenta mientras se tramita una solicitud de reembolso. Los reembolsos de puntos de pago y canciones restantes deben pedirse antes de eliminarla.","Los registros de pagos y reembolsos se conservan 5 años en forma mínima (importe, hora, medio, etc.) según la ley coreana de protección del consumidor en el comercio electrónico. Los registros de sanciones se conservan el tiempo necesario para las reclamaciones y para impedir el reingreso, y los registros de uso de la ubicación, 6 meses."]},{"h":"Artículo 7 (Derechos de autor y alcance de uso)","b":["Los derechos de los vídeos de karaoke y del acompañamiento, letras e imágenes que contienen pertenecen a Kumyoung Entertainment y otros titulares. Los derechos de las pantallas, logotipos y textos del Servicio pertenecen a la Empresa.","Solo puedes usar el Servicio para cantar y escuchar de forma personal. Fuera de las funciones que ofrece el Servicio, no puedes copiar, distribuir ni emitir los vídeos, acompañamientos o letras, ni usarlos con fines de lucro, por ejemplo en un negocio."]},{"h":"Artículo 8 (Publicación de grabaciones)","b":["Este artículo se aplica a grabar canciones y publicarlas en «Escenario» y «Mi escenario».",["Los derechos sobre la voz y el vídeo de las canciones que publiques son tuyos. Permites a la Empresa, sin coste, mostrar esas canciones en el Servicio y usarlas para promocionarlo. Si borras una canción, la Empresa deja de usarla.","Los derechos del acompañamiento y la letra de una grabación pertenecen a Kumyoung Entertainment y otros titulares, por lo que no puedes descargar grabaciones fuera del Servicio ni publicarlas en otro lugar.","Solo pueden publicar canciones los usuarios que hayan completado la verificación de identidad (15 años o más). No obstante, no se publican los vídeos de cuentas de menores en los que la comprobación detecte un problema ni los vídeos que puedan implicar a un menor.","No puedes publicar caras o voces de otras personas sin permiso, contenido obsceno, violento o de odio, insultos, nada que infrinja derechos ajenos ni publicidad.","El Escenario es solo para vídeos de personas cantando. La Empresa puede borrar sin previo aviso todo lo que no sea un vídeo cantando.","Si una canción es denunciada o entra en lo anterior, la Empresa puede ocultarla o borrarla, y puede limitar la publicación si se repite.","Puedes borrar tus canciones en cualquier momento, y tus canciones publicadas se borran al eliminar la cuenta (artículo 6-2).","Las fotos temáticas se crean solo a partir de tu propia grabación; las demás personas que aparecen son personas ficticias creadas por IA. Las fotos temáticas llevan la marca «Generado por IA».","Las fotos de grupo con IA se crean solo con las caras de quienes tocan «Unirme» en una sala Solo nosotros Karaoke; tocar «Unirme» es el consentimiento para usar la foto de tu cara. Las fotos tomadas al unirse se usan temporalmente solo para crearla y se borran justo después. La tarifa (5.000P) la paga quien la inicia y se devuelve automáticamente si la creación falla. Las fotos de grupo con IA también llevan la etiqueta «Generado por IA»."]]},{"h":"Artículo 8-2 (Emisiones LIVE)","b":["Este artículo se aplica a la función LIVE del karaoke.",["Solo los adultos verificados pueden iniciar una emisión LIVE. Quien pueda usar el Servicio puede ver, comentar y reaccionar, y ver no consume puntos.","Quien emite paga 100P por espectador y hora, calculados cada minuto. La Empresa lo muestra al iniciar la emisión y la termina automáticamente cuando los puntos restantes llegan a 0P.","La emisión continúa cuando termina una canción. Quien emite puede elegir la siguiente en 3 minutos y seguir cantando; si no, aparece un aviso y la emisión termina 30 segundos después.","Quien emite puede ver el apodo y la foto de perfil pública de los espectadores en el panel «Público».","Los espectadores pueden enviar regalos con puntos a quien emite. Los tipos, precios y el límite (500.000P por persona al día) son los que aparecen en pantalla. Los menores no pueden enviar regalos. Los regalos enviados no se cancelan ni se reembolsan, salvo cuando la ley permita cancelarlos.","Quien emite recibe el 60 % del importe del regalo como puntos gratuitos, válidos 1 año desde la fecha del abono, que solo se usan dentro del Servicio y no se cambian por dinero ni se reembolsan.","Si un pago usado para un regalo se cancela o reembolsa, o se confirma que es fraudulento, la Empresa puede recuperar los puntos abonados a quien emite por ese regalo. Si ya se han usado, la Empresa puede descontarlos de abonos posteriores o exigir su devolución.","En las emisiones se prohíben los contenidos obscenos, violentos u ofensivos, los insultos, la infracción de derechos ajenos y la publicidad. La Empresa puede terminar sin aviso una emisión denunciada o infractora y limitar a los reincidentes. Quien emite puede expulsar espectadores.","La Empresa guarda las emisiones de forma privada 30 días para atender denuncias y disputas, y luego las elimina. Solo los administradores pueden verlas."]]},{"h":"Artículo 8-3 (Ranking y premios)","b":[["La Empresa anuncia rankings semanales, mensuales y de fin de año (Campeón) de vídeos públicos y paga un premio en puntos al primer puesto. Los criterios y premios son los que aparecen en pantalla.","El premio semanal del último domingo de cada mes se sustituye por el premio mensual de ese mes, y el premio mensual de diciembre se sustituye por el premio de Campeón.","Los premios se pagan automáticamente como puntos gratuitos, válidos 1 año desde el pago. No se reembolsan ni se cambian por dinero.","Los ganadores tienen una estrella de perfil. Las semanales y mensuales desaparecen al cambiar de año; las de Campeón se quedan.","Los vídeos que influyan en el ranking de forma indebida pueden excluirse."]]},{"h":"Artículo 8-4 (Supervisión automática)","b":["StageSong tiene un sistema de supervisión automática del sonido y la imagen.","LIVE: además de la comprobación en el teléfono, se comprueban en el servidor imágenes de baja resolución y fragmentos de audio. No se guardan después, y las palabras ofensivas de los comentarios se ocultan.","Solo nosotros Karaoke: los vídeos que se suben a una sala se comprueban igual que los vídeos publicados. Lo aceptas con los Términos la primera vez que entras en la app.","Vídeos publicados: se comprueban imágenes de muestra al publicar, junto con título, descripción y comentarios. Si hay un problema, el vídeo se guarda como «Solo yo».","Al principio la imagen se cubre unos segundos con un aviso. La expulsión y el límite de 24 horas solo se aplican si las detecciones de alta confianza continúan y se repiten. Las comprobaciones de sonido y lenguaje solo dan un aviso. No obstante, en las cuentas de menores se aplican desde la primera vez, y ante escenas que puedan implicar a un menor la emisión termina de inmediato y se limita el uso. Si las infracciones se repiten, el uso puede limitarse de forma permanente.","Toca «Reclamar» en el aviso y la Empresa lo revisará. Si fue un error, se levanta el límite y recuperas los puntos usados. Los puntos usados en la emisión LIVE interrumpida se devuelven como puntos gratuitos (válidos 1 año).","Las comprobaciones automáticas pueden equivocarse, por lo que la Empresa fija umbrales prudentes. Las copias usadas para comprobar no se guardan. Los vídeos de las emisiones se guardan aparte según el artículo 8-2. Si se detecta una escena que pueda implicar a un menor, la emisión termina de inmediato y se borra esa grabación."]},{"h":"Artículo 8-5 (Denuncias y bloqueos)","b":["Puedes denunciar cualquier vídeo o comentario con «Denunciar», eligiendo un motivo: contenido sexual, insultos, acoso, derechos de autor u otro. Cada persona puede denunciar un mismo elemento una vez, y el número de denuncias al día está limitado.","La Empresa revisa las denuncias y puede ocultar o eliminar el vídeo o comentario, y restringir el uso si las infracciones se repiten.","Puedes bloquear a otro usuario desde su escenario, un vídeo o un comentario. Al bloquearlo, dejáis de ver los vídeos y comentarios del otro en las listas de Escenario, la búsqueda de personas y Cantantes cerca, se eliminan los seguimientos y no podéis seguiros, comentar ni invitaros.","Puedes desbloquear en «Mi escenario → Usuarios bloqueados»."]},{"h":"Artículo 8-6 (Perfil público)","b":["Tu ID, foto de perfil, estrellas, vídeos públicos y número de seguidores son visibles para otros usuarios.","Otros usuarios pueden buscarte por ID. La búsqueda y la visualización siguen la separación del artículo 4 y los bloqueos (artículo 8-5)."]},{"h":"Artículo 9 (Enlaces externos)","b":["El Servicio puede ofrecer enlaces a sitios o apps externos para tu comodidad. La Empresa no se responsabiliza del contenido, las transacciones ni la exactitud de esos servicios externos.","Los vídeos de karaoke los ofrecen servicios externos de reproducción de vídeo y los titulares de derechos; los anuncios, el contenido y la disponibilidad de los vídeos siguen las políticas de esos servicios y titulares."]},{"h":"Artículo 10 (Obligaciones del usuario y actos prohibidos)","b":["El usuario no debe:",["actuar en contra de la ley o del orden público y las buenas costumbres","interferir en el funcionamiento normal del Servicio o recopilar datos sin autorización","vulnerar los derechos de terceros"]]},{"h":"Artículo 11 (Interrupción y mantenimiento del servicio)","b":["En principio, el Servicio está disponible las 24 horas, todo el año. Puede interrumpirse temporalmente por mantenimiento, cambio de equipos o averías; cuando sea posible, lo avisaremos antes en el Servicio.","Si sufres un daño por dolo o negligencia de la Empresa, esta te indemnizará conforme a la ley aplicable."]},{"h":"Artículo 12 (Limitación de responsabilidad)","b":["Según la disponibilidad de las canciones, algunas pueden no reproducirse o la lista puede cambiar.","La Empresa no responde por daños derivados de causas ajenas a su control razonable, como fuerza mayor o fallos de API externas o de las comunicaciones."]},{"h":"Artículo 13 (Permisos del dispositivo)","b":["El Servicio usa la cámara y el micrófono solo cuando usas una función que los necesita, como grabar, LIVE o unirte a una foto de grupo con IA. La primera vez, el navegador o la app piden permiso; si no lo das, solo esa función no estará disponible y todo lo demás seguirá funcionando.","Las grabaciones se quedan en tu dispositivo; solo se envían a la Empresa las que decidas publicar con «Publicar mi canción». No obstante, las emisiones LIVE, las muestras para comprobar publicaciones y los tramos que elijas para la creación con IA se envían según los artículos correspondientes.","La ubicación solo se usa al activar «Mostrar mi ubicación» en «Cantantes cerca», y solo como ubicación aproximada (unos 1 km). Al entrar por primera vez en la app o al activarla pedimos tu consentimiento para usar la ubicación y el navegador o la app piden el permiso de ubicación (la app solo pide ubicación aproximada). No se usan otros permisos del dispositivo; si alguna vez se necesitan más, te indicaremos antes cuáles son obligatorios y cuáles opcionales, con sus motivos, y pediremos tu consentimiento (artículo 22-2 de la Ley de Redes)."]},{"h":"Artículo 13-2 (Servicio basado en ubicación — Cantantes cerca)","b":["La Empresa ha registrado su actividad de servicio basado en ubicación conforme a la ley coreana de protección y uso de la información de ubicación (Booman Inc., registro n.º 1866).","Qué hace: «Cantantes cerca» muestra a los usuarios con sesión iniciada que activan «Mostrar mi ubicación» (la verificación de identidad se hace una sola vez, al abrir StageSong por primera vez) el rango de distancia entre ellos (a menos de 1, 3 o 10 km) y sus últimas canciones públicas, y les permite verlas, darles me gusta, comentarlas y seguirse. Sin activar tu propia ubicación tampoco puedes ver la lista. Usar la ubicación es gratis.",["Al entrar por primera vez en la app o al activarla debes consentir el uso de la ubicación (sin ello, el resto del Servicio sigue disponible); la Empresa registra el consentimiento por cuenta con la hora.","La ubicación se redondea a unos 1 km antes de guardarla; nunca se guardan ni se muestran coordenadas exactas ni direcciones.","La ubicación se guarda solo mientras esté activada y se destruye sin demora al desactivarla, al terminar el tiempo visible (15 minutos tras activarla, o hasta la hora ampliada) o al retirar el consentimiento.","La Empresa registra automáticamente el uso y la cesión de la información de ubicación (hora, finalidad, cuenta), conserva estos registros 6 meses y luego los destruye.","Puedes desactivar «Mostrar mi ubicación» o retirar el consentimiento con «Retirar consentimiento de ubicación» en cualquier momento, y pedir ver o que se te notifiquen los registros de uso y cesión de tu ubicación y corregir errores.","La ubicación se muestra a otros usuarios solo como rango de distancia y no se cede a terceros salvo obligación legal.","En la lista se muestra la franja de edad y el sexo según la verificación de identidad (p. ej. «20-29 años · Hombre»; los menores aparecen como «Adolescentes»). El sexo siempre se muestra; nunca la edad exacta ni el cumpleaños.","Los menores solo se ven y se siguen entre menores, y los adultos solo entre adultos.","La lista se puede filtrar por «Todos / Amigos mutuos / Adolescentes / 20-29 / 30-49 / 50-59 / 60+». Las mujeres verificadas pueden activar «Mostrar mi ubicación solo a mujeres»; así ella y los usuarios hombres no se ven en la lista.","«Cantantes cerca» no permite invitar a desconocidos a salas. En la app, añadir o invitar a personas a salas Solo nosotros Karaoke solo es posible entre «amigos mutuos» que se siguen mutuamente, y la Empresa lo comprueba. Los enlaces de invitación que los usuarios envían por su cuenta (KakaoTalk, etc.) siguen funcionando.","Puedes bloquear y denunciar a otros usuarios. Los usuarios bloqueados no se ven en la lista ni pueden intercambiar invitaciones. Puedes enviar hasta 20 invitaciones a amigos mutuos al día y tener hasta 3 pendientes a la vez."],"Responsable de información de ubicación: Hwang Euiman (atención al cliente 010-4221-7066 · admin@moneypuzzle.co.kr)","Para conflictos sobre la información de ubicación puedes solicitar mediación a la Comisión de Medios y Comunicaciones de Corea o al Comité de Mediación de Conflictos de Información Personal. Si el tratamiento de la ubicación por la Empresa te causa daños, la Empresa los indemnizará conforme a la ley."]},{"h":"Artículo 14 (Ley aplicable y jurisdicción)","b":["Los litigios entre la Empresa y el usuario se rigen por las leyes de la República de Corea.","Los litigios por conflictos entre la Empresa y el usuario se presentarán ante function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/(admin|emhwang3)@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>').replace(/https:\/\/karaoke\.moneypuzzle\.co\.kr\/account-delete\.html/g,'<a href="account-delete.html">$&</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();

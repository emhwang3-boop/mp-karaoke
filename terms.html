var D={"ko": {"title": "이용약관", "eff": "시행일:      년    월    일", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "제1조 (목적)", "b": ["본 약관은 주식회사 부만(이하 '회사')이 제공하는 노래방 서비스 '머니퍼즐 노래방(Money Puzzle Karaoke)'(https://karaoke.moneypuzzle.co.kr, 이하 '서비스')의 이용 조건을 정하는 것을 목적으로 합니다."]}, {"h": "제2조 (서비스의 내용)", "b": ["서비스는 다음을 제공합니다.", ["금영엔터테인먼트 공식 유튜브 채널의 노래방 영상 재생(유튜브 퍼가기 플레이어 사용, 무료)", "노래방 곡 이용권(선불)의 판매 (판매 당사자: 회사)", "구글·애플 계정 로그인 및 곡 이용권 보관"], "곡 이용권 대금은 회사가 계약한 전자지급결제대행사의 결제창을 통해 회사에 지급됩니다. 회사는 카드 번호 등 결제 정보를 직접 받거나 저장하지 않습니다."]}, {"h": "제3조 (노래방 곡 이용권)", "b": ["회사는 서비스 안 노래방에서 쓰는 선불 「곡 이용권」을 판매합니다(1곡 1,000원, 묶음으로 사면 서비스 곡 증정). 묶음 구성과 가격은 판매 화면에 표시된 대로입니다.", "곡 이용권은 정식 반주 곡(준비 중)을 부를 때 사용되며, 노래 1곡을 부를 때마다 이용권 1곡이 차감됩니다. 금영 노래방 공식 유튜브 채널의 노래방 영상은 무료이며 곡 이용권을 차감하지 않습니다.", "곡 이용권은 로그인한 계정에 쌓이며 구매일로부터 1년간 보관됩니다.", "환불: 구매일로부터 7일 이내에는 결제 금액에서 사용한 곡을 1곡 1,000원으로 계산해 뺀 금액을, 7일이 지난 뒤(보관 기간 1년 안)에는 그 금액에서 환불 수수료 10%를 뺀 금액을 환불합니다. 서비스로 받은 곡은 환불 대상이 아니며, 계산 결과가 0원 이하면 환불 금액은 없습니다(10원 미만 버림). 자세한 내용은 환불 규정을 따릅니다.", "현재 곡 이용권 결제는 시험 운영 중(UNDER TESTING)이며, 시험 결제는 실제로 청구되지 않습니다."]}, {"h": "제4조 (미성년자의 이용)", "b": ["만 14세 미만은 법정대리인(부모 등)의 동의를 받아 이용해야 합니다.", "미성년자(만 19세 미만)가 법정대리인의 동의 없이 곡 이용권을 산 경우, 본인 또는 법정대리인은 그 구매를 취소할 수 있습니다. 다만 법정대리인이 쓰도록 허락한 용돈 범위 안에서 산 경우 등 법률이 정한 경우에는 취소할 수 없습니다."]}, {"h": "제5조 (곡 제공 조건)", "b": ["무료 노래방 영상은 금영 공식 유튜브 채널에 올라온 영상을 그대로 보여 주는 것이어서, 영상이 내려가거나 퍼가기가 막히면 목록에서 빠지거나 재생되지 않을 수 있습니다.", "곡 목록이 바뀌어도 남은 곡 이용권은 그대로 보관되며, 재생되지 않은 곡에는 곡 이용권이 차감되지 않습니다."]}, {"h": "제6조 (탈퇴 시 남은 곡 이용권)", "b": ["탈퇴(계정 삭제) 전에 환불 규정에 따라 남은 곡의 환불을 요청할 수 있습니다.", "탈퇴한 뒤에도 구매일로부터 1년 안에는 결제 기록으로 남은 곡의 환불을 요청할 수 있습니다. 환불 요청 없이 1년이 지나면 남은 곡 이용권은 소멸합니다."]}, {"h": "제7조 (저작권 및 이용 범위)", "b": ["노래방 영상과 그 안의 반주·가사·영상의 권리는 금영엔터테인먼트 등 각 권리자에게 있고, 서비스의 화면·로고·글의 권리는 회사에 있습니다.", "이용자는 서비스를 개인적으로 노래하고 감상하는 데에만 이용할 수 있으며, 영상·반주·가사를 복제·배포·방송하거나 영업장 등에서 영리 목적으로 이용해서는 안 됩니다."]}, {"h": "제8조 (녹음·녹화물 게시 — 준비 중인 기능)", "b": ["이 조항의 기능(노래 녹음·녹화, 「스테이지」·「내 스테이지」 게시)은 준비 중이며, 열리는 날부터 적용됩니다.", ["이용자가 올린 노래의 목소리·영상에 대한 권리는 이용자에게 있습니다. 이용자는 회사가 그 노래를 서비스 안에서 보여 주고 서비스를 알리는 데 무상으로 쓸 수 있도록 허락합니다. 이용자가 노래를 지우면 회사도 더 이상 쓰지 않습니다.", "녹음·녹화물 안의 반주·가사의 권리는 금영엔터테인먼트 등 권리자에게 있으므로, 서비스 밖으로 내려받거나 다른 곳에 올릴 수 없습니다.", "만 14세 미만은 노래를 올릴 수 없습니다. 회사는 처음 올릴 때 태어난 해를 확인합니다.", "다른 사람의 얼굴·목소리를 허락 없이 담은 것, 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리를 침해하는 것, 광고는 올릴 수 없습니다.", "스테이지는 노래를 부르는 영상만 올리는 곳입니다. 노래를 부르는 영상이 아닌 것은 회사가 예고 없이 지울 수 있습니다.", "신고가 들어오거나 위 내용에 해당하면 회사는 그 노래를 숨기거나 지울 수 있으며, 되풀이하면 올리기를 제한할 수 있습니다.", "이용자는 언제든 자기 노래를 지울 수 있고, 탈퇴하면 올린 노래도 지워집니다.", "상황 사진은 이용자 본인의 녹화 영상으로만 만들며, 함께 나오는 다른 인물은 AI가 만든 가상 인물입니다. 상황 사진에는 「AI 생성」이 표시됩니다."]]}, {"h": "제9조 (외부 링크 면책)", "b": ["서비스는 이용자의 편의를 위해 외부 사이트·앱으로 연결되는 링크를 제공할 수 있습니다. 회사는 외부 서비스의 내용·거래·정확성에 대해 책임지지 않습니다.", "노래방 영상은 유튜브와 각 공식 채널이 제공하며, 영상 안의 광고·내용·재생 가능 여부는 유튜브 및 해당 채널 운영사의 정책을 따릅니다."]}, {"h": "제10조 (이용자의 의무 및 금지 행위)", "b": ["이용자는 다음 행위를 하여서는 안 됩니다.", ["법령 또는 공서양속에 반하는 행위", "서비스의 정상적인 운영을 방해하거나 무단으로 데이터를 수집하는 행위", "타인의 권리를 침해하는 행위"]]}, {"h": "제11조 (서비스 중단 및 점검)", "b": ["서비스는 연중무휴 24시간 제공을 원칙으로 합니다. 다만 점검·설비 교체·장애가 있을 때는 일시 중단할 수 있으며, 미리 알릴 수 있는 경우에는 서비스 화면으로 미리 알립니다.", "회사의 고의 또는 과실로 이용자에게 손해가 생긴 경우 회사는 관련 법령에 따라 배상합니다."]}, {"h": "제12조 (책임의 한계)", "b": ["유튜브 사정(영상 삭제·퍼가기 제한 등)으로 일부 곡은 재생되지 않거나 목록이 바뀔 수 있으며, 이 경우 「유튜브에서 열기」로 안내합니다.", "회사는 천재지변, 외부 API·통신의 장애 등 회사의 합리적 통제를 벗어난 사유로 인한 손해에 대해 책임을 지지 않습니다."]}, {"h": "제13조 (기기 접근 권한)", "b": ["서비스는 「녹화」를 누를 때만 카메라와 마이크를 씁니다. 처음 쓸 때 브라우저가 허락을 묻고, 허락하지 않으면 녹화만 쓸 수 없고 다른 기능은 그대로 쓸 수 있습니다.", "녹화한 영상은 이용자의 기기 안에만 있고 회사로 보내지 않습니다. 「내 노래 올리기」가 열리면 이용자가 올리기를 고른 영상만 회사로 보내집니다.", "위치 등 다른 기기 접근 권한은 쓰지 않습니다. 앱으로 제공하면서 접근 권한이 필요해지면, 꼭 필요한 권한과 선택 권한을 나누어 그 이유와 함께 미리 알리고 동의를 받습니다(정보통신망법 제22조의2)."]}, {"h": "제14조 (준거법 및 관할)", "b": ["본 약관은 대한민국 법률에 따라 해석되며, 서비스 이용과 관련한 분쟁은 관련 법령에 따른 관할 법원에서 다룹니다."]}, {"h": "제15조 (문의)", "b": ["서비스 이용에 관한 문의는 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 연락하실 수 있습니다."]}]}, "en": {"title": "Terms of Service", "eff": "Effective date: ____-__-__", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "Article 1 (Purpose)", "b": ["These Terms govern your use of the karaoke service \"Money Puzzle Karaoke\" (https://karaoke.moneypuzzle.co.kr, \"the Service\") provided by Booman Inc. (\"the Company\")."]}, {"h": "Article 2 (The Service)", "b": ["The Service provides:", ["Playback of karaoke videos from the official YouTube channel of Kumyoung (KY) (via the YouTube embedded player, free of charge)", "Sale of prepaid karaoke song passes (seller: the Company)", "Sign-in with Google or Apple and storage of your song passes"], "Payment for song passes is made to the Company through the payment window of its contracted payment gateway. The Company does not receive or store card numbers or other payment details."]}, {"h": "Article 3 (Karaoke song pass)", "b": ["The Company sells a prepaid “song pass” for the karaoke in the Service (₩1,000 per song; bundles include bonus songs). Bundles and prices are as shown on the sales screen.", "The song pass is deducted by one song each time you sing licensed accompaniment songs (in preparation). Karaoke videos from the official KY (Kumyoung) YouTube channel are free and do not use the song pass.", "Song passes are saved to your signed-in account and kept for 1 year from purchase.", "Refunds: within 7 days of purchase, we refund the amount paid minus the songs used at ₩1,000 per song; after 7 days (within the 1-year storage period), that amount minus a 10% refund fee. Bonus songs are not refundable, and if the result is ₩0 or less there is no refund (rounded down to ₩10). Details follow the Refund Policy.", "Song pass payments are currently in test mode (UNDER TESTING); test payments are not actually charged."]}, {"h": "Article 4 (Use by minors)", "b": ["Children under 14 must have the consent of a legal guardian (such as a parent) to use the Service.", "If a minor (under 19) buys a song pass without a legal guardian's consent, the minor or the guardian may cancel the purchase. This does not apply where the law says otherwise, such as purchases made within pocket money the guardian allowed the minor to spend."]}, {"h": "Article 5 (Song availability)", "b": ["Free karaoke videos are shown as posted on the official KY YouTube channel, so a song may disappear from the list or fail to play if the video is removed or embedding is blocked.", "If the song list changes, your remaining song passes stay in your account, and no song pass is used for a song that did not play."]}, {"h": "Article 6 (Remaining song passes when you leave)", "b": ["Before leaving (deleting your account), you can request a refund for remaining songs under the Refund Policy.", "Even after leaving, you can request a refund for remaining songs within 1 year of purchase using your payment record. If no refund is requested within 1 year, the remaining song passes expire."]}, {"h": "Article 7 (Copyright and scope of use)", "b": ["Rights to the karaoke videos and the accompaniment, lyrics and footage in them belong to Kumyoung Entertainment and other rights holders. Rights to the Service's screens, logos and text belong to the Company.", "You may use the Service only for personal singing and listening. You may not copy, distribute or broadcast the videos, accompaniment or lyrics, or use them for profit, such as in a business."]}, {"h": "Article 8 (Posting recordings — feature in preparation)", "b": ["The features in this article (recording songs and posting them to \"Public Stage\" and \"My Stage\") are in preparation and apply from the day they open.", ["Rights to the voice and video in songs you post belong to you. You allow the Company, free of charge, to show those songs in the Service and to use them to promote the Service. Once you delete a song, the Company stops using it.", "Rights to the accompaniment and lyrics in a recording belong to Kumyoung Entertainment and other rights holders, so you may not download recordings outside the Service or post them elsewhere.", "Users under 14 may not post songs. The Company checks your year of birth the first time you post.", "You may not post others' faces or voices without permission, obscene, violent or hateful content, abusive language, anything that infringes others' rights, or advertising.", "The Public Stage is only for videos of people singing. The Company may delete anything that is not a singing video without notice.", "If a song is reported or falls under the above, the Company may hide or delete it, and may restrict posting for repeated violations.", "You can delete your songs at any time, and your posted songs are deleted when you leave the Service.", "Scene photos are made only from your own recording; any other people shown are fictional people created by AI. Scene photos are marked \"AI-generated\"."]]}, {"h": "Article 9 (External links)", "b": ["The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services.", "Karaoke videos are provided by YouTube and the respective official channels; ads, content and availability within the videos follow the policies of YouTube and those channel operators."]}, {"h": "Article 10 (User obligations and prohibited acts)", "b": ["You must not:", ["act in violation of law or public order and morals", "interfere with the normal operation of the Service or collect data without authorization", "infringe the rights of others"]]}, {"h": "Article 11 (Service suspension and maintenance)", "b": ["The Service is in principle available 24 hours a day, all year. It may be suspended temporarily for maintenance, equipment replacement or failures; where possible, we will announce this on the Service in advance.", "If you suffer damage due to the Company's intent or negligence, the Company will compensate you in accordance with applicable law."]}, {"h": "Article 12 (Limitation of liability)", "b": ["Due to YouTube (e.g. removed videos or embedding restrictions), some songs may not play or the list may change; in that case we offer “Open on YouTube”.", "The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]}, {"h": "Article 13 (Device permissions)", "b": ["The Service uses the camera and microphone only when you tap \"Record\". Your browser asks for permission the first time; if you decline, only recording is unavailable and everything else still works.", "Recordings stay on your device and are not sent to the Company. When \"Post my song\" opens, only the recordings you choose to post will be sent.", "No other device permissions, such as location, are used. If the Service is offered as an app and needs permissions, we will tell you in advance which are required and which are optional, with the reasons, and ask for your consent (Article 22-2 of the Network Act)."]}, {"h": "Article 14 (Governing law and jurisdiction)", "b": ["These Terms are construed under the laws of the Republic of Korea, and disputes relating to the Service are handled by the court of competent jurisdiction under applicable law."]}, {"h": "Article 15 (Contact)", "b": ["For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]}]}, "ja": {"title": "利用規約", "eff": "施行日：    年  月  日", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "第1条（目的）", "b": ["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供するカラオケサービス「マネーパズル カラオケ（Money Puzzle Karaoke）」（https://karaoke.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]}, {"h": "第2条（サービスの内容）", "b": ["本サービスは次のものを提供します。", ["クミョン（KY）公式YouTubeチャンネルのカラオケ動画の再生（YouTube埋め込みプレーヤー使用・無料）", "カラオケ曲チケット（前払い）の販売（販売当事者：当社）", "Google・Appleアカウントでのログインおよび曲チケットの保管"], "曲チケットの代金は、当社が契約した電子決済代行会社の決済画面を通じて当社に支払われます。当社はカード番号などの決済情報を直接受け取ったり保存したりしません。"]}, {"h": "第3条（カラオケ曲チケット）", "b": ["当社は、サービス内カラオケで使う前払いの「曲チケット」を販売します（1曲1,000ウォン、まとめ買いでサービス曲付き）。パック内容と価格は販売画面の表示どおりです。", "曲チケットは正式な伴奏曲（準備中）を歌うたびに、曲チケットが1曲分差し引かれます。KY（クミョン）公式YouTubeチャンネルのカラオケ動画は無料で、曲チケットは消費しません。", "曲チケットはログインしたアカウントに保存され、購入日から1年間保管されます。", "返金：購入日から7日以内は支払額から使った曲を1曲1,000ウォンとして差し引いた金額を、7日を過ぎた後（保管期間1年以内）はその金額から返金手数料10%を差し引いた金額を返金します。サービス曲は返金対象外で、計算結果が0ウォン以下の場合は返金額はありません（10ウォン未満切り捨て）。詳細は返金規定に従います。", "現在、曲チケットの決済はテスト運用中（UNDER TESTING）で、テスト決済は実際には請求されません。"]}, {"h": "第4条（未成年者の利用）", "b": ["満14歳未満の方は、法定代理人（保護者など）の同意を得て利用してください。", "未成年者（満19歳未満）が法定代理人の同意なく曲チケットを購入した場合、本人または法定代理人はその購入を取り消すことができます。ただし、法定代理人が使用を許したお小遣いの範囲内で購入した場合など、法律が定める場合は取り消せません。"]}, {"h": "第5条（曲の提供条件）", "b": ["無料カラオケ動画はKY公式YouTubeチャンネルに投稿された動画をそのまま表示するため、動画が削除されたり埋め込みが制限されたりすると、一覧から消えたり再生できなかったりすることがあります。", "曲の一覧が変わっても、残りの曲チケットはそのまま保管され、再生されなかった曲には曲チケットを使いません。"]}, {"h": "第6条（退会時の残り曲チケット）", "b": ["退会（アカウント削除）の前に、返金規定に従って残りの曲の返金を申請できます。", "退会後も購入日から1年以内であれば、決済記録をもとに残りの曲の返金を申請できます。返金申請がないまま1年が過ぎると、残りの曲チケットは消滅します。"]}, {"h": "第7条（著作権および利用範囲）", "b": ["カラオケ動画とその中の伴奏・歌詞・映像の権利は金永エンターテインメントなど各権利者に、本サービスの画面・ロゴ・文章の権利は当社に帰属します。", "利用者は本サービスを個人的に歌ったり楽しんだりする目的にのみ利用でき、動画・伴奏・歌詞を複製・配布・放送したり、店舗などで営利目的に利用したりしてはなりません。"]}, {"h": "第8条（録音・録画物の投稿 — 準備中の機能）", "b": ["この条項の機能（歌の録音・録画、「ステージ」「マイステージ」への投稿）は準備中で、公開日から適用されます。", ["利用者が投稿した歌の声・映像の権利は利用者に帰属します。利用者は、当社がその歌をサービス内で表示し、サービスの宣伝に無償で使用することを許諾します。利用者が歌を削除すると、当社も使用を中止します。", "録音・録画物に含まれる伴奏・歌詞の権利は金永エンターテインメントなどの権利者に帰属するため、サービスの外へダウンロードしたり、他の場所に投稿したりすることはできません。", "満14歳未満の方は歌を投稿できません。当社は初めて投稿するときに生まれ年を確認します。", "他人の顔・声を無断で含むもの、わいせつ・暴力・差別的な表現、暴言、他人の権利を侵害するもの、広告は投稿できません。", "ステージは歌っている動画だけを投稿する場所です。歌っている動画でないものは、当社が予告なく削除することがあります。", "通報があった場合や上記に該当する場合、当社はその歌を非表示または削除でき、繰り返す場合は投稿を制限できます。", "利用者はいつでも自分の歌を削除でき、退会すると投稿した歌も削除されます。", "シーン写真は利用者本人の録画映像からのみ作成し、一緒に写る他の人物はAIが作った架空の人物です。シーン写真には「AI生成」と表示されます。"]]}, {"h": "第9条（外部リンクの免責）", "b": ["本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。", "カラオケ動画はYouTubeおよび各公式チャンネルが提供するもので、動画内の広告・内容・再生可否はYouTubeおよび当該チャンネル運営会社のポリシーに従います。"]}, {"h": "第10条（利用者の義務および禁止行為）", "b": ["利用者は次の行為をしてはなりません。", ["法令または公序良俗に反する行為", "本サービスの正常な運営を妨げ、または無断でデータを収集する行為", "他人の権利を侵害する行為"]]}, {"h": "第11条（サービスの中断および点検）", "b": ["本サービスは年中無休・24時間の提供を原則とします。ただし点検・設備交換・障害の際は一時中断することがあり、事前に知らせることができる場合はサービス画面で事前にお知らせします。", "当社の故意または過失により利用者に損害が生じた場合、当社は関係法令に従って賠償します。"]}, {"h": "第12条（責任の限界）", "b": ["YouTube側の事情（動画の削除・埋め込み制限など）により、一部の曲が再生できなかったり一覧が変わったりすることがあります。その場合は「YouTubeで開く」をご案内します。", "当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]}, {"h": "第13条（端末のアクセス権限）", "b": ["本サービスは「録画」を押したときだけカメラとマイクを使います。初めて使うときにブラウザが許可を求め、許可しない場合は録画だけが使えず、ほかの機能はそのまま使えます。", "録画した動画は利用者の端末内にのみあり、当社には送信しません。「自分の歌を投稿」が公開されると、利用者が投稿を選んだ動画だけが当社に送信されます。", "位置情報などほかの端末アクセス権限は使いません。アプリとして提供する際にアクセス権限が必要になった場合は、必須権限と任意権限を分け、その理由とともに事前にお知らせし、同意を得ます（情報通信網法第22条の2）。"]}, {"h": "第14条（準拠法および管轄）", "b": ["本規約は大韓民国の法律に従って解釈され、本サービスの利用に関する紛争は関連法令に基づく管轄裁判所で取り扱われます。"]}, {"h": "第15条（お問い合わせ）", "b": ["本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]}]}, "zhs": {"title": "使用条款", "eff": "施行日期：    年  月  日", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "第1条（目的）", "b": ["本条款旨在规定 Booman Inc.（株式会社 부만，以下称“本公司”）提供的卡拉OK服务“Money Puzzle Karaoke（머니퍼즐 노래방）”（https://karaoke.moneypuzzle.co.kr，以下称“本服务”）的使用条件。"]}, {"h": "第2条（服务内容）", "b": ["本服务提供以下内容：", ["播放金永（KY）官方YouTube频道的卡拉OK视频（使用YouTube嵌入式播放器，免费）", "销售卡拉OK点歌券（预付）（销售方：本公司）", "Google·Apple 账号登录及点歌券保存"], "点歌券款项通过本公司签约的电子支付代理机构的支付页面支付给本公司。本公司不直接接收或保存卡号等支付信息。"]}, {"h": "第3条（卡拉OK点歌券）", "b": ["本公司销售在服务内卡拉OK使用的预付“点歌券”（每首₩1,000，购买套餐赠送歌曲）。套餐内容和价格以销售页面显示为准。", "点歌券在演唱正式伴奏歌曲（筹备中）时，每唱一首扣除一首点歌券。金永（KY）官方YouTube频道的卡拉OK视频免费，不扣点歌券。", "点歌券保存在已登录的账户中，自购买日起保留1年。", "退款：购买后7天内退还支付金额减去已用歌曲（每首₩1,000）后的金额；超过7天后（1年保存期内）再扣除10%退款手续费后退还。赠送歌曲不在退款范围内，计算结果为₩0或以下时不予退款（不足₩10舍去）。详情依退款规定。", "目前点歌券付款处于测试运营（UNDER TESTING），测试付款不会实际扣款。"]}, {"h": "第4条（未成年人的使用）", "b": ["未满14周岁者须征得法定代理人（父母等）同意后使用。", "未成年人（未满19周岁）未经法定代理人同意购买点歌券的，本人或法定代理人可以撤销该购买。但在法定代理人允许使用的零用钱范围内购买等法律规定的情形除外。"]}, {"h": "第5条（歌曲提供条件）", "b": ["免费卡拉OK视频直接显示金永（KY）官方YouTube频道发布的视频，视频被删除或禁止嵌入时，可能从列表中消失或无法播放。", "即使歌曲列表变化，剩余点歌券也会照常保留，未能播放的歌曲不扣点歌券。"]}, {"h": "第6条（退出时剩余点歌券）", "b": ["退出（删除账户）前，可按退款规定申请剩余歌曲的退款。", "退出后，自购买日起1年内仍可凭支付记录申请剩余歌曲的退款。1年内未申请退款的，剩余点歌券失效。"]}, {"h": "第7条（著作权及使用范围）", "b": ["卡拉OK视频及其中的伴奏、歌词、影像的权利归金永娱乐等各权利人所有，本服务的页面、标志、文字的权利归本公司所有。", "用户只能为个人演唱和欣赏使用本服务，不得复制、传播、播放视频、伴奏或歌词，也不得在营业场所等以营利为目的使用。"]}, {"h": "第8条（发布录音、录像 — 准备中的功能）", "b": ["本条所述功能（录制歌曲、发布到「舞台」「我的舞台」）正在准备中，自开放之日起适用。", ["用户发布的歌曲中声音、影像的权利归用户所有。用户允许本公司无偿在服务内展示这些歌曲并用于宣传服务。用户删除歌曲后，本公司也停止使用。", "录音、录像中伴奏、歌词的权利归金永娱乐等权利人所有，因此不得下载到服务之外或发布到其他地方。", "未满14周岁者不得发布歌曲。本公司在首次发布时确认出生年份。", "不得发布未经许可含有他人面孔或声音的内容、淫秽、暴力或仇恨内容、辱骂、侵害他人权利的内容或广告。", "舞台只用于发布唱歌的视频。不是唱歌视频的内容，本公司可不经通知予以删除。", "收到举报或属于上述情形时，本公司可以隐藏或删除该歌曲，屡次违反的可限制发布。", "用户可随时删除自己的歌曲，退出时已发布的歌曲也将删除。", "情景照片仅使用用户本人的录像制作，照片中的其他人物均为AI生成的虚拟人物。情景照片上会标示“AI生成”。"]]}, {"h": "第9条（外部链接免责）", "b": ["为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。", "卡拉OK视频由YouTube及各官方频道提供，视频中的广告、内容及能否播放遵循YouTube及相关频道运营方的政策。"]}, {"h": "第10条（用户义务及禁止行为）", "b": ["用户不得有下列行为：", ["违反法律或公序良俗的行为", "妨碍本服务正常运营或擅自收集数据的行为", "侵害他人权利的行为"]]}, {"h": "第11条（服务中断及维护）", "b": ["本服务原则上全年无休、24小时提供。但在维护、设备更换或故障时可能暂时中断，能够事先通知的，将在服务页面上提前通知。", "因本公司故意或过失给用户造成损害的，本公司依相关法律赔偿。"]}, {"h": "第12条（责任限制）", "b": ["因YouTube方面的原因（视频删除、嵌入限制等），部分歌曲可能无法播放或列表可能变化，届时将提示“在YouTube打开”。", "对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]}, {"h": "第13条（设备访问权限）", "b": ["本服务仅在点按「录像」时使用相机和麦克风。首次使用时浏览器会请求许可，不允许时只是无法录像，其他功能照常可用。", "录像只保存在用户设备上，不会发送给本公司。「发布我的歌」开放后，只有用户选择发布的视频才会发送给本公司。", "不使用位置等其他设备访问权限。以应用形式提供而需要访问权限时，将区分必要权限和可选权限，事先告知原因并征得同意（《信息通信网法》第22条之2）。"]}, {"h": "第14条（准据法及管辖）", "b": ["本条款依大韩民国法律解释，与本服务使用相关的纠纷由依相关法律确定的管辖法院处理。"]}, {"h": "第15条（咨询）", "b": ["有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]}]}, "zht": {"title": "使用條款", "eff": "施行日期：    年  月  日", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "第1條（目的）", "b": ["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的卡拉OK服務「Money Puzzle Karaoke（머니퍼즐 노래방）」（https://karaoke.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]}, {"h": "第2條（服務內容）", "b": ["本服務提供以下內容：", ["播放金永（KY）官方YouTube頻道的卡拉OK影片（使用YouTube嵌入式播放器，免費）", "銷售卡拉OK點歌券（預付）（銷售方：本公司）", "Google·Apple 帳號登入及點歌券保存"], "點歌券款項透過本公司簽約的電子支付代理機構的付款頁面支付給本公司。本公司不直接接收或保存卡號等付款資訊。"]}, {"h": "第3條（卡拉OK點歌券）", "b": ["本公司銷售在服務內卡拉OK使用的預付「點歌券」（每首₩1,000，購買套餐贈送歌曲）。套餐內容和價格以銷售頁面顯示為準。", "點歌券在演唱正式伴奏歌曲（籌備中）時，每唱一首扣除一首點歌券。金永（KY）官方YouTube頻道的卡拉OK影片免費，不扣點歌券。", "點歌券保存在已登入的帳戶中，自購買日起保留1年。", "退款：購買後7天內退還付款金額減去已用歌曲（每首₩1,000）後的金額；超過7天後（1年保存期內）再扣除10%退款手續費後退還。贈送歌曲不在退款範圍內，計算結果為₩0或以下時不予退款（不足₩10捨去）。詳情依退款規定。", "目前點歌券付款處於測試營運（UNDER TESTING），測試付款不會實際扣款。"]}, {"h": "第4條（未成年人的使用）", "b": ["未滿14歲者須經法定代理人（父母等）同意後使用。", "未成年人（未滿19歲）未經法定代理人同意購買點歌券者，本人或法定代理人得撤銷該購買。但於法定代理人允許使用之零用錢範圍內購買等法律規定之情形除外。"]}, {"h": "第5條（歌曲提供條件）", "b": ["免費卡拉OK影片直接顯示金永（KY）官方YouTube頻道發布的影片，影片被刪除或禁止嵌入時，可能從清單中消失或無法播放。", "即使歌曲清單變動，剩餘點歌券仍會照常保留，未能播放的歌曲不扣點歌券。"]}, {"h": "第6條（退出時剩餘點歌券）", "b": ["退出（刪除帳戶）前，可依退款規定申請剩餘歌曲的退款。", "退出後，自購買日起1年內仍可憑付款紀錄申請剩餘歌曲的退款。1年內未申請退款者，剩餘點歌券失效。"]}, {"h": "第7條（著作權及使用範圍）", "b": ["卡拉OK影片及其中的伴奏、歌詞、影像的權利歸金永娛樂等各權利人所有，本服務的頁面、標誌、文字的權利歸本公司所有。", "使用者僅能為個人演唱和欣賞使用本服務，不得重製、散布、播送影片、伴奏或歌詞，亦不得於營業場所等以營利為目的使用。"]}, {"h": "第8條（發布錄音、錄影 — 準備中的功能）", "b": ["本條所述功能（錄製歌曲、發布到「舞台」「我的舞台」）正在準備中，自開放之日起適用。", ["使用者發布的歌曲中聲音、影像的權利歸使用者所有。使用者同意本公司無償於服務內展示該等歌曲並用於宣傳服務。使用者刪除歌曲後，本公司亦停止使用。", "錄音、錄影中伴奏、歌詞的權利歸金永娛樂等權利人所有，因此不得下載至服務之外或發布到其他地方。", "未滿14歲者不得發布歌曲。本公司於首次發布時確認出生年份。", "不得發布未經許可含有他人面孔或聲音的內容、猥褻、暴力或仇恨內容、辱罵、侵害他人權利的內容或廣告。", "舞台僅用於發布唱歌的影片。非唱歌影片的內容，本公司得不經通知予以刪除。", "收到檢舉或屬上述情形時，本公司得隱藏或刪除該歌曲，屢次違反者得限制發布。", "使用者可隨時刪除自己的歌曲，退出時已發布的歌曲亦將刪除。", "情境照片僅使用使用者本人的錄影製作，照片中的其他人物均為AI生成的虛擬人物。情境照片上會標示「AI生成」。"]]}, {"h": "第9條（外部連結免責）", "b": ["為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。", "卡拉OK影片由YouTube及各官方頻道提供，影片中的廣告、內容及能否播放依循YouTube及相關頻道營運方的政策。"]}, {"h": "第10條（使用者義務及禁止行為）", "b": ["使用者不得有下列行為：", ["違反法律或公序良俗的行為", "妨礙本服務正常運營或擅自蒐集資料的行為", "侵害他人權利的行為"]]}, {"h": "第11條（服務中斷及維護）", "b": ["本服務原則上全年無休、24小時提供。但於維護、設備更換或故障時可能暫時中斷，能事先通知者，將於服務頁面提前通知。", "因本公司故意或過失致使用者受有損害者，本公司依相關法令賠償。"]}, {"h": "第12條（責任限制）", "b": ["因YouTube方面的原因（影片刪除、嵌入限制等），部分歌曲可能無法播放或清單可能變動，屆時將提示「在YouTube開啟」。", "對於天災、外部 API·通訊故障等超出本公司合理控制範圍的事由所致損害，本公司不承擔責任。"]}, {"h": "第13條（裝置存取權限）", "b": ["本服務僅在點按「錄影」時使用相機和麥克風。首次使用時瀏覽器會請求許可，不允許時僅無法錄影，其他功能照常可用。", "錄影只存在使用者裝置上，不會傳送給本公司。「發布我的歌」開放後，只有使用者選擇發布的影片才會傳送給本公司。", "不使用位置等其他裝置存取權限。以應用程式形式提供而需要存取權限時，將區分必要權限與選擇權限，事先告知原因並取得同意（《資訊通信網法》第22條之2）。"]}, {"h": "第14條（準據法及管轄）", "b": ["本條款依大韓民國法律解釋，與本服務使用相關的糾紛由依相關法律確定的管轄法院處理。"]}, {"h": "第15條（諮詢）", "b": ["有關本服務使用的諮詢，請聯絡客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）。"]}]}, "es": {"title": "Términos de Servicio", "eff": "Fecha de entrada en vigor: ____-__-__", "app": "Money Puzzle Karaoke · 머니퍼즐 노래방", "sec": [{"h": "Artículo 1 (Objeto)", "b": ["Estos Términos regulan el uso del servicio de karaoke «Money Puzzle Karaoke» (https://karaoke.moneypuzzle.co.kr, «el Servicio») prestado por Booman Inc. («la Empresa»)."]}, {"h": "Artículo 2 (El Servicio)", "b": ["El Servicio ofrece:", ["Reproducción de vídeos de karaoke de el canal oficial de YouTube de Kumyoung (KY) (con el reproductor integrado de YouTube, gratis)", "Venta de bonos de canciones de karaoke prepagados (vendedor: la Empresa)", "Inicio de sesión con Google o Apple y conservación de tus bonos"], "El pago de los bonos se hace a la Empresa a través de la ventana de pago de su pasarela contratada. La Empresa no recibe ni guarda números de tarjeta u otros datos de pago."]}, {"h": "Artículo 3 (Bono de canciones de karaoke)", "b": ["La Empresa vende un «bono de canciones» prepago para el karaoke del Servicio (₩1,000 por canción; los packs incluyen canciones de regalo). Los packs y precios son los que se muestran en la pantalla de venta.", "Se descuenta una canción del bono por cada canción con acompañamiento con licencia (en preparación) que se cante. Los vídeos de karaoke de los canal oficial de KY (Kumyoung) en YouTube son gratis y no usan el bono.", "Los bonos se guardan en tu cuenta y se conservan 1 año desde la compra.", "Reembolsos: en los 7 días siguientes a la compra, el importe pagado menos las canciones usadas a ₩1,000 cada una; pasados 7 días (dentro del año de conservación), ese importe menos una comisión de reembolso del 10%. Las canciones de regalo no son reembolsables y, si el resultado es ₩0 o menos, no hay reembolso (redondeo a la baja a ₩10). Los detalles siguen la Política de reembolso.", "Los pagos del bono están en modo de prueba (UNDER TESTING); los pagos de prueba no se cobran realmente."]}, {"h": "Artículo 4 (Uso por menores)", "b": ["Los menores de 14 años necesitan el consentimiento de su representante legal (padre, madre, etc.) para usar el Servicio.", "Si un menor (menos de 19 años) compra un bono sin el consentimiento de su representante legal, el menor o el representante pueden cancelar la compra, salvo en los casos que fije la ley, como compras hechas con dinero de bolsillo que el representante le permitió gastar."]}, {"h": "Artículo 5 (Disponibilidad de canciones)", "b": ["Los vídeos de karaoke gratuitos se muestran tal como están en el canal oficial de KY en YouTube, por lo que una canción puede desaparecer de la lista o no reproducirse si el vídeo se elimina o se bloquea su inserción.", "Aunque cambie la lista, tus bonos restantes se conservan y no se descuenta ningún bono por una canción que no se reprodujo."]}, {"h": "Artículo 6 (Bonos restantes al darte de baja)", "b": ["Antes de darte de baja (eliminar tu cuenta), puedes pedir el reembolso de las canciones restantes según la Política de reembolso.", "Incluso después de darte de baja, puedes pedir el reembolso de las canciones restantes dentro de 1 año desde la compra con tu registro de pago. Si no lo pides en 1 año, los bonos restantes caducan."]}, {"h": "Artículo 7 (Derechos de autor y alcance de uso)", "b": ["Los derechos de los vídeos de karaoke y del acompañamiento, letras e imágenes que contienen pertenecen a Kumyoung Entertainment y otros titulares. Los derechos de las pantallas, logotipos y textos del Servicio pertenecen a la Empresa.", "Solo puedes usar el Servicio para cantar y escuchar de forma personal. No puedes copiar, distribuir ni emitir los vídeos, acompañamientos o letras, ni usarlos con fines de lucro, por ejemplo en un negocio."]}, {"h": "Artículo 8 (Publicación de grabaciones — función en preparación)", "b": ["Las funciones de este artículo (grabar canciones y publicarlas en «Escenario» y «Mi escenario») están en preparación y se aplican desde el día en que se abran.", ["Los derechos sobre la voz y el vídeo de las canciones que publiques son tuyos. Permites a la Empresa, sin coste, mostrar esas canciones en el Servicio y usarlas para promocionarlo. Si borras una canción, la Empresa deja de usarla.", "Los derechos del acompañamiento y la letra de una grabación pertenecen a Kumyoung Entertainment y otros titulares, por lo que no puedes descargar grabaciones fuera del Servicio ni publicarlas en otro lugar.", "Los menores de 14 años no pueden publicar canciones. La Empresa comprueba tu año de nacimiento la primera vez que publiques.", "No puedes publicar caras o voces de otras personas sin permiso, contenido obsceno, violento o de odio, insultos, nada que infrinja derechos ajenos ni publicidad.", "El Escenario es solo para vídeos de personas cantando. La Empresa puede borrar sin previo aviso todo lo que no sea un vídeo cantando.", "Si una canción es denunciada o entra en lo anterior, la Empresa puede ocultarla o borrarla, y puede limitar la publicación si se repite.", "Puedes borrar tus canciones en cualquier momento, y tus canciones publicadas se borran al darte de baja.", "Las fotos temáticas se crean solo a partir de tu propia grabación; las demás personas que aparecen son personas ficticias creadas por IA. Las fotos temáticas llevan la marca «Generado por IA»."]]}, {"h": "Artículo 9 (Enlaces externos)", "b": ["El Servicio puede ofrecer enlaces a sitios o apps externos para su comodidad. La Empresa no se responsabiliza del contenido, las transacciones ni la exactitud de esos servicios externos.", "Los vídeos de karaoke los ofrecen YouTube y los canales oficiales correspondientes; los anuncios, el contenido y la disponibilidad de los vídeos siguen las políticas de YouTube y de dichos canales."]}, {"h": "Artículo 10 (Obligaciones del usuario y actos prohibidos)", "b": ["El usuario no debe:", ["actuar en contra de la ley o del orden público y las buenas costumbres", "interferir en el funcionamiento normal del Servicio o recopilar datos sin autorización", "vulnerar los derechos de terceros"]]}, {"h": "Artículo 11 (Interrupción y mantenimiento del servicio)", "b": ["En principio, el Servicio está disponible las 24 horas, todo el año. Puede interrumpirse temporalmente por mantenimiento, cambio de equipos o averías; cuando sea posible, lo avisaremos antes en el Servicio.", "Si sufres un daño por dolo o negligencia de la Empresa, esta te indemnizará conforme a la ley aplicable."]}, {"h": "Artículo 12 (Limitación de responsabilidad)", "b": ["Por motivos de YouTube (vídeos eliminados, restricciones de inserción, etc.), algunas canciones pueden no reproducirse o la lista puede cambiar; en ese caso ofrecemos «Abrir en YouTube».", "La Empresa no responde por daños derivados de causas ajenas a su control razonable, como fuerza mayor o fallos de API externas o de las comunicaciones."]}, {"h": "Artículo 13 (Permisos del dispositivo)", "b": ["El Servicio usa la cámara y el micrófono solo cuando tocas «Grabar». La primera vez, el navegador pide permiso; si no lo das, solo no podrás grabar y todo lo demás seguirá funcionando.", "Las grabaciones se quedan en tu dispositivo y no se envían a la Empresa. Cuando se abra «Publicar mi canción», solo se enviarán las grabaciones que decidas publicar.", "No se usan otros permisos del dispositivo, como la ubicación. Si el Servicio se ofrece como app y necesita permisos, te indicaremos antes cuáles son obligatorios y cuáles opcionales, con sus motivos, y pediremos tu consentimiento (artículo 22-2 de la Ley de Redes)."]}, {"h": "Artículo 14 (Ley aplicable y jurisdicción)", "b": ["Estos Términos se interpretan conforme a las leyes de la República de Corea, y los conflictos relativos al Servicio se resuelven ante el tribunal competente según la ley aplicable."]}, {"h": "Artículo 15 (Contacto)", "b": ["Para consultas sobre el Servicio, contacte con Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr)."]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/admin@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

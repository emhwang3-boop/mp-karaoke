raoke.moneypuzzle.co.kr, \"the Service\") provided by Booman Inc. (\"the Company\")."]},{"h":"Article 2 (The Service)","b":["The Service provides:",["Playback of karaoke videos from the official YouTube channel of Kumyoung (KY) (via the YouTube embedded player, free of charge)","Sale of prepaid karaoke song passes (seller: the Company)","Sign-in with Google or Apple and storage of your song passes"],"Payment for song passes is made to the Company through the payment window of its contracted payment gateway (Toss Payments). The Company does not receive or store card numbers or other payment details."]},{"h":"Article 3 (Karaoke song pass)","b":["The Company sells a prepaid “song pass” for the karaoke in the Service (₩1,000 per song; bundles include bonus songs). Bundles and prices are as shown on the sales screen.","The song pass is used one song at a time when singing licensed accompaniment songs (in preparation). Karaoke videos from the official KY (Kumyoung) YouTube channel are free and do not use the song pass.","Song passes are saved to your signed-in account and kept for 1 year from purchase.","Refunds: within 7 days of purchase, we refund the amount paid minus the songs used at ₩1,000 per song; after 7 days (within the 1-year storage period), that amount minus a 10% refund fee. Bonus songs are not refundable, and if the result is ₩0 or less there is no refund (rounded down to ₩10). Details follow the Refund Policy.","Song pass payments are currently in test mode (UNDER TESTING); test payments are not actually charged."]},{"h":"Article 4 (External links)","b":["The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services.","Karaoke videos are provided by YouTube and the respective official channels; ads, content and availability within the videos follow the policies of YouTube and those channel operators."]},{"h":"Article 5 (User obligations and prohibited acts)","b":["You must not:",["act in violation of law or public order and morals","interfere with the normal operation of the Service or collect data without authorization","infringe the rights of others"]]},{"h":"Article 6 (Limitation of liability)","b":["Due to YouTube (e.g. removed videos or embedding restrictions), some songs may not play or the list may change; in that case we offer “Open on YouTube”.","The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]},{"h":"Article 7 (Governing law and jurisdiction)","b":["These Terms are construed under the laws of the Republic of Korea, and disputes relating to the Service are handled by the court of competent jurisdiction under applicable law."]},{"h":"Article 8 (Contact)","b":["For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]}]},"ja":{"title":"利用規約","eff":"施行日：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供するカラオケサービス「マネーパズル カラオケ（Money Puzzle Karaoke）」（https://karaoke.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]},{"h":"第2条（サービスの内容）","b":["本サービスは次のものを提供します。",["クミョン（KY）公式YouTubeチャンネルのカラオケ動画の再生（YouTube埋め込みプレーヤー使用・無料）","カラオケ曲チケット（前払い）の販売（販売当事者：当社）","Google・Appleアカウントでのログインおよび曲チケットの保管"],"曲チケットの代金は、当社が契約した電子決済代行会社（トスペイメンツ）の決済画面を通じて当社に支払われます。当社はカード番号などの決済情報を直接受け取ったり保存したりしません。"]},{"h":"第3条（カラオケ曲チケット）","b":["当社は、サービス内カラオケで使う前払いの「曲チケット」を販売します（1曲1,000ウォン、まとめ買いでサービス曲付き）。パック内容と価格は販売画面の表示どおりです。","曲チケットは正式な伴奏曲（準備中）を歌うとき、1曲ごとに1曲分使います。KY（クミョン）公式YouTubeチャンネルのカラオケ動画は無料で、曲チケットは消費しません。","曲チケットはログインしたアカウントに保存され、購入日から1年間保管されます。","返金：購入日から7日以内は支払額から使った曲を1曲1,000ウォンとして差し引いた金額を、7日を過ぎた後（保管期間1年以内）はその金額から返金手数料10%を差し引いた金額を返金します。サービス曲は返金対象外で、計算結果が0ウォン以下の場合は返金額はありません（10ウォン未満切り捨て）。詳細は返金規定に従います。","現在、曲チケットの決済はテスト運用中（UNDER TESTING）で、テスト決済は実際には請求されません。"]},{"h":"第4条（外部リンクの免責）","b":["本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。","カラオケ動画はYouTubeおよび各公式チャンネルが提供するもので、動画内の広告・内容・再生可否はYouTubeおよび当該チャンネル運営会社のポリシーに従います。"]},{"h":"第5条（利用者の義務および禁止行為）","b":["利用者は次の行為をしてはなりません。",["法令または公序良俗に反する行為","本サービスの正常な運営を妨げ、または無断でデータを収集する行為","他人の権利を侵害する行為"]]},{"h":"第6条（責任の限界）","b":["YouTube側の事情（動画の削除・埋め込み制限など）により、一部の曲が再生できなかったり一覧が変わったりすることがあります。その場合は「YouTubeで開く」をご案内します。","当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]},{"h":"第7条（準拠法および管轄）","b":["本規約は大韓民国の法律に従って解釈され、本サービスの利用に関する紛争は関連法令に基づく管轄裁判所で取り扱われます。"]},{"h":"第8条（お問い合わせ）","b":["本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]}]},"zhs":{"title":"使用条款","eff":"施行日期：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本条款旨在规定 Booman Inc.（株式会社 부만，以下称“本公司”）提供的卡拉OK服务“Money Puzzle Karaoke（머니퍼즐 노래방）”（https://karaoke.moneypuzzle.co.kr，以下称“本服务”）的使用条件。"]},{"h":"第2条（服务内容）","b":["本服务提供以下内容：",["播放金永（KY）官方YouTube频道的卡拉OK视频（使用YouTube嵌入式播放器，免费）","销售卡拉OK点歌券（预付）（销售方：本公司）","Google·Apple 账号登录及点歌券保存"],"点歌券款项通过本公司签约的电子支付代理机构（Toss Payments）的支付页面支付给本公司。本公司不直接接收或保存卡号等支付信息。"]},{"h":"第3条（卡拉OK点歌券）","b":["本公司销售在服务内卡拉OK使用的预付“点歌券”（每首₩1,000，购买套餐赠送歌曲）。套餐内容和价格以销售页面显示为准。","点歌券在演唱正式伴奏歌曲（筹备中）时每首扣一首。金永（KY）官方YouTube频道的卡拉OK视频免费，不扣点歌券。","点歌券保存在已登录的账户中，自购买日起保留1年。","退款：购买后7天内退还支付金额减去已用歌曲（每首₩1,000）后的金额；超过7天后（1年保存期内）再扣除10%退款手续费后退还。赠送歌曲不在退款范围内，计算结果为₩0或以下时不予退款（不足₩10舍去）。详情依退款规定。","目前点歌券付款处于测试运营（UNDER TESTING），测试付款不会实际扣款。"]},{"h":"第4条（外部链接免责）","b":["为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。","卡拉OK视频由YouTube及各官方频道提供，视频中的广告、内容及能否播放遵循YouTube及相关频道运营方的政策。"]},{"h":"第5条（用户义务及禁止行为）","b":["用户不得有下列行为：",["违反法律或公序良俗的行为","妨碍本服务正常运营或擅自收集数据的行为","侵害他人权利的行为"]]},{"h":"第6条（责任限制）","b":["因YouTube方面的原因（视频删除、嵌入限制等），部分歌曲可能无法播放或列表可能变化，届时将提示“在YouTube打开”。","对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]},{"h":"第7条（准据法及管辖）","b":["本条款依大韩民国法律解释，与本服务使用相关的纠纷由依相关法律确定的管辖法院处理。"]},{"h":"第8条（咨询）","b":["有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]}]},"zht":{"title":"使用條款","eff":"施行日期：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1條（目的）","b":["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的卡拉OK服務「Money Puzzle Karaoke（머니퍼즐 노래방）」（https://karaoke.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]},{"h":"第2條（服務內容）","b":["本服務提供以下內容：",["播放金永（KY）官方YouTube頻道的卡拉OK影片（使用YouTube嵌入式播放器，免費）","銷售卡拉OK點歌券（預付）（銷售方：本公司）","Google·Apple 帳號登入及點歌券保存"],"點歌券款項透過本公司簽約的電子支付代理機構（Toss Payments）的付款頁面支付給本公司。本公司不直接接收或保存卡號等付款資訊。"]},{"h":"第3條（卡拉OK點歌券）","b":["本公司銷售在服務內卡拉OK使用的預付「點歌券」（每首₩1,000，購買套餐贈送歌曲）。套餐內容和價格以銷售頁面顯示為準。","點歌券在演唱正式伴奏歌曲（籌備中）時每首扣一首。金永（KY）官方YouTube頻道的卡拉OK影片免費，不扣點歌券。","點歌券保存在已登入的帳戶中，自購買日起保留1年。","退款：購買後7天內退還付款金額減去已用歌曲（每首₩1,000）後的金額；超過7天後（1年保存期內）再扣除10%退款手續費後退還。贈送歌曲不在退款範圍內，計算結果為₩0或以下時不予退款（不足₩10捨去）。詳情依退款規定。","目前點歌券付款處於測試營運（UNDER TESTING），測試付款不會實際扣款。"]},{"h":"第4條（外部連結免責）","b":["為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。","卡拉OK影片由YouTube及各官方頻道提供，影片中的廣告、內容及能否播放依循YouTube及相關頻道營運方的政策。"]},{"h":"第5條（使用者義務及禁止行為）","b":["使用者不得有下列行為：",["違反法律或公序良俗的行為","妨礙本服務正常運營或擅自蒐集資料的行為","侵害他人權利的行為"]]},{"h":"第6條（責任限制）","b":["因YouTube方面的原因（影片刪除、嵌入限制等），部分歌曲可能無法播放或清單可能變動，屆時將提示「在YouTube開啟」。","對於天災、外部 API·通訊故障等超出本公司合理控制範圍的事由所致損害，本公司不承擔責任。"]},{"h":"第7條（準據法及管轄）","b":["本條款依大韓民國法律解釋，與本服務使用相關的糾紛由依相關法律確定的管轄法院處理。"]},{"h":"第8條（諮詢）","b":["有關本服務使用的諮詢，請聯絡客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）。"]}]},"es":{"title":"Términos de Servicio","eff":"Fecha de entrada en vigor: ____-__-__","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"Artículo 1 (Objeto)","b":["Estos Términos regulan el uso del servicio de karaoke «Money Puzzle Karaoke» (https://karaoke.moneypuzzle.co.kr, «el Servicio») prestado por Booman Inc. («la Empresa»)."]},{"h":"Artículo 2 (El Servicio)","b":["El Servicio ofrece:",["Reproducción de vídeos de karaoke de el canal oficial de YouTube de Kumyoung (KY) (con el reproductor integrado de YouTube, gratis)","Venta de bonos de canciones de karaoke prepagados (vendedor: la Empresa)","Inicio de sesión con Google o Apple y conservación de tus bonos"],"El pago de los bonos se hace a la Empresa a través de la ventana de pago de su pasarela contratada (Toss Payments). La Empresa no recibe ni guarda números de tarjeta u otros datos de pago."]},{"h":"Artículo 3 (Bono de canciones de karaoke)","b":["La Empresa vende un «bono de canciones» prepago para el karaoke del Servicio (₩1,000 por canción; los packs incluyen canciones de regalo). Los packs y precios son los que se muestran en la pantalla de venta.","El bono se usa una canción por cada canción con acompañamiento con licencia (en preparación) que se cante. Los vídeos de karaoke de los canal oficial de KY (Kumyoung) en YouTube son gratis y no usan el bono.","Los bonos se guardan en tu cuenta y se conservan 1 año desde la compra.","Reembolsos: en los 7 días siguientes a la compra, el importe pagado menos las canciones usadas a ₩1,000 cada una; pasados 7 días (dentro del año de conservación), ese importe menos una comisión de reembolso del 10%. Las canciones de regalo no son reembolsables y, si el resultado es ₩0 o menos, no hay reembolso (redondeo a la baja a ₩10). Los detalles siguen la Política de reembolso.","Los pagos del bono están en modo de prueba (UNDER TESTING); los pagos de prueba no se cobran realmente."]},{"h":"Artículo 4 (Enlaces externos)","b":["El Servicio puede ofrecer enlaces a sitios o apps externos para su comodidad. La Empresa no se responsabiliza del contenido, las transacciones ni la exactitud de esos servicios externos.","Los vídeos de karaoke los ofrecen YouTube y los canales oficiales correspondientes; los anuncios, el contenido y la disponibilidad de los vídeos siguen las políticas de YouTube y de dichos canales."]},{"h":"Artículo 5 (Obligaciones del usuario y actos prohibidos)","b":["El usuario no debe:",["actuar en contra de la ley o del orden público y las buenas costumbres","interferir en el funcionamiento normal del Servicio o recopilar datos sin autorización","vulnerar los derechos de terceros"]]},{"h":"Artículo 6 (Limitación de responsabilidad)","b":["Por motivos de YouTube (vídeos eliminados, restricciones de inserción, etc.), algunas canciones pueden no reproducirse o la lista puede cambiar; en ese caso ofrecemos «Abrir en YouTube».","La Empresa no responde por daños derivados de causas ajenas a su control razonable, como fuerza mayor o fallos de API externas o de las comunicaciones."]},{"h":"Artículo 7 (Ley aplicable y jurisdicción)","b":["Estos Términos se interpretan conforme a las leyes de la República de Corea, y los conflictos relativos al Servicio se resuelven ante el tribunal competente según la ley aplicable."]},{"h":"Artículo 8 (Contacto)","b":["Para consultas sobre el Servicio, contacte con Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr)."]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/emhwang3@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>

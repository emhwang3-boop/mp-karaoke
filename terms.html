var D={"ko":{"title":"이용약관","eff":"시행일:      년    월    일","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"제1조 (목적)","b":["본 약관은 주식회사 부만(이하 '회사')이 제공하는 노래방 서비스 '머니퍼즐 노래방(Money Puzzle Karaoke)'(https://karaoke.moneypuzzle.co.kr, 이하 '서비스')의 이용 조건을 정하는 것을 목적으로 합니다."]},{"h":"제2조 (서비스의 내용)","b":["서비스는 다음을 제공합니다.",["금영엔터테인먼트 공식 유튜브 채널의 노래방 영상 재생(유튜브 퍼가기 플레이어 사용, 무료)","노래방 포인트(선불)와 기간제 이용권(포인트로 구매)의 판매 (판매 당사자: 회사)","구글·애플 계정 로그인 및 포인트·이용권 보관","노래방 LIVE 방송·선물과 순위 시상"],"포인트 대금은 회사가 계약한 전자지급결제대행사의 결제창 또는 앱 마켓 결제를 통해 회사에 지급됩니다. 회사는 카드 번호 등 결제 정보를 직접 받거나 저장하지 않습니다."]},{"h":"제3조 (노래방 이용권)","b":["회사는 서비스 안 노래방에서 쓰는 기간제 「이용권」을 판매합니다. 이용권은 포인트로 구매하며, 기간과 가격은 1개월 7,000P · 3개월 17,000P · 6개월 30,000P · 12개월 50,000P입니다. 가격은 구매 화면에 표시된 대로입니다.","이용권 기간에는 노래를 무제한으로 부를 수 있습니다. 이용권은 자동으로 연장(갱신)되지 않으며, 기간이 끝나도 따로 결제되지 않습니다.","이용권은 로그인한 계정에 적용됩니다. 이용 중에 다시 구매하면 지금 이용 중인 이용권이 끝나는 날부터 새 기간이 이어집니다.",["환불(구매일로부터 7일 이내이고 노래를 부르지 않은 경우): 전액을 환불합니다.","환불(그 밖의 경우): 남은 일수에 해당하는 금액에서 그 금액의 10%를 공제하고 환불합니다(콘텐츠이용자보호지침, 소비자분쟁해결기준의 계속거래 기준). 10P 미만은 환불하지 않습니다.","이용권 환불은 이용권 구매에 사용한 유료 포인트 몫만 결제한 수단으로 환불하며(1P = 1원), 무료 포인트로 산 몫은 환불하지 않습니다. 이 금액에서 포인트 환불 수수료를 다시 공제하지 않습니다. 앱 마켓에서 충전한 포인트로 산 몫은 해당 앱 마켓의 환불 규정을 따릅니다. 환불을 요청하면 이용권은 바로 끝납니다."],"이전에 구매한 곡 이용권(잔여 곡)은 그대로 유효하며, 구매일로부터 1년간 보관됩니다. 곡 이용권은 더 이상 판매하지 않습니다.","자세한 내용은 환불 규정을 따릅니다."]},{"h":"제3조의2 (포인트)","b":["회사는 서비스 안 노래방에서 사용하는 선불 「포인트」를 판매합니다. 1포인트(P)는 1원에 해당하며, 충전 단위와 가격은 각 구매 화면에 표시된 대로입니다.","포인트는 로그인한 계정의 지갑 하나에 기록되며, 웹과 전용 앱에서 같은 포인트를 충전하고 사용합니다.","포인트는 유료 포인트(이용자가 결제로 충전한 포인트)와 무료 포인트(충전 혜택·이벤트 등으로 회사가 무상으로 지급한 포인트)로 나누어 기록합니다.","포인트를 사용할 때는 유료 포인트를 먼저(먼저 충전한 것부터) 사용하고, 그다음 무료 포인트를 사용합니다. 포인트를 사용하기 전에는 사용할 포인트와 사용 후 잔여 포인트를 화면에 표시하고 이용자의 확인을 받습니다.",["유효기간: 포인트는 충전(지급)일로부터 1년간 사용할 수 있으며, 유효기간이 지난 포인트는 사용할 수 없습니다.","유효기간 연장: 유효기간 안에 이용자가 요청하면 유료 포인트의 유효기간을 3개월씩 연장합니다(「내 지갑 → 기간 연장」). 다만 연장된 유효기간은 충전일로부터 5년을 넘을 수 없습니다.","만료 알림: 회사는 유효기간 만료 30일 전을 포함하여 3회 이상 만료일, 연장 가능 여부와 방법, 만료 후에도 잔여 유료 포인트를 환불받을 수 있다는 사실을 이메일 또는 서비스 화면으로 알립니다."],["환불(구매일로부터 7일 이내): 사용하지 않은 유료 포인트는 일부를 사용했더라도 수수료 없이 전부 환불합니다.","환불(구매일로부터 7일이 지난 뒤, 유효기간 안): 잔여 유료 포인트에서 10% 이내의 환불 수수료를 공제하고 환불합니다. 적용 수수료율은 환불 요청 화면에 표시합니다. 다만 잔여 유료 포인트가 10,000P 이하인 경우에는 수수료 대신 1,000원을 공제하며, 공제 후 금액이 공제액보다 적으면 환불되지 않습니다.","환불(유효기간이 지난 뒤): 충전일로부터 5년까지 잔여 유료 포인트의 90%를 환불합니다.","무료 포인트는 환불 대상이 아니며, 환불을 처리할 때 함께 소멸합니다. 10원 미만은 환불하지 않습니다."],"환불은 「내 지갑 → 환불 요청」 또는 고객센터로 요청할 수 있으며, 회사가 확인한 뒤 결제한 수단으로 환불합니다. 환불 요청 중인 포인트는 처리가 끝날 때까지 사용할 수 없습니다.","구글 플레이·앱스토어 등 앱 마켓에서 구매한 포인트의 환불은 해당 앱 마켓의 환불 규정을 따릅니다. 앱 마켓에서 결제가 취소·환불되면 그 결제로 충전된 포인트(함께 지급된 무료 포인트 포함)를 지갑에서 차감하며, 이미 사용한 경우에는 다른 포인트 또는 이후 충전되는 포인트에서 차감합니다."]},{"h":"제4조 (미성년자의 이용)","b":["서비스는 만 15세 이상 이용할 수 있으며, 만 15세 미만은 이용할 수 없습니다. 만 15세 이상 18세 이하(청소년)도 이용할 수 있습니다.","회사는 서비스(앱)에 들어올 때 휴대폰 본인인증으로 만 15세 이상인지 한 번 확인하며, 본인인증을 마치지 않으면 서비스를 이용할 수 없습니다. 인증 결과 중 태어난 해와 성별만 저장합니다.","청소년(만 15~18세)은 한 달에 200,000원까지 포인트를 충전할 수 있습니다. 미성년자가 법정대리인의 동의 없이 한 결제는 미성년자 본인 또는 법정대리인이 관련 법령(민법 제5조 등)에 따라 취소할 수 있으며, 회사는 결제 취소·환불을 관련 법령에 따라 처리합니다.","「주변 노래 친구」에서 청소년(만 15~18세)은 청소년끼리만, 성인(19세 이상)은 성인끼리만 서로 보이고 팔로우할 수 있으며, 앱 안 방 초대는 맞팔 친구끼리만 할 수 있습니다(제13조의2).","만 15세 미만의 이용이 확인되면 회사는 이용을 제한할 수 있습니다."]},{"h":"제5조 (곡 제공 조건)","b":["무료 노래방 영상은 금영 공식 유튜브 채널에 올라온 영상을 그대로 보여 주는 것이어서, 영상이 내려가거나 퍼가기가 막히면 목록에서 빠지거나 재생되지 않을 수 있습니다.","곡 목록이 바뀌어도 이용권 기간과 이전에 구매한 잔여 곡은 그대로이며, 재생되지 않은 곡에는 잔여 곡이 차감되지 않습니다."]},{"h":"제6조 (탈퇴 시 남은 이용권·잔여 곡)","b":["탈퇴(계정 삭제) 전에 환불 규정에 따라 남은 이용권·포인트·잔여 곡의 환불을 요청할 수 있습니다.","탈퇴한 뒤에도 구매일로부터 1년 안에는 결제 기록으로 잔여 곡의 환불을 요청할 수 있습니다. 환불 요청 없이 1년이 지나면 잔여 곡은 소멸합니다."]},{"h":"제7조 (저작권 및 이용 범위)","b":["노래방 영상과 그 안의 반주·가사·영상의 권리는 금영엔터테인먼트 등 각 권리자에게 있고, 서비스의 화면·로고·글의 권리는 회사에 있습니다.","이용자는 서비스를 개인적으로 노래하고 감상하는 데에만 이용할 수 있으며, 영상·반주·가사를 복제·배포·방송하거나 영업장 등에서 영리 목적으로 이용해서는 안 됩니다."]},{"h":"제8조 (녹음·녹화물 게시)","b":["이 조항은 노래 녹음·녹화와 「스테이지」·「내 스테이지」 게시 기능에 적용됩니다.",["이용자가 올린 노래의 목소리·영상에 대한 권리는 이용자에게 있습니다. 이용자는 회사가 그 노래를 서비스 안에서 보여 주고 서비스를 알리는 데 무상으로 쓸 수 있도록 허락합니다. 이용자가 노래를 지우면 회사도 더 이상 쓰지 않습니다.","녹음·녹화물 안의 반주·가사의 권리는 금영엔터테인먼트 등 권리자에게 있으므로, 서비스 밖으로 내려받거나 다른 곳에 올릴 수 없습니다.","노래는 본인인증(만 15세 이상)을 마친 이용자만 올릴 수 있습니다.","다른 사람의 얼굴·목소리를 허락 없이 담은 것, 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리를 침해하는 것, 광고는 올릴 수 없습니다.","스테이지는 노래를 부르는 영상만 올리는 곳입니다. 노래를 부르는 영상이 아닌 것은 회사가 예고 없이 지울 수 있습니다.","신고가 들어오거나 위 내용에 해당하면 회사는 그 노래를 숨기거나 지울 수 있으며, 되풀이하면 올리기를 제한할 수 있습니다.","이용자는 언제든 자기 노래를 지울 수 있고, 탈퇴하면 올린 노래도 지워집니다.","상황 사진은 이용자 본인의 녹화 영상으로만 만들며, 함께 나오는 다른 인물은 AI가 만든 가상 인물입니다. 상황 사진에는 「AI 생성」이 표시됩니다.","단체 AI 사진은 우리끼리 노래 방·도란도란 방에서 「참여」를 누른 사람의 얼굴로만 만들며, 「참여」를 누르는 것이 얼굴 사진 이용에 대한 동의입니다. 참여할 때 촬영한 얼굴 사진은 생성에만 임시로 쓰고 생성 후 바로 삭제합니다. 요금(5,000P)은 시작한 사람이 내며, 생성에 실패하면 자동으로 환불됩니다. 단체 AI 사진에도 「AI 생성」이 표시됩니다."]]},{"h":"제8조의2 (LIVE 방송)","b":["이 조항은 노래방 「LIVE」 기능에 적용됩니다.",["LIVE 방송은 본인인증한 성인만 시작할 수 있습니다. 관람·댓글·반응은 서비스를 이용할 수 있는 이용자가 할 수 있으며, 관람에는 포인트가 사용되지 않습니다.","방송인은 방송 중 관람객 1명이 1시간 시청할 때 100P를 1분 단위로 부담합니다. 회사는 방송을 시작할 때 이를 화면에 알리고, 잔여 포인트가 0P가 되면 방송을 자동으로 종료합니다.","관람객은 방송인에게 포인트로 선물을 보낼 수 있습니다. 선물의 종류·가격과 한도(1인 하루 500,000P)는 화면에 표시된 대로이며, 청소년(만 15~18세)은 선물을 보낼 수 없습니다. 보낸 선물은 취소·환불되지 않습니다. 다만 관련 법령에 따라 취소할 수 있는 경우는 예외로 합니다.","방송인은 받은 선물 금액의 70%를 무료 포인트로 적립받습니다. 적립된 포인트는 서비스 안에서만 사용할 수 있으며 현금으로 바꾸거나 환불할 수 없습니다.","방송에도 음란·폭력·혐오 표현, 욕설, 다른 사람의 권리 침해, 광고는 금지됩니다. 회사는 신고가 들어오거나 이를 위반한 방송을 예고 없이 종료할 수 있고, 되풀이하면 방송을 제한할 수 있습니다. 방송인은 관람객을 내보낼 수 있습니다.","회사는 신고 처리와 분쟁 대응을 위해 방송 영상을 비공개로 30일간 보관한 뒤 삭제하며, 보관 영상은 관리자만 열람합니다."]]},{"h":"제8조의3 (순위 시상)","b":[["회사는 전체 공개 노래 영상을 대상으로 주간·월간·연말(왕중왕) 순위를 발표하고 1위에게 상금을 포인트로 지급합니다. 기준과 상금은 서비스 화면에 표시된 대로입니다.","상금은 무료 포인트로 자동 지급되며, 유효기간은 지급일로부터 1년입니다. 환불하거나 현금으로 바꿀 수 없습니다.","수상자에게는 프로필 별이 표시됩니다. 주간·월간 별은 해가 바뀌면 사라지고 왕중왕 별은 유지됩니다.","부정한 방법으로 순위에 영향을 준 영상은 순위에서 제외할 수 있습니다."]]},{"h":"제8조의4 (자동 감시)","b":["StageSong에는 음성과 화면을 살피는 자동 감시 시스템이 설치되어 있습니다.","LIVE 방송: 폰 안 판별과 함께 저해상도 화면과 음성 조각을 서버에서 판별합니다. 판별에 쓴 화면과 음성은 저장하지 않으며, 댓글의 욕설은 가려서 표시합니다.","도란도란·우리끼리 노래: 화면만 내 폰 안에서 5초마다 판별하고, 영상과 소리는 서버로 보내지 않습니다. 소리는 판별하지 않으며 욕설은 방 사람의 신고로 처리합니다. 처음 입장할 때 동의가 필요합니다.","게시 영상: 올릴 때 화면 표본을 판별하고 제목·설명·댓글의 욕설을 확인합니다. 문제가 있으면 「나만 보기」로 올라갑니다.","처음에는 화면을 몇 초 가리고 안내합니다. 높은 확신의 감지가 연속되고 반복될 때만 강퇴와 24시간 이용 제한이 적용되며, 음성·욕설 자동 판정은 안내까지만 합니다.","제한 안내의 「이의 신청」을 누르면 확인 후 해제되며, 오판으로 해제되면 이용권 기간과 사용한 포인트를 복구합니다.","자동 판정에는 오판이 있을 수 있어 회사는 임계값을 보수적으로 운영합니다. 자동 감시에 쓰인 화면과 음성은 판별 뒤 저장하지 않으며, 미성년자가 관련될 수 있는 장면은 어떤 경우에도 저장하지 않습니다."]},{"h":"제9조 (외부 링크 면책)","b":["서비스는 이용자의 편의를 위해 외부 사이트·앱으로 연결되는 링크를 제공할 수 있습니다. 회사는 외부 서비스의 내용·거래·정확성에 대해 책임지지 않습니다.","노래방 영상은 유튜브와 각 공식 채널이 제공하며, 영상 안의 광고·내용·재생 가능 여부는 유튜브 및 해당 채널 운영사의 정책을 따릅니다."]},{"h":"제10조 (이용자의 의무 및 금지 행위)","b":["이용자는 다음 행위를 하여서는 안 됩니다.",["법령 또는 공서양속에 반하는 행위","서비스의 정상적인 운영을 방해하거나 무단으로 데이터를 수집하는 행위","타인의 권리를 침해하는 행위"]]},{"h":"제11조 (서비스 중단 및 점검)","b":["서비스는 연중무휴 24시간 제공을 원칙으로 합니다. 다만 점검·설비 교체·장애가 있을 때는 일시 중단할 수 있으며, 미리 알릴 수 있는 경우에는 서비스 화면으로 미리 알립니다.","회사의 고의 또는 과실로 이용자에게 손해가 생긴 경우 회사는 관련 법령에 따라 배상합니다."]},{"h":"제12조 (책임의 한계)","b":["유튜브 사정(영상 삭제·퍼가기 제한 등)으로 일부 곡은 재생되지 않거나 목록이 바뀔 수 있으며, 이 경우 「유튜브에서 열기」로 안내합니다.","회사는 천재지변, 외부 API·통신의 장애 등 회사의 합리적 통제를 벗어난 사유로 인한 손해에 대해 책임을 지지 않습니다."]},{"h":"제13조 (기기 접근 권한)","b":["서비스는 「녹화」를 누를 때만 카메라와 마이크를 씁니다. 처음 쓸 때 브라우저가 허락을 묻고, 허락하지 않으면 녹화만 쓸 수 없고 다른 기능은 그대로 쓸 수 있습니다.","녹화한 영상은 이용자의 기기 안에 저장되며, 이용자가 「내 노래 올리기」로 올리기를 고른 영상만 회사로 보내집니다.","위치는 「주변 노래 친구」에서 「내 위치 보이기」를 켤 때만 대략 위치(약 1km)를 씁니다. 처음 켤 때 위치정보 이용 동의를 받고 브라우저 또는 앱이 위치 권한을 묻습니다(앱은 대략 위치 권한만 요청). 그 밖의 기기 접근 권한은 쓰지 않으며, 접근 권한이 더 필요해지면 꼭 필요한 권한과 선택 권한을 나누어 그 이유와 함께 미리 알리고 동의를 받습니다(정보통신망법 제22조의2)."]},{"h":"제13조의2 (위치기반서비스 — 주변 노래 친구)","b":["회사는 「위치정보의 보호 및 이용 등에 관한 법률」에 따라 위치기반서비스사업을 신고한 사업자입니다(주식회사 부만, 신고 제1866호).","서비스 내용: 「주변 노래 친구」는 로그인하고 「내 위치 보이기」를 켠 이용자끼리(본인인증은 StageSong을 처음 열 때 한 번 진행합니다) 서로의 거리 구간(1km·3km·10km 이내)과 최근 전체 공개 노래를 보여 주며, 보기·좋아요·댓글·팔로우를 할 수 있게 합니다. 위치를 켜지 않으면 다른 사람의 목록도 볼 수 없습니다. 위치 이용에는 요금이 없습니다.",["처음 켤 때 위치정보 이용에 동의해야 하며, 회사는 동의를 계정별로 시각과 함께 기록합니다.","위치는 약 1km 단위로 줄여 저장하며, 정확한 좌표·주소는 저장하거나 다른 이용자에게 보여 주지 않습니다.","위치는 켜 둔 동안만 보관하고, 끄거나 24시간이 지나거나 동의를 철회하면 지체 없이 파기합니다.","회사는 위치정보 이용·제공 사실 확인자료(이용 시각·목적·계정)를 자동으로 기록하여 6개월간 보관한 뒤 파기합니다.","이용자는 언제든 「내 위치 보이기」를 끄거나 「위치정보 동의 철회」로 동의를 철회할 수 있으며, 위치정보 이용·제공 사실 확인자료의 열람·고지와 오류 정정을 요구할 수 있습니다.","회사는 위치정보를 다른 이용자에게 거리 구간으로만 보여 주며, 법령에 따른 경우를 제외하고 그 밖의 제3자에게 제공하지 않습니다.","목록에는 본인인증 결과로 나이대와 성별이 함께 표시됩니다(예: 「20대 · 남」, 만 15~18세는 「10대」). 성별은 늘 표시되며, 정확한 나이·생일은 표시하지 않습니다. 본인인증 결과가 없는 계정은 나이대 없이 표시됩니다.","청소년(만 15~18세)은 청소년끼리만, 성인(19세 이상)은 성인끼리만 서로 목록에 보이고 팔로우할 수 있습니다.","목록은 「전체 / 같은 나이대 / 여성만 / 남성만」으로 거를 수 있습니다. 본인인증한 여성은 「여성에게만 내 위치 보이기」를 켤 수 있으며, 켜면 남성 이용자와 서로 목록에 보이지 않습니다.","「주변 노래 친구」에서는 모르는 사람을 방에 초대할 수 없습니다. 앱 안에서 우리끼리 노래 방·도란도란에 사람을 넣거나 초대하는 것은 서로 팔로우한 「맞팔 친구」끼리만 할 수 있으며, 회사가 이를 확인합니다. 이용자가 카카오톡 등으로 직접 보내는 초대 링크는 그대로 이용할 수 있습니다.","이용자는 다른 이용자를 차단·신고할 수 있습니다. 차단하면 서로 목록에 보이지 않고 초대를 주고받지 못합니다. 맞팔 친구 초대는 하루 20번, 대기 중인 초대는 3개까지 보낼 수 있습니다."],"위치정보관리책임자: 황의만 (고객센터 010-4221-7066 · admin@moneypuzzle.co.kr)","위치정보와 관련한 분쟁은 방송통신위원회 또는 개인정보분쟁조정위원회에 조정을 신청할 수 있으며, 회사의 위치정보 처리로 이용자에게 손해가 생긴 경우 회사는 관련 법령에 따라 배상합니다."]},{"h":"제14조 (준거법 및 관할)","b":["회사와 이용자 간에 제기된 소송은 대한민국 법을 준거법으로 합니다.","회사와 이용자 간 발생한 분쟁에 관한 소송은 민사소송법상의 관할법원에 제기합니다.","이용자가 외국 거주자인 경우, 회사와 이용자 간에 발생한 분쟁에 관한 소송은 전항에도 불구하고 대한민국 서울중앙지방법원을 전속 관할 법원으로 합니다."]},{"h":"제15조 (문의)","b":["서비스 이용에 관한 문의는 고객센터(010-4221-7066) 또는 이메일(admin@moneypuzzle.co.kr)로 연락하실 수 있습니다."]}]},"en":{"title":"Terms of Service","eff":"Effective date: ____-__-__","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"Article 1 (Purpose)","b":["These Terms govern your use of the karaoke service \"Money Puzzle Karaoke\" (https://karaoke.moneypuzzle.co.kr, \"the Service\") provided by Booman Inc. (\"the Company\")."]},{"h":"Article 2 (The Service)","b":["The Service provides:",["Playback of karaoke videos from the official YouTube channel of Kumyoung (KY) (via the YouTube embedded player, free of charge)","Sale of prepaid karaoke points and time-based passes bought with points (seller: the Company)","Sign-in with Google or Apple and storage of your points and passes","Karaoke LIVE broadcasts, gifts and ranking awards"],"Payment for points is made to the Company through the payment window of its contracted payment gateway or through app market billing. The Company does not receive or store card numbers or other payment details."]},{"h":"Article 3 (Karaoke pass)","b":["The Company sells a time-based “pass” for the karaoke in the Service. Passes are bought with points: 1 month 7,000P · 3 months 17,000P · 6 months 30,000P · 12 months 50,000P. Prices are as shown on the purchase screen.","During the pass you can sing without limit. A pass does not renew automatically, and nothing is charged when it ends.","The pass applies to the account you are signed in with. If you buy again while a pass is active, the new period starts from the end date of the current pass.",["Refund (within 7 days of purchase and you have not sung): the full amount is refunded.","Refund (all other cases): the amount for the remaining days, minus 10% of that amount, is refunded (Content User Protection Guidelines; Consumer Dispute Resolution Standards for continuous transactions). Amounts under 10P are not refunded.","Pass refunds are paid to your original payment method for the paid-point share only (1P = ₩1); the share bought with free points is not refunded. No points refund fee is deducted again. The share bought with points topped up in an app market follows that market's refund policy. The pass ends as soon as you request the refund."],"Song passes you bought before (songs left) remain valid and are kept for 1 year from purchase. Song passes are no longer sold.","Details follow the Refund Policy."]},{"h":"Article 3-2 (Points)","b":["The Company sells prepaid “points” used in the karaoke of the Service. 1 point (P) equals ₩1. Top-up amounts and prices are as shown on each purchase screen.","Points are recorded in a single wallet for your signed-in account, and the same points can be topped up and used on the web and in the dedicated app.","Points are recorded separately as paid points (topped up by your payment) and free points (given by the Company at no charge, e.g. as a top-up bonus or in events).","When points are used, paid points are used first (earliest top-up first), then free points. Before any use, the screen shows the points to be used and the balance afterwards, and asks you to confirm.",["Validity: points can be used for 1 year from the date they were topped up (or given). Expired points cannot be used.","Extension: if you request it within the validity period, the validity of your paid points is extended by 3 months at a time (“My wallet > Extend”). The extended validity cannot go beyond 5 years from the top-up date.","Expiry notices: the Company notifies you at least 3 times, including at least 30 days before expiry, by email or on the Service screen, of the expiry date, whether and how it can be extended, and that remaining paid points can still be refunded after expiry."],["Refund (within 7 days of purchase): unused paid points are refunded in full with no fee, even if you used part of them.","Refund (after 7 days, within the validity period): remaining paid points are refunded minus a refund fee of up to 10%. The rate applied is shown on the refund request screen. However, if the remaining paid points are 10,000P or less, ₩1,000 is deducted instead of the fee, and if the amount after the deduction is less than the deduction, there is no refund.","Refund (after expiry): 90% of the remaining paid points is refunded until 5 years from the top-up date.","Free points are not refundable and expire when a refund is processed. Amounts under ₩10 are not refunded."],"You can request a refund via “My wallet > Request refund” or Support. After review, the Company refunds to the payment method used. Points under a refund request cannot be used until the request is processed.","Refunds for points bought in an app marketplace such as Google Play or the App Store follow that marketplace's refund policy. If the marketplace cancels or refunds the payment, the points from that payment (including any free points given with it) are deducted from your wallet; if already used, they are deducted from other points or from later top-ups."]},{"h":"Article 4 (Use by minors)","b":["The Service is for users aged 15 and over. People under 15 may not use the Service. Minors aged 15 to 18 may use the Service.","When you enter the Service (app), the Company checks once, by mobile identity verification, that you are 15 or older. You cannot use the Service without completing identity verification. We keep only the birth year and gender from the result.","Minors aged 15 to 18 can top up points up to KRW 200,000 per month. A payment made by a minor without the consent of a legal guardian may be cancelled by the minor or the legal guardian under the applicable laws (such as Article 5 of the Korean Civil Act), and the Company handles such cancellations and refunds under those laws.","In “Singers nearby”, minors (15 to 18) can see and follow only minors, and adults (19 and over) only adults; in-app room invitations are only possible between mutual friends (Article 13-2).","If use by a person under 15 is found, the Company may restrict that use."]},{"h":"Article 5 (Song availability)","b":["Free karaoke videos are shown as posted on the official KY YouTube channel, so a song may disappear from the list or fail to play if the video is removed or embedding is blocked.","If the song list changes, your pass period and any songs left from earlier song passes stay as they are, and no song is used for a song that did not play."]},{"h":"Article 6 (Remaining passes and songs when you leave)","b":["Before leaving (deleting your account), you can request a refund for your remaining pass, points and songs under the Refund Policy.","Even after leaving, you can request a refund for songs left from earlier song passes within 1 year of purchase using your payment record. If no refund is requested within 1 year, those songs expire."]},{"h":"Article 7 (Copyright and scope of use)","b":["Rights to the karaoke videos and the accompaniment, lyrics and footage in them belong to Kumyoung Entertainment and other rights holders. Rights to the Service's screens, logos and text belong to the Company.","You may use the Service only for personal singing and listening. You may not copy, distribute or broadcast the videos, accompaniment or lyrics, or use them for profit, such as in a business."]},{"h":"Article 8 (Posting recordings)","b":["This article applies to recording songs and posting them to \"Public Stage\" and \"My Stage\".",["Rights to the voice and video in songs you post belong to you. You allow the Company, free of charge, to show those songs in the Service and to use them to promote the Service. Once you delete a song, the Company stops using it.","Rights to the accompaniment and lyrics in a recording belong to Kumyoung Entertainment and other rights holders, so you may not download recordings outside the Service or post them elsewhere.","Only users who have completed identity verification (15 and over) may post songs.","You may not post others' faces or voices without permission, obscene, violent or hateful content, abusive language, anything that infringes others' rights, or advertising.","The Public Stage is only for videos of people singing. The Company may delete anything that is not a singing video without notice.","If a song is reported or falls under the above, the Company may hide or delete it, and may restrict posting for repeated violations.","You can delete your songs at any time, and your posted songs are deleted when you leave the Service.","Scene photos are made only from your own recording; any other people shown are fictional people created by AI. Scene photos are marked \"AI-generated\".","Group AI photos are made only from the faces of people who tap “Join” in a Just Us Karaoke or Doran-doran room; tapping “Join” is consent to the use of your face photo. Face photos taken when joining are used temporarily only for creation and deleted right after. The fee (5,000P) is paid by the person who starts it and is refunded automatically if creation fails. Group AI photos are also labeled “AI-generated”."]]},{"h":"Article 8-2 (LIVE broadcasts)","b":["This article applies to the karaoke LIVE feature.",["Only verified adults can start a LIVE broadcast. Anyone able to use the Service can watch, comment and react, and watching uses no points.","The broadcaster pays 100P per viewer per hour, calculated every minute. The Company shows this before the broadcast starts and ends the broadcast automatically when remaining points reach 0P.","Viewers can send gifts to the broadcaster with points. Gift types, prices and the limit (500,000P per person per day) are as shown on screen. Minors aged 15–18 can't send gifts. Sent gifts can't be cancelled or refunded, except where the law allows cancellation.","The broadcaster receives 70% of the gift amount as free points. These points can only be used within the Service and can't be exchanged for cash or refunded.","Obscene, violent or hateful content, abuse, infringement of others' rights and advertising are prohibited in broadcasts. The Company may end a reported or violating broadcast without notice and may restrict repeat offenders. Broadcasters can remove viewers.","The Company keeps broadcast videos privately for 30 days to handle reports and disputes, then deletes them. Only administrators can view them."]]},{"h":"Article 8-3 (Rankings and awards)","b":[["The Company announces weekly, monthly and year-end (Champion) rankings of public song videos and pays first place a prize in points. Criteria and prizes are as shown on screen.","Prizes are paid automatically as free points, valid for 1 year from payment. They can't be refunded or exchanged for cash.","Winners get a profile star. Weekly and monthly stars disappear when the year changes; Champion stars stay.","Videos that affect rankings by improper means may be excluded."]]},{"h":"Article 8-4 (Automatic monitoring)","b":["StageSong has an automatic monitoring system for sound and picture.","LIVE: along with checks on your phone, low-resolution frames and audio clips are checked on the server. They are not stored afterwards, and abusive words in comments are hidden.","Doran-doran and Just Us Karaoke: only the picture is checked, on your phone every 5 seconds. No video or sound goes to the server. Sound is not checked; abusive language is handled through reports from the room. You agree the first time you enter.","Posted videos: sample frames are checked when you post, along with title, description and comments. If there's a problem, the video is saved as “Only me”.","At first your picture is covered for a few seconds with a notice. Removal and a 24-hour limit apply only when high-confidence detections continue and repeat. Automatic checks of sound and language only give a notice.","Tap “Appeal” in the notice to ask for a review. If it was a mistake, your pass period and points are restored.","Automatic checks can make mistakes, so we set thresholds conservatively. Pictures and sound used for monitoring are not stored after checking, and scenes that may involve a minor are never stored."]},{"h":"Article 9 (External links)","b":["The Service may provide links to external sites or apps for your convenience. The Company is not responsible for the content, transactions or accuracy of those external services.","Karaoke videos are provided by YouTube and the respective official channels; ads, content and availability within the videos follow the policies of YouTube and those channel operators."]},{"h":"Article 10 (User obligations and prohibited acts)","b":["You must not:",["act in violation of law or public order and morals","interfere with the normal operation of the Service or collect data without authorization","infringe the rights of others"]]},{"h":"Article 11 (Service suspension and maintenance)","b":["The Service is in principle available 24 hours a day, all year. It may be suspended temporarily for maintenance, equipment replacement or failures; where possible, we will announce this on the Service in advance.","If you suffer damage due to the Company's intent or negligence, the Company will compensate you in accordance with applicable law."]},{"h":"Article 12 (Limitation of liability)","b":["Due to YouTube (e.g. removed videos or embedding restrictions), some songs may not play or the list may change; in that case we offer “Open on YouTube”.","The Company is not liable for damage arising from causes beyond its reasonable control, such as force majeure or failures of external APIs or communications."]},{"h":"Article 13 (Device permissions)","b":["The Service uses the camera and microphone only when you tap \"Record\". Your browser asks for permission the first time; if you decline, only recording is unavailable and everything else still works.","Recordings stay on your device; only the recordings you choose to post with \"Post my song\" are sent to the Company.","Location is used only when you turn on “Show my location” in “Singers nearby”, and only as an approximate location (about 1 km). The first time, we ask for your consent to use location information and your browser or the app asks for location permission (the app requests approximate location only). No other device permissions are used; if more are ever needed, we will tell you in advance which are required and which are optional, with the reasons, and ask for your consent (Article 22-2 of the Network Act)."]},{"h":"Article 13-2 (Location-based service — Singers nearby)","b":["The Company has reported its location-based service business under Korea's Act on the Protection, Use, etc. of Location Information (Booman Inc., report No. 1866).","What it does: “Singers nearby” shows signed-in users who turned on “Show my location” (identity verification is done once, when StageSong is first opened) each other's distance range (within 1, 3 or 10 km) and latest public songs, and lets them watch, like, comment and follow. Without turning on your own location you cannot see the list either. Using location is free.",["You must consent to the use of location information the first time you turn it on; the Company records the consent per account with the time.","Location is rounded to about 1 km before saving; exact coordinates or addresses are never stored or shown to other users.","Location is kept only while turned on and is destroyed without delay when you turn it off, after 24 hours, or when you withdraw consent.","The Company automatically records the use and provision of location information (time, purpose, account), keeps these records for 6 months and then destroys them.","You may turn off “Show my location” or withdraw consent with “Withdraw location consent” at any time, and may ask to view or be notified of the records of use and provision of your location information and to correct errors.","Location is shown to other users only as a distance range and is not provided to any other third party except as required by law.","Each person in the list shows an age group and gender from identity verification (e.g. “20s · Male”; ages 15–18 show as “Teens”). Gender is always shown; exact age and birthday are never shown. Accounts without a verification result are shown without an age group.","Minors (15 to 18) can see and follow only minors, and adults (19 and over) only adults.","The list can be filtered by “All / Same age group / Women only / Men only”. Verified women can turn on “Show my location to women only”; she and male users then don't see each other in the list.","“Singers nearby” does not let you invite strangers into rooms. In the app, adding or inviting people to Just Us Karaoke rooms and Doran-doran is only possible between “mutual friends” who follow each other, and the Company checks this. Invitation links that users send themselves via KakaoTalk etc. work as before.","You can block and report other users. Blocked users do not see each other in the list and cannot exchange invitations. You can send up to 20 mutual-friend invitations a day and have up to 3 pending at once."],"Location information officer: Hwang Euiman (customer center 010-4221-7066 · admin@moneypuzzle.co.kr)","For disputes about location information you may apply for mediation to the Korea Communications Commission or the Personal Information Dispute Mediation Committee. If the Company's handling of location information causes you damage, the Company will compensate you as provided by law."]},{"h":"Article 14 (Governing law and jurisdiction)","b":["Any lawsuit between the Company and a user is governed by the laws of the Republic of Korea.","Any lawsuit concerning a dispute between the Company and a user shall be filed with the court having jurisdiction under the Civil Procedure Act of the Republic of Korea.","Despite the preceding paragraph, if the user resides outside the Republic of Korea, the Seoul Central District Court of the Republic of Korea has exclusive jurisdiction over any lawsuit concerning a dispute between the Company and the user."]},{"h":"Article 15 (Contact)","b":["For questions about the Service, contact Support (+82-10-4221-7066) or email (admin@moneypuzzle.co.kr)."]}]},"ja":{"title":"利用規約","eff":"施行日：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本規約は、株式会社 부만（Booman Inc.、以下「当社」）が提供するカラオケサービス「マネーパズル カラオケ（Money Puzzle Karaoke）」（https://karaoke.moneypuzzle.co.kr、以下「本サービス」）の利用条件を定めることを目的とします。"]},{"h":"第2条（サービスの内容）","b":["本サービスは次のものを提供します。",["クミョン（KY）公式YouTubeチャンネルのカラオケ動画の再生（YouTube埋め込みプレーヤー使用・無料）","カラオケポイント（前払い）と期間制利用券（ポイントで購入）の販売（販売当事者：当社）","Google・Appleアカウントでのログインおよびポイント・利用券の保管","カラオケのLIVE放送・ギフトとランキング表彰"],"ポイントの代金は、当社が契約した電子決済代行会社の決済画面またはアプリマーケットの決済を通じて当社に支払われます。当社はカード番号などの決済情報を直接受け取ったり保存したりしません。"]},{"h":"第3条（カラオケ利用券）","b":["当社は本サービス内のカラオケで使う期間制の「利用券」を販売します。利用券はポイントで購入し、期間と価格は1か月7,000P・3か月17,000P・6か月30,000P・12か月50,000Pです。価格は購入画面に表示されたとおりです。","利用券の期間中は歌い放題です。利用券は自動で延長（更新）されず、期間が終わっても別途請求はありません。","利用券はログインしたアカウントに適用されます。利用中にもう一度購入すると、今の利用券の終了日から新しい期間が続きます。",["返金（購入日から7日以内で、まだ歌っていない場合）：全額を返金します。","返金（それ以外の場合）：残り日数分の金額からその10%を差し引いて返金します（コンテンツ利用者保護指針、消費者紛争解決基準の継続取引基準）。10P未満は返金しません。","利用券の返金は、購入に使った有料ポイント分のみを決済した手段で返金し（1P＝1ウォン）、無料ポイントで購入した分は返金しません。ポイントの返金手数料を再び差し引くことはありません。アプリマーケットでチャージしたポイントで購入した分は、そのマーケットの返金規定に従います。返金を申請すると利用券はすぐに終了します。"],"以前に購入した曲チケット（残り曲）はそのまま有効で、購入日から1年間保管されます。曲チケットの販売は終了しました。","詳しくは返金規定に従います。"]},{"h":"第3条の2（ポイント）","b":["当社は、サービス内カラオケで使う前払いの「ポイント」を販売します。1ポイント（P）は1ウォンに相当し、チャージ単位と価格は各購入画面の表示どおりです。","ポイントはログインしたアカウントのウォレット1つに記録され、ウェブと専用アプリで同じポイントをチャージ・使用します。","ポイントは、有料ポイント（利用者が決済でチャージしたポイント）と無料ポイント（チャージ特典・イベントなどで当社が無償で付与したポイント）に分けて記録します。","ポイントを使うときは、有料ポイントから（先にチャージしたものから）使い、その後に無料ポイントを使います。使用前に、使うポイントと使用後の残りポイントを画面に表示し、利用者の確認を受けます。",["有効期限：ポイントはチャージ（付与）日から1年間使用でき、有効期限を過ぎたポイントは使用できません。","有効期限の延長：有効期限内に利用者が申請すると、有料ポイントの有効期限を3か月ずつ延長します（「マイウォレット → 期間延長」）。ただし、延長後の有効期限はチャージ日から5年を超えることはできません。","期限通知：当社は、有効期限の30日前を含めて3回以上、有効期限・延長の可否と方法・期限後も残りの有料ポイントを返金できることを、メールまたはサービス画面でお知らせします。"],["返金（購入日から7日以内）：未使用の有料ポイントは、一部を使っていても手数料なしで全額返金します。","返金（購入日から7日経過後・有効期限内）：残りの有料ポイントから10%以内の返金手数料を差し引いて返金します。適用する手数料率は返金申請画面に表示します。ただし、残りの有料ポイントが10,000P以下の場合は手数料の代わりに1,000ウォンを差し引き、差し引き後の金額が差引額より少ない場合は返金されません。","返金（有効期限経過後）：チャージ日から5年まで、残りの有料ポイントの90%を返金します。","無料ポイントは返金の対象外で、返金処理時にあわせて消滅します。10ウォン未満は返金しません。"],"返金は「マイウォレット → 返金申請」またはカスタマーセンターで申請でき、当社が確認した後、決済した手段で返金します。返金申請中のポイントは処理が終わるまで使用できません。","Google Play・App Storeなどのアプリマーケットで購入したポイントの返金は、そのアプリマーケットの返金規定に従います。アプリマーケットで決済が取消・返金された場合、その決済でチャージされたポイント（一緒に付与された無料ポイントを含む）をウォレットから差し引き、すでに使用している場合はほかのポイントまたは以後チャージされるポイントから差し引きます。"]},{"h":"第4条（未成年者の利用）","b":["本サービスは満15歳以上の方が利用でき、満15歳未満の方は利用できません。満15歳以上18歳以下の青少年も利用できます。","当社はサービス（アプリ）に入るときに携帯電話の本人認証で満15歳以上かを一度確認し、本人認証を済ませないとサービスを利用できません。認証結果のうち生まれ年と性別のみ保存します。","青少年（満15〜18歳）のポイントチャージは月200,000ウォンまでです。未成年者が法定代理人の同意なく行った決済は、未成年者本人または法定代理人が関係法令（韓国民法第5条など）に基づき取り消すことができ、当社は決済の取消・返金を関係法令に従って処理します。","「近くの歌友」では、青少年（満15〜18歳）は青少年同士だけ、成人（19歳以上）は成人同士だけが互いに表示され、フォローでき、アプリ内の部屋への招待は相互フォローの友だち同士だけです（第13条の2）。","満15歳未満の方の利用が判明した場合、当社は利用を制限することがあります。"]},{"h":"第5条（曲の提供条件）","b":["無料カラオケ動画はKY公式YouTubeチャンネルに投稿された動画をそのまま表示するため、動画が削除されたり埋め込みが制限されたりすると、一覧から消えたり再生できなかったりすることがあります。","曲の一覧が変わっても利用券の期間と以前に購入した残り曲はそのままで、再生されなかった曲には残り曲を使いません。"]},{"h":"第6条（退会時の残り利用券・残り曲）","b":["退会（アカウント削除）の前に、返金規定に従って残りの利用券・ポイント・残り曲の返金を申請できます。","退会後も購入日から1年以内であれば、決済記録をもとに残り曲の返金を申請できます。返金申請がないまま1年が過ぎると、残り曲は消滅します。"]},{"h":"第7条（著作権および利用範囲）","b":["カラオケ動画とその中の伴奏・歌詞・映像の権利は金永エンターテインメントなど各権利者に、本サービスの画面・ロゴ・文章の権利は当社に帰属します。","利用者は本サービスを個人的に歌ったり楽しんだりする目的にのみ利用でき、動画・伴奏・歌詞を複製・配布・放送したり、店舗などで営利目的に利用したりしてはなりません。"]},{"h":"第8条（録音・録画物の投稿）","b":["この条項は、歌の録音・録画および「ステージ」「マイステージ」への投稿機能に適用されます。",["利用者が投稿した歌の声・映像の権利は利用者に帰属します。利用者は、当社がその歌をサービス内で表示し、サービスの宣伝に無償で使用することを許諾します。利用者が歌を削除すると、当社も使用を中止します。","録音・録画物に含まれる伴奏・歌詞の権利は金永エンターテインメントなどの権利者に帰属するため、サービスの外へダウンロードしたり、他の場所に投稿したりすることはできません。","歌を投稿できるのは本人認証（満15歳以上）を済ませた利用者だけです。","他人の顔・声を無断で含むもの、わいせつ・暴力・差別的な表現、暴言、他人の権利を侵害するもの、広告は投稿できません。","ステージは歌っている動画だけを投稿する場所です。歌っている動画でないものは、当社が予告なく削除することがあります。","通報があった場合や上記に該当する場合、当社はその歌を非表示または削除でき、繰り返す場合は投稿を制限できます。","利用者はいつでも自分の歌を削除でき、退会すると投稿した歌も削除されます。","シーン写真は利用者本人の録画映像からのみ作成し、一緒に写る他の人物はAIが作った架空の人物です。シーン写真には「AI生成」と表示されます。","AI集合写真は、仲間だけカラオケ部屋・ドランドランで「参加」を押した人の顔だけで作成し、「参加」を押すことが顔写真の利用への同意となります。参加時に撮影した顔写真は作成にだけ一時的に使い、作成後すぐ削除します。料金（5,000P）は始めた人が支払い、作成に失敗すると自動で返金されます。AI集合写真にも「AI生成」と表示されます。"]]},{"h":"第8条の2（LIVE放送）","b":["この条項はカラオケの「LIVE」機能に適用されます。",["LIVE放送を始められるのは本人認証した成人だけです。視聴・コメント・リアクションはサービスを利用できる利用者が行え、視聴にポイントは使われません。","放送者は放送中、視聴者1人が1時間視聴するごとに100Pを1分単位で負担します。当社は放送開始時にこれを画面で知らせ、残りポイントが0Pになると放送を自動で終了します。","視聴者は放送者にポイントでギフトを贈ることができます。ギフトの種類・価格と上限（1人1日500,000P）は画面の表示どおりで、青少年（満15〜18歳）はギフトを贈れません。贈ったギフトは取消・返金できません。ただし関連法令により取り消せる場合を除きます。","放送者は受け取ったギフト金額の70%を無料ポイントとして受け取ります。積み立てたポイントはサービス内でのみ使用でき、現金化や返金はできません。","放送でも、わいせつ・暴力・嫌悪表現、暴言、他人の権利侵害、広告は禁止します。当社は通報があった放送や違反した放送を予告なく終了でき、繰り返す場合は放送を制限できます。放送者は視聴者を退出させることができます。","当社は通報処理と紛争対応のため放送動画を非公開で30日間保管した後に削除し、保管動画は管理者のみが閲覧します。"]]},{"h":"第8条の3（ランキング表彰）","b":[["当社は全体公開の歌の動画を対象に週間・月間・年末（王中王）の順位を発表し、1位に賞金をポイントで支給します。基準と賞金はサービス画面の表示どおりです。","賞金は無料ポイントとして自動で支給され、有効期間は支給日から1年です。返金や現金化はできません。","受賞者にはプロフィールの星が表示されます。週間・月間の星は年が変わると消え、王中王の星は残ります。","不正な方法で順位に影響を与えた動画は順位から除外することがあります。"]]},{"h":"第8条の4（自動監視）","b":["StageSongには音声と画面を確認する自動監視システムを設置しています。","LIVE配信：スマホ内の判定に加え、低解像度の画面と音声の断片をサーバーで判定します。判定に使った画面と音声は保存せず、コメントの暴言は伏せて表示します。","ドランドラン・仲間だけカラオケ：画面のみをスマホの中で5秒ごとに判定し、映像と音声はサーバーへ送りません。音声は判定せず、暴言はルームの人の通報で対応します。初めて入室するときに同意が必要です。","投稿動画：投稿時に画面の標本を判定し、タイトル・説明・コメントの暴言を確認します。問題があれば「自分のみ」で保存されます。","最初は画面を数秒隠してご案内します。確信度の高い検知が連続して繰り返された場合のみ、退室と24時間の利用制限を行います。音声・暴言の自動判定はご案内までです。","制限の案内にある「異議申し立て」を押すと確認の上で解除し、誤判定で解除された場合は利用券の期間と使ったポイントを復旧します。","自動判定には誤りがあり得るため、会社はしきい値を慎重に運用します。自動監視に使った画面と音声は判定後に保存せず、未成年者が関わる可能性のある場面はいかなる場合も保存しません。"]},{"h":"第9条（外部リンクの免責）","b":["本サービスは利便のため外部サイト・アプリへのリンクを提供する場合があります。当社は外部サービスの内容・取引・正確性について責任を負いません。","カラオケ動画はYouTubeおよび各公式チャンネルが提供するもので、動画内の広告・内容・再生可否はYouTubeおよび当該チャンネル運営会社のポリシーに従います。"]},{"h":"第10条（利用者の義務および禁止行為）","b":["利用者は次の行為をしてはなりません。",["法令または公序良俗に反する行為","本サービスの正常な運営を妨げ、または無断でデータを収集する行為","他人の権利を侵害する行為"]]},{"h":"第11条（サービスの中断および点検）","b":["本サービスは年中無休・24時間の提供を原則とします。ただし点検・設備交換・障害の際は一時中断することがあり、事前に知らせることができる場合はサービス画面で事前にお知らせします。","当社の故意または過失により利用者に損害が生じた場合、当社は関係法令に従って賠償します。"]},{"h":"第12条（責任の限界）","b":["YouTube側の事情（動画の削除・埋め込み制限など）により、一部の曲が再生できなかったり一覧が変わったりすることがあります。その場合は「YouTubeで開く」をご案内します。","当社は、天災や外部 API・通信の障害など、当社の合理的な支配を超える事由による損害について責任を負いません。"]},{"h":"第13条（端末のアクセス権限）","b":["本サービスは「録画」を押したときだけカメラとマイクを使います。初めて使うときにブラウザが許可を求め、許可しない場合は録画だけが使えず、ほかの機能はそのまま使えます。","録画した動画は利用者の端末内に保存され、利用者が「自分の歌を投稿」で投稿を選んだ動画だけが当社に送信されます。","位置情報は「近くの歌友」で「自分の位置を表示」をオンにしたときだけ、おおよその位置(約1km)を使います。初めてオンにするときに位置情報の利用への同意をいただき、ブラウザまたはアプリが位置情報の権限を求めます(アプリはおおよその位置の権限のみ要求)。そのほかの端末アクセス権限は使わず、さらに必要になった場合は、必須権限と任意権限を分け、その理由とともに事前にお知らせし、同意を得ます（情報通信網法第22条の2）。"]},{"h":"第13条の2（位置基盤サービス — 近くの歌友）","b":["当社は韓国「位置情報の保護及び利用等に関する法律」に基づき位置基盤サービス事業を申告した事業者です（株式会社 부만(Booman Inc.)、申告第1866号）。","サービス内容：「近くの歌友」は、ログインして「自分の位置を表示」をオンにした利用者同士(本人認証はStageSongを最初に開くときに一度だけ行います)に互いの距離の区分(1km・3km・10km以内)と最近の全体公開の歌を表示し、視聴・いいね・コメント・フォローができるようにします。自分の位置をオンにしないと一覧も見られません。位置の利用は無料です。",["初めてオンにするときに位置情報の利用に同意する必要があり、当社は同意をアカウントごとに日時とともに記録します。","位置は約1km単位に丸めて保存し、正確な座標・住所は保存せず、ほかの利用者にも表示しません。","位置はオンの間のみ保管し、オフにしたとき、24時間が過ぎたとき、または同意を撤回したときに遅滞なく破棄します。","当社は位置情報の利用・提供事実の確認資料(利用日時・目的・アカウント)を自動で記録して6か月間保管した後、破棄します。","利用者はいつでも「自分の位置を表示」をオフにするか「位置情報の同意撤回」で同意を撤回でき、位置情報の利用・提供事実の確認資料の閲覧・告知と誤りの訂正を求めることができます。","当社は位置情報をほかの利用者に距離の区分としてのみ表示し、法令に基づく場合を除き、そのほかの第三者に提供しません。","一覧には本人認証の結果で年代と性別が表示されます（例：「20代・男性」、満15〜18歳は「10代」）。性別は常に表示され、正確な年齢・誕生日は表示しません。本人認証の結果がないアカウントは年代なしで表示されます。","青少年（満15〜18歳）は青少年同士だけ、成人（19歳以上）は成人同士だけが互いに一覧に表示され、フォローできます。","一覧は「すべて／同じ年代／女性のみ／男性のみ」で絞り込めます。本人認証した女性は「女性にだけ自分の位置を表示」をオンにでき、オンにすると男性利用者とはお互いに一覧に表示されません。","「近くの歌友」では知らない人を部屋に招待できません。アプリ内で仲間だけカラオケ部屋・ドランドランに人を追加・招待できるのは、お互いにフォローしている「相互フォローの友だち」同士だけで、当社がこれを確認します。利用者がカカオトークなどで直接送る招待リンクはこれまでどおり使えます。","利用者は他の利用者をブロック・通報できます。ブロックするとお互いに一覧に表示されず、招待もやり取りできません。相互フォローの友だちへの招待は1日20回、保留中の招待は3件まで送れます。"],"位置情報管理責任者：Hwang Euiman（カスタマーセンター 010-4221-7066・admin@moneypuzzle.co.kr）","位置情報に関する紛争は、韓国放送通信委員会または個人情報紛争調停委員会に調停を申請できます。当社の位置情報の取り扱いにより利用者に損害が生じた場合、当社は関係法令に従って賠償します。"]},{"h":"第14条（準拠法および管轄）","b":["当社と利用者の間で提起された訴訟には、大韓民国法を準拠法とします。","当社と利用者の間で生じた紛争に関する訴訟は、民事訴訟法上の管轄裁判所に提起します。","利用者が外国居住者である場合、当社と利用者の間で生じた紛争に関する訴訟は、前項にかかわらず大韓民国ソウル中央地方法院を専属管轄裁判所とします。"]},{"h":"第15条（お問い合わせ）","b":["本サービスの利用に関するお問い合わせは、カスタマーセンター（+82-10-4221-7066）またはメール（admin@moneypuzzle.co.kr）までご連絡ください。"]}]},"zhs":{"title":"使用条款","eff":"施行日期：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1条（目的）","b":["本条款旨在规定 Booman Inc.（株式会社 부만，以下称“本公司”）提供的卡拉OK服务“Money Puzzle Karaoke（머니퍼즐 노래방）”（https://karaoke.moneypuzzle.co.kr，以下称“本服务”）的使用条件。"]},{"h":"第2条（服务内容）","b":["本服务提供以下内容：",["播放金永（KY）官方YouTube频道的卡拉OK视频（使用YouTube嵌入式播放器，免费）","销售卡拉OK积分（预付）及期限制畅唱券（用积分购买）（销售方：本公司）","Google·Apple 账号登录及积分·畅唱券保存","卡拉OK LIVE直播、礼物和排名奖励"],"积分款项通过本公司签约的电子支付代理机构的支付页面或应用商店支付支付给本公司。本公司不直接接收或保存卡号等支付信息。"]},{"h":"第3条（卡拉OK畅唱券）","b":["本公司销售在本服务卡拉OK中使用的期限制「畅唱券」。畅唱券用积分购买，期限与价格为：1个月7,000P · 3个月17,000P · 6个月30,000P · 12个月50,000P。价格以购买页面显示为准。","畅唱券有效期内可无限唱歌。畅唱券不会自动续期（续费），到期后也不会另行扣款。","畅唱券适用于登录的账户。使用中再次购买的，新期间从当前畅唱券到期日起接续。",["退款（购买之日起7天内且未唱歌）：全额退款。","退款（其他情况）：退还剩余天数对应金额扣除该金额10%后的金额（依据《内容用户保护指南》及《消费者纠纷解决标准》的持续交易标准）。不足10P的不予退还。","畅唱券退款仅将购买时使用的付费积分部分退回原支付方式（1P = 1韩元），用免费积分购买的部分不予退款。不会再次扣除积分退款手续费。用应用商店充值的积分购买的部分按该商店的退款规定办理。申请退款后畅唱券立即结束。"],"此前购买的点歌券（剩余歌曲）继续有效，自购买日起保留1年。点歌券已停止销售。","详情以退款规定为准。"]},{"h":"第3条之二（积分）","b":["本公司销售在服务内卡拉OK使用的预付“积分”。1积分（P）相当于1韩元，充值单位和价格以各购买页面显示为准。","积分记录在已登录账户的一个钱包中，网页和专用应用使用同一积分进行充值和使用。","积分分为付费积分（用户通过付款充值的积分）和免费积分（本公司通过充值优惠、活动等无偿赠送的积分）分别记录。","使用积分时，先使用付费积分（按充值先后），再使用免费积分。使用前，页面会显示将使用的积分和使用后的剩余积分，并经用户确认。",["有效期：积分自充值（赠送）之日起1年内可用，过期积分不能使用。","延长有效期：在有效期内用户提出申请的，付费积分的有效期每次延长3个月（“我的钱包 → 延长有效期”）。但延长后的有效期不得超过自充值之日起5年。","到期通知：本公司在有效期届满前30日（含）起至少通知3次，通过电子邮件或服务页面告知到期日、可否延长及方法，以及到期后仍可申请退还剩余付费积分。"],["退款（购买之日起7日内）：未使用的付费积分，即使已使用部分，也免手续费全额退还。","退款（购买满7日后、有效期内）：从剩余付费积分中扣除不超过10%的退款手续费后退还。适用的费率显示在退款申请页面。但剩余付费积分在10,000P以下时，改为扣除1,000韩元；扣除后金额少于扣除额的，不予退款。","退款（有效期届满后）：自充值之日起5年内，退还剩余付费积分的90%。","免费积分不予退款，并在退款处理时一并失效。不足10韩元的部分不予退还。"],"可通过“我的钱包 → 申请退款”或客服申请退款，经本公司确认后退回原支付方式。申请退款中的积分在处理完成前不能使用。","在 Google Play、App Store 等应用市场购买的积分，退款按该应用市场的退款规定办理。应用市场取消或退还付款时，将从钱包中扣除该笔付款充值的积分（含同时赠送的免费积分）；如已使用，则从其他积分或之后充值的积分中扣除。"]},{"h":"第4条（未成年人的使用）","b":["本服务供年满15周岁者使用，未满15周岁者不得使用。15至18周岁的青少年也可以使用。","进入本服务（应用）时，本公司通过手机实名认证确认一次是否年满15周岁；未完成实名认证的，不能使用本服务。认证结果中仅保存出生年份和性别。","青少年（15~18周岁）每月最多可充值200,000韩元积分。未成年人未经法定代理人同意进行的支付，未成年人本人或其法定代理人可依相关法律（韩国《民法》第5条等）撤销，本公司依相关法律处理付款撤销·退款。","在「附近歌友」中，青少年（15~18周岁）只能与青少年互相看到并关注，成年人（19岁以上）只能与成年人互相看到并关注；应用内的房间邀请只能在互关好友之间进行（第13条之2）。","如发现未满15周岁者使用，本公司可以限制其使用。"]},{"h":"第5条（歌曲提供条件）","b":["免费卡拉OK视频直接显示金永（KY）官方YouTube频道发布的视频，视频被删除或禁止嵌入时，可能从列表中消失或无法播放。","即使歌曲列表变化，畅唱券期间及此前购买的剩余歌曲也保持不变，未能播放的歌曲不扣剩余歌曲。"]},{"h":"第6条（退出时剩余畅唱券·剩余歌曲）","b":["退出（删除账户）前，可按退款规定申请剩余畅唱券·积分·剩余歌曲的退款。","退出后，自购买日起1年内仍可凭支付记录申请剩余歌曲的退款。1年内未申请退款的，剩余歌曲失效。"]},{"h":"第7条（著作权及使用范围）","b":["卡拉OK视频及其中的伴奏、歌词、影像的权利归金永娱乐等各权利人所有，本服务的页面、标志、文字的权利归本公司所有。","用户只能为个人演唱和欣赏使用本服务，不得复制、传播、播放视频、伴奏或歌词，也不得在营业场所等以营利为目的使用。"]},{"h":"第8条（发布录音、录像）","b":["本条适用于录制歌曲及发布到「舞台」「我的舞台」的功能。",["用户发布的歌曲中声音、影像的权利归用户所有。用户允许本公司无偿在服务内展示这些歌曲并用于宣传服务。用户删除歌曲后，本公司也停止使用。","录音、录像中伴奏、歌词的权利归金永娱乐等权利人所有，因此不得下载到服务之外或发布到其他地方。","只有完成实名认证（年满15周岁）的用户才能发布歌曲。","不得发布未经许可含有他人面孔或声音的内容、淫秽、暴力或仇恨内容、辱骂、侵害他人权利的内容或广告。","舞台只用于发布唱歌的视频。不是唱歌视频的内容，本公司可不经通知予以删除。","收到举报或属于上述情形时，本公司可以隐藏或删除该歌曲，屡次违反的可限制发布。","用户可随时删除自己的歌曲，退出时已发布的歌曲也将删除。","情景照片仅使用用户本人的录像制作，照片中的其他人物均为AI生成的虚拟人物。情景照片上会标示“AI生成”。","AI 合影仅使用在小圈子K歌房或 Doran-doran 房间中点了「参加」的人的面部生成，点「参加」即表示同意使用面部照片。参加时拍摄的面部照片仅临时用于生成，生成后立即删除。费用（5,000P）由发起人支付，生成失败时自动退还。AI 合影同样标注「AI生成」。"]]},{"h":"第8条之二（LIVE直播）","b":["本条适用于卡拉OK的「LIVE」功能。",["只有完成实名认证的成年人才能开始LIVE直播。可使用服务的用户均可观看、评论和发表情，观看不使用积分。","主播在直播中按每位观众每小时100P、以分钟计算承担费用。本公司在开播时于画面告知，剩余积分为0P时自动结束直播。","观众可用积分向主播赠送礼物。礼物种类、价格和限额（每人每天500,000P）以画面显示为准，青少年（15~18周岁）不能赠送礼物。已送出的礼物不可取消或退款，但依相关法令可取消的情形除外。","主播获得礼物金额70%的免费积分。这些积分只能在服务内使用，不能兑换现金或退款。","直播中同样禁止淫秽、暴力、仇恨内容、辱骂、侵害他人权利和广告。本公司可不经预告结束被举报或违规的直播，屡犯者可限制直播。主播可以请观众离开。","本公司为处理举报和应对纠纷，不公开保存直播视频30天后删除，保存的视频仅管理员可查看。"]]},{"h":"第8条之三（排名奖励）","b":[["本公司以公开歌曲视频为对象公布周榜、月榜和年终（总冠军）排名，并以积分向第一名发放奖金。标准和奖金以服务画面显示为准。","奖金以免费积分自动发放，有效期自发放日起1年，不可退款或兑换现金。","获奖者显示头像星星。周榜、月榜星星在换年时消失，总冠军星星保留。","以不正当方式影响排名的视频可从排名中排除。"]]},{"h":"第8条之4（自动监测）","b":["StageSong 设有声音和画面自动监测系统。","LIVE 直播：除手机内判定外，低分辨率画面和音频片段在服务器上判定。判定所用内容不保存，评论中的辱骂词会被遮挡。","Doran-doran 和小圈子K歌：仅在手机内每5秒判定一次画面，视频和声音不会发送到服务器。声音不判定，辱骂内容由房间成员举报处理。首次进入时需要同意。","发布的视频：发布时抽取画面判定，并检查标题、说明和评论中的辱骂词。如有问题，视频将设为「仅自己可见」。","最初只会遮挡画面几秒并提示。只有高置信度的检测连续且反复出现时，才会移出房间并限制使用24小时。声音和辱骂的自动判定只做提示。","点限制提示中的「提出申诉」即可申请核实。确认误判后，将恢复畅唱券期限和所用积分。","自动判定可能出错，因此公司以保守方式设置阈值。自动监测所用的画面和声音在判定后不保存，可能涉及未成年人的画面在任何情况下都不保存。"]},{"h":"第9条（外部链接免责）","b":["为方便用户，本服务可能提供指向外部网站·应用的链接。本公司对外部服务的内容·交易·准确性不承担责任。","卡拉OK视频由YouTube及各官方频道提供，视频中的广告、内容及能否播放遵循YouTube及相关频道运营方的政策。"]},{"h":"第10条（用户义务及禁止行为）","b":["用户不得有下列行为：",["违反法律或公序良俗的行为","妨碍本服务正常运营或擅自收集数据的行为","侵害他人权利的行为"]]},{"h":"第11条（服务中断及维护）","b":["本服务原则上全年无休、24小时提供。但在维护、设备更换或故障时可能暂时中断，能够事先通知的，将在服务页面上提前通知。","因本公司故意或过失给用户造成损害的，本公司依相关法律赔偿。"]},{"h":"第12条（责任限制）","b":["因YouTube方面的原因（视频删除、嵌入限制等），部分歌曲可能无法播放或列表可能变化，届时将提示“在YouTube打开”。","对于天灾、外部 API·通信故障等超出本公司合理控制范围的事由所致损害，本公司不承担责任。"]},{"h":"第13条（设备访问权限）","b":["本服务仅在点按「录像」时使用相机和麦克风。首次使用时浏览器会请求许可，不允许时只是无法录像，其他功能照常可用。","录像保存在用户设备上，只有用户通过「发布我的歌」选择发布的视频才会发送给本公司。","仅在「附近歌友」中开启「显示我的位置」时使用大致位置(约1公里)。首次开启时征得位置信息使用同意，并由浏览器或应用请求位置权限(应用仅请求大致位置权限)。不使用其他设备访问权限；如需更多权限，将区分必要权限和可选权限，事先告知原因并征得同意（《信息通信网法》第22条之2）。"]},{"h":"第13条之2（位置服务 — 附近歌友）","b":["本公司已依韩国《位置信息保护及利用法》申报位置服务业务（株式会社 부만(Booman Inc.)，申报第1866号）。","服务内容：「附近歌友」向已登录并开启「显示我的位置」的用户(实名认证在首次打开 StageSong 时进行一次)互相显示距离区间(1公里·3公里·10公里以内)和最近公开的歌曲，并可观看、点赞、评论、关注。不开启自己的位置就无法查看列表。使用位置免费。",["首次开启时须同意使用位置信息，本公司按账号记录同意及时间。","位置约按1公里取整后保存，不保存精确坐标或地址，也不向其他用户显示。","位置仅在开启期间保存，关闭、满24小时或撤回同意后立即销毁。","本公司自动记录位置信息使用·提供事实确认资料(时间、目的、账号)，保存6个月后销毁。","用户可随时关闭「显示我的位置」或通过「撤回位置信息同意」撤回同意，并可要求查阅、告知位置信息使用·提供事实确认资料及更正错误。","本公司仅以距离区间向其他用户显示位置信息，除法律规定外不向其他第三方提供。","列表中会根据实名认证结果显示年龄段和性别（例如「20多岁 · 男」，15~18周岁显示为「10多岁」）。性别始终显示，不显示确切年龄和生日。没有实名认证结果的账号不显示年龄段。","青少年（15~18周岁）只能与青少年互相在列表中看到并关注，成年人（19岁以上）只能与成年人互相看到并关注。","列表可按「全部 / 同龄段 / 仅女性 / 仅男性」筛选。完成实名认证的女性可开启「仅向女性显示我的位置」，开启后她与男性用户在列表中互相看不到。","「附近歌友」不能邀请陌生人进入房间。在应用内向小圈子K歌房、Doran-doran 添加或邀请他人，只能在互相关注的「互关好友」之间进行，本公司会对此进行确认。用户通过 KakaoTalk 等亲自发送的邀请链接照常可用。","用户可以屏蔽、举报其他用户。屏蔽后彼此在列表中看不到对方，也不能互发邀请。互关好友邀请每天最多20次，待回复的邀请最多3个。"],"位置信息管理负责人：Hwang Euiman（客服 010-4221-7066 · admin@moneypuzzle.co.kr）","与位置信息相关的纠纷，可向韩国放送通信委员会或个人信息纠纷调解委员会申请调解。因本公司处理位置信息给用户造成损害的，本公司依相关法律赔偿。"]},{"h":"第14条（准据法及管辖）","b":["公司与用户之间提起的诉讼以大韩民国法律为准据法。","公司与用户之间发生争议的诉讼，向《民事诉讼法》规定的管辖法院提起。","用户为外国居住者时，尽管有前款规定，公司与用户之间发生争议的诉讼以大韩民国首尔中央地方法院为专属管辖法院。"]},{"h":"第15条（咨询）","b":["有关本服务使用的咨询，请联系客服（+82-10-4221-7066）或邮箱（admin@moneypuzzle.co.kr）。"]}]},"zht":{"title":"使用條款","eff":"施行日期：    年  月  日","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"第1條（目的）","b":["本條款旨在規定 Booman Inc.（株式會社 부만，以下稱「本公司」）提供的卡拉OK服務「Money Puzzle Karaoke（머니퍼즐 노래방）」（https://karaoke.moneypuzzle.co.kr，以下稱「本服務」）的使用條件。"]},{"h":"第2條（服務內容）","b":["本服務提供以下內容：",["播放金永（KY）官方YouTube頻道的卡拉OK影片（使用YouTube嵌入式播放器，免費）","銷售卡拉OK點數（預付）及期限制暢唱券（以點數購買）（銷售方：本公司）","Google·Apple 帳號登入及點數·暢唱券保存","卡拉OK LIVE直播、禮物和排名獎勵"],"點數款項透過本公司簽約的電子支付代理機構的付款頁面或應用商店付款支付給本公司。本公司不直接接收或保存卡號等付款資訊。"]},{"h":"第3條（卡拉OK暢唱券）","b":["本公司銷售於本服務卡拉OK中使用的期限制「暢唱券」。暢唱券以點數購買，期限與價格為：1個月7,000P · 3個月17,000P · 6個月30,000P · 12個月50,000P。價格以購買頁面顯示為準。","暢唱券有效期內可無限唱歌。暢唱券不會自動續期（續費），到期後亦不會另行扣款。","暢唱券適用於登入的帳戶。使用中再次購買者，新期間自目前暢唱券到期日起接續。",["退款（購買之日起7天內且未唱歌）：全額退款。","退款（其他情況）：退還剩餘天數對應金額扣除該金額10%後的金額（依據《內容使用者保護指南》及《消費者紛爭解決標準》之持續交易標準）。不足10P者不予退還。","暢唱券退款僅將購買時使用的付費點數部分退回原付款方式（1P = 1韓元），以免費點數購買的部分不予退款。不會再次扣除點數退款手續費。以應用商店儲值的點數購買的部分依該商店的退款規定辦理。申請退款後暢唱券立即結束。"],"此前購買的點歌券（剩餘歌曲）繼續有效，自購買日起保留1年。點歌券已停止銷售。","詳情以退款規定為準。"]},{"h":"第3條之二（點數）","b":["本公司銷售在服務內卡拉OK使用的預付「點數」。1點（P）相當於1韓元，儲值單位與價格以各購買頁面顯示為準。","點數記錄在已登入帳戶的一個錢包中，網頁與專用應用程式使用同一點數儲值與使用。","點數分為付費點數（使用者付款儲值的點數）與免費點數（本公司透過儲值優惠、活動等無償贈送的點數）分別記錄。","使用點數時，先使用付費點數（依儲值先後），再使用免費點數。使用前，頁面會顯示將使用的點數與使用後的剩餘點數，並經使用者確認。",["有效期：點數自儲值（贈送）之日起1年內可用，過期點數不能使用。","延長有效期：在有效期內使用者提出申請者，付費點數的有效期每次延長3個月（「我的錢包 → 延長有效期」）。但延長後的有效期不得超過自儲值之日起5年。","到期通知：本公司於有效期屆滿前30日（含）起至少通知3次，透過電子郵件或服務頁面告知到期日、可否延長及方法，以及到期後仍可申請退還剩餘付費點數。"],["退款（購買之日起7日內）：未使用的付費點數，即使已使用部分，也免手續費全額退還。","退款（購買滿7日後、有效期內）：從剩餘付費點數中扣除不超過10%的退款手續費後退還。適用的費率顯示在退款申請頁面。但剩餘付費點數在10,000P以下時，改為扣除1,000韓元；扣除後金額少於扣除額者，不予退款。","退款（有效期屆滿後）：自儲值之日起5年內，退還剩餘付費點數的90%。","免費點數不予退款，並於退款處理時一併失效。未滿10韓元的部分不予退還。"],"可透過「我的錢包 → 申請退款」或客服申請退款，經本公司確認後退回原付款方式。申請退款中的點數在處理完成前不能使用。","在 Google Play、App Store 等應用程式市集購買的點數，退款依該市集的退款規定辦理。市集取消或退還付款時，將從錢包中扣除該筆付款儲值的點數（含同時贈送的免費點數）；如已使用，則從其他點數或之後儲值的點數中扣除。"]},{"h":"第4條（未成年人的使用）","b":["本服務供年滿15歲者使用，未滿15歲者不得使用。15至18歲的青少年也可以使用。","進入本服務（應用程式）時，本公司透過手機實名認證確認一次是否年滿15歲；未完成實名認證者，不能使用本服務。認證結果中僅儲存出生年份和性別。","青少年（15~18歲）每月最多可儲值200,000韓元點數。未成年人未經法定代理人同意所為之付款，未成年人本人或其法定代理人得依相關法令（韓國《民法》第5條等）撤銷，本公司依相關法令處理付款撤銷·退款。","在「附近歌友」中，青少年（15~18歲）只能與青少年互相看到並追蹤，成年人（19歲以上）只能與成年人互相看到並追蹤；應用程式內的房間邀請只能在互追好友之間進行（第13條之2）。","如發現未滿15歲者使用，本公司得限制其使用。"]},{"h":"第5條（歌曲提供條件）","b":["免費卡拉OK影片直接顯示金永（KY）官方YouTube頻道發布的影片，影片被刪除或禁止嵌入時，可能從清單中消失或無法播放。","即使歌曲清單變動，暢唱券期間及此前購買的剩餘歌曲亦維持不變，未能播放的歌曲不扣剩餘歌曲。"]},{"h":"第6條（退出時剩餘暢唱券·剩餘歌曲）","b":["退出（刪除帳戶）前，可依退款規定申請剩餘暢唱券·點數·剩餘歌曲的退款。","退出後，自購買日起1年內仍可憑付款紀錄申請剩餘歌曲的退款。1年內未申請退款者，剩餘歌曲失效。"]},{"h":"第7條（著作權及使用範圍）","b":["卡拉OK影片及其中的伴奏、歌詞、影像的權利歸金永娛樂等各權利人所有，本服務的頁面、標誌、文字的權利歸本公司所有。","使用者僅能為個人演唱和欣賞使用本服務，不得重製、散布、播送影片、伴奏或歌詞，亦不得於營業場所等以營利為目的使用。"]},{"h":"第8條（發布錄音、錄影）","b":["本條適用於錄製歌曲及發布到「舞台」「我的舞台」的功能。",["使用者發布的歌曲中聲音、影像的權利歸使用者所有。使用者同意本公司無償於服務內展示該等歌曲並用於宣傳服務。使用者刪除歌曲後，本公司亦停止使用。","錄音、錄影中伴奏、歌詞的權利歸金永娛樂等權利人所有，因此不得下載至服務之外或發布到其他地方。","只有完成實名認證（年滿15歲）的使用者才能發布歌曲。","不得發布未經許可含有他人面孔或聲音的內容、猥褻、暴力或仇恨內容、辱罵、侵害他人權利的內容或廣告。","舞台僅用於發布唱歌的影片。非唱歌影片的內容，本公司得不經通知予以刪除。","收到檢舉或屬上述情形時，本公司得隱藏或刪除該歌曲，屢次違反者得限制發布。","使用者可隨時刪除自己的歌曲，退出時已發布的歌曲亦將刪除。","情境照片僅使用使用者本人的錄影製作，照片中的其他人物均為AI生成的虛擬人物。情境照片上會標示「AI生成」。","AI 合影僅使用在小圈子K歌房或 Doran-doran 房間中點了「參加」的人的臉部生成，點「參加」即表示同意使用臉部照片。參加時拍攝的臉部照片僅暫時用於生成，生成後立即刪除。費用（5,000P）由發起人支付，生成失敗時自動退還。AI 合影同樣標註「AI生成」。"]]},{"h":"第8條之二（LIVE直播）","b":["本條適用於卡拉OK的「LIVE」功能。",["只有完成實名認證的成年人才能開始LIVE直播。可使用服務的使用者均可觀看、留言和發表情，觀看不使用點數。","主播在直播中按每位觀眾每小時100P、以分鐘計算負擔費用。本公司在開播時於畫面告知，剩餘點數為0P時自動結束直播。","觀眾可用點數向主播贈送禮物。禮物種類、價格和限額（每人每天500,000P）以畫面顯示為準，青少年（15~18歲）不能贈送禮物。已送出的禮物不可取消或退款，但依相關法令可取消的情形除外。","主播獲得禮物金額70%的免費點數。這些點數只能在服務內使用，不能兌換現金或退款。","直播中同樣禁止猥褻、暴力、仇恨內容、辱罵、侵害他人權利和廣告。本公司可不經預告結束被檢舉或違規的直播，屢犯者可限制直播。主播可以請觀眾離開。","本公司為處理檢舉和應對糾紛，不公開保存直播影片30天後刪除，保存的影片僅管理員可查看。"]]},{"h":"第8條之三（排名獎勵）","b":[["本公司以公開歌曲影片為對象公布週榜、月榜和年終（總冠軍）排名，並以點數向第一名發放獎金。標準和獎金以服務畫面顯示為準。","獎金以免費點數自動發放，有效期自發放日起1年，不可退款或兌換現金。","得獎者顯示頭像星星。週榜、月榜星星在換年時消失，總冠軍星星保留。","以不正當方式影響排名的影片可從排名中排除。"]]},{"h":"第8條之4（自動監測）","b":["StageSong 設有聲音和畫面自動監測系統。","LIVE 直播：除手機內判定外，低解析度畫面和音訊片段在伺服器上判定。判定所用內容不儲存，留言中的辱罵詞會被遮擋。","Doran-doran 和小圈子K歌：僅在手機內每5秒判定一次畫面，影像和聲音不會傳送到伺服器。聲音不判定，辱罵內容由房間成員檢舉處理。首次進入時需要同意。","發布的影片：發布時抽取畫面判定，並檢查標題、說明和留言中的辱罵詞。如有問題，影片將設為「僅自己可見」。","最初只會遮擋畫面幾秒並提示。只有高信賴度的偵測連續且反覆出現時，才會移出房間並限制使用24小時。聲音和辱罵的自動判定只做提示。","點限制提示中的「提出申訴」即可申請確認。確認誤判後，將恢復暢唱券期限和所用點數。","自動判定可能出錯，因此公司以保守方式設定閾值。自動監測所用的畫面和聲音在判定後不儲存，可能涉及未成年人的畫面在任何情況下都不儲存。"]},{"h":"第9條（外部連結免責）","b":["為方便使用者，本服務可能提供指向外部網站·應用程式的連結。本公司對外部服務的內容·交易·準確性不承擔責任。","卡拉OK影片由YouTube及各官方頻道提供，影片中的廣告、內容及能否播放依循YouTube及相關頻道營運方的政策。"]},{"h":"第10條（使用者義務及禁止行為）","b":["使用者不得有下列行為：",["違反法律或公序良俗的行為","妨礙本服務正常運營或擅自蒐集資料的行為","侵害他人權利的行為"]]},{"h":"第11條（服務中斷及維護）","b":["本服務原則上全年無休、24小時提供。但於維護、設備更換或故障時可能暫時中斷，能事先通知者，將於服務頁面提前通知。","因本公司故意或過失致使用者受有損害者，本公司依相關法令賠償。"]},{"h":"第12條（責任限制）","b":["因YouTube方面的原因（影片刪除、嵌入限制等），部分歌曲可能無法播放或清單可能變動，屆時將提示「在YouTube開啟」。","對於天災、外部 API·通訊故障等超出本公司合理控制範圍的事由所致損害，本公司不承擔責任。"]},{"h":"第13條（裝置存取權限）","b":["本服務僅在點按「錄影」時使用相機和麥克風。首次使用時瀏覽器會請求許可，不允許時僅無法錄影，其他功能照常可用。","錄影保存在使用者裝置上，只有使用者透過「發布我的歌」選擇發布的影片才會傳送給本公司。","僅在「附近歌友」中開啟「顯示我的位置」時使用大致位置(約1公里)。首次開啟時取得位置資訊使用同意，並由瀏覽器或應用程式請求位置權限(應用程式僅請求大致位置權限)。不使用其他裝置存取權限；如需更多權限，將區分必要權限與選擇權限，事先告知原因並取得同意（《資訊通信網法》第22條之2）。"]},{"h":"第13條之2（位置服務 — 附近歌友）","b":["本公司已依韓國《位置資訊保護及利用法》申報位置服務業務（株式會社 부만(Booman Inc.)，申報第1866號）。","服務內容：「附近歌友」向已登入並開啟「顯示我的位置」的使用者(實名認證在首次開啟 StageSong 時進行一次)互相顯示距離區間(1公里·3公里·10公里以內)和最近公開的歌曲，並可觀看、按讚、留言、追蹤。不開啟自己的位置就無法查看列表。使用位置免費。",["首次開啟時須同意使用位置資訊，本公司按帳號記錄同意及時間。","位置約按1公里取整後儲存，不儲存精確座標或地址，也不向其他使用者顯示。","位置僅在開啟期間保存，關閉、滿24小時或撤回同意後立即銷毀。","本公司自動記錄位置資訊使用·提供事實確認資料(時間、目的、帳號)，保存6個月後銷毀。","使用者可隨時關閉「顯示我的位置」或透過「撤回位置資訊同意」撤回同意，並可要求查閱、告知位置資訊使用·提供事實確認資料及更正錯誤。","本公司僅以距離區間向其他使用者顯示位置資訊，除法律規定外不向其他第三方提供。","列表中會依實名認證結果顯示年齡層和性別（例如「20多歲 · 男」，15~18歲顯示為「10多歲」）。性別一律顯示，不顯示確切年齡和生日。沒有實名認證結果的帳號不顯示年齡層。","青少年（15~18歲）只能與青少年互相在列表中看到並追蹤，成年人（19歲以上）只能與成年人互相看到並追蹤。","列表可依「全部 / 同齡層 / 僅女性 / 僅男性」篩選。完成實名認證的女性可開啟「僅向女性顯示我的位置」，開啟後她與男性使用者在列表中互相看不到。","「附近歌友」不能邀請陌生人進入房間。在應用程式內向小圈子K歌房、Doran-doran 新增或邀請他人，只能在互相追蹤的「互追好友」之間進行，本公司會對此進行確認。使用者透過 KakaoTalk 等親自傳送的邀請連結照常可用。","使用者可以封鎖、檢舉其他使用者。封鎖後彼此在列表中看不到對方，也不能互發邀請。互追好友邀請每天最多20次，待回覆的邀請最多3個。"],"位置資訊管理負責人：Hwang Euiman（客服 010-4221-7066 · admin@moneypuzzle.co.kr）","與位置資訊相關的糾紛，可向韓國放送通信委員會或個人資料糾紛調解委員會申請調解。因本公司處理位置資訊對使用者造成損害的，本公司依相關法律賠償。"]},{"h":"第14條（準據法及管轄）","b":["公司與用戶之間提起的訴訟以大韓民國法律為準據法。","公司與用戶之間發生爭議的訴訟，向《民事訴訟法》規定的管轄法院提起。","用戶為外國居住者時，儘管有前款規定，公司與用戶之間發生爭議的訴訟以大韓民國首爾中央地方法院為專屬管轄法院。"]},{"h":"第15條（諮詢）","b":["有關本服務使用的諮詢，請聯絡客服（+82-10-4221-7066）或電郵（admin@moneypuzzle.co.kr）。"]}]},"es":{"title":"Términos de Servicio","eff":"Fecha de entrada en vigor: ____-__-__","app":"Money Puzzle Karaoke · 머니퍼즐 노래방","sec":[{"h":"Artículo 1 (Objeto)","b":["Estos Términos regulan el uso del servicio de karaoke «Money Puzzle Karaoke» (https://karaoke.moneypuzzle.co.kr, «el Servicio») prestado por Booman Inc. («la Empresa»)."]},{"h":"Artículo 2 (El Servicio)","b":["El Servicio ofrece:",["Reproducción de vídeos de karaoke de el canal oficial de YouTube de Kumyoung (KY) (con el reproductor integrado de YouTube, gratis)","Venta de puntos de karaoke prepagados y de bonos por tiempo comprados con puntos (vendedor: la Empresa)","Inicio de sesión con Google o Apple y conservación de tus puntos y bonos","Emisiones LIVE de karaoke, regalos y premios de ranking"],"El pago de los puntos se hace a la Empresa a través de la ventana de pago de su pasarela contratada o del cobro de la tienda de apps. La Empresa no recibe ni guarda números de tarjeta u otros datos de pago."]},{"h":"Artículo 3 (Bono de karaoke)","b":["La Empresa vende un «bono» por tiempo para el karaoke del Servicio. Los bonos se compran con puntos: 1 mes 7,000P · 3 meses 17,000P · 6 meses 30,000P · 12 meses 50,000P. Los precios son los que muestra la pantalla de compra.","Durante el bono puedes cantar sin límite. El bono no se renueva automáticamente y no se cobra nada cuando termina.","El bono se aplica a la cuenta con la que inicias sesión. Si compras otro mientras uno está activo, el nuevo periodo empieza en la fecha de fin del bono actual.",["Reembolso (en los 7 días siguientes a la compra y si no has cantado): se devuelve el importe completo.","Reembolso (en los demás casos): se devuelve el importe de los días restantes menos el 10% de ese importe (Directrices de protección de usuarios de contenidos; Normas de resolución de litigios de consumo para transacciones continuas). No se devuelven importes inferiores a 10P.","El reembolso del bono se paga a tu método de pago original solo por la parte pagada con puntos de pago (1P = ₩1); la parte comprada con puntos gratuitos no se reembolsa. No se vuelve a descontar la comisión de reembolso de puntos. La parte comprada con puntos recargados en una tienda de apps sigue la política de esa tienda. El bono termina en cuanto pides el reembolso."],"Los bonos de canciones que compraste antes (canciones restantes) siguen siendo válidos y se conservan 1 año desde la compra. Ya no se venden bonos de canciones.","Los detalles siguen la Política de reembolso."]},{"h":"Artículo 3-2 (Puntos)","b":["La Empresa vende «puntos» prepagados para el karaoke del Servicio. 1 punto (P) equivale a ₩1. Los importes de recarga y precios son los que se muestran en cada pantalla de compra.","Los puntos se registran en un único monedero de tu cuenta con sesión iniciada, y los mismos puntos se recargan y usan en la web y en la app propia.","Los puntos se registran por separado como puntos de pago (recargados con tu pago) y puntos gratis (que la Empresa da sin coste, por ejemplo como bonificación de recarga o en eventos).","Al usar puntos, primero se usan los de pago (los recargados antes primero) y después los gratis. Antes de cualquier uso, la pantalla muestra los puntos que se usarán y el saldo restante, y pide tu confirmación.",["Validez: los puntos pueden usarse durante 1 año desde la fecha de recarga (o entrega). Los puntos caducados no pueden usarse.","Ampliación: si lo solicitas dentro del período de validez, la validez de tus puntos de pago se amplía de 3 en 3 meses («Mi monedero > Ampliar»). La validez ampliada no puede superar 5 años desde la fecha de recarga.","Avisos de caducidad: la Empresa te avisa al menos 3 veces, una de ellas con al menos 30 días de antelación, por correo electrónico o en la pantalla del Servicio, de la fecha de caducidad, si se puede ampliar y cómo, y de que los puntos de pago restantes pueden reembolsarse incluso después de caducar."],["Reembolso (en los 7 días siguientes a la compra): los puntos de pago no usados se reembolsan íntegros sin comisión, aunque hayas usado una parte.","Reembolso (pasados 7 días, dentro del período de validez): se reembolsan los puntos de pago restantes menos una comisión de hasta el 10%. La tasa aplicada se muestra en la pantalla de solicitud de reembolso. No obstante, si los puntos de pago restantes son 10.000P o menos, se descuentan ₩1.000 en lugar de la comisión y, si lo que queda tras el descuento es menor que el descuento, no hay reembolso.","Reembolso (después de caducar): se reembolsa el 90% de los puntos de pago restantes hasta 5 años desde la fecha de recarga.","Los puntos gratis no son reembolsables y caducan al procesar un reembolso. No se reembolsan importes inferiores a ₩10."],"Puedes solicitar el reembolso en «Mi monedero > Solicitar reembolso» o a través de Atención al cliente. Tras revisarlo, la Empresa reembolsa al medio de pago utilizado. Los puntos con una solicitud de reembolso en curso no pueden usarse hasta que se procese.","Los reembolsos de puntos comprados en una tienda de apps como Google Play o App Store siguen la política de reembolso de esa tienda. Si la tienda cancela o reembolsa el pago, los puntos de ese pago (incluidos los puntos gratis entregados con él) se descuentan de tu monedero; si ya se usaron, se descuentan de otros puntos o de recargas posteriores."]},{"h":"Artículo 4 (Uso por menores)","b":["El Servicio es para personas de 15 años o más. Los menores de 15 años no pueden usarlo. Los menores de 15 a 18 años sí pueden usar el Servicio.","Al entrar en el Servicio (app), la Empresa comprueba una vez, mediante verificación de identidad por móvil, que tienes 15 años o más. Sin completar la verificación de identidad no puedes usar el Servicio. Del resultado solo guardamos el año de nacimiento y el sexo.","Los menores de 15 a 18 años pueden recargar hasta 200.000 KRW en puntos al mes. Un pago hecho por un menor sin el consentimiento de su representante legal puede ser anulado por el menor o por su representante legal según la ley aplicable (como el artículo 5 del Código Civil coreano), y la Empresa tramita esas anulaciones y reembolsos según dicha ley.","En «Cantantes cerca», los menores (15 a 18 años) solo ven y siguen a menores, y los adultos (19 años o más) solo a adultos; las invitaciones a salas dentro de la app solo son posibles entre amigos mutuos (artículo 13-2).","Si se detecta el uso por una persona menor de 15 años, la Empresa puede restringirlo."]},{"h":"Artículo 5 (Disponibilidad de canciones)","b":["Los vídeos de karaoke gratuitos se muestran tal como están en el canal oficial de KY en YouTube, por lo que una canción puede desaparecer de la lista o no reproducirse si el vídeo se elimina o se bloquea su inserción.","Aunque cambie la lista, el periodo de tu bono y las canciones restantes de bonos anteriores se mantienen, y no se descuenta ninguna canción que no se reprodujo."]},{"h":"Artículo 6 (Bono y canciones restantes al darte de baja)","b":["Antes de darte de baja (eliminar tu cuenta), puedes pedir el reembolso de tu bono, puntos y canciones restantes según la Política de reembolso.","Incluso después de darte de baja, puedes pedir el reembolso de las canciones restantes de bonos anteriores dentro de 1 año desde la compra con tu registro de pago. Si no lo pides en 1 año, esas canciones caducan."]},{"h":"Artículo 7 (Derechos de autor y alcance de uso)","b":["Los derechos de los vídeos de karaoke y del acompañamiento, letras e imágenes que contienen pertenecen a Kumyoung Entertainment y otros titulares. Los derechos de las pantallas, logotipos y textos del Servicio pertenecen a la Empresa.","Solo puedes usar el Servicio para cantar y escuchar de forma personal. No puedes copiar, distribuir ni emitir los vídeos, acompañamientos o letras, ni usarlos con fines de lucro, por ejemplo en un negocio."]},{"h":"Artículo 8 (Publicación de grabaciones)","b":["Este artículo se aplica a grabar canciones y publicarlas en «Escenario» y «Mi escenario».",["Los derechos sobre la voz y el vídeo de las canciones que publiques son tuyos. Permites a la Empresa, sin coste, mostrar esas canciones en el Servicio y usarlas para promocionarlo. Si borras una canción, la Empresa deja de usarla.","Los derechos del acompañamiento y la letra de una grabación pertenecen a Kumyoung Entertainment y otros titulares, por lo que no puedes descargar grabaciones fuera del Servicio ni publicarlas en otro lugar.","Solo pueden publicar canciones los usuarios que hayan completado la verificación de identidad (15 años o más).","No puedes publicar caras o voces de otras personas sin permiso, contenido obsceno, violento o de odio, insultos, nada que infrinja derechos ajenos ni publicidad.","El Escenario es solo para vídeos de personas cantando. La Empresa puede borrar sin previo aviso todo lo que no sea un vídeo cantando.","Si una canción es denunciada o entra en lo anterior, la Empresa puede ocultarla o borrarla, y puede limitar la publicación si se repite.","Puedes borrar tus canciones en cualquier momento, y tus canciones publicadas se borran al darte de baja.","Las fotos temáticas se crean solo a partir de tu propia grabación; las demás personas que aparecen son personas ficticias creadas por IA. Las fotos temáticas llevan la marca «Generado por IA».","Las fotos de grupo con IA se crean solo con las caras de quienes tocan «Unirme» en una sala Solo nosotros Karaoke o Doran-doran; tocar «Unirme» es el consentimiento para usar la foto de tu cara. Las fotos tomadas al unirse se usan temporalmente solo para crearla y se borran justo después. La tarifa (5.000P) la paga quien la inicia y se devuelve automáticamente si la creación falla. Las fotos de grupo con IA también llevan la etiqueta «Generado por IA»."]]},{"h":"Artículo 8-2 (Emisiones LIVE)","b":["Este artículo se aplica a la función LIVE del karaoke.",["Solo los adultos verificados pueden iniciar una emisión LIVE. Quien pueda usar el Servicio puede ver, comentar y reaccionar, y ver no consume puntos.","Quien emite paga 100P por espectador y hora, calculados cada minuto. La Empresa lo muestra al iniciar la emisión y la termina automáticamente cuando los puntos restantes llegan a 0P.","Los espectadores pueden enviar regalos con puntos a quien emite. Los tipos, precios y el límite (500.000P por persona al día) son los que aparecen en pantalla. Los menores de 15 a 18 años no pueden enviar regalos. Los regalos enviados no se cancelan ni se reembolsan, salvo cuando la ley permita cancelarlos.","Quien emite recibe el 70 % del importe del regalo como puntos gratuitos, que solo se usan dentro del Servicio y no se cambian por dinero ni se reembolsan.","En las emisiones se prohíben los contenidos obscenos, violentos u ofensivos, los insultos, la infracción de derechos ajenos y la publicidad. La Empresa puede terminar sin aviso una emisión denunciada o infractora y limitar a los reincidentes. Quien emite puede expulsar espectadores.","La Empresa guarda las emisiones de forma privada 30 días para atender denuncias y disputas, y luego las elimina. Solo los administradores pueden verlas."]]},{"h":"Artículo 8-3 (Ranking y premios)","b":[["La Empresa anuncia rankings semanales, mensuales y de fin de año (Campeón) de vídeos públicos y paga un premio en puntos al primer puesto. Los criterios y premios son los que aparecen en pantalla.","Los premios se pagan automáticamente como puntos gratuitos, válidos 1 año desde el pago. No se reembolsan ni se cambian por dinero.","Los ganadores tienen una estrella de perfil. Las semanales y mensuales desaparecen al cambiar de año; las de Campeón se quedan.","Los vídeos que influyan en el ranking de forma indebida pueden excluirse."]]},{"h":"Artículo 8-4 (Supervisión automática)","b":["StageSong tiene un sistema de supervisión automática del sonido y la imagen.","LIVE: además de la comprobación en el teléfono, se comprueban en el servidor imágenes de baja resolución y fragmentos de audio. No se guardan después, y las palabras ofensivas de los comentarios se ocultan.","Doran-doran y Solo nosotros Karaoke: solo se comprueba la imagen, en tu teléfono cada 5 segundos. No se envían vídeo ni sonido al servidor. El sonido no se comprueba; el lenguaje ofensivo se gestiona mediante denuncias. Aceptas la primera vez que entras.","Vídeos publicados: se comprueban imágenes de muestra al publicar, junto con título, descripción y comentarios. Si hay un problema, el vídeo se guarda como «Solo yo».","Al principio la imagen se cubre unos segundos con un aviso. La expulsión y el límite de 24 horas solo se aplican si las detecciones de alta confianza continúan y se repiten. Las comprobaciones de sonido y lenguaje solo dan un aviso.","Toca «Reclamar» en el aviso para pedir una revisión. Si fue un error, recuperarás el periodo del bono y los puntos.","Las comprobaciones automáticas pueden equivocarse, por lo que fijamos umbrales prudentes. Las imágenes y el sonido usados no se guardan tras la comprobación, y las escenas que puedan implicar a un menor no se guardan nunca."]},{"h":"Artículo 9 (Enlaces externos)","b":["El Servicio puede ofrecer enlaces a sitios o apps externos para su comodidad. La Empresa no se responsabiliza del contenido, las transacciones ni la exactitud de esos servicios externos.","Los vídeos de karaoke los ofrecen YouTube y los canales oficiales correspondientes; los anuncios, el contenido y la disponibilidad de los vídeos siguen las políticas de YouTube y de dichos canales."]},{"h":"Artículo 10 (Obligaciones del usuario y actos prohibidos)","b":["El usuario no debe:",["actuar en contra de la ley o del orden público y las buenas costumbres","interferir en el funcionamiento normal del Servicio o recopilar datos sin autorización","vulnerar los derechos de terceros"]]},{"h":"Artículo 11 (Interrupción y mantenimiento del servicio)","b":["En principio, el Servicio está disponible las 24 horas, todo el año. Puede interrumpirse temporalmente por mantenimiento, cambio de equipos o averías; cuando sea posible, lo avisaremos antes en el Servicio.","Si sufres un daño por dolo o negligencia de la Empresa, esta te indemnizará conforme a la ley aplicable."]},{"h":"Artículo 12 (Limitación de responsabilidad)","b":["Por motivos de YouTube (vídeos eliminados, restricciones de inserción, etc.), algunas canciones pueden no reproducirse o la lista puede cambiar; en ese caso ofrecemos «Abrir en YouTube».","La Empresa no responde por daños derivados de causas ajenas a su control razonable, como fuerza mayor o fallos de API externas o de las comunicaciones."]},{"h":"Artículo 13 (Permisos del dispositivo)","b":["El Servicio usa la cámara y el micrófono solo cuando tocas «Grabar». La primera vez, el navegador pide permiso; si no lo das, solo no podrás grabar y todo lo demás seguirá funcionando.","Las grabaciones se quedan en tu dispositivo; solo se envían a la Empresa las que decidas publicar con «Publicar mi canción».","La ubicación solo se usa al activar «Mostrar mi ubicación» en «Cantantes cerca», y solo como ubicación aproximada (unos 1 km). La primera vez pedimos tu consentimiento para usar la ubicación y el navegador o la app piden el permiso de ubicación (la app solo pide ubicación aproximada). No se usan otros permisos del dispositivo; si alguna vez se necesitan más, te indicaremos antes cuáles son obligatorios y cuáles opcionales, con sus motivos, y pediremos tu consentimiento (artículo 22-2 de la Ley de Redes)."]},{"h":"Artículo 13-2 (Servicio basado en ubicación — Cantantes cerca)","b":["La Empresa ha registrado su actividad de servicio basado en ubicación conforme a la ley coreana de protección y uso de la información de ubicación (Booman Inc., registro n.º 1866).","Qué hace: «Cantantes cerca» muestra a los usuarios con sesión iniciada que activan «Mostrar mi ubicación» (la verificación de identidad se hace una sola vez, al abrir StageSong por primera vez) el rango de distancia entre ellos (a menos de 1, 3 o 10 km) y sus últimas canciones públicas, y les permite verlas, darles me gusta, comentarlas y seguirse. Sin activar tu propia ubicación tampoco puedes ver la lista. Usar la ubicación es gratis.",["La primera vez que la activas debes consentir el uso de la ubicación; la Empresa registra el consentimiento por cuenta con la hora.","La ubicación se redondea a unos 1 km antes de guardarla; nunca se guardan ni se muestran coordenadas exactas ni direcciones.","La ubicación se guarda solo mientras esté activada y se destruye sin demora al desactivarla, a las 24 horas o al retirar el consentimiento.","La Empresa registra automáticamente el uso y la cesión de la información de ubicación (hora, finalidad, cuenta), conserva estos registros 6 meses y luego los destruye.","Puedes desactivar «Mostrar mi ubicación» o retirar el consentimiento con «Retirar consentimiento de ubicación» en cualquier momento, y pedir ver o que se te notifiquen los registros de uso y cesión de tu ubicación y corregir errores.","La ubicación se muestra a otros usuarios solo como rango de distancia y no se cede a terceros salvo obligación legal.","En la lista se muestra la franja de edad y el sexo según la verificación de identidad (p. ej. «20-29 años · Hombre»; de 15 a 18 años aparece «Adolescentes»). El sexo siempre se muestra; nunca la edad exacta ni el cumpleaños. Las cuentas sin resultado de verificación se muestran sin franja de edad.","Los menores (15 a 18 años) solo se ven y se siguen entre menores, y los adultos (19 años o más) solo entre adultos.","La lista se puede filtrar por «Todos / Misma edad / Solo mujeres / Solo hombres». Las mujeres verificadas pueden activar «Mostrar mi ubicación solo a mujeres»; así ella y los usuarios hombres no se ven en la lista.","«Cantantes cerca» no permite invitar a desconocidos a salas. En la app, añadir o invitar a personas a salas Solo nosotros Karaoke y Doran-doran solo es posible entre «amigos mutuos» que se siguen mutuamente, y la Empresa lo comprueba. Los enlaces de invitación que los usuarios envían por su cuenta (KakaoTalk, etc.) siguen funcionando.","Puedes bloquear y denunciar a otros usuarios. Los usuarios bloqueados no se ven en la lista ni pueden intercambiar invitaciones. Puedes enviar hasta 20 invitaciones a amigos mutuos al día y tener hasta 3 pendientes a la vez."],"Responsable de información de ubicación: Hwang Euiman (atención al cliente 010-4221-7066 · admin@moneypuzzle.co.kr)","Para conflictos sobre la información de ubicación puedes solicitar mediación a la Comisión de Comunicaciones de Corea o al Comité de Mediación de Conflictos de Información Personal. Si el tratamiento de la ubicación por la Empresa te causa daños, la Empresa los indemnizará conforme a la ley."]},{"h":"Artículo 14 (Ley aplicable y jurisdicción)","b":["Los litigios entre la Empresa y el usuario se rigen por las leyes de la República de Corea.","Los litigios por conflictos entre la Empresa y el usuario se presentarán ante el tribunal competente según la Ley de Enjuiciamiento Civil de la República de Corea.","No obstante lo anterior, si el usuario reside fuera de la República de Corea, el Tribunal Central del Distrito de Seúl de la República de Corea tendrá jurisdicción exclusiva sobre los litigios por conflictos entre la Empresa y el usuario."]},{"h":"Artículo 15 (Contacto)","b":["Para consultas sobre el Servicio, contacte con Atención (+82-10-4221-7066) o por correo (admin@moneypuzzle.co.kr)."]}]}};
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function inline(s){ return esc(s).replace(/admin@moneypuzzle\.co\.kr/g,'<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'); }
function opBlock(lang){ var o=OP[lang]; var L=[
  ['', '<b>'+esc(o.cn)+'</b>'],
  [o.rn, o.rv],[o.ceo, o.cev],[o.mo, esc(o.mov)],[o.po, o.pov],
  [o.cs, o.csv],[o.em, '<a href="mailto:admin@moneypuzzle.co.kr">admin@moneypuzzle.co.kr</a>'],
  [o.ad, o.adv],[o.ho, esc(o.hov)],['', esc(o.ns)]];
  var h='<div class="op"><div><b>'+esc(o.t)+'</b></div>';
  for(var i=0;i<L.length;i++){ h+='<div>'+(L[i][0]?esc(L[i][0])+' : ':'')+L[i][1]+'</div>'; }
  return h+'</div>';
}
function render(lang){
  if(LANGS.indexOf(lang)<0) lang="ko";
  document.documentElement.lang=HLANG[lang];
  var d=D[lang], h='';
  h+='<h1>'+esc(d.title)+'</h1>';
  h+='<p class="eff">'+esc(d.app)+' · '+esc(d.eff)+'</p>';
  for(var i=0;i<d.sec.length;i++){ var s=d.sec[i];
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    for(var j=0;j<s.b.length;j++){ var b=s.b[j];
      if(Object.prototype.toString.call(b)==="[object Array]"){ h+='<ul>'; for(var k=0;k<b.length;k++) h+='<li>'+inline(b[k])+'</li>'; h+='</ul>'; }
      else h+='<p>'+inline(b)+'</p>';
    }
  }
  h+=opBlock(lang);
  document.getElementById("doc").innerHTML=h;
  document.getElementById("backt").textContent=BACK[lang];
  document.getElementById("back").href="./?lang="+lang;
  document.title=d.title+" · Money Puzzle Karaoke";
  var bs=document.getElementById("langbar").children;
  for(var m=0;m<bs.length;m++) bs[m].className=(bs[m].getAttribute("data-l")===lang)?"on":"";
  try{ localStorage.setItem("mpv_lang",lang); }catch(e){}
  try{ history.replaceState(null,"","?lang="+lang); }catch(e){}
}
function pick(){
  var q=(location.search.match(/[?&]lang=([a-z]+)/)||[])[1];
  if(q&&LANGS.indexOf(q)>=0) return q;
  var st; try{ st=localStorage.getItem("mpv_lang"); }catch(e){}
  if(st&&LANGS.indexOf(st)>=0) return st;
  var n=(navigator.language||"en").toLowerCase();
  if(n.indexOf("ko")===0) return "ko";
  if(n.indexOf("ja")===0) return "ja";
  if(n.indexOf("es")===0) return "es";
  if(n.indexOf("zh")===0) return (n.indexOf("tw")>=0||n.indexOf("hant")>=0||n.indexOf("hk")>=0)?"zht":"zhs";
  return "en";
}
(function(){
  var bar=document.getElementById("langbar"),h="";
  for(var i=0;i<LANGS.length;i++) h+='<button data-l="'+LANGS[i]+'">'+LBL[LANGS[i]]+'</button>';
  bar.innerHTML=h;
  var btns=bar.children;
  for(var j=0;j<btns.length;j++) btns[j].addEventListener("click",function(){ render(this.getAttribute("data-l")); });
  render(pick());
})();
</script>
